    function App() {
      const [s, setS] = useState(getCachedData);

      const [tapFloats, setTapFloats] = useState([]);

      const [bankModalOpen, setBankModalOpen] = useState(false);

      const [sendTo, setSendTo] = useState('');
      const [sendAmt, setSendAmt] = useState('');
      const [isSending, setIsSending] = useState(false);
      const [verifiedBank, setVerifiedBank] = useState(null);

      const [txHistoryOpen, setTxHistoryOpen] = useState(false);

      // Password setup
      const [passwordModalOpen, setPasswordModalOpen] = useState(false);

      const [pwSetting, setPwSetting] = useState(false);

      // Leaderboard & Missions
      const [leaders, setLeaders] = useState([]);

      // EFCC & Black Card States

      // Settings sync
      useEffect(() => {

      // Auth & Firestore Listener
      useEffect(() => {
        let userUnsub = null;

          if (!user) {

          const userId = user.uid;
          setUid(userId);
          const userRef = db.collection("users").doc(userId);

          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              const dbData = doc.data();
              setS(prev => {
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  travels: dbData.travels || prev.travels || [],
                  transactions: dbData.transactions || [],
                  bankName: dbData.bankName || prev.bankName || null,
                  achievements: dbData.achievements || prev.achievements || [],
                  lastClaimDate: dbData.lastClaimDate !== undefined ? dbData.lastClaimDate : (prev.lastClaimDate || null),
                  streakCount: dbData.streakCount !== undefined ? dbData.streakCount : (prev.streakCount || 0),
                  accountNumber: dbData.accountNumber || prev.accountNumber || null,
                  cash: (dbData.cash || 0) + pendingTaps.current.cash,
                  energy: (dbData.energy || 0) + pendingTaps.current.energy,
                  taps: (dbData.taps || 0) + pendingTaps.current.taps
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;

              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',

                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: [], bankName: null,
                lastClaimDate: null, streakCount: 0, accountNumber: null, achievements: [],
                efccDeadline: Date.now() + 24 * 60 * 60 * 1000, hasCard: false
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => {
          authUnsub();
          if (userUnsub) userUnsub();
        };
      }, []);

      // 🆕 EFCC RAID LOGIC (Only if cash >= 200 Sextillion)
      useEffect(() => {
        if (!s || !uid) return;
        const now = Date.now();
        
        // Only raid if they have 200 Sextillion or more
        if (s.cash >= EFCC_THRESHOLD) {
          if (s.efccDeadline && now > s.efccDeadline) {
            // Raid time!
            db.collection("users").doc(uid).update({
              cash: 0,
              efccDeadline: now + 24 * 60 * 60 * 1000 // Next raid in 24 hours
            }).catch(()=>{});
            notify("🚨 EFCC RAIDED YOU! Your fake cash don finish.", "bad");
          } else if (!s.efccDeadline) {
            // Set initial deadline if they just crossed the threshold
            db.collection("users").doc(uid).update({
              efccDeadline: now + 24 * 60 * 60 * 1000
            }).catch(()=>{});
          }
        }

        // Timer for warning (6 hours before)
        const timer = setInterval(() => {
          if (!s.efccDeadline || s.cash < EFCC_THRESHOLD) {
            setEfccTimeLeft(null);
            return;
          }
          const diff = s.efccDeadline - Date.now();
          if (diff > 0 && diff < 6 * 60 * 60 * 1000) {
            setEfccTimeLeft(diff);
          } else {
            setEfccTimeLeft(null);
          }
        }, 1000);

        return () => clearInterval(timer);
      }, [s.efccDeadline, s.cash, uid]);

      const payEFCC = async () => {
        if (s.real < 200) return notify("You need ₦200 Real Cash to clear EFCC! Top up in Club.", "bad");
        try {
          await db.collection("users").doc(uid).update({
            real: firebase.firestore.FieldValue.increment(-200),
            efccDeadline: Date.now() + 24 * 60 * 60 * 1000 // Reset 24 hours
          });
          setEfccTimeLeft(null);
          AudioEngine.coin();
          notify("✅ CAC Paid! EFCC cleared for 24hrs.", "good");
        } catch(e) {
          notify("Payment failed. Try again.", "bad");
        }
      };

      // 🆕 BLACK CARD LOGIC
      const buyBlackCard = async () => {
        if (s.cash < CARD_COST) return notify("You need ₦1 Quadrillion for a Black Card!", "bad");
        if (pinInput.length !== 4) return notify("Enter a 4-digit PIN", "bad");

        const cardNum = "5399 " + Math.floor(1000 + Math.random() * 9000) + " " + Math.floor(1000 + Math.random() * 9000) + " " + Math.floor(1000 + Math.random() * 9000);
        const cvv = Math.floor(100 + Math.random() * 900);
        const exp = "12/29";

        try {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(-CARD_COST),
            hasCard: true,
            cardNumber: cardNum,
            cardExpiry: exp,
            cardCvv: cvv,
            cardPin: pinInput
          });
          setCardModalOpen(false);
          setPinInput('');
          AudioEngine.jackpot();
          notify("💳 Lagos Life Black Card Issued!", "good");
        } catch(e) {
          notify("Failed to issue card", "bad");
        }
      };

      const changeCardPin = async () => {
        if (oldPin !== s.cardPin) return notify("Incorrect Old PIN", "bad");
        if (newPin.length !== 4) return notify("New PIN must be 4 digits", "bad");
        try {
          await db.collection("users").doc(uid).update({ cardPin: newPin });
          setOldPin(''); setNewPin('');
          notify("✅ PIN changed successfully!", "good");
          setCardSettingsView(false);
        } catch(e) {
          notify("Failed to change PIN", "bad");
        }
      };

      const replaceCard = async () => {
        if (s.cash < 10e12) return notify("You need ₦10 Trillion to replace card", "bad"); // 10T fee
        const cardNum = "5399 " + Math.floor(1000 + Math.random() * 9000) + " " + Math.floor(1000 + Math.random() * 9000) + " " + Math.floor(1000 + Math.random() * 9000);
        const cvv = Math.floor(100 + Math.random() * 900);
        try {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(-10e12),
            cardNumber: cardNum,
            cardCvv: cvv,
            cardPin: '0000' // Reset to default or new PIN
          });
          notify("💳 Card Replaced! Default PIN is 0000", "good");
          setCardSettingsView(false);
        } catch(e) {
          notify("Failed to replace card", "bad");
        }
      };

      // Password Check
      useEffect(() => {
        let shown = false;
        const unsub = auth.onAuthStateChanged((user) => {
          if (!user || shown) return;
          shown = true;
          const hasPassword = (user.providerData || []).some(p => p.providerId === 'password');
          if (hasPassword) return;
          const lastShown = parseInt(localStorage.getItem('pw_prompt_shown') || '0', 10);
          const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
          if (lastShown < dayAgo) {
            setTimeout(() => {
              setPasswordModalOpen(true);
              localStorage.setItem('pw_prompt_shown', String(Date.now()));
            }, 3000);
          }
        });
        return () => unsub();
      }, []);

      const setupPassword = async () => {
        if (!newPassword || newPassword.length < 6) return notify('Password must be 6+ chars', 'bad');
        if (newPassword !== confirmPassword) return notify('Passwords don\'t match', 'bad');
        if (!auth.currentUser || !auth.currentUser.email) return notify('No email on account', 'bad');
        setPwSetting(true);
        try {
          const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, newPassword);
          await auth.currentUser.linkWithCredential(cred);
          notify('✅ Password added! Login with email next time', 'good');
          setPasswordModalOpen(false);
          setNewPassword('');
          setConfirmPassword('');
          localStorage.removeItem('pw_prompt_shown');
          AudioEngine.achievement();
        } catch (e) {
          console.error('linkWithCredential error:', e);
          if (e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') {
            notify('That email already has a password.', 'bad');
          } else if (e.code === 'auth/provider-already-linked') {
            notify('Password already set ✅', 'good');
            setPasswordModalOpen(false);
          } else if (e.code === 'auth/requires-recent-login') {
            notify('Log out and log in again, then set password.', 'bad');
          } else if (e.code === 'auth/weak-password') {
            notify('Password too weak. Use 6+ chars.', 'bad');
          } else {
            notify(e.message || 'Failed to set password', 'bad');
          }
        } finally {
          setPwSetting(false);
        }
      };

      // Auto-open bank modal
      useEffect(() => {
        if (!bankAutoShownRef.current && s && !s.bankName && !isMaintenance && !authError) {
          bankAutoShownRef.current = true;
          setBankModalOpen(true);
        }
      }, [s.bankName, isMaintenance, authError]);

      const flushPending = async () => {
        if (!uid) return false;
        const toSync = Object.assign({}, pendingTaps.current);
        const cur = stateRef.current;
        const lastEnergy = lastSyncedEnergyRef.current;
        const energyChanged = cur.energy !== lastEnergy.energy || cur.lastEnergy !== lastEnergy.lastEnergy;

        if (toSync.cash === 0 && toSync.taps === 0 && !energyChanged) return false;

        pendingTaps.current = { cash: 0, energy: 0, taps: 0 };
        lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };

        const updates = { lastSeen: Date.now() };
        if (toSync.cash !== 0) updates.cash = firebase.firestore.FieldValue.increment(toSync.cash);
        if (toSync.taps !== 0) updates.taps = firebase.firestore.FieldValue.increment(toSync.taps);
        if (energyChanged) { updates.energy = cur.energy; updates.lastEnergy = cur.lastEnergy; }

        try {
          await db.collection("users").doc(uid).update(updates);
          return true;
        } catch (e) {
          pendingTaps.current.cash += toSync.cash;
          pendingTaps.current.taps += toSync.taps;
          console.error("Flush error:", e);
          return false;
        }
      };

      useEffect(() => {
        if (!uid) return;
        const iv = setInterval(() => { flushPending(); }, SYNC_INTERVAL_MS);
        return () => clearInterval(iv);
      }, [uid]);

      useEffect(() => {
        if (!uid) return;
        const handleVisibility = () => { if (document.visibilityState === 'hidden') flushPending(); };
        const handleBeforeUnload = () => { flushPending(); };
        document.addEventListener('visibilitychange', handleVisibility);
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibility);
          window.removeEventListener('beforeunload', handleBeforeUnload);
        };
      }, [uid]);

      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        const iv = setInterval(() => setQuoteIndex(prev => (prev + 1) % FUNNY_QUOTES.length), 5000);
        return () => clearInterval(iv);
      }, []);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      useEffect(() => {
        if (!s) return;
        const iv = setInterval(() => {
          setS(prev => {
            if (!prev || prev.energy >= MAX_E) return prev;
            const now = Date.now();
            const gained = Math.floor((now - prev.lastEnergy) / ENERGY_MS);
            if (gained <= 0) return prev;
            const energy = Math.min(MAX_E, prev.energy + gained);
            const lastEnergy = energy >= MAX_E ? now : prev.lastEnergy + gained * ENERGY_MS;
            const next = Object.assign({}, prev, { energy, lastEnergy });
            stateRef.current = next;
            return next;
          });
        }, 1000);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        if (!uid) return;
        const syncEnergy = async () => {
          const cur = stateRef.current;
          const last = lastSyncedEnergyRef.current;
          if (cur.energy === last.energy && cur.lastEnergy === last.lastEnergy) return;
          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };
          try {
            await db.collection("users").doc(uid).update({
              energy: cur.energy,
              lastEnergy: cur.lastEnergy,
              lastSeen: Date.now()
            });
          } catch (e) {}
        };
        const iv = setInterval(syncEnergy, ENERGY_SYNC_MS);
        return () => clearInterval(iv);
      }, [uid]);

      useEffect(() => {
        const iv = setInterval(() => { setOnline((o) => o + 1 + Math.floor(Math.random() * 14)); }, 3200);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        if (!uid) return;
        const fetchLeaders = async () => {
          if (leadersFetchRef.current) return;
          if (Date.now() - leadersLastFetch < 5 * 60 * 1000) return;
          leadersFetchRef.current = true;
          try {
            const snap = await db.collection("users").orderBy("cash", "desc").limit(3).get();
            const arr = [];
            snap.forEach(doc => {
              const d = doc.data();
              arr.push({ id: doc.id, name: d.name || 'Hustler', cash: d.cash || 0 });
            });
            setLeaders(arr);
            setLeadersLastFetch(Date.now());
          } catch (e) {
            console.error("Leaders fetch:", e);
          } finally {
            leadersFetchRef.current = false;
          }
        };
        const t = setTimeout(fetchLeaders, 2000);
        return () => clearTimeout(t);
      }, [uid]);

      const safeBiz = s.businesses || {};
      const safeAssets = s.assets || {};
      const safeTravels = s.travels || [];

      const bizValue = Object.entries(safeBiz).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);
      const assetValue = Object.entries(safeAssets).reduce((a, kv) => a + kv[1] * (ASSET_PRICES[kv[0]] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);
      const tapBonus = safeTravels.reduce((a, id) => a + (DEST_BONUSES[id] || 0), 0);
      const TAP_VALUE = BASE_TAP + tapBonus;

      const achSig = [s.taps || 0, netWorth, Object.keys(safeBiz).length, Object.keys(safeAssets).length, safeTravels.length].join('|');
      useEffect(() => {
        if (!s || !uid) return;
        const unlocked = s.achievements || [];
        const newlyUnlocked = ACHIEVEMENTS.filter(a => 
          !unlocked.includes(a.id) && 
          !achievementsLock.current.has(a.id) && 
          a.check(s, netWorth)
        );
        if (newlyUnlocked.length === 0) return;
        
        const newIds = newlyUnlocked.map(a => a.id);
        newIds.forEach(id => achievementsLock.current.add(id));
        setS(prev => Object.assign({}, prev, { achievements: [...(prev.achievements || []), ...newIds] }));
        db.collection("users").doc(uid).update({
          achievements: firebase.firestore.FieldValue.arrayUnion(...newIds)
        }).catch(() => {});
        AudioEngine.achievement();
        setAchievementToast(newlyUnlocked[0]);
        setTimeout(() => setAchievementToast(null), 3500);
      }, [achSig, uid]);

      const todayStr = new Date().toISOString().slice(0, 10);
      const yesterdayStr = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const canClaimDaily = s.lastClaimDate !== todayStr;
      const nextStreak = s.lastClaimDate === yesterdayStr ? (s.streakCount || 0) + 1 : 1;
      const dailyRewardAmount = DAILY_REWARDS[Math.min(nextStreak - 1, DAILY_REWARDS.length - 1)];

      const claimDaily = async () => {
        if (!canClaimDaily) return notify('Come back tomorrow 😴', 'bad');
        const reward = dailyRewardAmount;
        const newStreak = nextStreak;
        setS(prev => Object.assign({}, prev, {
          cash: prev.cash + reward,
          lastClaimDate: todayStr,
          streakCount: newStreak
        }));
        const m = getMissions(); m.claimed = true; saveMissions(m);
        setMissionRefresh(x => x + 1);
        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(reward),
            lastClaimDate: todayStr,
            streakCount: newStreak
          }).catch(() => {});
        }
        AudioEngine.coin();
        notify('Day ' + newStreak + ' claimed! +' + fmt(reward));
      };

      const refillEnergy = async () => {
        const missing = MAX_E - (s.energy || 0);
        if (missing <= 0) return notify('Energy already full ⚡');
        const cost = missing * REFILL_COST_PER_POINT;
        if ((s.cash || 0) < cost) { AudioEngine.error(); return notify('You no get that money 💸', 'bad'); }
        setS(prev => {
          const next = Object.assign({}, prev, { cash: prev.cash - cost, energy: MAX_E, lastEnergy: Date.now() });
          stateRef.current = next;
          return next;
        });
        lastSyncedEnergyRef.current = { energy: MAX_E, lastEnergy: Date.now() };
        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(-cost),
            energy: MAX_E,
            lastEnergy: Date.now()
          }).catch(() => {});
        }
        AudioEngine.purchase();
        notify('Energy refilled! +' + missing + ' ⚡');
      };

      const handleSaveBank = async (bank) => {
        setS(prev => Object.assign({}, prev, { bankName: bank }));
        setBankModalOpen(false);
        notify('Bank updated: ' + bank + ' ✅');
        if (uid) await db.collection("users").doc(uid).update({ bankName: bank }).catch(() => {});
      };

      const saveAccountNumber = async () => {
        const acct = (accountInput || '').replace(/\D/g, '').slice(0, 10);
        if (acct.length !== 10) return notify('Enter 10-digit account number', 'bad');
        setS(prev => Object.assign({}, prev, { accountNumber: acct }));
        if (uid) await db.collection("users").doc(uid).update({ accountNumber: acct }).catch(() => {});
        notify('Account saved ✅');
      };

      const verifyBank = async () => {
        if (!sendTo.trim()) return setVerifiedBank(null);
        setIsVerifying(true);
        try {
          const snap = await db.collection("users").where("name", "==", sendTo.trim()).limit(1).get();
          if (!snap.empty) {
            const userData = snap.docs[0].data();
            setVerifiedBank({ bank: userData.bankName || 'Unknown Bank', name: userData.name, accountNumber: userData.accountNumber || null });
          } else {
            setVerifiedBank(null);
          }
        } catch(e) { setVerifiedBank(null); }
        setIsVerifying(false);
      };

      const doTap = () => {
        if (s.energy < 1) { AudioEngine.error(); return notify('No energy! Wait or refill ⚡', 'bad'); }
        AudioEngine.tap();
        try { if (navigator.vibrate) navigator.vibrate(8); } catch(e) {}
        
        const now = Date.now();
        const c = comboRef.current;
        if (now - c.lastTap < COMBO_WINDOW_MS) {
          c.count = Math.min(c.count + 1, 25);
        } else {
          c.count = 1;
        }
        c.lastTap = now;

        const mult = Math.min(COMBO_MAX, 1 + (c.count - 1) * COMBO_STEP);
        const tapValue = Math.round(TAP_VALUE * mult);
        setComboMult(mult);

        if (c.timer) clearTimeout(c.timer);
        c.timer = setTimeout(() => {
          setComboMult(1);
          comboRef.current.count = 0;
        }, COMBO_WINDOW_MS);

        const newEnergy = Math.max(0, s.energy - 1);
        setS(prev => {
          const next = Object.assign({}, prev, { cash: prev.cash + tapValue, energy: newEnergy, taps: prev.taps + 1 });
          stateRef.current = next;
          return next;
        });
        
        pendingTaps.current.cash += tapValue;
        pendingTaps.current.energy -= 1;
        pendingTaps.current.taps += 1;

        const m = getMissions();

                  }, bank)
                )
              )
            )
          ),

          sendOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => !isSending && setSendOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'text-3xl text-center' }, '📤'),
              h('div', { className: 'text-center mt-2 text-[13px] font-black tracking-widest text-[#FFD60A] font-display' }, 'SEND LAGOS CASH'),
              h('p', { className: 'text-center text-[11px] text-white/50 mt-1' }, 'Send fake money to another hustler'),
              h('div', { className: 'mt-4 space-y-3' },
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Recipient In-Game Name'),
                  h('input', {
                    value: sendTo, 
                    onChange: (e) => { setSendTo(e.target.value); setVerifiedBank(null); }, 
                    onBlur: verifyBank,
                    placeholder: 'e.g. Aje Butler', 
                    disabled: isSending,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-extrabold text-white placeholder-white/25 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
                  }),
                  isVerifying && h('div', { className: 'text-[10px] text-[#FFD60A] mt-1 animate-pulse' }, 'Verifying...'),
                  verifiedBank && h('div', { className: 'mt-1.5 px-3 py-2 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 flex items-center gap-1.5' },
                    h('span', { className: 'text-[#22C55E] text-sm' }, '✅'),
                    h('div', null,
                      h('div', { className: 'text-[10px] text-white/60 font-bold' }, 'Verified Account'),
                      h('div', { className: 'text-[12px] text-[#22C55E] font-black font-display' }, verifiedBank.bank)
                    )
                  )
                ),
                h('div', null,
                  h('div', { className: 'flex justify-between items-end' },
                    h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Amount (₦)'),
                    !s.bankName && h('button', { onClick: () => { setSendOpen(false); setSettingsOpen(true); }, className: 'text-[9px] text-[#FFD60A] underline' }, 'Setup your bank')
                  ),
                  h('input', {
                    type: 'tel',
                    inputMode: 'numeric',
                    value: sendAmt,
                    onChange: (e) => setSendAmt(e.target.value.replace(/\D/g, '').slice(0, 15)),
                    placeholder: 'e.g. 5000',
                    disabled: isSending,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[15px] font-extrabold text-white placeholder-white/25 focus:border-[#FFD60A]/50 transition tabular-nums disabled:opacity-50'
                  }),
                  sendAmt && Number(sendAmt) > 0 && h('div', {
                    className: 'mt-2 px-3 py-2 rounded-xl flex items-center justify-between border ' +
                      (Number(sendAmt) > s.cash ? 'bg-red-500/15 border-red-500/40' : 'bg-[#FFD60A]/10 border-[#FFD60A]/30')
                  },
                    h('span', { className: 'text-[10px] uppercase tracking-widest font-bold text-white/50' }, 'You are sending'),
                    h('span', {
                      className: 'font-black tabular-nums font-display text-[14px] ' +
                        (Number(sendAmt) > s.cash ? 'text-red-400' : 'text-[#FFD60A]')
                    }, fmt(Math.floor(Number(sendAmt))))
                  ),
                  h('div', { className: 'mt-2 flex gap-1.5 flex-wrap' },
                    [1000, 5000, 10000, 100000, 1000000].map(a =>
                      h('button', {
                        key: a,
                        onClick: () => setSendAmt(String(a)),
                        disabled: isSending || a > s.cash,
                        className: 'px-2.5 py-1 rounded-lg text-[10px] font-black active:scale-95 transition ' +
                          (a > s.cash ? 'bg-white/[0.03] text-white/20' :
                           Number(sendAmt) === a ? 'bg-[#FFD60A] text-black' : 'bg-white/[0.06] border border-white/10 text-white/70')
                      }, fmt(a))
                    ),
                    h('button', {
                      onClick: () => setSendAmt(String(Math.floor(s.cash))),
                      disabled: isSending || s.cash < 100,
                      className: 'px-2.5 py-1 rounded-lg text-[10px] font-black active:scale-95 transition ' +
                        (s.cash < 100 ? 'bg-white/[0.03] text-white/20' :
                         Number(sendAmt) === Math.floor(s.cash) ? 'bg-[#22C55E] text-black' : 'bg-[#22C55E]/20 border border-[#22C55E]/40 text-[#22C55E]')
                    }, 'MAX')
                  )
                ),
                h('div', { className: 'text-[10px] text-white/40 tabular-nums' }, 'Available: ' + fmt(s.cash))
              ),
              h('div', { className: 'mt-4 flex gap-2' },
                h('button', { onClick: () => setSendOpen(false), disabled: isSending, className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/70 active:scale-95 transition disabled:opacity-50' }, 'Cancel'),
                h('button', { onClick: sendMoney, disabled: isSending, className: 'flex-1 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-95 transition disabled:opacity-50' }, isSending ? 'Sending...' : 'Send')
              )
            )
          ),

          txHistoryOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => setTxHistoryOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3 mb-3' },
                h('div', { className: 'text-[13px] font-black tracking-widest text-[#FFD60A] font-display' }, 'TRANSACTIONS'),
                h('button', { onClick: () => setTxHistoryOpen(false), className: 'text-white/50 text-xl leading-none' }, '×')
              ),
              h('div', { className: 'space-y-2.5 max-h-[60vh] overflow-y-auto pr-1' },
                (!s.transactions || s.transactions.length === 0) ?
                  h('div', { className: 'text-center text-white/40 text-[11px] py-6' }, 'No transactions yet.') :
                  [...s.transactions].sort((a,b) => b.date - a.date).slice(0, 20).map((tx, i) =>
                    h('div', { key: i, className: 'flex items-center justify-between bg-white/[0.03] border border-white/[0.05] p-2.5 rounded-xl' },
                      h('div', { className: 'flex items-center gap-2' },
                        h('div', { className: 'w-8 h-8 rounded-full grid place-items-center text-sm ' + (tx.type === 'sent' ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400') }, tx.type === 'sent' ? '↗️' : '↙️'),
                        h('div', null,
                          h('div', { className: 'text-[12px] font-extrabold text-white' }, (tx.type === 'sent' ? 'Sent to ' : 'Received from ') + tx.name),
                          h('div', { className: 'text-[9px] text-white/40' }, new Date(tx.date).toLocaleDateString())
                        )
                      ),
                      h('div', { className: 'text-[13px] font-black tabular-nums ' + (tx.type === 'sent' ? 'text-red-400' : 'text-green-400') },
                        (tx.type === 'sent' ? '-' : '+') + fmt(tx.amount)
                      )
                    )
                  )
              )
            )
          ),

          shareOpen && shareUrl && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-4' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setShareOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm animate-popIn' },
              h('div', { className: 'rounded-2xl overflow-hidden border border-[#FFD60A]/40' },
                h('img', { src: shareUrl, alt: 'Share card', className: 'w-full block' })
              ),
              h('div', { className: 'mt-3 grid grid-cols-2 gap-2' },
                h('button', { onClick: downloadCard, className: 'rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/85 active:scale-95' }, '⬇️ Download'),
                h('button', { onClick: shareToTikTok, className: 'rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-95' }, '🎵 TikTok')
              ),
              h('button', { onClick: () => setShareOpen(false), className: 'mt-2 w-full rounded-xl bg-white/[0.04] border border-white/10 py-2.5 text-[11px] font-extrabold text-white/60 active:scale-95' }, 'Close')
            )
          ),

          // PASSWORD SETUP MODAL
          passwordModalOpen && h('div', { className: 'fixed inset-0 z-[95] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => !pwSetting && setPasswordModalOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'text-center mb-3' },
                h('div', { className: 'text-5xl mb-2' }, '🔐'),
                h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'ADD A PASSWORD'),
                h('p', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed' },
                  'You signed in with Google. Add a password so you can also log in with ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, 'email + password'),
                  ' next time.'
                ),
                h('p', { className: 'text-[10px] text-white/40 mt-1' }, 'Email: ' + (auth.currentUser && auth.currentUser.email || '—'))
              ),
              h('div', { className: 'space-y-2' },
                h('input', {
                  type: 'password',
                  value: newPassword,
                  onChange: (e) => setNewPassword(e.target.value),
                  placeholder: 'New password (min 6 chars)',
                  disabled: pwSetting,
                  className: 'w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-extrabold text-white placeholder-white/30 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
                }),
                h('input', {
                  type: 'password',
                  value: confirmPassword,
                  onChange: (e) => setConfirmPassword(e.target.value),
                  placeholder: 'Confirm password',
                  disabled: pwSetting,
                  className: 'w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-extrabold text-white placeholder-white/30 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
                }),
                newPassword && confirmPassword && newPassword !== confirmPassword && h('div', { className: 'text-[10px] text-red-400 px-1' }, 'Passwords no match')
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: setupPassword,
                  disabled: pwSetting || !newPassword || newPassword !== confirmPassword || newPassword.length < 6,
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[12px] active:scale-95 transition disabled:opacity-40 font-display'
                }, pwSetting ? 'Setting...' : '🔒 SET PASSWORD'),
                h('button', {
                  onClick: () => setPasswordModalOpen(false),
                  disabled: pwSetting,
                  className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold disabled:opacity-40'
                }, 'Later')
              )
            )
          ),

          achievementToast && h('div', { className: 'fixed top-20 left-1/2 -translate-x-1/2 z-[95] px-4 animate-slideDown pointer-events-none' },
            h('div', { className: 'bg-gradient-to-r from-[#FFD60A] to-[#FFB800] text-black px-5 py-3 rounded-2xl shadow-[0_8px_30px_-6px_rgba(255,214,10,0.8)] flex items-center gap-3 min-w-[220px]' },
              h('div', { className: 'text-2xl' }, achievementToast.icon),
              h('div', null,
                h('div', { className: 'text-[9px] font-black uppercase tracking-widest opacity-60' }, 'Achievement Unlocked!'),
                h('div', { className: 'text-[13px] font-black font-display' }, achievementToast.name)
              )
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'home';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
