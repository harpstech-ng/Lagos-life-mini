            }, 'Hustlers Online'),
            h(Card, { className: 'p-4' },
              h('div', { className: 'text-3xl font-black text-gradient-gold tabular-nums font-display' }, online.toLocaleString()),
              h('div', { className: 'text-[10px] text-white/40 mt-1' }, 'hustlers dey grind right now 🇳🇬')
            )
          ),

          bankModalOpen && h('div', { className: 'fixed inset-0 z-[70] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(255,214,10,0.4)] animate-popIn' },
              h('div', { className: 'text-4xl text-center mb-2' }, '🏦'),
              h('div', { className: 'text-center text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'CHOOSE YOUR BANK'),
              h('p', { className: 'text-center text-[11px] text-white/50 mt-1 mb-4' }, 'Select the bank you want to use to receive fake alerts from other hustlers.'),
              
              h('div', { className: 'space-y-1.5 max-h-[40vh] overflow-y-auto pr-1' },
                NIGERIAN_BANKS.map(bank => 
                  h('button', {
                    key: bank,
                    onClick: () => handleSaveBank(bank),
                    className: 'w-full text-left px-4 py-3 rounded-xl bg-white/[0.04] border border-white/[0.07] text-[13px] font-extrabold active:scale-[0.98] transition hover:bg-white/[0.08]'
                  }, bank)
                )
              )
            )
          ),

          sendOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => !isSending && setSendOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(255,214,10,0.4)] animate-popIn' },
              h('div', { className: 'text-3xl text-center' }, '📤'),
              h('div', { className: 'text-center mt-2 text-[13px] font-black tracking-widest text-[#FFD60A] font-display' }, 'SEND LAGOS CASH'),
              h('p', { className: 'text-center text-[11px] text-white/50 mt-1' }, 'Send fake money to another hustler'),
              
              h('div', { className: 'mt-4 space-y-3' },
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Recipient In-Game Name'),
                  h('input', {
                    value: sendTo, 
                    onChange: (e) => { setSendTo(e.target.value); setVerifiedBank(null); }, 
                    onBlur: verifyBank,
                    placeholder: 'e.g. Aje Butler', 
                    disabled: isSending,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-extrabold text-white placeholder-white/25 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
                  }),
                  isVerifying && h('div', { className: 'text-[10px] text-[#FFD60A] mt-1 animate-pulse' }, 'Verifying...'),
                  verifiedBank && h('div', { className: 'mt-1.5 px-3 py-2 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 flex items-center justify-between' },
                    h('div', { className: 'flex items-center gap-1.5' },
                      h('span', { className: 'text-[#22C55E] text-sm' }, '✅'),
                      h('div', null,
                        h('div', { className: 'text-[10px] text-white/60 font-bold' }, 'Verified Account'),
                        h('div', { className: 'text-[12px] text-[#22C55E] font-black font-display' }, verifiedBank.bank)
                      )
                    )
                  )
                ),
                h('div', null,
                  h('div', { className: 'flex justify-between items-end' },
                    h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Amount'),
                    !s.bankName && h('button', { onClick: () => setBankModalOpen(true), className: 'text-[9px] text-[#FFD60A] underline' }, 'Setup your bank')
                  ),
                  h('input', {
                    type: 'number', value: sendAmt, onChange: (e) => setSendAmt(e.target.value), placeholder: 'Minimum ₦100', disabled: isSending,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-extrabold text-white placeholder-white/25 focus:border-[#FFD60A]/50 transition tabular-nums disabled:opacity-50'
                  })
                ),
                h('div', { className: 'text-[10px] text-white/40 tabular-nums' }, 'Available: ' + fmt(s.cash))
              ),
              h('div', { className: 'mt-4 flex gap-2' },
                h('button', { onClick: () => setSendOpen(false), disabled: isSending, className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/70 active:scale-95 transition disabled:opacity-50' }, 'Cancel'),
                h('button', { onClick: sendMoney, disabled: isSending, className: 'flex-1 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-95 transition shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)] disabled:opacity-50 disabled:shadow-none' }, isSending ? 'Sending...' : 'Send')
              )
            )
          ),

          fakeAlert && h('div', { className: 'fixed top-4 left-0 right-0 z-[100] px-4 animate-slideDown flex justify-center' },
            h('div', { className: 'w-full max-w-sm bg-[#1C1C24] rounded-2xl p-4 shadow-2xl border border-white/20 flex items-start gap-3' },
              h('div', { className: 'w-10 h-10 rounded-full bg-[#22C55E]/20 grid place-items-center shrink-0' },
                h('span', { className: 'text-xl' }, '💸')
              ),
              h('div', { className: 'flex-1' },
                h('div', { className: 'flex justify-between items-start' },
                  h('div', { className: 'text-[13px] font-black text-white' }, fakeAlert.bank + ' Alert'),
                  h('div', { className: 'text-[9px] text-white/40' }, 'Just now')
                ),
                h('div', { className: 'text-[11px] text-white/60 mt-0.5' }, 'Credit Alert'),
                h('div', { className: 'text-[16px] font-black text-[#22C55E] mt-1' }, '₦' + fakeAlert.amount.toLocaleString()),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'From: ' + fakeAlert.sender),
                h('div', { className: 'text-[9px] text-white/30 mt-1' }, 'Ref: LGM' + fakeAlert.ref)
              )
            )
          ),

          txHistoryOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => setTxHistoryOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(255,214,10,0.4)] animate-popIn' },
              h('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3 mb-3' },
                h('div', { className: 'text-[13px] font-black tracking-widest text-[#FFD60A] font-display' }, 'TRANSACTION HISTORY'),
                h('button', { onClick: () => setTxHistoryOpen(false), className: 'text-white/50 text-xl leading-none' }, '×')
              ),
              h('div', { className: 'space-y-2.5 max-h-[60vh] overflow-y-auto pr-1' },
                (!s.transactions || s.transactions.length === 0) ?
                  h('div', { className: 'text-center text-white/40 text-[11px] py-6' }, 'No transactions yet.') :
                  [...s.transactions].sort((a,b) => b.date - a.date).map((tx, i) =>
                    h('div', { key: i, className: 'flex items-center justify-between bg-white/[0.03] border border-white/[0.05] p-2.5 rounded-xl' },
                      h('div', { className: 'flex items-center gap-2' },
                        h('div', { className: 'w-8 h-8 rounded-full grid place-items-center text-sm ' + (tx.type === 'sent' ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400') }, tx.type === 'sent' ? '↗️' : '↙️'),
                        h('div', null,
                          h('div', { className: 'text-[12px] font-extrabold text-white' }, (tx.type === 'sent' ? 'Sent to ' : 'Received from ') + tx.name),
                          h('div', { className: 'text-[9px] text-white/40' }, new Date(tx.date).toLocaleDateString() + ' ' + new Date(tx.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}))
                        )
                      ),
                      h('div', { className: 'text-[13px] font-black tabular-nums ' + (tx.type === 'sent' ? 'text-red-400' : 'text-green-400') },
                        (tx.type === 'sent' ? '-' : '+') + fmt(tx.amount)
                      )
                    )
                  )
              )
            )
          ),

          shareOpen && shareUrl && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-4' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setShareOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm animate-popIn' },
              h('div', { className: 'rounded-2xl overflow-hidden border border-[#FFD60A]/40 shadow-[0_0_60px_-10px_rgba(255,214,10,0.5)]' },
                h('img', { src: shareUrl, alt: 'Share card', className: 'w-full block' })
              ),
              h('div', { className: 'mt-3 grid grid-cols-2 gap-2' },
                h('button', { onClick: downloadCard, className: 'rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/85 active:scale-95 transition' }, '⬇️ Download'),
                h('button', { onClick: shareToTikTok, className: 'rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-95 transition shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)]' }, '🎵 TikTok')
              ),
              h('button', { onClick: () => setShareOpen(false), className: 'mt-2 w-full rounded-xl bg-white/[0.04] border border-white/10 py-2.5 text-[11px] font-extrabold text-white/60 active:scale-95 transition' }, 'Close')
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'home';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
