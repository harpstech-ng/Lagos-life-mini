    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };

    const timeAgo = (t) => {

      if (secs < 60) return secs + 's ago';
      const m = Math.floor(secs / 60);
      if (m < 60) return m + 'm ago';
      const hrs = Math.floor(m / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';

    const todayStr = () => new Date().toISOString().slice(0, 10);

    const AudioEngine = (() => {
      let ctx = null;
      let enabled = true;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx || !enabled) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },

          biggestWin: newBiggest
        }));

        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(winAmount),
            winStreak: newStreak,
            biggestWin: newBiggest,
            lastSeen: Date.now()
          }).catch(() => {});
        }

        if (winAmount >= BIG_WIN_THRESHOLD) {
          fireConfetti();
          AudioEngine.jackpot();
          setBigWin({ amount: winAmount, msg: BIG_WIN_MESSAGES[Math.floor(Math.random() * BIG_WIN_MESSAGES.length)] });
        } else {
          AudioEngine.coin();
        }
        return newStreak;
      };

      // Lose — 1 write only if streak was active
      const recordLoss = async () => {
        const cur = stateRef.current;
        if ((cur.winStreak || 0) === 0) return;
        setS(prev => Object.assign({}, prev, { winStreak: 0 }));
        if (uid) {
          await db.collection("users").doc(uid).update({
            winStreak: 0,
            lastSeen: Date.now()
          }).catch(() => {});
        }
      };

      // Log bet to history + stats (localStorage only, 0 Firebase)
      const logBet = (game, amount, won, winAmount) => {
        try {
          const hist = getBetHistory();
          hist.unshift({
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            game, amount, won, winAmount: winAmount || 0, t: Date.now()
          });
          localStorage.setItem('bet_history', JSON.stringify(hist.slice(0, 20)));
          setBetHistory(hist.slice(0, 20));

          const stats = getBetStats();
          stats.played++;
          stats.wagered += amount;
          if (won) stats.won += winAmount;
          localStorage.setItem('bet_stats', JSON.stringify(stats));
          setBetStats(stats);
        } catch (e) {}
      };

      // ═══════════ AVIATOR ═══════════
      const startAviator = () => {
        if (s.cash < aviatorBet) { AudioEngine.error(); return notify('Not enough cash 💸', 'bad'); }
        deductBet(aviatorBet);
        setAviatorState("flying");
        setMultiplier(1.00);
        setHasCashedOut(false);
        cashedOutRef.current = false; // ← FIX: use ref instead of stale state
        AudioEngine.tap();
        const r = Math.random();
        let cp = 1.00;
        if (r < 0.4) cp = 1.0 + Math.random() * 0.5;
        else if (r < 0.7) cp = 1.5 + Math.random() * 1.5;
        else if (r < 0.9) cp = 3.0 + Math.random() * 7.0;
        else cp = 10.0 + Math.random() * 40.0;
        crashPoint.current = cp;
        let currentM = 1.00;
        aviatorInterval.current = setInterval(() => {
          currentM += 0.02 + (currentM * 0.01);
          if (currentM >= crashPoint.current) {
            clearInterval(aviatorInterval.current);
            setMultiplier(crashPoint.current);

            setSlotReels(finalReels);
            const key = finalReels.join('');
            const mult = SLOT_PAYOUTS[key] || (finalReels[0] === finalReels[1] || finalReels[1] === finalReels[2] ? 1.5 : 0);
            
            if (mult > 0) {

              logBet('Slots', slotBet, false, 0);
              notify('No win. Try again 😭', 'bad');

            setSlotState("idle");
          }
        }, 100);

        setTimeout(() => {

          let won = false;
          let mult = 0;
          if (diceChoice === 'high' && result >= 4) { won = true; mult = 2; }

                    h('div', {
                      key: bet.id,
                      className: 'flex items-center justify-between px-2.5 py-2 rounded-xl ' +
                        (bet.won ? 'bg-[#22C55E]/10 border border-[#22C55E]/20' : 'bg-red-500/10 border border-red-500/20')
                    },
                      h('div', { className: 'flex items-center gap-2 min-w-0' },
                        h('div', { className: 'text-base shrink-0' }, bet.won ? '✅' : '❌'),
                        h('div', { className: 'min-w-0' },
                          h('div', { className: 'text-[11px] font-extrabold font-display truncate' }, bet.game),
                          h('div', { className: 'text-[9px] text-white/40' }, timeAgo(bet.t) + ' · Bet ' + fmt(bet.amount))
                        )
                      ),
                      h('div', { className: 'text-[11px] font-black tabular-nums shrink-0 ' + (bet.won ? 'text-[#22C55E]' : 'text-red-400') },
                        bet.won ? '+' + fmt(bet.winAmount) : '-' + fmt(bet.amount)
                      )
                    )
                  )
                ),
              h('button', {
                onClick: () => {
                  if (confirm('Clear all bet history? This cannot be undone.')) {
                    localStorage.removeItem('bet_history');
                    localStorage.removeItem('bet_stats');
                    setBetHistory([]);
                    setBetStats({ played: 0, wagered: 0, won: 0 });
                  }
                },
                className: 'mt-3 w-full py-2 rounded-xl bg-white/[0.04] border border-white/10 text-white/40 text-[10px] font-bold'
              }, 'Clear History')
            )
          ),

          // Big win modal
          bigWin && h('div', { className: 'fixed inset-0 z-[90] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setBigWin(null) }),
            h('div', { className: 'relative w-full max-w-sm animate-popIn' },
              h('div', { className: 'rounded-3xl bg-gradient-to-br from-[#FFE566] via-[#FFD60A] to-[#FFB800] p-1 shadow-[0_0_80px_-10px_rgba(255,214,10,0.8)]' },
                h('div', { className: 'rounded-3xl bg-[#0a0a10] p-6 text-center' },
                  h('div', { className: 'text-6xl mb-3 animate-bounce' }, '🎉'),
                  h('div', { className: 'text-[16px] font-black tracking-widest text-[#FFD60A] font-display' }, bigWin.msg),
                  h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold mt-4' }, 'You just won'),
                  h('div', { className: 'text-5xl font-black text-gradient-gold font-display tabular-nums my-2 drop-shadow-lg' }, fmt(bigWin.amount)),
                  h('div', { className: 'text-[11px] text-white/60 mt-2' }, 'This one na proper blessing 🙏'),
                  h('button', {
                    onClick: () => setBigWin(null),
                    className: 'w-full mt-5 py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[13px] active:scale-95 transition shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)]'
                  }, '🔥 COLLECT AM!')
                )
              )
            )
          ),

          // Password reminder
          showPasswordReminder && h('div', { className: 'fixed inset-0 z-[95] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setShowPasswordReminder(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-2' }, '🔐'),
              h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'ADD A PASSWORD'),
              h('p', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed' },
                'You signed in with Google. Add a password so you fit still login with email if Google login ever fails.'
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: () => { window.location.href = '/index.html'; },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95'
                }, '🔒 Set Password Now'),
                h('button', { onClick: () => setShowPasswordReminder(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Later')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
