    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    @keyframes floatEmoji { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-10px) rotate(6deg); } }

    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-pulseRing { animation: pulseRing 2s ease-in-out infinite; }

    .square-light { background: linear-gradient(135deg, #E8C9A0 0%, #D4B785 100%); }

    }
    .piece-G {

  <script>

  <script>
    const { useState, useEffect, useRef } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const houseFeeFor = (isReal) => isReal ? 0.25 : 0;
    const winPayout = (stake, isReal) => Math.floor(stake * 2 * (1 - houseFeeFor(isReal)));

    const FAKE_STAKES = [1_000_000, 10_000_000, 50_000_000, 100_000_000];
    const REAL_STAKES = [100, 500, 1000, 5000];
    const ROOM_EXPIRY_MS = 15 * 60 * 1000;
    const CHAT_MAX = 40;
    const COUNTDOWN_MS = 10_000;
    const MOVE_TIMER_MS = 30_000;
    const PRESENCE_TIMEOUT_MS = 20_000;
    const PRESENCE_HEARTBEAT_MS = 5_000;

    const NIGERIAN_PHRASES = [
      'Omo! 😱', 'E don do! 💀', 'Sharp sharp! ⚡', 'Wahala! 😭',
      'You dey whine me? 🤨', 'Na wa oo 😤', 'Chai! 🙆🏾', 'I don die 💀',
      'Oya now! 👊', 'No gree for anybody 🚨', 'Abeg 😩', 'God when? 🙏🏾'
    ];
    const QUICK_REACTIONS = ['🔥', '💀', '😂', '💰', '👑', '🎉', '😤', '🫡'];

    const CHECKERS_INITIAL = [
      [null,'H',null,'H',null,'H',null,'H'],
      ['H',null,'H',null,'H',null,'H',null],
      [null,'H',null,'H',null,'H',null,'H'],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ['G',null,'G',null,'G',null,'G',null],
      [null,'G',null,'G',null,'G',null,'G'],
      ['G',null,'G',null,'G',null,'G',null]
    ];

    const fmt = (n) => {
      n = Math.floor(Number(n) || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (Number(n) || 0).toLocaleString('en-NG', { maximumFractionDigits: 0 });
    const timeAgo = (ts) => {
      if (!ts) return 'now';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const sec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (sec < 10) return 'now';
      if (sec < 60) return sec + 's';
      if (sec < 3600) return Math.floor(sec / 60) + 'm';
      return Math.floor(sec / 3600) + 'h';
    };
    const initial = (n) => (n || 'H').charAt(0).toUpperCase();
    const colorFromName = (name) => {
      const c = ['#FFD60A','#22C55E','#3B82F6','#A855F7','#EF4444','#EC4899','#06B6D4','#F59E0B'];
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
      return c[Math.abs(hash) % c.length];
    };
    const genCode = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 8; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    };
    const getCachedData = () => {
      try {
        const c = localStorage.getItem("lagos_user_data");
        if (c) return JSON.parse(c);
      } catch (e) {}
      return { name: localStorage.getItem("lagos_user_name") || 'Hustler', cash: 25000, real: 0 };
    };

    const pieceOwner = (p) => p ? p.charAt(0) : null;
    const isKing = (p) => p === 'Hk' || p === 'Gk';

    const getMoves = (board, r, c) => {
      const piece = board[r][c];
      if (!piece) return [];
      const owner = pieceOwner(piece);
      const king = isKing(piece);
      const forward = owner === 'H' ? 1 : -1;
      const dirs = king ? [1, -1] : [forward];
      const moves = [];
      for (const dr of dirs) {
        for (const dc of [-1, 1]) {
          const nr = r + dr, nc = c + dc;
          if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) continue;
          if (!board[nr][nc]) moves.push({ to: [nr, nc], type: 'move' });
          else if (pieceOwner(board[nr][nc]) !== owner) {
            const jr = r + dr * 2, jc = c + dc * 2;
            if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && !board[jr][jc]) {
              moves.push({ to: [jr, jc], type: 'jump', captured: [nr, nc] });
            }
          }
        }
      }
      return moves;
    };

    const applyMove = (board, from, move, owner) => {
      const nb = board.map(r => [...r]);
      const [fr, fc] = from;
      const [tr, tc] = move.to;
      let piece = nb[fr][fc];
      nb[fr][fc] = null;
      if (move.type === 'jump') nb[move.captured[0]][move.captured[1]] = null;
      if (owner === 'H' && tr === 7 && piece === 'H') piece = 'Hk';
      if (owner === 'G' && tr === 0 && piece === 'G') piece = 'Gk';
      nb[tr][tc] = piece;
      return nb;
    };

    const hasAnyMove = (board, owner) => {
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if (pieceOwner(board[r][c]) === owner && getMoves(board, r, c).length > 0) return true;
      }
      return false;
    };
    const countPieces = (board, owner) => {
      let n = 0;
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (pieceOwner(board[r][c]) === owner) n++;
      return n;
    };

    const getRandomMove = (board, owner) => {
      const candidates = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if (pieceOwner(board[r][c]) === owner) {
          const moves = getMoves(board, r, c);
          if (moves.length > 0) candidates.push({ from: [r, c], moves });
        }
      }
      if (candidates.length === 0) return null;
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      const move = pick.moves[Math.floor(Math.random() * pick.moves.length)];
      return { from: pick.from, move };
    };

    const AudioEngine = (() => {
      let ctx = null;
      const init = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); };
      const tone = (f, d, t, w=0, g=0.25) => {
        if (!ctx) return;
        const s = ctx.currentTime + w, o = ctx.createOscillator(), gn = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gn.gain.setValueAtTime(0, s); gn.gain.linearRampToValueAtTime(g, s+0.01);
        gn.gain.exponentialRampToValueAtTime(0.0001, s+d);
        o.connect(gn); gn.connect(ctx.destination); o.start(s); o.stop(s+d+0.05);
      };
      return {
        tap: () => { init(); tone(880, 0.08, 'triangle'); },
        move: () => { init(); tone(660, 0.08, 'triangle'); },
        capture: () => { init(); tone(440, 0.1, 'square'); tone(330, 0.15, 'square', 0.06); },
        win: () => { init(); [523,659,783,1046,1318].forEach((f,i) => tone(f, 0.2, 'triangle', i*0.08)); },
        lose: () => { init(); tone(220, 0.3, 'sawtooth'); tone(165, 0.4, 'sawtooth', 0.15); },
        msg: () => { init(); tone(1046, 0.05, 'sine'); },
        error: () => { init(); tone(220, 0.15, 'sawtooth'); },
        copy: () => { init(); tone(1318, 0.08, 'sine'); tone(1568, 0.1, 'sine', 0.05); },
        countdown: () => { init(); tone(880, 0.1, 'sine'); },
        tick: () => { init(); tone(440, 0.03, 'sine', 0, 0.15); },
        timeout: () => { init(); tone(330, 0.2, 'sawtooth'); tone(220, 0.3, 'sawtooth', 0.1); }
      };
    })();

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [view, setView] = useState('lobby');
      const [roomId, setRoomId] = useState(null);
      const [room, setRoom] = useState(null);
      const [inviteCode, setInviteCode] = useState(null);
      const [toast, setToast] = useState(null);
      const [feed, setFeed] = useState([]);
      const [now, setNow] = useState(Date.now());

      const [opponentName, setOpponentName] = useState('');
      const [isReal, setIsReal] = useState(false);
      const [stake, setStake] = useState(FAKE_STAKES[0]);
      const [userCheck, setUserCheck] = useState({ status: 'idle' });

      const [joinError, setJoinError] = useState(null);
      const [joinRoom, setJoinRoom] = useState(null);
      const [checkingInvite, setCheckingInvite] = useState(false);

      useEffect(() => {
        let unsubUser = null;
        const unsubAuth = auth.onAuthStateChanged(user => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (unsubUser) unsubUser();
          setUid(user.uid);
          unsubUser = db.collection("users").doc(user.uid).onSnapshot(doc => {
            if (doc.exists) {
              const d = doc.data();
              setS(prev => {
                const m = { ...prev, ...d };
                try { localStorage.setItem("lagos_user_data", JSON.stringify(m)); } catch(e) {}
                return m;
              });
            }
          }, e => console.error(e));
        });
        return () => { unsubAuth(); if (unsubUser) unsubUser(); };
      }, []);

      useEffect(() => {
        const iv = setInterval(() => setNow(Date.now()), 500);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(t);
      }, [toast]);
      const notify = (msg, kind='good') => setToast({ msg, kind, id: Date.now() });

      useEffect(() => {
        const unsub = db.collection("game_feed")
          .where("game", "==", "checkers")
          .orderBy("at", "desc")
          .limit(10)
          .onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFeed(list);
          }, () => {});
        return () => unsub();
      }, []);

      useEffect(() => {
        const name = opponentName.trim();
        if (!name || name.length < 2) { setUserCheck({ status: 'idle' }); return; }
        if (uid && name.toLowerCase() === (s.name || '').toLowerCase()) {
          setUserCheck({ status: 'self' });
          return;
        }
        setUserCheck({ status: 'checking' });
        const t = setTimeout(async () => {
          try {
            const snap = await db.collection("users").where("name", "==", name).limit(1).get();
            if (snap.empty) {
              setUserCheck({ status: 'notfound' });
            } else {
              const d = snap.docs[0].data();
              setUserCheck({ status: 'found', user: { name: d.name, bankName: d.bankName || '—' } });
            }
          } catch (e) { setUserCheck({ status: 'error' }); }
        }, 700);
        return () => clearTimeout(t);
      }, [opponentName, uid, s.name]);

      useEffect(() => {
        if (!uid || !s.name) return;
        const params = new URLSearchParams(window.location.search);
        const inv = params.get('invite');
        if (!inv) return;
        setCheckingInvite(true);
        (async () => {
          try {
            const doc = await db.collection("game_rooms").doc(inv).get();
            if (!doc.exists) { setJoinError('This invite link no longer exists 😢'); setView('join'); setCheckingInvite(false); return; }
            const d = doc.data();
            if (d.hostId === uid) { setRoomId(inv); setView('waiting'); setCheckingInvite(false); return; }
            if (d.status !== 'waiting') { setJoinError('Match already started or finished 😤'); setView('join'); setCheckingInvite(false); return; }
            if (d.targetName && d.targetName.toLowerCase() !== (s.name || '').toLowerCase()) {
              setJoinError('This invite is for "' + d.targetName + '" only! 🚫');
              setView('join'); setCheckingInvite(false); return;
            }
            setJoinRoom({ id: inv, ...d });
            setView('join');
            setCheckingInvite(false);
          } catch (e) {
            setJoinError('Failed: ' + e.message);
            setView('join');
            setCheckingInvite(false);
          }
        })();
      }, [uid, s.name]);

      useEffect(() => {
        if (!roomId) { setRoom(null); return; }
        const unsub = db.collection("game_rooms").doc(roomId).onSnapshot(doc => {
          if (!doc.exists) { setRoom(null); return; }
          setRoom({ id: doc.id, ...doc.data() });
        }, e => console.error(e));
        return () => unsub();
      }, [roomId]);

      useEffect(() => {
        if (!room || !uid) return;
        if (room.status !== 'countdown' && room.status !== 'playing') return;
        const isHost = room.hostId === uid;
        const field = isHost ? 'lastSeenHost' : 'lastSeenGuest';
        const beat = () => {
          db.collection("game_rooms").doc(room.id).update({
            [field]: Date.now()
          }).catch(() => {});
        };
        beat();
        const iv = setInterval(beat, PRESENCE_HEARTBEAT_MS);
        return () => clearInterval(iv);
      }, [room?.id, room?.status, uid]);

      const disconnectHandledRef = useRef(false);
      useEffect(() => {
        if (!room || room.status !== 'playing' || room.winner) { disconnectHandledRef.current = false; return; }
        if (!uid) return;
        const isHost = room.hostId === uid;
        const oppLastSeen = isHost ? room.lastSeenGuest : room.lastSeenHost;
        if (!oppLastSeen) return;
        const stale = now - oppLastSeen;
        if (stale > PRESENCE_TIMEOUT_MS && !disconnectHandledRef.current) {
          disconnectHandledRef.current = true;
          claimWinByDisconnect(room, isHost ? 'host' : 'guest');
        }
      }, [now, room, uid]);

      const claimWinByDisconnect = async (r, winner) => {
        try {
          const roomRef = db.collection("game_rooms").doc(r.id);
          await db.runTransaction(async (tx) => {
            const doc = await tx.get(roomRef);
            if (!doc.exists) return;
            const d = doc.data();
            if (d.status === 'finished' || d.winner) return;
            tx.update(roomRef, {
              status: 'finished',
              winner,
              forfeitedBy: winner === 'host' ? d.guestId : d.hostId,
              endedBy: 'disconnect'
            });
          });
          await payout(r, winner);
          AudioEngine.win();
          notify('Opponent disconnected! You win 🏆');
        } catch (e) {
          disconnectHandledRef.current = false;
        }
      };

      useEffect(() => {
        if (!room || room.status !== 'countdown' || !uid) return;
        if (room.hostId !== uid) return;
        const startsAt = room.startsAt?.toMillis?.() || 0;
        if (now >= startsAt) {
          db.collection("game_rooms").doc(room.id).update({
            status: 'playing',
            turn: 'host',
            lastMoveAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastSeenHost: Date.now(),
            lastSeenGuest: Date.now()
          }).catch(() => {});
        }
      }, [now, room, uid]);

      const autoMoveRef = useRef(false);
      useEffect(() => {
        if (!room || room.status !== 'playing' || room.winner || !uid) { autoMoveRef.current = false; return; }
        const isHost = room.hostId === uid;
        const myTurn = (isHost && room.turn === 'host') || (!isHost && room.turn === 'guest');
        if (!myTurn) { autoMoveRef.current = false; return; }
        const lastMove = room.lastMoveAt?.toMillis?.() || 0;
        if (now - lastMove > MOVE_TIMER_MS && !autoMoveRef.current) {
          autoMoveRef.current = true;
          const myOwner = isHost ? 'H' : 'G';
          const random = getRandomMove(room.board, myOwner);
          if (random) {
            const newBoard = applyMove(room.board, random.from, random.move, myOwner);
            const opp = myOwner === 'H' ? 'G' : 'H';
            const hasMoves = hasAnyMove(newBoard, opp);
            const hasPieces = countPieces(newBoard, opp) > 0;
            const winner = (!hasMoves || !hasPieces) ? (myOwner === 'H' ? 'host' : 'guest') : null;
            makeMove(newBoard, winner, 'timeout');
            AudioEngine.timeout();
            notify('You ran out of time! Random move made ⏱️', 'bad');
          }
        }
      }, [now, room, uid]);

      useEffect(() => {
        if (!uid) return;
        (async () => {
          try {
            const snap = await db.collection("game_rooms")
              .where("hostId", "==", uid)
              .where("status", "==", "waiting")
              .get();
            for (const doc of snap.docs) {
              const d = doc.data();
              const created = d.createdAt?.toMillis?.() || 0;
              if (Date.now() - created > ROOM_EXPIRY_MS) {
                const field = d.isReal ? 'real' : 'cash';
                await db.collection("users").doc(uid).update({

          if (navigator.share) { await navigator.share({ title: 'Draft Challenge', text, url: link }); return; }
          await navigator.clipboard.writeText(text);
          setCopied(true); AudioEngine.copy();
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {}
      };

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto p-5' },
        h('div', { className: 'text-center mb-5 pt-4' },
          h('div', { className: 'text-6xl mb-3 animate-pulse' }, '⏳'),
          h('div', { className: 'text-[16px] font-black font-display text-[#FFD60A]' }, 'Waiting for opponent...'),
          h('div', { className: 'text-[11px] text-white/50 mt-1' }, 'Share the link below')
        ),
        h('div', { className: 'rounded-2xl bg-gradient-to-br from-[#FFD60A]/15 to-transparent border border-[#FFD60A]/40 p-4 space-y-3' },
          h('div', { className: 'text-center' },
            h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, '🎟️ Invite Code'),
            h('div', { className: 'text-3xl font-black font-display text-[#FFD60A] mt-1 tracking-wider' }, inviteCode || '------'),
            h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Only "' + room.targetName + '" can join')
          ),
          h('div', { className: 'space-y-1.5 pt-2 border-t border-white/[0.08]' },
            h('div', { className: 'flex justify-between text-[11px]' },
              h('span', { className: 'text-white/40' }, 'Game'),
              h('span', { className: 'font-black' }, 'Naija Draft ⚫')),
            h('div', { className: 'flex justify-between text-[11px]' },
              h('span', { className: 'text-white/40' }, 'Stake'),
              h('span', { className: 'font-black ' + (room.isReal ? 'text-[#22C55E]' : 'text-[#FFD60A]') }, fmtAmt(room.stake) + (room.isReal ? ' REAL' : ' FAKE'))),
            h('div', { className: 'flex justify-between text-[11px]' },
              h('span', { className: 'text-white/40' }, 'Winner gets'),
              h('span', { className: 'font-black text-[#22C55E]' }, fmtAmt(winPayout(room.stake, room.isReal))))
          )
        ),
        h('button', {
          onClick: copyLink,
          className: 'w-full mt-4 py-4 rounded-2xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[14px] shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)] active:scale-95 transition animate-pulseRing'
        }, copied ? '✅ COPIED!' : '📋 SHARE LINK'),
        h('button', {
          onClick: onCancel,
          className: 'w-full mt-2 py-3 rounded-xl bg-red-500/15 border border-red-500/30 text-red-400 text-[12px] font-black active:scale-95'
        }, '❌ CANCEL & REFUND'),
        h('p', { className: 'text-[9px] text-white/30 text-center mt-4 leading-relaxed' },
          'Link expires in 15 minutes. Auto-refund if cancelled.')
      );
    }

    function JoinScreen({ joinRoom, joinError, s, onAccept, onBack }) {
      const [accepting, setAccepting] = useState(false);
      const fmtAmt = (v) => joinRoom?.isReal ? fmtReal(v) : fmt(v);

      if (joinError || !joinRoom) {
        return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto grid place-items-center p-6' },
          h('div', { className: 'text-center w-full max-w-sm' },
            h('div', { className: 'text-6xl mb-3' }, '🚫'),
            h('div', { className: 'text-[16px] font-black font-display text-red-400' }, 'Cannot Join'),
            h('div', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed px-4' }, joinError || 'Invite not found'),
            h('button', { onClick: onBack, className: 'mt-5 px-6 py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[12px] active:scale-95' }, 'Back to Lobby')
          )
        );
      }

      const field = joinRoom.isReal ? 'real' : 'cash';
      const canAfford = (s[field] || 0) >= joinRoom.stake;

      const handleAccept = async () => {
        setAccepting(true);
        await onAccept();
        setAccepting(false);
      };

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto grid place-items-center p-5' },
        h('div', { className: 'w-full max-w-sm' },
          h('div', { className: 'text-center mb-4' },
            h('div', { className: 'text-6xl mb-2 animate-floatEmoji' }, '🎟️'),
            h('div', { className: 'text-[16px] font-black font-display text-[#FFD60A]' }, 'YOU\'VE BEEN CHALLENGED!'),
            h('div', { className: 'text-[11px] text-white/50 mt-1' }, 'Only you can accept this match')
          ),
          h('div', { className: 'rounded-2xl card-gradient p-5 space-y-3' },
            h('div', { className: 'flex items-center gap-3' },
              h('div', { className: 'w-12 h-12 rounded-full grid place-items-center font-black text-black text-lg', style: { background: colorFromName(joinRoom.hostName) } }, initial(joinRoom.hostName)),
              h('div', { className: 'flex-1' },
                h('div', { className: 'text-[13px] font-black' }, joinRoom.hostName),
                h('div', { className: 'text-[10px] text-white/40' }, 'Challenger')
              )
            ),
            h('div', { className: 'text-center py-3 border-y border-white/[0.08]' },
              h('div', { className: 'text-4xl mb-1' }, '⚫'),
              h('div', { className: 'text-[14px] font-black' }, 'Naija Draft'),
              h('div', { className: 'text-[11px] ' + (joinRoom.isReal ? 'text-[#22C55E]' : 'text-[#FFD60A]') + ' font-bold mt-1' },
                fmtAmt(joinRoom.stake) + ' ' + (joinRoom.isReal ? 'REAL' : 'FAKE'))
            ),
            h('div', { className: 'text-[10px] space-y-1' },
              h('div', { className: 'flex justify-between' },
                h('span', { className: 'text-white/40' }, 'Winner gets'),
                h('span', { className: 'font-black text-[#22C55E]' }, fmtAmt(winPayout(joinRoom.stake, joinRoom.isReal)))),
              h('div', { className: 'flex justify-between' },
                h('span', { className: 'text-white/40' }, 'Your balance'),
                h('span', { className: 'font-black ' + (canAfford ? 'text-white' : 'text-red-400') }, fmtAmt(s[field] || 0)))
            )
          ),
          h('button', {
            onClick: handleAccept,
            disabled: accepting || !canAfford,
            className: 'w-full mt-4 py-4 rounded-2xl bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black font-black text-[14px] shadow-[0_8px_24px_-8px_rgba(34,197,94,0.7)] active:scale-95 transition disabled:opacity-50 animate-pulseRing'
          }, accepting ? 'Joining...' : !canAfford ? '💸 Not enough balance' : '✅ ACCEPT & PLAY'),
          h('button', { onClick: onBack, className: 'w-full mt-2 py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-[11px] font-bold text-white/60' }, 'Decline')
        )
      );
    }

    function PlayingScreen({ room, uid, s, now, onMove, onLeave, notify }) {
      const isHost = room.hostId === uid;
      const myTurn = (isHost && room.turn === 'host') || (!isHost && room.turn === 'guest');
      const myOwner = isHost ? 'H' : 'G';
      const [selected, setSelected] = useState(null);
      const [chatText, setChatText] = useState('');
      const [confirmLeave, setConfirmLeave] = useState(false);
      const [withdrawForm, setWithdrawForm] = useState({ bank: '', acc: '', name: '' });
      const [submitting, setSubmitting] = useState(false);
      const [showPhrases, setShowPhrases] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }, [room.messages?.length]);
      useEffect(() => { setSelected(null); }, [room.turn, room.board]);

      const fmtAmt = (v) => room.isReal ? fmtReal(v) : fmt(v);
      const oppName = isHost ? room.guestName : room.hostName;
      const oppLastSeen = isHost ? room.lastSeenGuest : room.lastSeenHost;
      const oppStale = oppLastSeen && now - oppLastSeen;

      const sendChat = async (msgText) => {
        const txt = (msgText || chatText).trim();
        if (!txt) return;
        const msg = { userId: uid, name: s.name || 'Player', text: txt.slice(0, 200), at: Date.now() };
        const trimmed = [...(room.messages || []), msg].slice(-CHAT_MAX);
        try {
          await db.collection("game_rooms").doc(room.id).update({ messages: trimmed });
          if (!msgText) setChatText('');
          AudioEngine.msg();
        } catch (e) {}
      };

      const handleTap = async (r, c) => {
        if (!myTurn || room.status !== 'playing') return;
        const piece = room.board[r][c];
        if (selected && selected[0] === r && selected[1] === c) { setSelected(null); return; }
        if (piece && pieceOwner(piece) === myOwner) { setSelected([r, c]); AudioEngine.tap(); return; }
        if (selected) {
          const moves = getMoves(room.board, selected[0], selected[1]);
          const move = moves.find(m => m.to[0] === r && m.to[1] === c);
          if (move) {
            const newBoard = applyMove(room.board, selected, move, myOwner);
            const opp = myOwner === 'H' ? 'G' : 'H';
            const hasMoves = hasAnyMove(newBoard, opp);
            const hasPieces = countPieces(newBoard, opp) > 0;
            const winner = (!hasMoves || !hasPieces) ? (myOwner === 'H' ? 'host' : 'guest') : null;
            if (move.type === 'jump') AudioEngine.capture(); else AudioEngine.move();
            await onMove(newBoard, winner);
            setSelected(null);
          }
        }
      };

      const submitWithdraw = async () => {
        if (!withdrawForm.bank || !withdrawForm.acc || !withdrawForm.name) return notify('Fill all fields', 'bad');
        if (withdrawForm.acc.length < 10) return notify('Account must be 10 digits', 'bad');
        setSubmitting(true);
        try {
          await db.collection("withdrawals").add({
            userId: uid,
            name: s.name || 'Hustler',
            bankName: withdrawForm.bank,
            accountNumber: withdrawForm.acc,
            accountName: withdrawForm.name,
            amountReal: winPayout(room.stake, room.isReal),
            status: 'pending',
            source: 'checkers_win',
            createdAt: Date.now()
          });
          notify('Withdrawal submitted! 24-48hrs ✅');
          setWithdrawForm({ bank: '', acc: '', name: '' });
        } catch (e) { notify('Failed: ' + e.message, 'bad'); }
        setSubmitting(false);
      };

      if (room.status === 'countdown') {
        const startsAt = room.startsAt?.toMillis?.() || 0;
        const remaining = Math.max(0, Math.ceil((startsAt - now) / 1000));
        return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto grid place-items-center p-6 relative overflow-hidden' },
          h('div', { className: 'absolute inset-0 bg-gradient-to-br from-[#FFD60A]/20 via-transparent to-[#EF4444]/15' }),
          h('div', { className: 'relative text-center' },
            h('div', { className: 'text-[11px] uppercase tracking-widest text-white/50 font-bold mb-2' }, 'Match starts in'),
            h('div', { className: 'text-9xl font-black font-display text-gradient-gold animate-countdownPop tabular-nums', key: remaining }, remaining || 'GO!'),
            h('div', { className: 'mt-6 flex items-center justify-center gap-4' },
              h('div', { className: 'text-center' },
                h('div', { className: 'w-14 h-14 rounded-full grid place-items-center text-lg font-black text-black mx-auto', style: { background: colorFromName(s.name) } }, initial(s.name)),
                h('div', { className: 'text-[10px] text-white/60 mt-1' }, 'You')
              ),
              h('div', { className: 'text-2xl text-[#FFD60A]' }, '⚔️'),
              h('div', { className: 'text-center' },
                h('div', { className: 'w-14 h-14 rounded-full grid place-items-center text-lg font-black text-black mx-auto', style: { background: colorFromName(oppName) } }, initial(oppName)),
                h('div', { className: 'text-[10px] text-white/60 mt-1' }, oppName)
              )
            ),
            h('div', { className: 'mt-4 text-[11px] text-white/50' }, 'Stake: ' + fmtAmt(room.stake))
          )
        );
      }

      if (room.status === 'finished') {
        const iWon = (isHost && room.winner === 'host') || (!isHost && room.winner === 'guest');
        const winAmt = winPayout(room.stake, room.isReal);

        return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto p-6 overflow-y-auto' },
          h('div', { className: 'text-center pt-6' },
            h('div', { className: 'text-7xl mb-3 animate-bounce' }, iWon ? '🏆' : '💀'),
            h('div', { className: 'text-2xl font-black font-display ' + (iWon ? 'text-[#FFD60A]' : 'text-red-400') }, iWon ? 'YOU WIN!' : 'YOU LOSE'),
            h('div', { className: 'text-3xl font-black tabular-nums mt-2 ' + (iWon ? 'text-[#22C55E]' : 'text-red-400') },
              (iWon ? '+' : '-') + fmtAmt(iWon ? winAmt : room.stake)),
            h('div', { className: 'text-[11px] text-white/50 mt-1' },
              room.endedBy === 'disconnect' ? '🎯 Opponent disconnected' :
              room.endedBy === 'timeout' ? '⏱️ Timeout' :
              room.forfeitedBy === uid ? '🚪 You forfeited' :
              room.forfeitedBy ? '🎯 Opponent forfeited' :
              iWon ? (room.isReal ? 'Added to Real Balance' : 'Added to Cash') :
              'Opponent outsmarted you'
            )
          ),

          iWon && room.isReal && h('div', { className: 'mt-6 rounded-2xl border-2 border-[#22C55E]/40 bg-gradient-to-br from-[#22C55E]/15 to-transparent p-4 animate-pulseRing' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-2xl mb-1' }, '💸'),
              h('div', { className: 'text-[13px] font-black font-display text-[#22C55E]' }, 'WITHDRAW YOUR WINNINGS NOW'),
              h('div', { className: 'text-[10px] text-white/60 mt-0.5' }, 'Don\'t let it sleep in your account!')
            ),
            h('div', { className: 'space-y-2' },
              h('input', { placeholder: 'Bank (e.g. GTBank, Opay)', value: withdrawForm.bank, onChange: e => setWithdrawForm({...withdrawForm, bank: e.target.value}), className: 'w-full rounded-lg bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/30' }),
              h('input', { placeholder: 'Account number (10 digits)', type: 'tel', value: withdrawForm.acc, onChange: e => setWithdrawForm({...withdrawForm, acc: e.target.value.replace(/\D/g,'').slice(0,10)}), className: 'w-full rounded-lg bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/30' }),
              h('input', { placeholder: 'Account name', value: withdrawForm.name, onChange: e => setWithdrawForm({...withdrawForm, name: e.target.value}), className: 'w-full rounded-lg bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/30' })
            ),
            h('button', { onClick: submitWithdraw, disabled: submitting, className: 'w-full mt-3 py-3 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black font-black text-[13px] active:scale-95 disabled:opacity-50 shadow-[0_6px_20px_-6px_rgba(34,197,94,0.7)]' },
              submitting ? 'Submitting...' : '📥 WITHDRAW ' + fmtAmt(winAmt))
          ),

          h('button', {
            onClick: onLeave,
            className: 'w-full mt-6 py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[13px] active:scale-95'
          }, '🎮 Back to Lobby')
        );
      }

      const validMoves = selected ? getMoves(room.board, selected[0], selected[1]) : [];
      const validTargets = new Set(validMoves.map(m => m.to[0] + ',' + m.to[1]));
      const captures = new Set(validMoves.filter(m => m.type === 'jump').map(m => m.to[0] + ',' + m.to[1]));

      const lastMove = room.lastMoveAt?.toMillis?.() || 0;
      const moveTimeLeft = Math.max(0, MOVE_TIMER_MS - (now - lastMove));
      const moveTimeSecs = Math.ceil(moveTimeLeft / 1000);
      const moveBarPct = (moveTimeLeft / MOVE_TIMER_MS) * 100;

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white max-w-md mx-auto flex flex-col' },
        h('header', { className: 'px-3 py-2 border-b border-white/[0.06] flex items-center justify-between shrink-0' },
          h('button', { onClick: () => setConfirmLeave(true), className: 'w-9 h-9 rounded-xl bg-white/[0.06] border border-white/10 grid place-items-center text-lg' }, '←'),
          h('div', { className: 'flex-1 min-w-0 text-center' },
            h('div', { className: 'text-[12px] font-black font-display text-[#FFD60A]' }, 'Naija Draft · ' + fmtAmt(room.stake)),
            h('div', { className: 'text-[9px] ' + (myTurn ? 'text-[#22C55E]' : 'text-white/40') + ' flex items-center justify-center gap-1 mt-0.5' },
              h('span', { className: 'w-1.5 h-1.5 rounded-full ' + (myTurn ? 'bg-[#22C55E] glow-dot animate-pulse' : 'bg-white/30') }),
              myTurn ? 'YOUR TURN' : 'Waiting...'
            )
          ),
          h('div', { className: 'text-[9px] text-white/60 text-right' },
            h('div', { className: 'font-black text-[10px]' }, isHost ? 'HOST' : 'GUEST'))
        ),

        h('div', { className: 'px-3 py-2 bg-white/[0.03] border-b border-white/[0.05] shrink-0' },
          h('div', { className: 'flex items-center gap-2 text-[10px]' },
            h('div', { className: 'w-6 h-6 rounded-full grid place-items-center text-[10px] font-black text-black relative', style: { background: colorFromName(oppName) } },
              initial(oppName),
              oppStale < 5000 ? h('span', { className: 'absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-[#22C55E] border border-black' }) : null
            ),
            h('div', { className: 'font-bold text-white/70' }, oppName),
            h('div', { className: 'ml-auto flex items-center gap-2' },
              h('div', { className: 'text-[9px] font-black tabular-nums ' + (moveTimeSecs <= 5 ? 'text-red-400 animate-pulse' : 'text-white/50') }, moveTimeSecs + 's'),
              h('div', { className: 'w-16 h-1 rounded-full bg-white/10 overflow-hidden' },
                h('div', { className: 'h-full rounded-full transition-all ' + (moveTimeSecs <= 5 ? 'bg-red-500' : 'bg-[#FFD60A]'), style: { width: moveBarPct + '%' } })
              )
            )
          ),
          room.history && room.history.length > 0 && h('div', { className: 'mt-1.5 text-[9px] text-white/40 truncate' },
            room.history.slice(-1).map((h_, i) => h_?.reason === 'timeout' ? '⏱️ ' + h_.name + ' timed out' : '♟️ ' + h_.name + ' moved'))
        ),

        h('div', { className: 'flex-1 min-h-0 overflow-y-auto' },
          h('div', { className: 'flex justify-center py-2 px-3' },
            h('div', { className: 'rounded-xl overflow-hidden border-2 border-[#3a2a1a] shadow-[0_8px_32px_-8px_rgba(0,0,0,0.8)]', style: { width: 'min(92vw, 380px)', aspectRatio: '1/1' } },
              h('div', { className: 'grid grid-cols-8 h-full' },
                room.board.map((row, r) =>
                  row.map((cell, c) => {
                    const isDark = (r + c) % 2 === 1;
                    const key = r + ',' + c;
                    const isSel = selected && selected[0] === r && selected[1] === c;
                    const isValid = validTargets.has(key);
                    const isCap = captures.has(key);
                    const owner = pieceOwner(cell);
                    const king = isKing(cell);
                    return h('button', {
                      key: r + '-' + c,
                      onClick: () => handleTap(r, c),
                      className: 'relative ' + (isDark ? 'square-dark' : 'square-light') + ' ' +
                        (isSel ? 'cell-selected ' : '') + (isValid && !isCap ? 'cell-valid ' : '') + (isCap ? 'cell-capture ' : '')
                    },
                      h('div', { className: 'absolute inset-0 grid place-items-center' },
                        cell && h('div', {
                          className: 'w-[78%] h-[78%] rounded-full relative flex items-center justify-center ' +
                            (owner === 'H' ? 'piece-H' : 'piece-G') + ' ' + (king ? 'piece-king' : '')
                        }, !king && h('div', { className: 'w-[35%] h-[35%] rounded-full bg-black/20' }))
                      )
                    );
                  })
                )
              )
            )
          ),

          h('div', { className: 'px-2 pt-2 flex gap-1 overflow-x-auto' },
            QUICK_REACTIONS.map(emoji =>
              h('button', {
                key: emoji,
                onClick: () => sendChat(emoji),
                className: 'shrink-0 w-9 h-9 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center text-base active:scale-90 transition'
              }, emoji)
            ),
            h('button', {
              onClick: () => setShowPhrases(!showPhrases),
              className: 'shrink-0 w-9 h-9 rounded-full bg-[#FFD60A]/20 border border-[#FFD60A]/50 flex items-center justify-center text-sm active:scale-90 transition'
            }, showPhrases ? '✕' : '🇳🇬')
          ),

          showPhrases && h('div', { className: 'px-2 pt-2 flex flex-wrap gap-1' },
            NIGERIAN_PHRASES.map((p, i) =>
              h('button', {
                key: i,
                onClick: () => { sendChat(p); setShowPhrases(false); },
                className: 'text-[10px] font-bold bg-[#22C55E]/15 border border-[#22C55E]/40 text-[#22C55E] px-2.5 py-1.5 rounded-full active:scale-95'
              }, p)
            )
          ),

          h('div', { className: 'px-3 mt-2' },
            h('div', { className: 'rounded-xl bg-white/[0.03] border border-white/[0.05] p-2 h-32 overflow-y-auto space-y-1' },
              (room.messages || []).length === 0
                ? h('div', { className: 'text-[10px] text-white/30 text-center py-8' }, 'Trash talk goes here 💬')
                : room.messages.map((m, i) =>
                    h('div', { key: i, className: 'text-[10px] leading-snug' },
                      h('span', { className: 'font-black', style: { color: colorFromName(m.name) } }, m.name),
                      h('span', { className: 'text-white/30 mx-1' }, '·'),
                      h('span', { className: 'text-white/80' }, m.text))
                  ),
              h('div', { ref: chatEndRef })
            )
          ),

          h('div', { className: 'px-3 py-2 flex gap-1.5 shrink-0 pb-3' },
            h('input', {
              value: chatText, onChange: e => setChatText(e.target.value),
              onKeyDown: e => { if (e.key === 'Enter') sendChat(); },
              placeholder: 'Say something...', maxLength: 200,
              className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 px-3 py-2 text-[12px] text-white placeholder-white/30 focus:border-[#FFD60A]/50'
            }),
            h('button', { onClick: () => sendChat(), disabled: !chatText.trim(), className: 'w-10 h-10 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] text-black font-black grid place-items-center active:scale-90 disabled:opacity-40' }, '➤')
          )
        ),

        confirmLeave && h('div', { className: 'fixed inset-0 z-[200] grid place-items-center p-6' },
          h('div', { className: 'absolute inset-0 bg-black/85 backdrop-blur-sm', onClick: () => setConfirmLeave(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/30 rounded-3xl p-5 text-center animate-popIn' },
            h('div', { className: 'text-5xl mb-2' }, '⚠️'),
            h('div', { className: 'text-[14px] font-black text-white font-display' }, 'Forfeit the match?'),
            h('p', { className: 'text-[11px] text-white/50 mt-2 leading-relaxed' }, 'You lose your ' + fmtAmt(room.stake) + ' stake. No refund.'),
            h('div', { className: 'mt-4 flex gap-2' },
              h('button', { onClick: () => setConfirmLeave(false), className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-bold text-white/70' }, 'Stay'),
              h('button', { onClick: onLeave, className: 'flex-1 rounded-xl bg-gradient-to-b from-[#F87171] to-[#EF4444] py-3 text-[12px] font-black text-white' }, 'Leave'))
          )
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(e) { return { hasError: true, error: e }; }
      componentDidCatch(e, i) { console.error('EB:', e, i); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12, padding: 24, textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: 12 } },
            h('div', { style: { fontSize: 32 } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String(this.state.error?.message || 'Unknown')),
            h('button', { style: { marginTop: 12, padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: 8, fontWeight: 'bold' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
