        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }

        try {
          const cur = stateRef.current;

            return false;

          // Clear pending SYNCHRONOUSLY to prevent double-flush
          pendingTaps.current = { cash: 0, energy: 0, taps: 0 };
          pendingBizCash.current -= bizSync;
          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };

          const updates = { lastSeen: Date.now() };
          const cashDelta = toSync.cash + bizSync;

          if (toSync.taps !== 0) updates.taps = firebase.firestore.FieldValue.increment(toSync.taps);
          updates.energy = cur.energy;
          updates.lastEnergy = cur.lastEnergy;

      const dailyRewardAmount = DAILY_REWARDS[Math.min(nextStreak - 1, DAILY_REWARDS.length - 1)];

      const doTap = () => {

              h('div', { className: 'text-[11px] text-white/50 mt-1' }, 'Win up to ₦250,000,000'),
              
              h('div', { className: 'my-5 h-32 rounded-2xl bg-gradient-to-br from-[#FFE566]/20 to-[#FFB800]/5 border border-[#FFD60A]/30 grid place-items-center overflow-hidden' },
                isSpinning ? h('div', { className: 'text-5xl animate-spin' }, '🎰') :
                spinResult ? h('div', null,
                  h('div', { className: 'text-[10px] uppercase tracking-widest text-white/50 font-bold' }, 'You won'),
                  h('div', { className: 'text-3xl font-black text-gradient-gold font-display tabular-nums mt-1' }, fmt(spinResult))
                ) : h('div', { className: 'text-5xl' }, '🍀')
              ),

              h('button', { 
                onClick: handleSpin, 
                disabled: !canSpin || isSpinning,
                className: 'w-full rounded-xl py-3 text-[13px] font-black active:scale-95 transition font-display ' +
                  (canSpin && !isSpinning ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)]' : 'bg-white/[0.06] text-white/40 border border-white/10')
              }, isSpinning ? 'Spinning...' : canSpin ? '🎰 SPIN NOW (FREE)' : 'Next spin in ' + mmss(spinCooldownLeft)),

              h('button', { onClick: () => setSpinOpen(false), disabled: isSpinning, className: 'mt-2 w-full rounded-xl bg-white/[0.04] border border-white/10 py-2.5 text-[11px] font-extrabold text-white/60 disabled:opacity-40' }, 'Close')
            )
          ),

          boostOpen && h('div', { className: 'fixed inset-0 z-[70] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setBoostOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#22C55E]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(34,197,94,0.4)] animate-popIn' },
              h('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3 mb-3' },
                h('div', { className: 'text-[13px] font-black tracking-widest text-[#22C55E] font-display' }, '⚡ BOOST SHOP'),
                h('button', { onClick: () => setBoostOpen(false), className: 'text-white/50 text-xl leading-none' }, '×')
              ),
              h('p', { className: 'text-[11px] text-white/50 mb-3' }, 'Buy temporary tap multipliers to hustle faster.'),
              h('div', { className: 'space-y-2' },
                BOOSTS.map(b => h('button', {
                  key: b.id,
                  onClick: () => buyBoost(b),
                  disabled: s.cash < b.cost,
                  className: 'w-full rounded-xl bg-white/[0.04] border border-white/10 p-3 flex items-center justify-between active:scale-95 transition disabled:opacity-40'
                },
                  h('div', { className: 'text-left' },
                    h('div', { className: 'text-[13px] font-black font-display' }, b.label),
                    h('div', { className: 'text-[10px] text-white/40' }, 'For ' + b.durLabel)
                  ),
                  h('div', { className: 'text-[13px] font-black text-[#FFD60A] tabular-nums' }, fmt(b.cost))
                ))
              )
            )
          ),

          bossOpen && h('div', { className: 'fixed inset-0 z-[70] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-gradient-to-b from-[#1a0a0a] to-black' }),
            h('div', { className: 'relative w-full max-w-sm' },
              h('div', { className: 'flex items-center justify-between mb-3' },
                h('div', { className: 'text-[11px] font-black text-[#EF4444] font-display' }, bossActive ? '⚔️ FIGHT!' : 'FIGHT OVER'),
                h('div', { className: 'text-[12px] font-black tabular-nums text-white' }, (bossTimeLeft/1000).toFixed(1) + 's')
              ),
              h('div', { className: 'rounded-2xl bg-gradient-to-b from-[#2a0a0a] to-[#1a0505] border border-[#EF4444]/40 p-5 text-center' },
                h('div', { className: 'text-6xl mb-3 ' + (bossActive ? 'animate-bounce' : '') }, bossActive ? '👹' : bossHP <= 0 ? '💀' : '😤'),
                h('div', { className: 'text-[13px] font-black tracking-widest text-[#EF4444] font-display mb-3' }, bossHP <= 0 ? 'BOSS DEFEATED!' : 'AGBERO KING'),
                h('div', { className: 'h-3 rounded-full bg-black/50 overflow-hidden mb-1' },
                  h('div', { className: 'h-full bg-gradient-to-r from-[#F87171] to-[#EF4444] transition-all', style: { width: (bossHP / BOSS_MAX_HP * 100) + '%' } })
                ),
                h('div', { className: 'text-[10px] text-white/50 tabular-nums' }, bossHP + ' / ' + BOSS_MAX_HP + ' HP — ' + bossHits + ' hits'),
                bossActive ? h('button', { 
                  onClick: hitBoss, 
                  className: 'mt-4 w-full rounded-2xl bg-gradient-to-b from-[#F87171] to-[#EF4444] py-6 text-[16px] font-black text-white active:scale-95 transition shadow-[0_8px_24px_-8px_rgba(239,68,68,0.8)] font-display' 
                }, '👊 PUNCH!') : h('button', { 
                  onClick: finishBoss, 
                  className: 'mt-4 w-full rounded-2xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[13px] font-black text-black active:scale-95 transition shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)] font-display'
                }, 'COLLECT ₦' + ((bossHits * BOSS_REWARD_PER_HIT) + (bossHP <= 0 ? BOSS_KILL_BONUS : 0)).toLocaleString())
              )
            )
          ),

          sapaScamOpen && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-green-500/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(34,197,94,0.4)] animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2 animate-bounce' }, '🎁'),
              h('div', { className: 'text-[15px] font-black text-green-400 font-display mb-2' }, 'CONGRATULATIONS!'),
              h('p', { className: 'text-[12px] text-white/70 mb-4' }, 'You just won ₦1,000,000 in the Lagos Life Mini daily draw! Click below to claim your prize.'),
              h('div', { className: 'space-y-2' },
                h('button', { onClick: handleScamClaim, className: 'w-full py-3 rounded-xl bg-gradient-to-b from-green-400 to-green-600 text-black font-black text-[13px] active:scale-95 transition' }, 'Claim ₦1,000,000 (Pay ₦5k fee)'),
                h('button', { onClick: () => setSapaScamOpen(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/50 font-bold text-[11px]' }, 'I no fall for am (Close)')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
