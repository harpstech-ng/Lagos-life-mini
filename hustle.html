             await db.collection("users").doc(uid).update({
              cash: firebase.firestore.FieldValue.increment(toSync.cash),
              energy: firebase.firestore.FieldValue.increment(toSync.energy),
              taps: firebase.firestore.FieldValue.increment(toSync.taps),
            });
            pendingTaps.current = { cash: 0, energy: 0, taps: 0 };
          }
          await db.collection("users").doc(uid).update({ ...data, lastSeen: Date.now() });
        }
      };

      /* Tick: energy + income */
      useEffect(() => {
        if (!uid) return;
        const iv = setInterval(() => {
          setS(prev => {
            const now = Date.now();
            let energy = prev.energy;
            let lastEnergy = prev.lastEnergy;
            if (energy < MAX_E) {
              const gained = Math.floor((now - lastEnergy) / ENERGY_MS);
              if (gained > 0) {
                energy = Math.min(MAX_E, energy + gained);
                lastEnergy = energy >= MAX_E ? now : lastEnergy + gained * ENERGY_MS;
              }
            }
            const perHr = Object.entries(prev.businesses || {}).reduce((a, [id, cnt]) => a + cnt * (BIZ_PER_HR[id] || 0), 0);
            const newCash = prev.cash + perHr / 3600;
            
            if (perHr > 0) {
              db.collection("users").doc(uid).update({ cash: firebase.firestore.FieldValue.increment(perHr / 3600) });
            }
            return { ...prev, energy, lastEnergy, cash: newCash };
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [uid]);

      if (authError) return <div className="min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500"><div className="text-4xl">⚠️</div><div className="font-bold">Auth Error</div><div className="text-sm">{authError}</div></div>;

      /* MAINTENANCE SCREEN */
      if (isMaintenance) {
        return (
          <div className="min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center bg-[#08080B]">
            <div className="text-7xl animate-bounce">🚧</div>
            <h1 className="text-2xl font-black text-[#FFD60A] font-display mt-4">GAME UNDER MAINTENANCE</h1>
            <p className="text-white/50 text-sm max-w-xs">We dey upgrade the game for you. Check back in a few minutes!</p>
          </div>
        );
      }

      const energyNextIn = s.energy >= MAX_E ? 0 : ENERGY_MS - ((Date.now() - s.lastEnergy) % ENERGY_MS);
      const tapBonus = (s.travels || []).reduce((a, id) => a + (DEST_BONUSES[id] || 0), 0);
      const TAP_VALUE = BASE_TAP + tapBonus;

      const doTap = () => {
        if (s.energy < 1) { AudioEngine.error(); return notify('No energy! Refill or wait ⚡', 'bad'); }
        AudioEngine.tap();
        try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch {}
        
        const newEnergy = Math.max(0, s.energy - 1);
        setS(prev => ({ ...prev, cash: prev.cash + TAP_VALUE, energy: newEnergy, taps: prev.taps + 1 }));
        
        pendingTaps.current.cash += TAP_VALUE;
        pendingTaps.current.energy -= 1;
        pendingTaps.current.taps += 1;

        const id = ++tapCounter.current;
        setTapFloats((f) => [...f.slice(-6), { id, x: 40 + Math.random() * 20, amt: TAP_VALUE }]);
        setTimeout(() => setTapFloats((f) => f.filter((x) => x.id !== id)), 950);

        const now = Date.now();
        if (Math.random() < EVENT_CHANCE && !event && now - lastEventAt.current > 8000) {
          lastEventAt.current = now;
          setTimeout(() => {
            setEvent(EVENTS[Math.floor(Math.random() * EVENTS.length)]);
            try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium'); } catch {}
          }, 300);
        }
      };

      const resolveEvent = (opt) => {
        const d = opt.delta || {};
        updateUser({
          cash: Math.max(0, s.cash + (d.cash || 0)),
          energy: Math.max(0, Math.min(MAX_E, s.energy + (d.energy || 0))),
          clout: s.clout + (d.clout || 0),
        });
        setEventHistory((h) => [{ id: Date.now(), msg: opt.msg }, ...h].slice(0, 8));
        notify(opt.msg, (d.cash || 0) >= 0 ? 'good' : 'bad');
        if ((d.cash || 0) < 0) AudioEngine.error(); else AudioEngine.coin();
        setEvent(null);
      };

      const refillEnergy = () => {
        if (s.energy >= MAX_E) { AudioEngine.error(); return notify('Energy already full ⚡', 'bad'); }
        if (s.cash < REFILL_COST) { AudioEngine.error(); return notify('Need ₦25,000 to refill', 'bad'); }
        updateUser({ cash: s.cash - REFILL_COST, energy: MAX_E, lastEnergy: Date.now() });
        AudioEngine.purchase();
        notify('Energy full ⚡');
      };

      const forceEvent = () => {
        if (event) return;
        lastEventAt.current = Date.now();
        setEvent(EVENTS[Math.floor(Math.random() * EVENTS.length)]);
      };

      /* WATCH AD LOGIC */
      const watchAd = () => {
        if (isWatchingAd) return;
        setIsWatchingAd(true);
        setAdTimer(5);
        AudioEngine.tap();
        
        let timer = 5;
        const iv = setInterval(() => {
          timer--;
          setAdTimer(timer);
          if (timer <= 0) {
            clearInterval(iv);
            setIsWatchingAd(false);
            updateUser({ cash: s.cash + 30000 });
            AudioEngine.coin();
            notify('Ad watched! +₦30,000 💰');
            try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy'); } catch {}
          }
        }, 1000);
      };

      /* JOIN WHATSAPP LOGIC */
      const joinWA = () => {
        if (hasJoinedWA) return notify('You already claimed this bonus!', 'bad');
        const tg = window?.Telegram?.WebApp;
        if (tg?.openLink) tg.openLink('https://whatsapp.com/channel/0029VbBlJUeFy72KIFuQoP38');
        else window.open('https://whatsapp.com/channel/0029VbBlJUeFy72KIFuQoP38', '_blank');
        notify('Verifying join...', 'good');
        setTimeout(() => {
          updateUser({ cash: s.cash + 10000 });
          localStorage.setItem('joined_wa', 'true');
          setHasJoinedWA(true);
          AudioEngine.purchase();
          notify('Thanks for joining! +₦10,000 💬');
        }, 2000);
      };

      /* SHARE REFERRAL LOGIC */
      const shareReferral = () => {
        // Replace 'LagosLifeMiniBot' with your actual bot username if different
        const botUsername = "LagosLifeMiniBot"; 
        const refLink = `https://t.me/${botUsername}?start=REF_${uid}`;
        const text = `Join me on Lagos Life Mini and let's hustle together! 🇳🇬🔥 Tap the link to play and we both get ₦10,000 bonus: ${refLink}`;
        
        if (navigator.share) {
          navigator.share({
            title: 'Lagos Life Mini',
            text: text,
            url: refLink,
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(text);
          notify('Referral link copied! Share with friends 🚀');
        }
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: '#' },
      ];
      const MORE_PAGES = [
        { id: 'travel', label: 'Travel', icon: '✈️', desc: 'Japa from Mushin', href: 'travel.html' },
        { id: 'street', label: 'Street', icon: '🥷', desc: 'Rob, beg, tax, spray', href: 'street.html' },
        { id: 'leaderboard', label: 'Ranks & Wallet', icon: '🏆', desc: 'Top 100 + withdraw', href: 'leaderboard.html' },
      ];

      const eventColorClass = (c) => c === 'red' ? 'from-[#F87171] to-[#EF4444]' : 'from-[#34D976] to-[#22C55E]';

      return (
        <div className="min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black">
          <div className="mx-auto max-w-md min-h-screen flex flex-col pb-24 relative">
            <header className="sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]">
              <div className="px-4 py-2.5 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display">L</div>
                  <div className="min-w-0">
                    <div className="text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display">Hustle</div>
                    <div className="text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5">{s.name || 'Hustler'} · {fmt(s.cash)}</div>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <div className="px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums">⚡ {s.energy}</div>
                  <div className="px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums">{fmtReal(s.real)}</div>
                </div>
              </div>
            </header>

            <main className="flex-1 px-4 pb-4 animate-slideDown">
              <Card className="p-4 mt-3">
                <div className="flex items-center justify-between text-[11px] font-bold text-white/60 mb-2">
                  <span>⚡ {s.energy} / {MAX_E}</span>
                  <span className="tabular-nums">{s.energy >= MAX_E ? 'FULL' : '+1 in ' + mmss(energyNextIn)}</span>
                </div>
                <div className="h-2.5 rounded-full bg-white/10 overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-[#FFD60A] to-[#FF8A00] rounded-full transition-all" style={{ width: (s.energy / MAX_E * 100) + '%' }} />
                </div>
                <button onClick={refillEnergy} disabled={s.energy >= MAX_E}
                        className="w-full mt-3 rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/85 active:scale-[0.97] transition disabled:opacity-40 font-display">
                  ⚡ Refill Full Energy — ₦25,000
                </button>
              </Card>

              <div className="mt-6 flex flex-col items-center">
                <div className="relative">
                  <button onClick={doTap} className="tap-btn w-64 h-64 grid place-items-center text-black">
                    <div className="text-center relative z-10">
                      <div className="text-6xl drop-shadow-md">👊🏾</div>
                      <div className="text-2xl font-black tracking-tighter mt-1 font-display">HUSTLE</div>
                      <div className="text-[11px] font-extrabold opacity-70 font-display">+{fmt(TAP_VALUE)}</div>
                    </div>
                  </button>
                  {tapFloats.map((f) => (
                    <span key={f.id} className="tap-float" style={{ left: f.x + '%' }}>+{fmt(f.amt)}</span>
                  ))}
                </div>
              </div>

              <div className="mt-6 grid grid-cols-4 gap-2 text-center">
                {[['Taps', s.taps.toLocaleString()], ['Cash', fmt(s.cash)], ['Clout', s.clout.toLocaleString()], ['Referrals', s.referrals || 0]].map(([k, v]) => (
                  <Card key={k} className="py-2.5">
                    <div className="text-[9px] uppercase tracking-widest text-white/35 font-bold">{k}</div>
                    <div className="text-[13px] font-black tabular-nums mt-0.5">{v}</div>
                  </Card>
                ))}
              </div>

              {/* BONUS SECTION */}
              <SectionTitle right={<span className="text-[10px] font-bold text-[#FFD60A]">Free Money</span>}>
                Bonuses
              </SectionTitle>
              <div className="grid grid-cols-3 gap-2">
                <Card className="p-2.5 flex flex-col items-center text-center">
                  <div className="text-2xl mb-1">📺</div>
                  <div className="text-[11px] font-black font-display">Watch Ad</div>
                  <div className="text-[9px] text-[#22C55E] font-bold mb-2">+₦30K</div>
                  <button onClick={watchAd} disabled={isWatchingAd}
                          className={'w-full rounded-lg text-[10px] font-black py-2 active:scale-95 transition-all tabular-nums ' + 
                          (!isWatchingAd 
                            ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.6)]' 
                            : 'bg-white/[0.06] text-white/50 border border-white/[0.06]')}>
                    {isWatchingAd ? `${adTimer}s` : 'Watch'}
                  </button>
                </Card>

                <Card className="p-2.5 flex flex-col items-center text-center">
                  <div className="text-2xl mb-1">🟢</div>
                  <div className="text-[11px] font-black font-display">WhatsApp</div>
                  <div className="text-[9px] text-[#22C55E] font-bold mb-2">+₦10K</div>
                  <button onClick={joinWA} disabled={hasJoinedWA}
                          className={'w-full rounded-lg text-[10px] font-black py-2 active:scale-95 transition-all tabular-nums ' + 
                          (!hasJoinedWA 
                            ? 'bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black shadow-[0_4px_12px_-4px_rgba(34,197,94,0.6)]' 
                            : 'bg-white/[0.06] text-white/50 border border-white/[0.06]')}>
                    {hasJoinedWA ? '✅' : 'Join'}
                  </button>
                </Card>

                <Card className="p-2.5 flex flex-col items-center text-center">
                  <div className="text-2xl mb-1">🤝</div>
                  <div className="text-[11px] font-black font-display">Refer</div>
                  <div className="text-[9px] text-[#22C55E] font-bold mb-2">+₦10K</div>
                  <button onClick={shareReferral} 
                          className="w-full rounded-lg text-[10px] font-black py-2 active:scale-95 transition-all tabular-nums bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.6)]">
                    Invite
                  </button>
                </Card>
              </div>

              <SectionTitle right={<span className="text-[10px] font-bold text-[#FFD60A]">~5.5% per tap</span>}>
                Street Events
              </SectionTitle>
              <Card className="p-4">
                <p className="text-[11px] text-white/55 leading-relaxed">
                  LASTMA, Agbero, Police Checkpoint, Bet9ja win and plenty other wahala dey wait for you.
                  Keep tapping — events pop up randomly. Choose wisely.
                </p>
                <button onClick={forceEvent} disabled={!!event}
                        className="w-full mt-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-[0.97] transition disabled:opacity-40 font-display shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)]">
                  🎲 Trigger Random Event
                </button>
              </Card>

              {eventHistory.length > 0 && (
                <>
                  <SectionTitle>Event Log</SectionTitle>
                  <Card className="divide-y divide-white/[0.05] overflow-hidden">
                    {eventHistory.map((h) => (
                      <div key={h.id} className="px-3.5 py-2.5 text-[11px] text-white/65">{h.msg}</div>
                    ))}
                  </Card>
                </>
              )}
            </main>

            <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]">
              <div className="grid grid-cols-6 px-1 pt-1.5 safe-bottom">
                {NAV.map((n) => {
                  const active = n.id === 'hustle';
                  return (
                    <a key={n.id} href={n.href}
                       onClick={(e) => { if (n.id === 'more') { e.preventDefault(); document.getElementById('more-sheet')?.classList.remove('hidden'); } }}
                       className={'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')}>
                      <span className={'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '')}>{n.icon}</span>
                      <span className="text-[8.5px] font-extrabold tracking-wide font-display">{n.label}</span>
                    </a>
                  );
                })}
              </div>
            </nav>

            <div id="more-sheet" className="hidden fixed inset-0 z-50 flex items-end justify-center">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => document.getElementById('more-sheet')?.classList.add('hidden')} />
              <div className="relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp" onClick={(e) => e.stopPropagation()}>
                <div className="w-10 h-1 rounded-full bg-white/15 mx-auto mb-4" />
                <div className="space-y-2">
                  {MORE_PAGES.map((m) => (
                    <a key={m.id} href={m.href} className="w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left">
                      <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0">{m.icon}</div>
                      <div className="min-w-0">
                        <div className="text-[13px] font-extrabold font-display">{m.label}</div>
                        <div className="text-[10px] text-white/40 font-bold mt-0.5">{m.desc}</div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>
            </div>

            {event && (
              <div className="fixed inset-0 z-50 grid place-items-center p-6">
                <div className="absolute inset-0 bg-black/85 backdrop-blur-sm" />
                <div className="relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(255,214,10,0.4)] animate-popIn">
                  <div className={'mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br ' + eventColorClass(event.color) + ' grid place-items-center text-3xl shadow-lg'}>
                    {event.emoji}
                  </div>
                  <div className="text-center mt-3 text-[13px] font-black tracking-widest text-[#FFD60A] font-display">{event.title}</div>
                  <p className="text-center text-[12px] text-white/60 mt-2 leading-relaxed">{event.text}</p>
                  <div className="mt-5 space-y-2">
                    {event.options.map((o, i) => {
                      const cashDelta = o.delta?.cash || 0;
                      return (
                        <button key={i} onClick={() => resolveEvent(o)}
                                className="w-full rounded-xl bg-white/[0.06] border border-white/10 py-3 px-4 text-[12px] font-extrabold active:scale-[0.97] transition hover:bg-white/[0.1] font-display flex items-center justify-between gap-2">
                          <span className="text-left">{o.label}</span>
                          {cashDelta !== 0 && (
                            <span className={'text-[11px] font-black tabular-nums shrink-0 ' + (cashDelta > 0 ? 'text-[#22C55E]' : 'text-[#EF4444]')}>
                              {cashDelta > 0 ? '+' : ''}{fmt(cashDelta)}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {toast && (
              <div className={'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' + (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')}>
                {toast.msg}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
