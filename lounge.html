    /* ========== HELPERS ========== */
    const fmt = (n) => {
      n = Math.floor(Number(n) || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';

    const timeAgo = (ts) => {
      if (!ts) return 'now';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const sec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (sec < 10) return 'now';
      if (sec < 60) return sec + 's';
      if (sec < 3600) return Math.floor(sec / 60) + 'm';
      if (sec < 86400) return Math.floor(sec / 3600) + 'h';
      return Math.floor(sec / 86400) + 'd';
    };

    const initial = (name) => (name || 'H').trim().charAt(0).toUpperCase();

    const colorFromName = (name) => {
      const colors = ['#FFD60A', '#22C55E', '#3B82F6', '#A855F7', '#EF4444', '#EC4899', '#06B6D4', '#F59E0B'];
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
      return colors[Math.abs(hash) % colors.length];
    };

    const getCachedData = () => {

    /* ========== AUDIO ENGINE ========== */
    const AudioEngine = (() => {
      let ctx = null;
      let enabled = true;
      let musicOn = false;
      let musicTimer = null;
      let musicStep = 0;

      function init() {
        if (ctx) return;
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }

      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx || !enabled) return;
        const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(g, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + d);
        o.connect(gain); gain.connect(ctx.destination);
        o.start(start); o.stop(start + d + 0.05);
      }

      const chords = [
        [130.81, 164.81, 196.00],
        [146.83, 174.61, 220.00],
        [164.81, 196.00, 246.94],
        [174.61, 220.00, 261.63],
      ];

      function musicTick() {
        if (!musicOn || !ctx) return;
        const chord = chords[musicStep % 4];
        chord.forEach((freq, i) => tone(freq, 1.4, 'sine', i * 0.08, 0.04));
        // Soft hi-hat
        tone(3000, 0.03, 'square', 1.2, 0.015);
        musicStep++;
      }

      return {
        startMusic: () => {
          init();
          if (!ctx) return;
          if (ctx.state === 'suspended') ctx.resume();
          if (musicOn) return;
          musicOn = true;
          musicTick();
          musicTimer = setInterval(musicTick, 2500);
        },
        stopMusic: () => {
          musicOn = false;
          if (musicTimer) clearInterval(musicTimer);
        },
        toggleMusic: () => {
          if (musicOn) { AudioEngine.stopMusic(); return false; }
          AudioEngine.startMusic();
          return true;
        },
        isMusicOn: () => musicOn,
        tap: () => { init(); if(ctx?.state==="suspended") ctx.resume(); tone(880, 0.09, "triangle", 0, 0.25); },
        send: () => { init(); tone(1046, 0.06, "sine", 0, 0.15); },
        receive: () => { init(); tone(660, 0.05, "sine", 0, 0.1); },
        bottle: () => { init(); [523, 659, 783, 1046, 1318].forEach((f,i) => tone(f, 0.2, "triangle", i*0.08, 0.25)); },
        gift: () => { init(); [880, 1046, 1318, 1568].forEach((f,i) => tone(f, 0.15, "square", i*0.06, 0.2)); },
        react: () => { init(); tone(1318, 0.05, "sine", 0, 0.1); },
        win: () => { init(); [523, 659, 783, 1046].forEach((f,i) => tone(f, 0.15, "triangle", i*0.07, 0.2)); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.2); },
      };
    })();

    /* ========== IMAGE COMPRESSION + UPLOAD ========== */
    const compressImage = (file, maxWidth = 1200, quality = 0.75) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name || 'image.jpg', { type: 'image/jpeg' }));
            }, 'image/jpeg', quality);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const uploadToCloudinary = async (file) => {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);

        method: 'POST', body: formData
      });
      const data = await res.json();
      if (!data.secure_url) throw new Error(data.error?.message || 'Upload failed');
      return data.secure_url;

    const Confetti = ({ trigger }) => {

      useEffect(() => {
        if (!trigger) return;
        const colors = ['#FFD60A','#FFB800','#22C55E','#EF4444','#3B82F6','#A855F7','#FF6B00'];

          delay: Math.random() * 0.4,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 6 + Math.random() * 10,

        setPieces(arr);
        const t = setTimeout(() => setPieces([]), 3000);
        return () => clearTimeout(t);
      }, [trigger]);
      if (pieces.length === 0) return null;
      return h(React.Fragment, null,

      const [triviaOpen, setTriviaOpen] = useState(false);
      const [triviaAnswered, setTriviaAnswered] = useState(false);
      const [triviaResult, setTriviaResult] = useState(null);
      const [celebration, setCelebration] = useState(null);
      const [confettiTrigger, setConfettiTrigger] = useState(0);
      const [zoomImage, setZoomImage] = useState(null);
      const [toast, setToast] = useState(null);
      const [nowTick, setNowTick] = useState(Date.now());
      const [musicOn, setMusicOn] = useState(false);
      const [replyTo, setReplyTo] = useState(null);
      const [reactingTo, setReactingTo] = useState(null);
      const [leaderboard, setLeaderboard] = useState([]);

      const chatScrollRef = useRef(null);
      const fileInputRef = useRef(null);
      const lastMessageAt = useRef(0);

      /* tick */
      useEffect(() => {
        const iv = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(iv);
      }, []);

      /* auth + user doc */
      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();
          setUid(user.uid);
          userUnsub = db.collection("users").doc(user.uid).onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const d = doc.data();
                const merged = Object.assign({}, prev, d, {
                  name: d.name || prev.name,
                  cash: d.cash || 0,
                  bottlesBought: d.bottlesBought || 0,

                try { localStorage.setItem("lagos_user_data", JSON.stringify(merged)); } catch(e) {}
                return merged;
              });
            }
          }, (e) => console.error(e));
        });
        return () => { authUnsub(); if (userUnsub) userUnsub(); };
      }, []);

      /* presence heartbeat */
      useEffect(() => {
        if (!uid || !s?.name) return;
        const hb = () => {
          db.collection("lounge_presence").doc(uid).set({

        hb();
        const iv = setInterval(hb, PRESENCE_HEARTBEAT_MS);

      }, [uid, s?.name]);

      /* online users */
      useEffect(() => {
        const unsub = db.collection("lounge_presence").onSnapshot(snap => {
          const now = Date.now();
          const active = [];
          snap.forEach(doc => {
            const d = doc.data();
            if (d.lastHeartbeat && (now - d.lastHeartbeat) < PRESENCE_ACTIVE_MS) {
              active.push({ id: doc.id, name: d.name || 'Anonymous' });

          });
          setOnlineUsers(active);
        }, () => {});
        return () => unsub();
      }, []);

      /* messages */
      useEffect(() => {
        const unsub = db.collection("vip_chat")
          .orderBy("createdAt", "desc")
          .limit(CHAT_LIMIT)
          .onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));

            setMessages(list);
          }, (e) => console.error('chat error', e));
        return () => unsub();
      }, []);

      /* auto scroll */
      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;

      }, [messages.length]);

      /* bottle celebration */
      useEffect(() => {
        if (messages.length === 0) return;
        const latest = [...messages].reverse().find(m => m.type === 'bottle');
        if (!latest) return;
        if (firstMessageLoadRef.current) {
          firstMessageLoadRef.current = false;
          lastBottleShownRef.current = latest.id;
          return;
        }
        if (latest.id === lastBottleShownRef.current) return;
        lastBottleShownRef.current = latest.id;
        if (latest.userId === uid) return;
        const ts = latest.createdAt?.toMillis?.() || 0;
        if (Date.now() - ts > 30000) return;
        setCelebration({
          buyer: latest.name,
          bottle: { emoji: latest.bottleEmoji, name: latest.bottleName },
          tip: latest.tipAmount || 0,
          isMine: false

        AudioEngine.bottle();
        setConfettiTrigger(t => t + 1);
        setTimeout(() => setCelebration(null), 4500);
      }, [messages, uid]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

        if (!toast) return;

      /* FEATURE: Temperature (computed) */
      const temperature = useMemo(() => {
        const cutoff = Date.now() - 120000;
        const recent = messages.filter(m => (m.createdAt?.toMillis?.() || 0) > cutoff).length;
        if (recent >= 8) return { label: 'ON FIRE', emoji: '🔥', color: '#EF4444', animate: true };
        if (recent >= 4) return { label: 'HOT', emoji: '🌡️', color: '#FF6B00', animate: false };
        if (recent >= 1) return { label: 'WARM', emoji: '☀️', color: '#FFD60A', animate: false };
        return { label: 'COLD', emoji: '❄️', color: '#06B6D4', animate: false };
      }, [messages, nowTick]);

      /* FEATURE: Happy Hour (computed) */
      const happyHour = useMemo(() => {
        const d = new Date();
        const minute = d.getMinutes();
        const secondsLeft = (5 - minute) * 60 - d.getSeconds();
        if (minute < 5) return { active: true, secondsLeft };
        return { active: false, secondsLeft: 0 };
      }, [nowTick]);

      /* FEATURE: Trivia (localStorage, hourly) */
      const triviaData = useMemo(() => {
        const dayIdx = Math.floor(Date.now() / (60 * 60 * 1000)); // changes every hour
        const question = TRIVIA_POOL[dayIdx % TRIVIA_POOL.length];
        const answeredKey = 'trivia_answered_' + dayIdx;
        return { question, answeredKey, canPlay: !localStorage.getItem(answeredKey) };
      }, [nowTick]);

      /* FEATURE: Leaderboard (cached) */
      useEffect(() => {
        if (!leaderboardOpen) return;
        if (leaderboardFetchRef.current) return;
        if (Date.now() - leaderboardLastFetch < LEADERBOARD_CACHE_MS && leaderboard.length > 0) return;
        leaderboardFetchRef.current = true;
        (async () => {
          try {
            const snap = await db.collection("users")
              .where("bottlesBought", ">", 0)
              .orderBy("bottlesBought", "desc")
              .limit(5)
              .get();
            const arr = [];
            snap.forEach(doc => {
              const d = doc.data();
              arr.push({ id: doc.id, name: d.name || 'Hustler', bottles: d.bottlesBought || 0 });
            });
            setLeaderboard(arr);
            setLeaderboardLastFetch(Date.now());
          } catch (e) {
            console.warn('Leaderboard query needs index:', e.message);
            // Fallback: query without where
            try {
              const snap = await db.collection("users").orderBy("bottlesBought", "desc").limit(5).get();
              const arr = [];
              snap.forEach(doc => {
                const d = doc.data();
                if (d.bottlesBought > 0) arr.push({ id: doc.id, name: d.name || 'Hustler', bottles: d.bottlesBought });
              });
              setLeaderboard(arr);
              setLeaderboardLastFetch(Date.now());
            } catch (e2) { console.error(e2); }
          } finally {
            leaderboardFetchRef.current = false;
          }
        })();
      }, [leaderboardOpen]);

      /* ========== ACTIONS ========== */

      const sendMessage = async (payload) => {
        if (Date.now() - lastMessageAt.current < MSG_COOLDOWN_MS) {
          notify('Slow down ⏱️', 'bad');
          return false;
        }
        lastMessageAt.current = Date.now();
        try {
          const doc = {
            userId: uid,
            name: s.name || 'Hustler',
            ...payload,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          if (replyTo) {
            doc.replyToId = replyTo.id;
            doc.replyToName = replyTo.name;
            doc.replyToText = (replyTo.text || '').slice(0, 60);
          }
          await db.collection("vip_chat").add(doc);
          setReplyTo(null);
          return true;
        } catch (e) {
          notify('Send failed', 'bad');
          return false;
        }
      };

      const handleSendText = async () => {
        const trimmed = text.trim();
        if (!trimmed) return;
        setSending(true);
        const ok = await sendMessage({ type: 'text', text: trimmed.slice(0, 500) });
        if (ok) { setText(''); AudioEngine.send(); }
        setSending(false);
      };

      const handleImagePick = () => {
        if (uploading) return;
        fileInputRef.current?.click();
      };

      const handleImageFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) return notify('Only images 📸', 'bad');
        if (file.size > MAX_IMG_MB * 1024 * 1024) return notify('Max ' + MAX_IMG_MB + 'MB 📸', 'bad');
        setUploading(true);
        try {
          const compressed = await compressImage(file);
          const url = await uploadToCloudinary(compressed);
          const ok = await sendMessage({ type: 'image', imageUrl: url });
          if (ok) { AudioEngine.send(); notify('Image posted! 📸'); }
        } catch (err) {
          notify('Upload failed: ' + err.message, 'bad');
        }
        setUploading(false);
      };

      const quickReact = async (emoji) => {
        const ok = await sendMessage({ type: 'text', text: emoji });
        if (ok) AudioEngine.send();
      };

      const sendWave = async () => {
        const ok = await sendMessage({ type: 'wave', text: '👋 waved to everybody in the lounge' });
        if (ok) AudioEngine.send();
      };

      /* FEATURE: react to message */
      const reactToMessage = async (msgId, emoji) => {
        if (!uid) return;
        try {
          await db.runTransaction(async (t) => {
            const ref = db.collection("vip_chat").doc(msgId);
            const doc = await t.get(ref);
            if (!doc.exists) return;
            const data = doc.data();
            const reactions = Object.assign({}, data.reactions || {});
            const users = reactions[emoji] || [];
            if (users.includes(uid)) {
              reactions[emoji] = users.filter(u => u !== uid);
              if (reactions[emoji].length === 0) delete reactions[emoji];
            } else {
              reactions[emoji] = [...users, uid];
            }
            t.update(ref, { reactions });
          });
          AudioEngine.react();
          setReactingTo(null);
        } catch (e) {
          console.error(e);
          notify('Reaction failed', 'bad');
        }
      };

      /* FEATURE: claim gift */
      const claimGift = async (giftMsg) => {
        if (!uid) return;
        try {
          await db.runTransaction(async (t) => {
            const ref = db.collection("vip_chat").doc(giftMsg.id);
            const doc = await t.get(ref);
            if (!doc.exists) throw new Error('Gift gone');
            const data = doc.data();
            if (data.claimedBy && data.claimedBy.length > 0) throw new Error('Already claimed');
            const userRef = db.collection("users").doc(uid);
            t.update(ref, { claimedBy: [uid], claimedByName: s.name });
            t.update(userRef, {
              cash: firebase.firestore.FieldValue.increment(data.giftAmount)
            });
          });
          AudioEngine.win();
          notify('🎁 Gift claimed! +' + fmt(giftMsg.giftAmount));
          setConfettiTrigger(t => t + 1);
        } catch (e) {
          notify('Too late! Someone claimed it 😭', 'bad');
        }
      };

      /* FEATURE: drop gift */
      const dropGift = async (giftOption) => {
        if ((s.cash || 0) < giftOption.amount) {
          AudioEngine.error();
          return notify('You need ' + fmt(giftOption.amount) + ' 💸', 'bad');
        }
        setGiftPickerOpen(false);
        try {
          const now = Date.now();
          const batch = db.batch();
          batch.update(db.collection("users").doc(uid), {
            cash: firebase.firestore.FieldValue.increment(-giftOption.amount)
          });
          const msgRef = db.collection("vip_chat").doc();
          batch.set(msgRef, {
            userId: uid,
            name: s.name || 'Hustler',
            type: 'gift',
            giftAmount: giftOption.amount,
            claimedBy: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await batch.commit();
          AudioEngine.gift();
          notify('🎁 Gift dropped! First to claim wins ₦' + giftOption.amount.toLocaleString());
        } catch (e) {
          notify('Failed: ' + e.message, 'bad');
        }
      };

      /* FEATURE: trivia answer */
      const answerTrivia = async (selectedIdx) => {
        if (triviaAnswered) return;
        const q = triviaData.question;
        const isCorrect = selectedIdx === q.answer;
        setTriviaAnswered(true);
        setTriviaResult({ isCorrect, correct: q.answer });
        localStorage.setItem(triviaData.answeredKey, 'true');
        if (isCorrect) {
          const bonus = 50000;
          setS(prev => Object.assign({}, prev, { cash: (prev.cash || 0) + bonus }));
          try {
            await db.collection("users").doc(uid).update({
              cash: firebase.firestore.FieldValue.increment(bonus)
            });
          } catch(e) {}
          AudioEngine.win();
          notify('🎯 Correct! +' + fmt(bonus));
          setConfettiTrigger(t => t + 1);
        } else {
          AudioEngine.error();
          notify('❌ Wrong. Come back next hour 😭', 'bad');
        }
      };

      /* FEATURE: buy bottle (with happy hour 2x bonus) */
      const buyBottle = async (bottle) => {
        if ((s.cash || 0) < bottle.price) {
          AudioEngine.error();
          return notify('You need ' + fmt(bottle.price) + ' 💸', 'bad');
        }
        if (!uid) return;
        setBottlePickerOpen(false);

        const tipMultiplier = happyHour.active ? 2 : 1;
        const finalTip = bottle.tip * tipMultiplier;

        try {
          const activeIds = onlineUsers
            .filter(u => u.id !== uid)
            .slice(0, MAX_TIPS_BATCH)
            .map(u => u.id);

          const batch = db.batch();
          batch.update(db.collection("users").doc(uid), {
            cash: firebase.firestore.FieldValue.increment(-bottle.price),
            bottlesBought: firebase.firestore.FieldValue.increment(1),
            tipsGiven: firebase.firestore.FieldValue.increment(finalTip * activeIds.length),
            clout: firebase.firestore.FieldValue.increment(50)
          });

          activeIds.forEach(id => {
            batch.update(db.collection("users").doc(id), {
              cash: firebase.firestore.FieldValue.increment(finalTip),
              tipsReceived: firebase.firestore.FieldValue.increment(finalTip)
            });
          });

          const msgRef = db.collection("vip_chat").doc();
          batch.set(msgRef, {
            userId: uid,
            name: s.name || 'Hustler',
            type: 'bottle',
            bottleName: bottle.name,
            bottleEmoji: bottle.emoji,
            bottlePrice: bottle.price,
            tipAmount: finalTip,
            text: 'just oppression-funded ' + bottle.emoji + ' ' + bottle.name + ' for everybody here! 🥂',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          await batch.commit();

          setCelebration({
            buyer: s.name || 'You',
            bottle: bottle,
            tip: finalTip,
            isMine: true,
            tipped: activeIds.length,
            happyHour: happyHour.active
          });
          lastBottleShownRef.current = msgRef.id;
          AudioEngine.bottle();
          setConfettiTrigger(t => t + 1);
          setTimeout(() => setCelebration(null), 5000);
          notify('🍾 Legend! You blessed ' + activeIds.length + ' people' + (happyHour.active ? ' (2x tips!)' : ''));
        } catch (e) {
          notify('Failed: ' + e.message, 'bad');
          AudioEngine.error();
        }
      };

      /* derived */
      const latestBottle = useMemo(() => [...messages].reverse().find(m => m.type === 'bottle'), [messages]);
      const boostRemaining = latestBottle
        ? Math.max(0, BOOST_DURATION_MS - (nowTick - (latestBottle.createdAt?.toMillis?.() || nowTick)))
        : 0;

      /* render helpers */
      const renderMessage = (m) => {
        const isMine = m.userId === uid;

        // GIFT
        if (m.type === 'gift') {
          const claimed = m.claimedBy && m.claimedBy.length > 0;
          const expired = (m.createdAt?.toMillis?.() || 0) + GIFT_EXPIRE_MS < Date.now();
          return h('div', { key: m.id, className: 'animate-msgIn flex justify-center py-1' },
            h('div', { className: 'gift-card rounded-2xl px-4 py-3 max-w-[92%] text-center animate-giftShine' },
              h('div', { className: 'text-3xl mb-1' }, '🎁'),
              h('div', { className: 'text-[10px] uppercase tracking-widest font-black text-[#22C55E]' }, 'CASH GIFT DROP'),
              h('div', { className: 'text-[13px] font-black text-white mt-1' }, m.name + ' dropped ' + fmt(m.giftAmount)),
              claimed
                ? h('div', { className: 'text-[11px] text-[#22C55E] font-bold mt-2' }, '✅ Claimed by ' + (m.claimedByName || 'someone'))
                : expired
                  ? h('div', { className: 'text-[11px] text-white/40 font-bold mt-2' }, '⏰ Expired')
                  : h('button', {
                      onClick: () => claimGift(m),
                      disabled: isMine,
                      className: 'mt-2 px-4 py-2 rounded-lg bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black font-black text-[11px] active:scale-95 disabled:opacity-40'
                    }, isMine ? 'Your drop' : '🎁 CLAIM NOW!')
            )
          );
        }

        // BOTTLE
        if (m.type === 'bottle') {
          return h('div', { key: m.id, className: 'animate-msgIn flex justify-center py-1' },
            h('div', { className: 'bottle-card rounded-2xl px-4 py-3 max-w-[92%] text-center shadow-[0_8px_24px_-8px_rgba(255,214,10,0.5)]' },
              h('div', { className: 'text-3xl mb-1' }, m.bottleEmoji || '🍾'),
              h('div', { className: 'text-[11px] uppercase tracking-widest font-black text-[#FFD60A]' }, 'BOTTLE ALERT'),
              h('div', { className: 'text-[12px] font-black text-white mt-1' }, m.name + ' ' + (m.text || '')),
              h('div', { className: 'text-[9px] text-white/50 mt-1 tabular-nums' },
                'Everyone got ₦' + (m.tipAmount || 0).toLocaleString() + ' tip! · ' + timeAgo(m.createdAt))
            )
          );
        }

        // WAVE
        if (m.type === 'wave') {
          return h('div', { key: m.id, className: 'animate-msgIn flex justify-center py-0.5' },
            h('div', { className: 'wave-msg rounded-xl px-3 py-1.5 text-[11px] text-white/70' },
              h('span', { className: 'mr-1' }, '👋'),
              h('span', { className: 'font-bold' }, m.name),
              h('span', null, ' ' + (m.text || 'waved'))
            )
          );
        }

        // TEXT / IMAGE
        return h('div', { key: m.id, className: 'animate-msgIn flex ' + (isMine ? 'justify-end' : 'justify-start') },
          h('div', { className: 'flex gap-2 max-w-[80%] ' + (isMine ? 'flex-row-reverse' : '') },
            !isMine && h('div', { className: 'w-7 h-7 rounded-full shrink-0 grid place-items-center text-[10px] font-black text-black mt-1', style: { background: colorFromName(m.name) } }, initial(m.name)),
            h('div', { className: 'flex flex-col gap-0.5 ' + (isMine ? 'items-end' : 'items-start') },
              !isMine && h('div', { className: 'text-[9px] font-bold text-white/50 px-1' }, m.name),
              h('div', {
                className: 'rounded-2xl px-3 py-2 text-[12px] leading-relaxed ' + (isMine ? 'bubble-mine rounded-tr-sm' : 'bubble-theirs rounded-tl-sm'),
                onDoubleClick: () => setReactingTo(m.id),
                onClick: () => setReplyTo({ id: m.id, name: m.name, text: m.text })
              },
                m.replyToName && h('div', { className: 'reply-preview rounded px-2 py-1 mb-1 text-[10px] text-white/60' },
                  h('div', { className: 'font-bold text-[#FFD60A] text-[9px]' }, '↩ ' + m.replyToName),
                  h('div', { className: 'truncate' }, m.replyToText)
                ),
                m.type === 'image' && m.imageUrl
                  ? h('img', { src: m.imageUrl, alt: 'chat', loading: 'lazy', onClick: (e) => { e.stopPropagation(); setZoomImage(m.imageUrl); }, className: 'rounded-lg max-w-[200px] max-h-[240px] object-cover cursor-pointer block' })
                  : h('div', { className: 'whitespace-pre-wrap break-words' }, m.text || '')
              ),
              // Reactions display
              m.reactions && Object.keys(m.reactions).length > 0 && h('div', { className: 'flex gap-1 flex-wrap ' + (isMine ? 'justify-end' : 'justify-start') },
                Object.entries(m.reactions).map(([emoji, users]) =>
                  h('button', {
                    key: emoji,
                    onClick: () => reactToMessage(m.id, emoji),
                    className: 'px-1.5 py-0.5 rounded-full bg-white/[0.08] border border-white/10 text-[10px] flex items-center gap-1 active:scale-95 ' + (users.includes(uid) ? 'bg-[#FFD60A]/20 border-[#FFD60A]/40' : '')
                  }, emoji, h('span', { className: 'text-[9px] text-white/70' }, users.length))
                )
              ),
              h('div', { className: 'text-[8px] text-white/30 px-1 tabular-nums' }, timeAgo(m.createdAt))
            )
          )
        );
      };

      return h('div', { className: 'h-screen flex flex-col max-w-md mx-auto relative' },
        h(Confetti, { trigger: confettiTrigger }),

        /* HEADER */
        h('header', { className: 'flex-shrink-0 px-2 py-2 border-b border-white/[0.08] bg-[#0a0a12]' },
          h('div', { className: 'flex items-center justify-between gap-1.5' },
            h('a', { href: 'more.html', className: 'w-8 h-8 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition text-sm shrink-0' }, '←'),
            h('div', { className: 'flex-1 min-w-0 text-center' },
              h('div', { className: 'text-[12px] font-black font-display leading-tight',
                style: { background: 'linear-gradient(135deg, #FFE566, #FFD60A, #FFB800)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' } }, 'VGC Lounge 🍾'),
              h('div', { className: 'text-[8.5px] text-white/40 flex items-center justify-center gap-1 mt-0.5' },
                h('span', { className: 'w-1 h-1 rounded-full bg-[#22C55E] glow-dot animate-pulse' }),
                onlineUsers.length + ' in the lounge',
                h('span', { className: 'mx-1 text-white/20' }, '·'),
                h('span', { style: { color: temperature.color }, className: temperature.animate ? 'animate-fire' : '' },
                  temperature.emoji + ' ' + temperature.label)
              )
            ),
            h('div', { className: 'flex items-center gap-1 shrink-0' },
              h('button', { onClick: () => { const on = AudioEngine.toggleMusic(); setMusicOn(on); },
                className: 'w-8 h-8 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition text-sm' }, musicOn ? '🎵' : '🔇'),
              h('button', { onClick: () => setLeaderboardOpen(true), className: 'w-8 h-8 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition text-sm' }, '🏆'),
              h('button', { onClick: () => setCardOpen(true), className: 'w-8 h-8 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition text-sm' }, '📊'),
              h('div', { className: 'px-1.5 py-1 rounded-lg bg-[#FFD60A]/10 border border-[#FFD60A]/30 text-[#FFD60A] text-[9.5px] font-black tabular-nums' }, fmt(s.cash))
            )
          ),

          /* online avatars */
          onlineUsers.length > 0 && h('div', { className: 'mt-1.5 flex gap-1 overflow-x-auto no-scrollbar pb-0.5' },
            onlineUsers.slice(0, 15).map(u =>
              h('div', { key: u.id, className: 'shrink-0 flex flex-col items-center w-8' },
                h('div', { className: 'w-6 h-6 rounded-full grid place-items-center text-[9px] font-black text-black border border-[#22C55E]/40 relative', style: { background: colorFromName(u.name) } },
                  initial(u.name),
                  h('span', { className: 'absolute -bottom-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-[#22C55E] border border-black' })
                ),
                h('div', { className: 'text-[6px] text-white/50 truncate w-full text-center mt-0.5' }, (u.name || '').split(' ')[0])
              )
            )
          )
        ),

        /* HAPPY HOUR BANNER */
        happyHour.active && h('div', { className: 'flex-shrink-0 mx-2 mt-1.5 px-3 py-1.5 rounded-lg happy-banner flex items-center justify-between' },
          h('div', { className: 'flex items-center gap-1.5' },
            h('span', { className: 'text-sm animate-fire' }, '⏰'),
            h('div', { className: 'text-[10px] font-black text-black' }, 'HAPPY HOUR — 2X TIPS!')
          ),
          h('div', { className: 'text-[10px] font-black text-black tabular-nums' },
            Math.floor(happyHour.secondsLeft / 60) + 'm ' + (happyHour.secondsLeft % 60) + 's')
        ),

        /* BOOST BANNER */
        boostRemaining > 0 && latestBottle && h('div', { className: 'flex-shrink-0 mx-2 mt-1.5 px-3 py-1 rounded-lg bg-gradient-to-r from-[#FFD60A]/25 to-[#FFB800]/10 border border-[#FFD60A]/40 flex items-center justify-between' },
          h('div', { className: 'flex items-center gap-1.5' },
            h('span', { className: 'text-xs' }, '⚡'),
            h('div', { className: 'text-[9px] font-black text-[#FFD60A]' }, latestBottle.name + "'s bottle boost!")
          ),
          h('div', { className: 'text-[9px] font-black text-white/70 tabular-nums' },
            Math.floor(boostRemaining / 60000) + 'm ' + Math.floor((boostRemaining % 60000) / 1000) + 's')
        ),

        /* TRIVIA BANNER (only if not answered) */
        triviaData.canPlay && h('button', {
          onClick: () => setTriviaOpen(true),
          className: 'flex-shrink-0 mx-2 mt-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-[#A855F7]/20 to-[#6366F1]/10 border border-[#A855F7]/40 flex items-center justify-between active:scale-[0.98]'
        },
          h('div', { className: 'flex items-center gap-1.5' },
            h('span', { className: 'text-sm' }, '🎯'),
            h('div', { className: 'text-[10px] font-black text-[#A855F7]' }, 'Naija Trivia — Win ₦50K!')
          ),
          h('div', { className: 'text-[9px] font-black text-white/60' }, 'PLAY →')
        ),

        /* MESSAGES */
        h('div', { ref: chatScrollRef, className: 'flex-1 overflow-y-auto px-2 py-2 space-y-1.5' },
          messages.length === 0 && h('div', { className: 'flex flex-col items-center justify-center h-full text-center px-6' },
            h('div', { className: 'text-6xl mb-3 animate-floatBottles' }, '🍾'),
            h('div', { className: 'text-[14px] font-black text-white/80' }, 'Welcome to VGC Lounge!'),
            h('div', { className: 'text-[11px] text-white/40 mt-1 max-w-xs' }, 'Nobody has said anything yet. Break the ice — send a message or buy a bottle to start the party 🔥')
          ),
          messages.map(renderMessage)
        ),

        /* QUICK REACTIONS */
        h('div', { className: 'flex-shrink-0 px-1.5 py-1 border-t border-white/[0.06] bg-black/30 flex gap-1 overflow-x-auto no-scrollbar items-center' },
          h('button', { onClick: sendWave, className: 'shrink-0 w-8 h-8 rounded-full bg-[#3B82F6]/20 border border-[#3B82F6]/40 flex items-center justify-center text-sm active:scale-90 transition' }, '👋'),
          QUICK_REACTIONS.map(emoji =>
            h('button', { key: emoji, onClick: () => quickReact(emoji),
              className: 'shrink-0 w-8 h-8 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center text-sm active:scale-90 transition' }, emoji)
          )
        ),

        /* REPLY PREVIEW */
        replyTo && h('div', { className: 'flex-shrink-0 px-3 py-1.5 bg-[#1a1a22] border-t border-white/[0.06] flex items-center gap-2' },
          h('div', { className: 'flex-1 min-w-0' },
            h('div', { className: 'text-[9px] font-black text-[#FFD60A]' }, '↩ Replying to ' + replyTo.name),
            h('div', { className: 'text-[10px] text-white/50 truncate' }, replyTo.text || '(image)')
          ),
          h('button', { onClick: () => setReplyTo(null), className: 'w-6 h-6 rounded-full bg-white/[0.06] text-white/60 text-sm grid place-items-center' }, '×')
        ),

        /* INPUT AREA */
        h('div', { className: 'flex-shrink-0 px-2 py-1.5 border-t border-white/[0.08] bg-[#0a0a12]' },
          h('div', { className: 'flex gap-1.5 mb-1.5' },
            h('button', { onClick: () => setBottlePickerOpen(true),
              className: 'flex-1 py-2 rounded-lg bg-gradient-to-r from-[#FFE566] to-[#FFB800] text-black font-black text-[10px] active:scale-95 transition shadow-[0_3px_10px_-3px_rgba(255,214,10,0.7)]' },
              '🍾 BUY BOTTLE'),
            h('button', { onClick: () => setGiftPickerOpen(true),
              className: 'flex-1 py-2 rounded-lg bg-gradient-to-r from-[#34D976] to-[#22C55E] text-black font-black text-[10px] active:scale-95 transition shadow-[0_3px_10px_-3px_rgba(34,197,94,0.7)]' },
              '🎁 DROP GIFT')
          ),
          h('div', { className: 'flex gap-1.5' },
            h('button', { onClick: handleImagePick, disabled: uploading,
              className: 'w-10 h-10 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition text-base disabled:opacity-50' },
              uploading ? '⏳' : '📸'),
            h('input', { ref: fileInputRef, type: 'file', accept: 'image/*', onChange: handleImageFile, style: { display: 'none' } }),
            h('input', {
              type: 'text', value: text, onChange: e => setText(e.target.value),
              onKeyDown: e => { if (e.key === 'Enter') handleSendText(); },
              placeholder: replyTo ? 'Replying to ' + replyTo.name + '...' : 'Send message...',
              maxLength: 500, disabled: sending,
              className: 'flex-1 rounded-lg bg-white/[0.06] border border-white/10 px-3 py-2 text-[12px] text-white placeholder-white/30 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
            }),
            h('button', { onClick: handleSendText, disabled: sending || !text.trim(),
              className: 'w-10 h-10 rounded-lg bg-gradient-to-br from-[#FFE566] to-[#FFB800] text-black font-black grid place-items-center active:scale-90 transition disabled:opacity-40 text-base' }, '➤')
          )
        ),

        /* BOTTLE PICKER */
        bottlePickerOpen && h('div', { className: 'fixed inset-0 z-[300] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/92 backdrop-blur-md', onClick: () => setBottlePickerOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-4 shadow-[0_0_60px_-10px_rgba(255,214,10,0.5)] animate-popIn max-h-[85vh] overflow-y-auto' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-3xl mb-1' }, '🍾'),
              h('div', { className: 'text-[14px] font-black tracking-widest text-[#FFD60A] font-display' }, 'BUY A BOTTLE'),
              h('div', { className: 'text-[10px] text-white/50 mt-1' },
                'Everyone online gets a tip instantly' + (happyHour.active ? ' · 2X HAPPY HOUR! 🔥' : ''))
            ),
            h('div', { className: 'space-y-1.5' },
              BOTTLES.map(b => {
                const finalTip = b.tip * (happyHour.active ? 2 : 1);
                return h('button', { key: b.id, onClick: () => buyBottle(b), disabled: (s.cash || 0) < b.price,
                  className: 'w-full rounded-xl bg-white/[0.04] border border-white/10 p-2.5 flex items-center gap-2.5 active:scale-[0.98] transition disabled:opacity-40 hover:bg-white/[0.08]' },
                  h('div', { className: 'text-2xl' }, b.emoji),
                  h('div', { className: 'flex-1 text-left' },
                    h('div', { className: 'text-[12px] font-black text-white' }, b.name),
                    h('div', { className: 'text-[9px] text-[#22C55E] font-bold tabular-nums' },
                      'Tips: ₦' + finalTip.toLocaleString() + ' each' + (happyHour.active ? ' ⚡' : ''))
                  ),
                  h('div', { className: 'text-[12px] font-black text-[#FFD60A] tabular-nums' }, fmt(b.price))
                );
              })
            ),
            h('button', { onClick: () => setBottlePickerOpen(false), className: 'w-full mt-2 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Cancel')
          )
        ),

        /* GIFT PICKER */
        giftPickerOpen && h('div', { className: 'fixed inset-0 z-[300] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/92 backdrop-blur-md', onClick: () => setGiftPickerOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#22C55E]/30 rounded-3xl p-4 shadow-[0_0_60px_-10px_rgba(34,197,94,0.5)] animate-popIn' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-3xl mb-1' }, '🎁'),
              h('div', { className: 'text-[14px] font-black tracking-widest text-[#22C55E] font-display' }, 'DROP A GIFT'),
              h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'First person to claim wins the cash!')
            ),
            h('div', { className: 'space-y-1.5' },
              GIFTS.map(g =>
                h('button', { key: g.amount, onClick: () => dropGift(g), disabled: (s.cash || 0) < g.amount,
                  className: 'w-full rounded-xl bg-white/[0.04] border border-white/10 p-3 flex items-center justify-between active:scale-[0.98] transition disabled:opacity-40 hover:bg-white/[0.08]' },
                  h('div', { className: 'flex items-center gap-2.5' },
                    h('div', { className: 'text-2xl' }, '🎁'),
                    h('div', { className: 'text-[13px] font-black text-white' }, g.label)
                  ),
                  h('div', { className: 'text-[12px] font-black text-[#22C55E] tabular-nums' }, fmt(g.amount))
                )
              )
            ),
            h('button', { onClick: () => setGiftPickerOpen(false), className: 'w-full mt-2 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Cancel')
          )
        ),

        /* LEADERBOARD */
        leaderboardOpen && h('div', { className: 'fixed inset-0 z-[300] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/92 backdrop-blur-md', onClick: () => setLeaderboardOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-4 animate-popIn max-h-[85vh] overflow-y-auto' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-3xl mb-1' }, '🏆'),
              h('div', { className: 'text-[14px] font-black tracking-widest text-[#FFD60A] font-display' }, 'TOP BOTTLE BUYERS'),
              h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Biggest flexers of all time')
            ),
            leaderboard.length === 0
              ? h('div', { className: 'text-center text-white/40 text-[11px] py-6 animate-pulse' }, 'Loading...')
              : h('div', { className: 'space-y-1.5' },
                  leaderboard.map((user, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1);
                    const isMe = user.id === uid;
                    return h('div', {
                      key: user.id,
                      className: 'flex items-center gap-2.5 px-2.5 py-2 rounded-xl ' + (isMe ? 'bg-[#FFD60A]/15 border border-[#FFD60A]/30' : 'bg-white/[0.03] border border-white/[0.06]')
                    },
                      h('div', { className: 'text-lg shrink-0 w-6 text-center' }, medal),
                      h('div', { className: 'w-8 h-8 rounded-full grid place-items-center text-[11px] font-black text-black shrink-0', style: { background: colorFromName(user.name) } }, initial(user.name)),
                      h('div', { className: 'flex-1 min-w-0' },
                        h('div', { className: 'text-[12px] font-extrabold font-display truncate' }, user.name + (isMe ? ' (You)' : '')),
                        h('div', { className: 'text-[9px] text-white/40 font-bold' }, user.bottles + ' bottle' + (user.bottles > 1 ? 's' : '') + ' bought')
                      )
                    );
                  })
                ),
            h('button', { onClick: () => setLeaderboardOpen(false), className: 'w-full mt-3 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Close')
          )
        ),

        /* PERSONAL CARD */
        cardOpen && h('div', { className: 'fixed inset-0 z-[300] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/92 backdrop-blur-md', onClick: () => setCardOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-gradient-to-br from-[#121218] to-[#0a0a12] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'w-16 h-16 mx-auto rounded-full grid place-items-center text-2xl font-black text-black mb-2', style: { background: colorFromName(s.name) } }, initial(s.name)),
              h('div', { className: 'text-[15px] font-black font-display' }, s.name || 'Hustler'),
              h('div', { className: 'text-[10px] text-white/40' }, 'VGC Lounge Member')
            ),
            h('div', { className: 'grid grid-cols-2 gap-2 mb-3' },
              h('div', { className: 'rounded-xl p-2.5 bg-white/[0.04] border border-white/[0.06] text-center' },
                h('div', { className: 'text-lg mb-0.5' }, '🍾'),
                h('div', { className: 'text-[8.5px] uppercase tracking-wider text-white/40 font-extrabold' }, 'Bottles'),
                h('div', { className: 'text-[13px] font-black text-[#FFD60A] tabular-nums mt-0.5' }, (s.bottlesBought || 0).toString())
              ),
              h('div', { className: 'rounded-xl p-2.5 bg-white/[0.04] border border-white/[0.06] text-center' },
                h('div', { className: 'text-lg mb-0.5' }, '📤'),
                h('div', { className: 'text-[8.5px] uppercase tracking-wider text-white/40 font-extrabold' }, 'Tips Given'),
                h('div', { className: 'text-[13px] font-black text-[#22C55E] tabular-nums mt-0.5' }, fmt(s.tipsGiven || 0))
              ),
              h('div', { className: 'rounded-xl p-2.5 bg-white/[0.04] border border-white/[0.06] text-center' },
                h('div', { className: 'text-lg mb-0.5' }, '💰'),
                h('div', { className: 'text-[8.5px] uppercase tracking-wider text-white/40 font-extrabold' }, 'Tips Received'),
                h('div', { className: 'text-[13px] font-black text-[#FFD60A] tabular-nums mt-0.5' }, fmt(s.tipsReceived || 0))
              ),
              h('div', { className: 'rounded-xl p-2.5 bg-white/[0.04] border border-white/[0.06] text-center' },
                h('div', { className: 'text-lg mb-0.5' }, '👑'),
                h('div', { className: 'text-[8.5px] uppercase tracking-wider text-white/40 font-extrabold' }, 'Lounge Rank'),
                h('div', { className: 'text-[11px] font-black text-[#FFD60A] mt-0.5 truncate' },
                  (s.bottlesBought || 0) >= 10 ? 'LEGEND 🏆' :
                  (s.bottlesBought || 0) >= 5 ? 'BALLER 💎' :
                  (s.bottlesBought || 0) >= 1 ? 'VIP ⭐' : 'NEWBIE 🌱'
                )
              )
            ),
            h('div', { className: 'rounded-xl p-2.5 bg-gradient-to-r from-[#FFD60A]/10 to-[#FFB800]/5 border border-[#FFD60A]/30 text-center mb-3' },
              h('div', { className: 'text-[9.5px] text-white/60 italic' },
                (s.bottlesBought || 0) === 0 ? '"Buy your first bottle and become a legend 🍾"' :
                (s.bottlesBought || 0) < 5 ? '"You dey try! Keep balling 💪"' :
                (s.bottlesBought || 0) < 10 ? '"Real baller vibes 🎩"' :
                '"Odogwu of the lounge 👑"'
              )
            ),
            h('button', { onClick: () => setCardOpen(false), className: 'w-full py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Close')
          )
        ),

        /* TRIVIA MODAL */
        triviaOpen && h('div', { className: 'fixed inset-0 z-[300] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/92 backdrop-blur-md', onClick: () => setTriviaOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#A855F7]/40 rounded-3xl p-5 animate-popIn' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-3xl mb-1' }, '🎯'),
              h('div', { className: 'text-[14px] font-black tracking-widest text-[#A855F7] font-display' }, 'NAIJA TRIVIA'),
              h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Get it right = ₦50K bonus!')
            ),
            h('div', { className: 'rounded-xl bg-white/[0.04] border border-white/10 p-3 mb-3' },
              h('div', { className: 'text-[12px] font-black text-white text-center' }, triviaData.question.q)
            ),
            h('div', { className: 'space-y-1.5' },
              triviaData.question.options.map((opt, i) =>
                h('button', {
                  key: i,
                  onClick: () => answerTrivia(i),
                  disabled: triviaAnswered,
                  className: 'w-full rounded-xl bg-white/[0.04] border border-white/10 p-2.5 text-left text-[12px] font-bold text-white active:scale-[0.98] transition disabled:opacity-50 ' +
                    (triviaResult && i === triviaResult.correct ? 'bg-[#22C55E]/20 border-[#22C55E]/50 text-[#22C55E]' : '') +
                    (triviaResult && !triviaResult.isCorrect && i !== triviaResult.correct ? 'bg-red-500/10 border-red-500/20' : '')
                },
                  h('span', { className: 'font-black text-white/40 mr-2' }, String.fromCharCode(65 + i) + '.'),
                  opt,
                  triviaResult && i === triviaResult.correct && h('span', { className: 'ml-2' }, '✅')
                )
              )
            ),
            triviaResult && h('div', { className: 'mt-3 text-center' },
              triviaResult.isCorrect
                ? h('div', { className: 'text-[12px] font-black text-[#22C55E]' }, '🎉 Correct! ₦50K added!')
                : h('div', { className: 'text-[12px] font-black text-red-400' }, '❌ Wrong. Come back next hour 😭')
            ),
            h('button', { onClick: () => setTriviaOpen(false), className: 'w-full mt-3 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Close')
          )
        ),

        /* REACTION PICKER */
        reactingTo && h('div', { className: 'fixed inset-0 z-[310] grid place-items-center p-4' },
          h('div', { className: 'absolute inset-0 bg-black/70', onClick: () => setReactingTo(null) }),
          h('div', { className: 'relative bg-[#121218] border border-white/20 rounded-2xl p-3 flex gap-1.5 animate-popIn' },
            MSG_REACTIONS.map(emoji =>
              h('button', {
                key: emoji,
                onClick: () => reactToMessage(reactingTo, emoji),
                className: 'w-10 h-10 rounded-full bg-white/[0.08] border border-white/10 flex items-center justify-center text-xl active:scale-90 transition'
              }, emoji)
            )
          )
        ),

        /* CELEBRATION */
        celebration && h('div', { className: 'fixed inset-0 z-[250] grid place-items-center p-6', onClick: () => setCelebration(null) },
          h('div', { className: 'absolute inset-0 bg-gradient-to-b from-[#FFD60A]/40 via-black/70 to-[#FFB800]/30 animate-popIn' }),
          h('div', { className: 'relative w-full max-w-sm text-center animate-popIn pointer-events-none' },
            h('div', { className: 'text-7xl mb-2 animate-floatBottles' }, celebration.bottle.emoji),
            h('div', { className: 'text-[11px] uppercase tracking-widest font-black text-[#FFD60A] drop-shadow-lg' },
              celebration.isMine ? 'YOU JUST BLESSED THE LOUNGE!' : 'SOMEONE JUST BOUGHT A BOTTLE!'),
            h('div', { className: 'text-3xl font-black text-white mt-2 font-display drop-shadow-xl' }, celebration.buyer),
            h('div', { className: 'text-[18px] font-black text-[#FFD60A] mt-1 drop-shadow-lg' }, celebration.bottle.name),
            celebration.isMine
              ? h('div', { className: 'text-[12px] text-white/80 mt-2 font-bold' },
                  '👑 You tipped ' + celebration.tipped + ' people ₦' + celebration.tip.toLocaleString() + ' each!' +
                  (celebration.happyHour ? ' ⚡ 2X!' : ''))
              : h('div', { className: 'text-[12px] text-white/80 mt-2 font-bold' }, '💰 You got ₦' + celebration.tip.toLocaleString() + ' tip!')
          )
        ),

        /* IMAGE ZOOM */
        zoomImage && h('div', { className: 'fixed inset-0 z-[280] grid place-items-center p-4 bg-black/95', onClick: () => setZoomImage(null) },
          h('img', { src: zoomImage, alt: 'zoomed', className: 'max-w-full max-h-full rounded-2xl object-contain animate-popIn' }),
          h('button', { onClick: () => setZoomImage(null), className: 'absolute top-6 right-6 w-10 h-10 rounded-full bg-white/10 border border-white/20 text-white text-xl grid place-items-center' }, '×')
        ),

        /* TOAST */
        toast && h('div', {
          className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[400] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
            (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
        }, toast.msg)
      );
    }

    /* ========== ERROR BOUNDARY ========== */
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, info) { console.error('EB:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String(this.state.error?.message || 'Unknown')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
