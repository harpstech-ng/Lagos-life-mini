  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { gold: '#FFD60A', gold2: '#FFB800', ink: '#08080B' },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Sora', 'Inter', 'sans-serif'] },

  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; overscroll-behavior-y: contain; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; }
    body { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,214,10,0.08), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,184,0,0.05), transparent); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    .glow-dot { box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes floatBottles { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-popIn { animation: popIn 0.28s cubic-bezier(0.22,1,0.36,1); }
    .animate-floatBottles { animation: floatBottles 3s ease-in-out infinite; }
    .nav-active-pill { background: linear-gradient(180deg, rgba(255,214,10,0.2) 0%, rgba(255,214,10,0.05) 100%); border: 1px solid rgba(255,214,10,0.35); box-shadow: 0 0 25px rgba(255,214,10,0.25); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-backdrop { background: #08080B; }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    .lounge-banner-bg { background: radial-gradient(circle at top left, rgba(255,214,10,0.25) 0%, transparent 55%), radial-gradient(circle at bottom right, rgba(239,68,68,0.15) 0%, transparent 55%), linear-gradient(180deg, #0a0a12 0%, #08080B 100%); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, clout: 0, energy: 100,
        taps: 0, xp: 0, clubSpent: 0, goldName: false
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      if (n >= 1e15) return '₦' + (n / 1e15).toFixed(2) + 'Q';
      if (n >= 1e12) return '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return '₦' + (n / 1e3).toFixed(1) + 'K';
      return '₦' + n.toLocaleString();
    };

    const Card = ({ children, className = '' }) =>
      h('div', { className: 'rounded-2xl card-gradient ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    const TIPS = [
      { icon: '⚡', title: 'Energy dey regen', text: 'Your energy dey come back every 5 minutes. Come back later if you run out.' },
      { icon: '🔥', title: 'Combo Streak', text: 'Tap fast (within 8s) to build combos up to 3x in hustle or 5x in club.' },
      { icon: '💎', title: 'Baller Level', text: 'The more real money you spend, the higher your level bonus (up to +50%).' },
      { icon: '🏪', title: 'Business Income', text: 'Your businesses make money even when you dey sleep. Collect am before 48hrs.' },
      { icon: '🎰', title: 'Daily Spin', text: 'Free ₦1T–₦100T from the club lucky spin every 24hrs. No skip!' },
      { icon: '🤝', title: 'P2P Market', text: 'Buy cheap from other players, sell expensive. Profit na profit.' },
    ];

    function App() {
      const [s] = useState(getCachedData);
      const [logoutOpen, setLogoutOpen] = useState(false);
      const [loggingOut, setLoggingOut] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [onlineCount, setOnlineCount] = useState(0);
      const [tipsOpen, setTipsOpen] = useState(false);
      const [ratingOpen, setRatingOpen] = useState(false);
      const [ratingValue, setRatingValue] = useState(0);
      const [hasRated, setHasRated] = useState(() => !!localStorage.getItem('rated_app'));

      useEffect(() => {
        const unsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          setUserEmail(user.email || user.displayName || '');
        });
        return () => unsub();
      }, []);

      // ✅ Presence — one-time fetch + 60s refresh (no onSnapshot)
      useEffect(() => {
        let cancelled = false;
        const fetchPresence = async () => {
          try {
            const snap = await db.collection("lounge_presence")
              .where("lastHeartbeat", ">", Date.now() - 60000)
              .limit(100)
              .get();
            if (!cancelled) setOnlineCount(snap.size);
          } catch (e) {}
        };
        fetchPresence();
        const iv = setInterval(fetchPresence, 60000);
        return () => { cancelled = true; clearInterval(iv); };
      }, []);

      const handleLogout = async () => {
        setLoggingOut(true);
        try {
          localStorage.removeItem('lagos_user_data');
          localStorage.removeItem('lagos_user_name');
          localStorage.removeItem('lagos_user_id');
          await auth.signOut();
          window.location.href = '/login.html';
        } catch (e) {
          setLoggingOut(false);
          setLogoutOpen(false);
          alert('Logout failed: ' + e.message);
        }
      };

      const submitRating = () => {
        if (ratingValue < 1) return;
        localStorage.setItem('rated_app', String(ratingValue));
        setHasRated(true);
        setRatingOpen(false);
        const msgs = ['Thank you! 🙏', 'We go do better 💪', 'Naija love 🇳🇬', 'E go blow! 🚀'];
        alert(msgs[Math.floor(Math.random() * msgs.length)]);
      };

      const shareApp = async () => {
        const text = 'Join me on Lagos Life Mini 🇳🇬 — the funniest Naija money game! Tap hustle, buy businesses, become an Aje Butler. Play here: https://lagoslifemini.online';
        try {
          if (navigator.share) {
            await navigator.share({ title: 'Lagos Life Mini', text });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            alert('Link copied! Share am with your friends 📤');
          }
        } catch (e) {}
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      const FEATURES = [
        {
          category: 'Personal',
          items: [
            { id: 'history', label: 'Hustle History', icon: '🕒', desc: 'Track all your money & moves', href: 'history.html', color: 'from-blue-500/20 to-blue-700/10' },
            { id: 'leaderboard', label: 'Ranks & Wallet', icon: '🏆', desc: 'Top 100, Withdraw real', href: 'leaderboard.html', color: 'from-amber-400/20 to-amber-700/10' },
          ]
        },
        {
          category: 'Social',
          items: [
            { id: 'chatroom', label: 'Chatroom', icon: '💬', desc: 'Search & chat with hustlers live', href: 'chatroom.html', color: 'from-cyan-500/20 to-blue-700/10' },
          ]
        },
        {
          category: 'Empire & Money',
          items: [
            { id: 'bet', label: 'Bet Center', icon: '🎰', desc: 'Aviator, Virtual, Cards', href: 'bet.html', color: 'from-emerald-500/20 to-emerald-700/10' },
          ]
        },
        {
          category: 'Head-to-Head',
          items: [
            { id: 'games', label: 'Street Corner Boardroom', icon: '🎱', desc: 'Draft, Pool, Ludo · Real opponents', href: 'games.html', color: 'from-amber-500/25 to-orange-700/10' },
          ]
        },
        {
          category: 'Flex & Status',
          items: [
            { id: 'vip', label: 'Big Boys Lounge', icon: '👑', desc: 'VIP, Geh Geh, Gold Name', href: 'vip.html', color: 'from-amber-500/20 to-yellow-700/10' },
            { id: 'politics', label: 'Politics & BBN', icon: '🎩', desc: 'Elections, Big Brother', href: 'politics.html', color: 'from-blue-500/20 to-blue-700/10' },
          ]
        },
        {
          category: 'Wahala & Drama',
          items: [
            { id: 'babe', label: 'Babe Wahala', icon: '👩🏾‍❤️‍👨🏾', desc: 'Billing, DNA Test, Breakup', href: 'babe.html', color: 'from-pink-500/20 to-pink-700/10' },
            { id: 'client', label: 'Client Palava', icon: '💻', desc: 'Yahoo, Scam, EFCC', href: 'client.html', color: 'from-green-500/20 to-green-700/10' },
            { id: 'marriage', label: 'Marriage & Divorce', icon: '💍', desc: 'Weddings, Cheating, Court', href: 'marriage.html', color: 'from-rose-500/20 to-rose-700/10' },
            { id: 'madness', label: 'Madness & Ritual', icon: '🍃', desc: 'Smoke Loud, Ritual, Kidnap', href: 'madness.html', color: 'from-red-500/20 to-red-700/10' },
          ]
        },
        {
          category: 'Streets & Travel',
          items: [
            { id: 'street', label: 'Street Hustle', icon: '🥷', desc: 'Rob, beg, tax, spray', href: 'street.html', color: 'from-slate-500/20 to-slate-700/10' },
            { id: 'travel', label: 'Travel & Japa', icon: '✈️', desc: 'Japa from Mushin', href: 'travel.html', color: 'from-cyan-500/20 to-cyan-700/10' },
          ]
        }
      ];

      // ---- Helper render functions (clean, no bracket mess) ----

      const renderStats = () => {
        const stats = [
          { label: 'Cash', value: fmt(s.cash), emoji: '💰' },
          { label: 'Taps', value: (s.taps || 0).toLocaleString(), emoji: '👊' },
          { label: 'Clout', value: (s.clout || 0).toLocaleString(), emoji: '⭐' },
        ];
        return h('div', { className: 'grid grid-cols-3 gap-2 mt-3' },
          stats.map(stat =>
            h('div', { key: stat.label, className: 'rounded-xl p-2.5 text-center card-gradient' },
              h('div', { className: 'text-lg mb-0.5' }, stat.emoji),
              h('div', { className: 'text-[8.5px] uppercase tracking-wider text-white/40 font-extrabold' }, stat.label),
              h('div', { className: 'text-[11px] font-black text-[#FFD60A] tabular-nums mt-0.5 truncate' }, stat.value)
            )
          )
        );
      };

      const renderVGCBanner = () => {
        const bottles = ['🍾', '🥂', '🍾', '🥃'];
        return h('button', {
          onClick: () => window.location.href = 'lounge.html',
          className: 'w-full text-left mt-4 rounded-2xl overflow-hidden relative lounge-banner-bg border border-[#FFD60A]/35 active:scale-[0.98] transition shadow-[0_8px_32px_-8px_rgba(255,214,10,0.4)]'
        },
          h('div', { className: 'absolute inset-0 pointer-events-none overflow-hidden' },
            bottles.map((e, i) =>
              h('div', {
                key: i,
                className: 'absolute text-3xl opacity-15 animate-floatBottles',
                style: { left: (15 + i * 25) + '%', top: (20 + (i % 2) * 40) + '%', animationDelay: (i * 0.5) + 's' }
              }, e)
            )
          ),
          h('div', { className: 'relative p-4' },
            h('div', { className: 'flex items-center justify-between mb-2' },
              h('div', { className: 'flex items-center gap-1.5' },
                h('span', { className: 'text-[9px] uppercase tracking-widest text-[#FFD60A] font-black bg-[#FFD60A]/25 px-2 py-0.5 rounded-full border border-[#FFD60A]/40' }, '🔴 LIVE'),
                onlineCount > 0 && h('span', { className: 'text-[10px] font-bold text-white/70 flex items-center gap-1' },
                  h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#22C55E] glow-dot animate-pulse' }),
                  onlineCount + ' online'
                )
              )
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('div', { className: 'text-4xl animate-floatBottles' }, '🍾'),
              h('div', { className: 'flex-1 min-w-0' },
                h('div', { className: 'text-[17px] font-black font-display text-[#FFD60A] leading-tight' }, 'VGC Lounge'),
                h('div', { className: 'text-[10px] text-white/60 mt-0.5' }, 'Beach Bar · Live chat · Buy bottles for everyone')
              ),
              h('div', { className: 'text-2xl text-[#FFD60A]' }, '→')
            )
          )
        );
      };

      const QuickActionBtn = ({ onClick, emoji, title, subtitle, className }) =>
        h('button', {
          onClick,
          className: 'card-gradient rounded-2xl p-3 text-left active:scale-[0.97] transition relative overflow-hidden ' + (className || '')
        },
          h('div', { className: 'flex items-center gap-2.5' },
            h('div', { className: 'text-2xl' }, emoji),
            h('div', { className: 'flex-1 min-w-0' },
              h('div', { className: 'text-[11.5px] font-black font-display' }, title),
              h('div', { className: 'text-[9px] text-white/50' }, subtitle)
            )
          )
        );

      const renderQuickActions = () =>
        h('div', null,
          h(SectionTitle, null, 'Quick Actions'),
          h('div', { className: 'grid grid-cols-2 gap-2.5' },
            h(QuickActionBtn, { onClick: () => setTipsOpen(true), emoji: '💡', title: 'Tips & Tricks', subtitle: 'Learn the hustle secrets' }),
            h(QuickActionBtn, { onClick: shareApp, emoji: '📤', title: 'Share App', subtitle: 'Invite friends to hustle' }),
            h(QuickActionBtn, {
              onClick: () => !hasRated && setRatingOpen(true),
              emoji: hasRated ? '✅' : '⭐',
              title: hasRated ? 'You don rate us!' : 'Rate Lagos Life',
              subtitle: hasRated ? 'Thank you for the love 💛' : 'How we dey do?',
              className: 'col-span-2'
            })
          )
        );

      const renderFeatureSection = (section) =>
        h('div', { key: section.category },
          h(SectionTitle, null, section.category),
          h('div', { className: 'grid grid-cols-2 gap-2.5' },
            section.items.map(item =>
              h('a', {
                key: item.id,
                href: item.href,
                className: 'relative overflow-hidden rounded-2xl card-gradient p-3 active:scale-[0.97] transition-all flex flex-col h-full'
              },
                h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + item.color + ' opacity-50 pointer-events-none' }),
                h('div', { className: 'relative z-10 flex-1' },
                  h('div', { className: 'text-2xl mb-2' }, item.icon),
                  h('div', { className: 'text-[12px] font-extrabold font-display leading-tight' }, item.label),
                  h('div', { className: 'text-[9px] text-white/50 mt-0.5 leading-tight' }, item.desc)
                )
              )
            )
          )
        );

      const renderAccount = () =>
        h('div', null,
          h(SectionTitle, null, 'Account'),
          h(Card, { className: 'p-4' },
            h('div', { className: 'min-w-0' },
              h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Signed in as'),
              h('div', { className: 'text-[12px] font-black text-white truncate mt-0.5' }, userEmail || s.name || 'Hustler')
            ),
            h('button', {
              onClick: () => setLogoutOpen(true),
              className: 'mt-3 w-full rounded-xl bg-red-500/10 border border-red-500/30 py-3 text-[12px] font-black text-red-400 active:scale-[0.97] transition'
            }, '🚪 LOG OUT')
          )
        );

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },

          h('header', { className: 'sticky top-0 z-30 bg-[#08080B] border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Explore'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            h('div', { className: 'mt-4 p-4 rounded-2xl bg-gradient-to-br from-[#FFD60A]/10 to-transparent border border-[#FFD60A]/20' },
              h('div', { className: 'text-[16px] font-black text-[#FFD60A] font-display' }, 'Welcome to Lagos Life 🇳🇬'),
              h('div', { className: 'text-[11px] text-white/60 mt-1 leading-relaxed' },
                'Your hub for everything. Build your empire, flex on streets, chat with hustlers, or create pure wahala.'
              )
            ),
            renderStats(),
            renderVGCBanner(),
            renderQuickActions()
          ),

          h('div', { className: 'px-4' },
            FEATURES.map(renderFeatureSection),
            renderAccount(),
            h('div', { className: 'mt-8 mb-4 text-center' },
              h('div', { className: 'text-[10px] font-bold text-white/20' }, 'Lagos Life Mini v2.2 — Hustle or Nothing')
            )
          )
        ),

        h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
          h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
            NAV.map((n) => {
              const active = n.id === 'more';
              return h('a', {
                key: n.id, href: n.href,
                className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
              },
                h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
              );
            })
          )
        ),

        tipsOpen && h('div', { className: 'fixed inset-0 z-[80] grid place-items-center p-6' },
          h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setTipsOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn max-h-[85vh] overflow-y-auto' },
            h('div', { className: 'text-center mb-3' },
              h('div', { className: 'text-4xl mb-1' }, '💡'),
              h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'TIPS & TRICKS'),
              h('p', { className: 'text-[11px] text-white/50 mt-1' }, 'Wetin you need to know to blow')
            ),
            h('div', { className: 'space-y-2' },
              TIPS.map((tip, i) =>
                h('div', { key: i, className: 'flex items-start gap-2.5 px-2.5 py-2 rounded-xl bg-white/[0.03] border border-white/[0.06]' },
                  h('div', { className: 'text-lg shrink-0' }, tip.icon),
                  h('div', { className: 'flex-1 min-w-0' },
                    h('div', { className: 'text-[11.5px] font-extrabold font-display' }, tip.title),
                    h('div', { className: 'text-[10px] text-white/50 mt-0.5 leading-relaxed' }, tip.text)
                  )
                )
              )
            ),
            h('button', {
              onClick: () => setTipsOpen(false),
              className: 'mt-4 w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/70 text-[11px] font-bold'
            }, 'Close')
          )
        ),

        ratingOpen && h('div', { className: 'fixed inset-0 z-[80] grid place-items-center p-6' },
          h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setRatingOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn text-center' },
            h('div', { className: 'text-5xl mb-2' }, '⭐'),
            h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'RATE LAGOS LIFE'),
            h('p', { className: 'text-[11px] text-white/50 mt-2' }, 'How we dey do? Tap the stars'),
            h('div', { className: 'flex items-center justify-center gap-2 mt-5' },
              [1, 2, 3, 4, 5].map(star =>
                h('button', {
                  key: star,
                  onClick: () => setRatingValue(star),
                  className: 'text-4xl transition-all active:scale-90 ' + (star <= ratingValue ? 'text-[#FFD60A] scale-110' : 'text-white/20')
                }, '⭐')
              )
            ),
            h('div', { className: 'mt-5 space-y-2' },
              h('button', {
                onClick: submitRating,
                disabled: ratingValue < 1,
                className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95 disabled:opacity-40'
              }, 'Submit Rating'),
              h('button', { onClick: () => setRatingOpen(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Cancel')
            )
          )
        ),

        logoutOpen && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-6' },
          h('div', { className: 'absolute inset-0 bg-black/85 backdrop-blur-sm', onClick: () => !loggingOut && setLogoutOpen(false) }),
          h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/30 rounded-3xl p-5 animate-popIn text-center' },
            h('div', { className: 'text-5xl mb-2' }, '🚪'),
            h('div', { className: 'text-[15px] font-black text-white font-display' }, 'You wan comot?'),
            h('p', { className: 'text-[11.5px] text-white/50 mt-2 leading-relaxed' }, 'Your hustle progress is saved. When you come back, just log in again and continue.'),
            h('div', { className: 'mt-5 flex gap-2' },
              h('button', {
                onClick: () => setLogoutOpen(false),
                disabled: loggingOut,
                className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/70 active:scale-95 transition disabled:opacity-50'
              }, 'Stay'),
              h('button', {
                onClick: handleLogout,
                disabled: loggingOut,
                className: 'flex-1 rounded-xl bg-gradient-to-b from-[#F87171] to-[#EF4444] py-3 text-[12px] font-black text-white active:scale-95 transition disabled:opacity-50'
              }, loggingOut ? 'Logging out...' : 'Log Out')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
