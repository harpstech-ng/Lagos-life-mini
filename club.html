  <script>
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {

    const REGULAR_ACTIONS = [
      { id: 'bail',   label: 'Bail a Hustler', price: 100, emoji: '⛓️', desc: 'Free your guy from cell. He go owe you.', multiplier: 5_000_000, color: 'from-slate-400/25 to-slate-700/10' },
      { id: 'spray',  label: 'Spray Dancer',   price: 200, emoji: '💸', desc: 'Make it rain on the dancer. She go smile.', multiplier: 5_000_000, color: 'from-fuchsia-400/25 to-fuchsia-700/10' },
      { id: 'bouncer', label: 'Bribe Bouncer', price: 150, emoji: '🦍', desc: 'Enter VIP without queue. No wahala.', multiplier: 5_000_000, color: 'from-red-400/25 to-red-700/10' },
      { id: 'babe',   label: 'Buy Babe Drink', price: 500, emoji: '🍹', desc: 'Impress the finest babe. But she might scam you.', multiplier: 5_000_000, color: 'from-pink-400/25 to-pink-700/10' },

    const VIP_ACTIONS = [
      { id: 'escort', label: 'Police Escort', price: 300, emoji: '🚔', desc: 'Clear traffic to the club.', multiplier: 5_000_000, color: 'from-blue-400/25 to-blue-700/10' },
      { id: 'gold',   label: 'Gold Name',     price: 200, emoji: '⭐', desc: 'Forever shining in gold.', multiplier: 5_000_000, color: 'from-amber-400/25 to-amber-700/10' },

      { id: 'dj',     label: 'Buy the DJ',    price: 1000, emoji: '🎧', desc: 'DJ plays your song all night.', multiplier: 15_000_000, color: 'from-purple-400/25 to-purple-700/10' },

    const NAMES = ['Tunde', 'Chidi', 'Bisi', 'Emeka', 'Ngozi', 'Femi', 'Yemi', 'Ada', 'Kelechi', 'Seyi', 'Ifeanyi', 'Amaka', 'Bola', 'Dapo', 'Funke', 'Uche', 'Tope', 'Zainab', 'Musa', 'Chioma', 'Segun', 'Kemi', 'Olamide', 'Davido', 'Wizkid', 'Burna'];
    
    const FEED_LINES = [
      () => 'just paid ₦100 to bail a hustler ⛓️',
      () => 'sprayed ₦200 on the dancer and she smiled 💸',
      () => 'bribed the bouncer and walked straight to VIP 🦍',
      () => 'bought a bottle of Hennessy for a babe ₦500 🍾',
      () => 'booked Police Escort to clear traffic 🚔',
      () => 'bought Gold Name and is shining brightly ⭐',
      () => 'japa\'d the entire club to Dubai ✈️',
      () => 'bought the DJ for the night 🎧',
      () => 'bought the dancer\'s wig. She\'s bald now 😂',
      () => 'SHUT DOWN THE CLUB! The ultimate flex 🚨',
      () => 'is buying Azul for the whole table 💸',
      () => 'got into a fight with area boys outside 🥊',
      () => 'is spraying fake dollars on the strippers 💵',
      () => 'just bought a G-Wagon to park outside 🚙',
      () => 'DJ just played Ojuelegba and the whole club went crazy 🎶',
      () => 'was caught with someone else\'s babe. Fight don start! 🥊'
    ];

    let feedSeq = 0;
    function makeFeed() {
      const n = NAMES[Math.floor(Math.random() * NAMES.length)];
      const line = FEED_LINES[Math.floor(Math.random() * FEED_LINES.length)]();
      return { id: ++feedSeq, text: n + ' ' + line, t: Date.now() };
    }

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      const tg = window && window.Telegram && window.Telegram.WebApp;
      return {
        name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: []
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }

      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }

      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        toggle: () => { if (musicPlaying) { AudioEngine.stopMusic(); } else { AudioEngine.startMusic(); } return musicPlaying; },
        coin: () => { init(); tone(1046, 0.08, "square", sfxGain, 0, 0.15); tone(1318, 0.15, "square", sfxGain, 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", sfxGain, 0, 0.25); tone(165, 0.25, "sawtooth", sfxGain, 0.1, 0.25); },
        purchase: () => { init(); tone(523, 0.1, "triangle", sfxGain, 0, 0.2); tone(659, 0.1, "triangle", sfxGain, 0.07, 0.2); tone(783, 0.2, "triangle", sfxGain, 0.14, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [feed, setFeed] = useState(() => Array.from({ length: 8 }, makeFeed));
      const [musicOn, setMusicOn] = useState(false);

      // PAYSTACK STATES
      const [paystackKey, setPaystackKey] = useState("");
      const [topUpAmount, setTopUpAmount] = useState(1000);

      useEffect(() => {
        const tg = window && window.Telegram && window.Telegram.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

        fetch('/api/config')
          .then(res => res.json())
          .then(data => setPaystackKey(data.publicKey))
          .catch(err => console.error("Could not load Paystack config", err));

        auth.signInAnonymously().then((cred) => {
          const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
          const userId = (tgUser && tgUser.id) ? String(tgUser.id) : cred.user.uid;
          setUid(userId);

          const userRef = db.collection("users").doc(userId);
          const unsubscribe = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  transactions: dbData.transactions || []
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: (tgUser && tgUser.first_name) || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: []
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (err) => console.error(err));
          return unsubscribe;
        }).catch(e => setAuthError(e.message));
      }, []);

      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      useEffect(() => {
        if (!s) return;
        const iv = setInterval(() => {
          setS((p) => {
            const nowT = Date.now();
            let energy = p.energy;
            let lastEnergy = p.lastEnergy;
            if (energy < MAX_E) {
              const gained = Math.floor((nowT - lastEnergy) / ENERGY_MS);
              if (gained > 0) {
                energy = Math.min(MAX_E, energy + gained);
                lastEnergy = energy >= MAX_E ? nowT : lastEnergy + gained * ENERGY_MS;
              }
            }
            const perHr = Object.entries(p.businesses || {}).reduce((a, kv) => a + kv[1] * (BIZ_PER_HR[kv[0]] || 0), 0);
            const newCash = p.cash + perHr / 3600;
            if (energy !== p.energy || perHr > 0) {
              if (uid && perHr > 0) {
                db.collection("users").doc(uid).update({ cash: firebase.firestore.FieldValue.increment(perHr / 3600), energy, lastEnergy }).catch(() => {});
              }
              return Object.assign({}, p, { energy: energy, lastEnergy: lastEnergy, cash: newCash });
            }
            return p;
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [s, uid]);

      useEffect(() => {
        const iv = setInterval(() => {
          setFeed((f) => [makeFeed(), ...f].slice(0, 40));
        }, 5000);
        return () => clearInterval(iv);
      }, []);

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' }, h('div', { className: 'text-4xl' }, '⚠️'), h('div', { className: 'font-bold' }, 'Auth Error'), h('div', { className: 'text-sm' }, authError));

      const payReal = async (item) => {
        if (s.real < item.price) {
          AudioEngine.error();
          return notify('Insufficient real balance — top up!', 'bad');
        }

        const fakeGain = item.price * item.multiplier;

        setS((p) => (Object.assign({}, p, {
          real: p.real - item.price,
          cash: p.cash + fakeGain,
          clout: (p.clout || 0) + item.price,
          goldName: item.id === 'gold' ? true : p.goldName,
        })));
        
        setFeed((f) => [{
          id: ++feedSeq,
          text: 'YOU paid ₦' + item.price + ' real for ' + item.label + ' ' + item.emoji,
          t: Date.now(),
          me: true,
        }].concat(f).slice(0, 40));
        
        AudioEngine.purchase();
        notify(item.label + ' activated! +' + fmt(fakeGain) + ' fake 🔥');
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); } catch(e) {}

        if (uid) {
          const updates = {
            real: firebase.firestore.FieldValue.increment(-item.price),
            cash: firebase.firestore.FieldValue.increment(fakeGain),
            clout: firebase.firestore.FieldValue.increment(item.price),
            lastSeen: Date.now()
          };
          if (item.id === 'gold') updates.goldName = true;
          
          await db.collection("users").doc(uid).update(updates).catch(() => {});
        }
      };

      // REAL PAYSTACK TOP UP
      const topUpReal = () => {
        if (!paystackKey) return notify("Payment system loading. Try again.", 'bad');
        if (topUpAmount < 100) return notify("Minimum top up is ₦100", 'bad');

        const handler = PaystackPop.setup({
          key: paystackKey,
          email: `user_${uid}@lagoslife.com`,
          amount: topUpAmount * 100, // Paystack uses kobo
          currency: 'NGN',
          ref: 'LGM_' + Date.now() + '_' + Math.floor(Math.random() * 1000), 
          callback: function(response) {
            notify('Verifying payment...', 'good');
            
            fetch('/api/paystack', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                reference: response.reference, 
                userId: uid, 
                amount: topUpAmount 
              })
            })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                setS((p) => (Object.assign({}, p, { real: (p.real || 0) + topUpAmount })));
                notify(`Payment Successful! +₦${topUpAmount.toLocaleString()} real 💳`);
                AudioEngine.coin();
              } else {
                notify('Payment verification failed.', 'bad');
              }
            })
            .catch(err => notify('Network error during verification.', 'bad'));
          },
          onClose: function() {
            notify('Payment cancelled.', 'bad');
          }
        });
        handler.openIframe();
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      // Calculate Club Status
      let clubRank = "Ajebutter";
      if ((s.clout || 0) > 1000) clubRank = "Club Rat";
      if ((s.clout || 0) > 5000) clubRank = "Baller";
      if ((s.clout || 0) > 10000) clubRank = "Odogwu";
      if ((s.clout || 0) > 50000) clubRank = "Club Owner";

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('button', {
            onClick: () => { const on = AudioEngine.toggle(); setMusicOn(on); },
            className: 'music-toggle w-10 h-10 rounded-full bg-white/[0.08] border border-white/15 grid place-items-center active:scale-95 transition backdrop-blur'
          }, h('span', { className: 'text-base' }, musicOn ? '🔊' : '🔇')),

          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Club'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + clubRank)
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0)),
                h('div', { className: 'px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums' }, fmt(s.cash))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            // EXCHANGE RATE BANNER
            h('div', { className: 'mt-3 p-3 rounded-xl bg-gradient-to-r from-green-500/20 to-[#FFD60A]/20 border border-green-500/30 text-center animate-popIn' },
              h('div', { className: 'text-[12px] font-black text-white' }, '💸 ₦100 REAL = ₦500,000,000 FAKE CASH! 💸'),
              h('div', { className: 'text-[10px] text-white/70 mt-0.5 font-bold' }, 'Why? Because Na Lagos we dey! 🇳🇬 Top up and blow fake money.')
            ),

            h(Card, { className: 'relative overflow-hidden p-4 mt-3 hero-grid', gold: true },
              h('div', { className: 'absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#22C55E]/20 blur-3xl pointer-events-none' }),
              h('div', { className: 'relative' },
                h('div', { className: 'flex items-center justify-between' },
                  h('div', { className: 'text-[9px] uppercase tracking-widest text-white/45 font-bold' }, 'Real Balance'),
                  h('div', { className: 'text-2xl' }, '🤑')
                ),
                h('div', { className: 'text-3xl font-black text-[#22C55E] tabular-nums font-display mt-1' }, fmtReal(s.real || 0)),
                h('div', { className: 'text-[10px] text-white/45 mt-1.5' }, 'Pay real money for flex moves inside club'),

                // DYNAMIC TOP UP SECTION
                h('div', { className: 'mt-3 pt-3 border-t border-white/[0.08]' },
                  h('div', { className: 'flex gap-2' },
                    h('div', { className: 'flex-1 flex items-center bg-white/[0.05] border border-white/10 rounded-xl px-3' },
                      h('span', { className: 'text-[14px] text-white/50 font-bold' }, '₦'),
                      h('input', {
                        type: 'number',
                        value: topUpAmount || '',
                        onChange: (e) => setTopUpAmount(Math.floor(Number(e.target.value))),
                        placeholder: 'Enter amount',
                        className: 'w-full bg-transparent py-3 text-[14px] font-black text-white focus:outline-none ml-1'
                      })
                    ),
                    h('button', { onClick: topUpReal, className: 'px-4 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[12px] active:scale-95 transition' }, 'Pay Now')
                  )
                )
              )
            ),

            // REGULAR ACTIONS
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, 'Regular') }, 'Club Actions'),
            h('div', { className: 'grid grid-cols-2 gap-2.5' },
              REGULAR_ACTIONS.map((it) => {
                const canAfford = (s.real || 0) >= it.price;
                return h(Card, { key: it.id, className: 'relative overflow-hidden p-3 flex flex-col' },
                  h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + it.color + ' pointer-events-none opacity-70' }),
                  h('div', { className: 'relative' },
                    h('div', { className: 'text-3xl' }, it.emoji),
                    h('div', { className: 'text-[12px] font-extrabold mt-2 font-display' }, it.label),
                    h('div', { className: 'text-[9px] text-white/50 leading-tight mt-0.5 mb-2' }, it.desc),
                    h('button', {
                      onClick: () => payReal(it),
                      disabled: !canAfford,
                      className: 'w-full rounded-lg text-[11px] font-black py-2 active:scale-95 transition-all tabular-nums ' +
                        (canAfford
                          ? 'bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black shadow-[0_4px_12px_-4px_rgba(34,197,94,0.6)]'
                          : 'bg-white/[0.06] text-white/25 border border-white/[0.06]')
                    }, '₦' + it.price)
                  )
                );
              })
            ),

            // VIP ACTIONS
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-[#FFD60A] flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#FFD60A] animate-pulse glow-dot' }), 'VIP ROOM') }, 'Crazy Flex'),
            h('div', { className: 'grid grid-cols-2 gap-2.5' },
              VIP_ACTIONS.map((it) => {
                const canAfford = (s.real || 0) >= it.price;
                const owned = it.id === 'gold' && s.goldName;
                return h(Card, { key: it.id, className: 'relative overflow-hidden p-3 flex flex-col border-[#FFD60A]/20' },
                  h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + it.color + ' pointer-events-none opacity-70' }),
                  h('div', { className: 'relative' },
                    h('div', { className: 'flex items-start justify-between' },
                      h('div', { className: 'text-3xl' }, it.emoji),
                      owned && h('span', { className: 'text-[8.5px] font-black bg-[#FFD60A] text-black rounded px-1.5 py-0.5' }, 'OWNED')
                    ),
                    h('div', { className: 'text-[12px] font-extrabold mt-2 font-display text-[#FFD60A]' }, it.label),
                    h('div', { className: 'text-[9px] text-white/50 leading-tight mt-0.5 mb-2' }, it.desc),
                    h('button', {
                      onClick: () => payReal(it),
                      disabled: !canAfford,
                      className: 'w-full rounded-lg text-[11px] font-black py-2 active:scale-95 transition-all tabular-nums ' +
                        (canAfford
                          ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.6)]'
                          : 'bg-white/[0.06] text-white/25 border border-white/[0.06]')
                    }, '₦' + it.price)
                  )
                );
              })
            ),

            // LIVE FEED
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-[#22C55E] flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#22C55E] animate-pulse glow-dot' }), 'LIVE') }, 'Club Feed'),
            h(Card, { className: 'divide-y divide-white/[0.05] max-h-96 overflow-y-auto' },
              feed.map((f) => h('div', { key: f.id, className: 'px-3.5 py-2.5 flex items-start gap-2.5 text-[11px] animate-slideInRight' },
                h('span', { className: 'mt-1 w-1.5 h-1.5 rounded-full shrink-0 ' + (f.me ? 'bg-[#22C55E] glow-dot' : 'bg-[#FFD60A]') }),
                h('span', { className: f.me ? 'text-[#22C55E] font-bold' : 'text-white/65' }, f.text)
              ))
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '🎉'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' },
                  'Every real payment gives you ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, 'massive fake money'),
                  ' plus clout. Gold Name dey permanent for your profile. This na the fastest way to climb Net Worth. 🔥'
                )
              )
            )
          ),

          // NAVIGATION
          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'club';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
