    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }
      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },

              NAV.map((n) => {

                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')

              h('div', { className: 'space-y-2.5' },

                    onChange: (e) => setSongTitle(e.target.value),

                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-bold text-white placeholder-white/30 focus:border-[#A855F7]/50 transition'
                  })
                )
              ),
              h('div', { className: 'mt-4 space-y-2' },

                h('p', { className: 'text-[11px] text-white/50 mt-1' }, 'Send fake cash to another hustler')
              ),
              h('div', { className: 'space-y-2.5' },
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Recipient Name'),

                    h('span', { className: 'text-[#22C55E] text-sm' }, '✅'),

                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Amount (₦)'),
                  h('input', {
                    type: 'tel',
                    inputMode: 'numeric',
                    value: giftAmt,
                    onChange: (e) => setGiftAmt(e.target.value.replace(/\D/g, '').slice(0, 15)),
                    disabled: isGifting,
                    placeholder: 'Min ₦' + GIFT_MIN,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[15px] font-black text-white placeholder-white/30 focus:border-[#FFD60A]/50 transition tabular-nums disabled:opacity-50'
                  }),
                  giftAmt && Number(giftAmt) > 0 && h('div', {
                    className: 'mt-2 px-3 py-2 rounded-xl flex items-center justify-between border ' +
                      (Number(giftAmt) > s.cash ? 'bg-red-500/15 border-red-500/40' : 'bg-[#FFD60A]/10 border-[#FFD60A]/30')
                  },
                    h('span', { className: 'text-[10px] uppercase tracking-widest font-bold text-white/50' }, 'You are sending'),
                    h('span', { className: 'font-black tabular-nums font-display text-[14px] ' + (Number(giftAmt) > s.cash ? 'text-red-400' : 'text-[#FFD60A]') },
                      fmt(Math.floor(Number(giftAmt))))
                  )
                ),
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Note (optional)'),
                  h('input', {
                    value: giftNote,
                    onChange: (e) => setGiftNote(e.target.value),
                    disabled: isGifting,
                    placeholder: 'e.g. Happy birthday!',
                    maxLength: 40,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[13px] font-bold text-white placeholder-white/30 focus:border-[#FFD60A]/50 transition disabled:opacity-50'
                  })
                ),
                h('div', { className: 'text-[10px] text-white/40 tabular-nums' }, 'Available: ' + fmt(s.cash))
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: sendGift,
                  disabled: isGifting || !verifiedPlayer || !giftAmt || Number(giftAmt) < GIFT_MIN || Number(giftAmt) > s.cash,
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95 disabled:opacity-40'
                }, isGifting ? 'Sending...' : '🍾 SEND GIFT'),
                h('button', { onClick: () => setGiftModal(false), disabled: isGifting, className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold disabled:opacity-40' }, 'Cancel')
              )
            )
          ),

          // 🔐 PASSWORD REMINDER
          showPasswordReminder && h('div', { className: 'fixed inset-0 z-[95] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setShowPasswordReminder(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-2' }, '🔐'),
              h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'ADD A PASSWORD'),
              h('p', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed' },
                'You signed in with Google. Add a password so you fit still login with email if Google login ever fails.'
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: () => { window.location.href = '/index.html'; },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95'
                }, '🔒 Set Password Now'),
                h('button', { onClick: () => setShowPasswordReminder(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Later')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
