        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);

              if (!dbData.telegramId && tgUser && tgUser.id) userRef.update({ telegramId: tgUser.id }).catch(() => {});

              setS(prev => {
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  telegramId: dbData.telegramId || (tgUser && tgUser.id),
                  transactions: dbData.transactions || [],
                  cash: dbData.cash !== undefined ? dbData.cash : prev.cash,
                  lastCollected: dbData.lastCollected || prev.lastCollected || Date.now()
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: (tgUser && tgUser.first_name) || 'Hustler',
                telegramId: (tgUser && tgUser.id) || null,
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: [], lastCollected: Date.now()
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
          return unsubscribe;
        }).catch(e => setAuthError(e.message));

        return () => unsubSettings();
      }, []);

      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      // Live Feed Ticker
      useEffect(() => {
        const iv = setInterval(() => {
          setFeedMsg(BUSINESS_FEED[Math.floor(Math.random() * BUSINESS_FEED.length)]);
        }, 6000);
        return () => clearInterval(iv);
      }, []);

      // 🕒 OFFLINE VAULT ACCUMULATOR
      useEffect(() => {
        if (!s) return;
        
        const calculateVault = () => {
          const perHr = Object.entries(s.businesses || {}).reduce((a, kv) => {
            const biz = BUSINESSES.find((b) => b.id === kv[0]);
            return a + kv[1] * (biz ? biz.perHr : 0);
          }, 0);
          
          if (perHr > 0) {
            const lastCollected = s.lastCollected || Date.now();
            const now = Date.now();
            const elapsedMs = Math.max(0, now - lastCollected);
            
            // Cap offline earnings at MAX_OFFLINE_HOURS
            const maxMs = MAX_OFFLINE_HOURS * 60 * 60 * 1000;
            const effectiveMs = Math.min(elapsedMs, maxMs);
            
            const accumulated = Math.floor((effectiveMs / 3600000) * perHr);
            setVault(accumulated);
          } else {
            setVault(0);
          }
        };

        // Calculate immediately on load
        calculateVault();

        // Then update every second
        const iv = setInterval(calculateVault, 1000);
        return () => clearInterval(iv);
      }, [s.businesses, s.lastCollected]);

      const collectVault = async () => {
        const amount = vault;
        if (amount < 1) { AudioEngine.error(); return notify('Vault is empty. Wait small! ⏳', 'bad'); }
        
        setIsCollecting(true);
        AudioEngine.collect();
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); } catch(e) {}

        const now = Date.now();
        setS(prev => Object.assign({}, prev, { 
          cash: (prev.cash || 0) + amount,
          lastCollected: now
        }));
        setVault(0);
        notify('Collected ' + fmt(amount) + ' from your businesses! 💰');
        
        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(amount),
            lastCollected: now,
            lastSeen: Date.now()
          }).catch(() => {});
        }
        
        setTimeout(() => setIsCollecting(false), 800);
      };

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' },
        h('div', { className: 'text-4xl' }, '⚠️'),
        h('div', { className: 'font-bold' }, 'Auth Error'),
        h('div', { className: 'text-sm' }, authError)
      );

      if (isMaintenance) {
        return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center bg-[#08080B]' },
          h('div', { className: 'text-7xl animate-bounce' }, '🚧'),
          h('h1', { className: 'text-2xl font-black text-[#FFD60A] font-display mt-4' }, 'GAME UNDER MAINTENANCE'),
          h('p', { className: 'text-white/50 text-sm max-w-xs' }, 'We dey upgrade the game for you. Check back in a few minutes!')
        );
      }

      const safeBiz = s.businesses || {};
      const bizValue = Object.entries(safeBiz).reduce((a, kv) => {
        const biz = BUSINESSES.find((b) => b.id === kv[0]);
        return a + kv[1] * (biz ? biz.price : 0);
      }, 0);
      const perHr = Object.entries(safeBiz).reduce((a, kv) => {
        const biz = BUSINESSES.find((b) => b.id === kv[0]);
        return a + kv[1] * (biz ? biz.perHr : 0);
      }, 0);
      const assetValue = Object.entries(s.assets || {}).reduce((a, kv) => a + kv[1] * (ASSET_PRICES[kv[0]] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);
      const ownedCount = Object.values(safeBiz).reduce((a, c) => a + c, 0);

      let bizRank = "Street Hustler";
      if (ownedCount > 5) bizRank = "Small Business Owner";
      if (ownedCount > 15) bizRank = "Business Mogul";
      if (ownedCount > 30) bizRank = "Dangote of Lagos";

      const buyBusiness = async (b) => {
        // Auto-collect vault if buying a business
        const currentVault = vault;
        if ((s.cash + currentVault) < b.price) {
          AudioEngine.error();
          return notify('Not enough Lagos Cash 💸', 'bad');
        }

        const now = Date.now();
        
        setS(prev => {
          const newBiz = Object.assign({}, prev.businesses || {});
          newBiz[b.id] = (newBiz[b.id] || 0) + 1;
          return Object.assign({}, prev, { 
            cash: (prev.cash || 0) + currentVault - b.price, 
            businesses: newBiz,
            lastCollected: now
          });
        });
        setVault(0);

        AudioEngine.purchase();
        notify(b.emoji + ' ' + b.name + ' bought! +' + fmt(b.perHr) + '/hr');
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); } catch(e) {}

        if (uid) {
          const updates = { 
            cash: firebase.firestore.FieldValue.increment(currentVault - b.price), 
            lastCollected: now,
            lastSeen: Date.now() 
          };
          updates['businesses.' + b.id] = firebase.firestore.FieldValue.increment(1);
          await db.collection("users").doc(uid).update(updates).catch(() => {});
        }
      };

      const filteredBusinesses = activeTab === "All"
        ? BUSINESSES
        : BUSINESSES.filter(b => b.cat === activeTab);

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },

          h('button', {
            onClick: () => { const on = AudioEngine.toggle(); setMusicOn(on); },
            className: 'music-toggle w-10 h-10 rounded-full bg-white/[0.08] border border-white/15 grid place-items-center active:scale-95 transition'
          }, h('span', { className: 'text-base' }, musicOn ? '🔊' : '🔇')),

          h('header', { className: 'sticky top-0 z-30 bg-[#08080B] border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Business Empire'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0)),
                h('div', { className: 'px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums' }, fmtReal(s.real || 0))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            // VAULT CARD
            h(Card, { className: 'p-5 mt-3 relative overflow-hidden', gold: true },
              h('div', { className: 'absolute -top-10 -right-10 w-32 h-32 rounded-full bg-[#FFD60A]/20 blur-2xl pointer-events-none' }),
              h('div', { className: 'text-center relative z-10' },
                h('div', { className: 'text-[10px] uppercase tracking-widest text-[#FFD60A]/70 font-bold mb-1' }, 'Business Vault'),
                h('div', { className: 'text-4xl font-black text-gradient-gold tabular-nums font-display drop-shadow-md mb-2' }, fmt(vault)),
                h('div', { className: 'text-[10px] text-white/50 mb-4' }, 'Your businesses make money 24/7. Collect am!'),
                
                h('button', { 
                  onClick: collectVault, 
                  disabled: isCollecting || vault < 1,
                  className: 'w-full py-4 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black font-black text-[15px] shadow-[0_8px_24px_-8px_rgba(34,197,94,0.7)] active:scale-95 transition disabled:opacity-50 disabled:shadow-none ' + (vault >= 1 ? 'collect-btn' : '')
                }, 
                  isCollecting ? 'Collecting...' : 'COLLECT ' + fmt(vault)
                )
              )
            ),

            // STATS GRID
            h('div', { className: 'grid grid-cols-3 gap-2 mt-3' },
              h(Card, { className: 'p-2.5 text-center' },
                h('div', { className: 'text-[9px] uppercase tracking-widest text-white/40 font-bold' }, 'Per Hour'),
                h('div', { className: 'text-[12px] font-black text-[#22C55E] tabular-nums mt-0.5' }, '+' + fmt(perHr))
              ),
              h(Card, { className: 'p-2.5 text-center' },
                h('div', { className: 'text-[9px] uppercase tracking-widest text-white/40 font-bold' }, 'Owned'),
                h('div', { className: 'text-[12px] font-black text-white tabular-nums mt-0.5' }, String(ownedCount))
              ),
              h(Card, { className: 'p-2.5 text-center' },
                h('div', { className: 'text-[9px] uppercase tracking-widest text-white/40 font-bold' }, 'Title'),
                h('div', { className: 'text-[10px] font-black text-[#FFD60A] mt-0.5 truncate' }, bizRank)
              )
            ),

            // LIVE FEED
            h('div', { className: 'mt-4 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/[0.05] flex items-center gap-2 overflow-hidden' },
              h('span', { className: 'text-sm shrink-0 animate-pulse' }, '📡'),
              h('div', { className: 'flex-1 overflow-hidden relative h-5' },
                h('div', { className: 'absolute text-[10.5px] font-bold text-white/60 whitespace-nowrap marquee', key: feedMsg }, feedMsg)
              )
            ),

            // TABS
            h('div', { className: 'mt-4 flex gap-1.5 overflow-x-auto pb-1 no-scrollbar' },
              CATEGORIES.map(cat =>
                h('button', {
                  key: cat,
                  onClick: () => setActiveTab(cat),
                  className: 'whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all ' +
                    (activeTab === cat
                      ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.5)]'
                      : 'bg-white/[0.06] text-white/50 border border-white/10')
                }, cat)
              )
            ),

            // YOUR BUSINESSES
            ownedCount > 0 && activeTab === 'All' && h(React.Fragment, null,
              h(SectionTitle, {
                right: h('span', { className: 'text-[10px] font-bold text-[#22C55E] flex items-center gap-1.5' },
                  h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#22C55E] animate-pulse glow-dot' }),
                  'LIVE INCOME'
                )
              }, 'Your Empire'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
                BUSINESSES.filter((b) => (safeBiz[b.id] || 0) > 0).map((b) => {
                  const owned = safeBiz[b.id];
                  return h('div', { key: b.id, className: 'px-3.5 py-2.5 flex items-center gap-3' },
                    h('div', { className: 'w-8 h-8 rounded-lg bg-white/[0.06] grid place-items-center text-base shrink-0' }, b.emoji),
                    h('div', { className: 'flex-1 min-w-0' },
                      h('div', { className: 'text-[12px] font-extrabold truncate font-display' }, b.name),
                      h('div', { className: 'text-[10px] text-white/40 font-bold tabular-nums' }, '×' + owned + ' · ' + fmt(b.perHr * owned) + '/hr')
                    ),
                    h('div', { className: 'text-[11px] font-black text-[#FFD60A] tabular-nums shrink-0' }, fmt(b.price * owned))
                  );
                })
              )
            ),

            h(SectionTitle, {
              right: h('span', { className: 'text-[10px] font-bold text-white/30' }, filteredBusinesses.length + ' options')
            }, activeTab === "All" ? "All Businesses" : activeTab + " Businesses"),

            h('div', { className: 'space-y-2' },
              filteredBusinesses.map((b) => {
                const owned = safeBiz[b.id] || 0;
                const canAfford = (s.cash + vault) >= b.price;
                const roiHours = (b.price / b.perHr).toFixed(1);
                return h(Card, {
                  key: b.id,
                  className: 'p-3 flex items-center gap-3 transition-all ' + (owned > 0 ? 'border-[#FFD60A]/40 shadow-[0_0_15px_-5px_rgba(255,214,10,0.2)]' : '')
                },
                  h('div', { className: 'w-12 h-12 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-2xl shrink-0 relative' },
                    b.emoji,
                    owned > 0 && h('span', { className: 'badge-owned absolute -top-1.5 -right-1.5 bg-gradient-to-br from-[#FFE566] to-[#FFB800] text-black text-[9px] font-black rounded-full w-5 h-5 grid place-items-center shadow-lg' }, String(owned))
                  ),
                  h('div', { className: 'flex-1 min-w-0' },
                    h('div', { className: 'text-[13px] font-extrabold truncate font-display' }, b.name),
                    h('div', { className: 'text-[9px] text-white/40 truncate mb-1' }, b.desc),
                    h('div', { className: 'flex items-center gap-2' },
                      h('span', { className: 'text-[10px] font-black text-[#22C55E] tabular-nums' }, '+' + fmt(b.perHr) + '/hr'),
                      h('span', { className: 'text-[9px] text-white/30 font-bold' }, '· ROI ' + roiHours + 'h')
                    )
                  ),
                  h('button', {
                    onClick: () => buyBusiness(b),
                    disabled: !canAfford,
                    className: 'shrink-0 rounded-lg text-[11px] font-black px-3 py-2 active:scale-95 transition-all tabular-nums ' +
                      (canAfford
                        ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.5)]'
                        : 'bg-white/[0.07] text-white/30')
                  }, fmt(b.price))
                );
              })
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '💡'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' },
                  'Your businesses no dey sleep. Money dey enter your vault 24/7, even when you close the app! (Max: 24 hours). Collect am often so Sapa no go catch you.'
                )
              )
            )
          ),

          // BOTTOM NAV
          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'biz';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad'
                ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white'
                : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', {
              style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' },
              onClick: () => window.location.reload()
            }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      h(ErrorBoundary, null, h(App))
    );
  </script>
</body>
</html>
