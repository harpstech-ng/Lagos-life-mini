      "Your Oil Bloc just shipped 1 million barrels 🛢️",
      "Your Satellite Network just signed a ₦50T government contract 🛰️",
      "Your Mars Colony just shipped rare minerals back to Earth 🔴",
      "Your Central Bank just printed another quadrillion 🏦",
      "Your Private Army just secured another nation ⚔️"
    ];

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) {
          const parsed = JSON.parse(cached);
          return Object.assign({}, parsed, {
            lastCollected: parsed.lastCollected || Date.now(),
            upgrades: parsed.upgrades || {},
            autoCollect: parsed.autoCollect === true,
            whatsappJoined: parsed.whatsappJoined === true
          });
        }
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: [], history: [], lastCollected: Date.now(),
        upgrades: {}, autoCollect: false, whatsappJoined: false
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e15) return s + '₦' + (n / 1e15).toFixed(2) + 'Q';
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }
      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        toggle: () => { if (musicPlaying) { AudioEngine.stopMusic(); } else { AudioEngine.startMusic(); } return musicPlaying; },
        coin: () => { init(); tone(1046, 0.08, "square", sfxGain, 0, 0.15); tone(1318, 0.15, "square", sfxGain, 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", sfxGain, 0, 0.25); tone(165, 0.25, "sawtooth", sfxGain, 0.1, 0.25); },
        purchase: () => { init(); tone(523, 0.1, "triangle", sfxGain, 0, 0.2); tone(659, 0.1, "triangle", sfxGain, 0.07, 0.2); tone(783, 0.2, "triangle", sfxGain, 0.14, 0.2); },
        collect: () => { init(); tone(1318, 0.1, "sine", sfxGain, 0, 0.2); tone(1567, 0.1, "sine", sfxGain, 0.08, 0.2); tone(2093, 0.2, "sine", sfxGain, 0.16, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    const getEffectivePerHr = (biz, count, level) => {
      return count * biz.perHr * Math.pow(3, level || 0);
    };

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [musicOn, setMusicOn] = useState(false);
      const [activeTab, setActiveTab] = useState("Street");
      const [isMaintenance, setIsMaintenance] = useState(false);
      const [feedMsg, setFeedMsg] = useState("Welcome to your business empire! Buy a business to start making passive income.");
      const [isCollecting, setIsCollecting] = useState(false);

      const [dramaEvent, setDramaEvent] = useState(null);
      const [manageBiz, setManageBiz] = useState(null);

      const [now, setNow] = useState(Date.now());

      // Refs
      const stateRef = useRef(s);
      // Track last synced energy so we only write when it actually changes
      const lastSyncedEnergyRef = useRef({ energy: -1, lastEnergy: 0 });

      // Keep stateRef in sync
      useEffect(() => { stateRef.current = s; }, [s]);

      // Local ticker (no Firebase reads)
      useEffect(() => {
        const iv = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(iv);
      }, []);

      // ✅ TASK 2: Settings — get() once + 5min interval (NOT onSnapshot)
      useEffect(() => {
        let cancelled = false;
        const checkMaintenance = async () => {
          try {
            const doc = await db.collection("settings").doc("game").get();
            if (cancelled) return;
            if (doc.exists && doc.data().maintenance === true) setIsMaintenance(true);
            else setIsMaintenance(false);
          } catch (e) {
            // silently ignore
          }
        };
        checkMaintenance();
        const iv = setInterval(checkMaintenance, SETTINGS_REFRESH_MS);
        return () => { cancelled = true; clearInterval(iv); };
      }, []);

      // ✅ TASK 1: Auth + ONLY ONE onSnapshot (own user) with cleanup
      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);
          const userRef = db.collection("users").doc(userId);

          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              const dbData = doc.data();
              setS(prev => {
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  transactions: dbData.transactions || [],
                  history: dbData.history || [],
                  cash: dbData.cash !== undefined ? dbData.cash : prev.cash,
                  lastCollected: dbData.lastCollected || prev.lastCollected || Date.now(),
                  upgrades: dbData.upgrades || prev.upgrades || {},
                  autoCollect: dbData.autoCollect === true,
                  whatsappJoined: dbData.whatsappJoined === true
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: [], history: [], lastCollected: Date.now(),
                upgrades: {}, autoCollect: false, whatsappJoined: false
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => { authUnsub(); if (userUnsub) userUnsub(); };
      }, []);

      // 🎵 Music unlock
      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      // Toast auto-dismiss
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      // Feed rotation
      useEffect(() => {
        const iv = setInterval(() => {
          setFeedMsg(BUSINESS_FEED[Math.floor(Math.random() * BUSINESS_FEED.length)]);
        }, 6000);
        return () => clearInterval(iv);
      }, []);

      // ✅ ENERGY REGEN — local only, NO Firestore write
      useEffect(() => {
        if (!uid) return;
        const iv = setInterval(() => {
          setS(prev => {
            if (!prev || prev.energy >= MAX_E) return prev;
            const tickNow = Date.now();
            const gained = Math.floor((tickNow - prev.lastEnergy) / ENERGY_MS);
            if (gained <= 0) return prev;
            const energy = Math.min(MAX_E, prev.energy + gained);
            const lastEnergy = energy >= MAX_E ? tickNow : prev.lastEnergy + gained * ENERGY_MS;
            const next = Object.assign({}, prev, { energy, lastEnergy });
            stateRef.current = next;
            return next;
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [uid]);

      // ✅ ENERGY SYNC — every 60s, ONLY if energy changed. No more per-second writes.
      useEffect(() => {
        if (!uid) return;
        const syncEnergy = async () => {
          const cur = stateRef.current;
          if (!cur) return;
          const last = lastSyncedEnergyRef.current;
          if (cur.energy === last.energy && cur.lastEnergy === last.lastEnergy) return;
          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };
          try {
            await db.collection("users").doc(uid).update({
              energy: cur.energy,
              lastEnergy: cur.lastEnergy,
              lastSeen: Date.now()
            });
          } catch (e) { console.error("Energy sync error:", e); }
        };
        const iv = setInterval(syncEnergy, ENERGY_SYNC_MS);
        return () => clearInterval(iv);
      }, [uid]);

      // ✅ Flush energy on tab hidden / unload
      useEffect(() => {
        if (!uid) return;
        const flush = () => {
          const cur = stateRef.current;
          if (!cur) return;
          const last = lastSyncedEnergyRef.current;
          if (cur.energy === last.energy && cur.lastEnergy === last.lastEnergy) return;
          // fire-and-forget
          db.collection("users").doc(uid).update({
            energy: cur.energy,
            lastEnergy: cur.lastEnergy,
            lastSeen: Date.now()
          }).catch(() => {});
        };
        const handleVisibility = () => { if (document.visibilityState === 'hidden') flush(); };
        document.addEventListener('visibilitychange', handleVisibility);
        window.addEventListener('beforeunload', flush);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibility);
          window.removeEventListener('beforeunload', flush);
        };
      }, [uid]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      const logHistory = async (title, desc, amount) => {
        if (!uid) return;
        await db.collection("users").doc(uid).update({
          history: firebase.firestore.FieldValue.arrayUnion({
            title: title,
            desc: desc,
            amount: amount,
            date: Date.now(),
            category: 'activity'
          })
        }).catch(() => {});
      };

      // ✅ Vault calculation (client-side only, no writes)
      const vault = useMemo(() => {
        const safeBiz = s.businesses || {};
        const upgrades = s.upgrades || {};
        const perHr = Object.entries(safeBiz).reduce((a, kv) => {
          const biz = BUSINESSES.find((b) => b.id === kv[0]);
          if (!biz) return a;
          const level = upgrades[kv[0]] || 0;
          return a + getEffectivePerHr(biz, kv[1], level);
        }, 0);
        if (perHr <= 0) return 0;
        const lastCollected = s.lastCollected || now;
        const elapsedMs = Math.max(0, now - lastCollected);
        const maxMs = MAX_OFFLINE_HOURS * 60 * 60 * 1000;
        const effectiveMs = Math.min(elapsedMs, maxMs);
        return Math.floor((effectiveMs / 3600000) * perHr);
      }, [s.businesses, s.upgrades, s.lastCollected, now]);

      const totalPerHr = useMemo(() => {
        const safeBiz = s.businesses || {};
        const upgrades = s.upgrades || {};
        return Object.entries(safeBiz).reduce((a, kv) => {
          const biz = BUSINESSES.find((b) => b.id === kv[0]);
          if (!biz) return a;
          const level = upgrades[kv[0]] || 0;
          return a + getEffectivePerHr(biz, kv[1], level);
        }, 0);
      }, [s.businesses, s.upgrades]);

      // ✅ AUTO-COLLECT bot — 1 write per 60s, includes energy (combined)
      useEffect(() => {
        if (!s.autoCollect || !uid) return;
        const iv = setInterval(async () => {
          const cur = stateRef.current;
          if (!cur.autoCollect) return;
          const safeBizCur = cur.businesses || {};
          const upgradesCur = cur.upgrades || {};
          const perHrCur = Object.entries(safeBizCur).reduce((a, kv) => {
            const biz = BUSINESSES.find(b => b.id === kv[0]);
            if (!biz) return a;
            const level = upgradesCur[kv[0]] || 0;
            return a + getEffectivePerHr(biz, kv[1], level);
          }, 0);
          if (perHrCur <= 0) return;
          const elapsed = Math.min(Date.now() - (cur.lastCollected || Date.now()), MAX_OFFLINE_HOURS * 3600000);
          const amount = Math.floor((elapsed / 3600000) * perHrCur);
          if (amount < 1) return;
          const collectNow = Date.now();

          setS(prev => {
            const next = Object.assign({}, prev, {
              cash: (prev.cash || 0) + amount,
              lastCollected: collectNow
            });
            stateRef.current = next;
            return next;
          });

          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };

          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(amount),
            lastCollected: collectNow,
            energy: cur.energy,
            lastEnergy: cur.lastEnergy
          }).catch(() => {});
          AudioEngine.coin();
          notify('🤖 Bot collected ' + fmt(amount), 'good');
        }, 60000);
        return () => clearInterval(iv);
      }, [s.autoCollect, uid]);

      const collectVault = async () => {
        const amount = vault;
        if (amount < 1) { AudioEngine.error(); return notify('Vault is empty. Wait small! ⏳', 'bad'); }

        setIsCollecting(true);
        AudioEngine.collect();
        try { if (navigator.vibrate) navigator.vibrate(30); } catch(e) {}

        const collectNow = Date.now();
        setS(prev => {
          const next = Object.assign({}, prev, {
            cash: (prev.cash || 0) + amount,
            lastCollected: collectNow
          });
          stateRef.current = next;
          return next;

        notify('Collected ' + fmt(amount) + ' from your businesses! 💰');

        if (uid) {
          const cur = stateRef.current;
          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(amount),
            lastCollected: collectNow,
            energy: cur.energy,
            lastEnergy: cur.lastEnergy,

        }
        setTimeout(() => setIsCollecting(false), 800);
      };

      const checkBusinessDrama = () => {
        const safeBiz = s.businesses || {};
        const ownedIds = Object.keys(safeBiz).filter(id => safeBiz[id] > 0);
        if (ownedIds.length === 0) return notify('You need to buy a business first!', 'bad');

        const randomId = ownedIds[Math.floor(Math.random() * ownedIds.length)];

        if (roll < 0.2) {

        } else if (roll < 0.85) {
          const val = Math.floor(biz.price * 1.5);

        } else {

          event = { type: 'good', title: '🎉 MIRACLE!', msg: 'A viral video featured your ' + biz.name + '! You made ' + fmt(val) + '.', cash: val, biz: null };

      const resolveDrama = async () => {

      };

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' },
        h('div', { className: 'text-4xl' }, '⚠️'),
        h('div', { className: 'font-bold' }, 'Auth Error'),

      );

      if (isMaintenance) {
        return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center bg-[#08080B]' },
          h('div', { className: 'text-7xl animate-bounce' }, '🚧'),
          h('h1', { className: 'text-2xl font-black text-[#FFD60A] font-display mt-4' }, 'GAME UNDER MAINTENANCE'),
          h('p', { className: 'text-white/50 text-sm max-w-xs' }, 'We dey upgrade the game for you. Check back in a few minutes!')
        );
      }

      const safeBiz = s.businesses || {};
      const upgrades = s.upgrades || {};
      const bizValue = Object.entries(safeBiz).reduce((a, kv) => {
        const biz = BUSINESSES.find((b) => b.id === kv[0]);
        return a + kv[1] * (biz ? biz.price : 0);
      }, 0);
      const assetValue = Object.entries(s.assets || {}).reduce((a, kv) => a + kv[1] * (ASSET_PRICES[kv[0]] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);
      const ownedCount = Object.values(safeBiz).reduce((a, c) => a + c, 0);
      const perSec = totalPerHr / 3600;

      let bizRank = "Street Hustler";
      if (ownedCount > 5) bizRank = "Small Business Owner";
      if (ownedCount > 15) bizRank = "Business Mogul";
      if (ownedCount > 30) bizRank = "Dangote of Lagos";
      if (ownedCount > 60) bizRank = "Global Titan 🌍";
      if (ownedCount > 100) bizRank = "Cosmic Emperor 🌌";

      const buyBusiness = async (b) => {
        const currentVault = vault;
        if ((s.cash + currentVault) < b.price) {
          AudioEngine.error();
          return notify('Not enough Lagos Cash 💸', 'bad');
        }
        const buyNow = Date.now();
        setS(prev => {
          const newBiz = Object.assign({}, prev.businesses || {});
          newBiz[b.id] = (newBiz[b.id] || 0) + 1;
          const next = Object.assign({}, prev, {
            cash: (prev.cash || 0) + currentVault - b.price,
            businesses: newBiz,
            lastCollected: buyNow
          });
          stateRef.current = next;
          return next;
        });
        AudioEngine.purchase();
        notify(b.emoji + ' ' + b.name + ' bought! +' + fmt(b.perHr) + '/hr');
        try { if (navigator.vibrate) navigator.vibrate(25); } catch(e) {}
        if (uid) {
          const cur = stateRef.current;
          lastSyncedEnergyRef.current = { energy: cur.energy, lastEnergy: cur.lastEnergy };
          const updates = {
            cash: firebase.firestore.FieldValue.increment(currentVault - b.price),
            lastCollected: buyNow,
            energy: cur.energy,
            lastEnergy: cur.lastEnergy,
            lastSeen: Date.now()
          };
          updates['businesses.' + b.id] = firebase.firestore.FieldValue.increment(1);
          await db.collection("users").doc(uid).update(updates).catch(() => {});
          logHistory('Bought Business', 'Bought ' + b.name, -b.price);
        }
      };

      const upgradeBiz = async (b) => {
        const currentLevel = upgrades[b.id] || 0;
        if (currentLevel >= MAX_UPGRADE_LEVEL) return notify('Already MAX level! 🏆', 'bad');

            );
          })(),

          dramaEvent && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-2xl animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2' }, dramaEvent.type === 'good' ? '🎉' : dramaEvent.type === 'bad' ? '😭' : '💸'),
              h('div', { className: 'text-[15px] font-black text-white font-display mb-2' }, dramaEvent.title),
              h('p', { className: 'text-[12px] text-white/80 leading-relaxed mb-4' }, dramaEvent.msg),
              h('button', { onClick: resolveDrama, className: 'w-full py-3 rounded-xl bg-white/[0.06] border border-white/10 text-white font-bold text-[12px] active:scale-95 transition' }, 'Accept Fate')
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad'
                ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white'
                : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', {
              style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' },
              onClick: () => window.location.reload()
            }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
