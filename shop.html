  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; }
    body { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(236,72,153,0.1), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(168,85,247,0.08), transparent); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(600px) rotate(720deg); opacity: 0; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes giftFloat { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-8px) rotate(8deg); } }
    @keyframes spinWheel { 0% { transform: rotate(0deg); } 100% { transform: rotate(1440deg); } }
    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-slideUp { animation: slideUp 0.32s cubic-bezier(0.22,1,0.36,1); }
    .animate-giftFloat { animation: giftFloat 3s ease-in-out infinite; }
    .animate-spinWheel { animation: spinWheel 1s cubic-bezier(0.17, 0.67, 0.12, 0.99) forwards; }
    .shop-hero { background: radial-gradient(circle at top right, rgba(236,72,153,0.4) 0%, transparent 55%), radial-gradient(circle at bottom left, rgba(168,85,247,0.35) 0%, transparent 55%), linear-gradient(135deg, #1a0a1f 0%, #0f0a1a 100%); }
    .shimmer-line { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); background-size: 200% 100%; animation: shimmer 3s infinite; }
    .cat-pill { transition: all 0.2s; }
    .cat-pill.active { background: linear-gradient(135deg, #EC4899, #A855F7); color: #fff; box-shadow: 0 4px 16px -4px rgba(236,72,153,0.5); border-color: transparent; }
    .prod-card:active { transform: scale(0.96); }
    input, select { -webkit-user-select: text; user-select: text; }
    input:focus, select:focus { outline: none; }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .confetti-piece { position: fixed; top: -20px; font-size: 22px; animation: confetti 2.5s linear forwards; pointer-events: none; z-index: 999; }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .trending-badge { position: absolute; top: 0; right: 0; background: linear-gradient(45deg, #FF4500, #FF8C00); color: #fff; font-size: 8px; font-weight: 900; padding: 2px 6px; border-bottom-left-radius: 8px; z-index: 10; }
  </style>

    const fmt = (n) => {

      if (n >= 1e6) return '₦' + (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '₦' + (n / 1e3).toFixed(1) + 'K';

    };

    const THEMES = {

    const PRODUCTS = [

      { id: 'pizza', name: 'Pizza', emoji: '🍕', cat: 'food', min: 1500, max: 15000 },
      { id: 'gplay', name: 'Google Play', emoji: '🎮', cat: 'tech', min: 500, max: 20000 },
      { id: 'spotify', name: 'Spotify Gift', emoji: '🎵', cat: 'tech', min: 500, max: 10000 },
      { id: 'netflix', name: 'Netflix Gift', emoji: '🎬', cat: 'tech', min: 1500, max: 15000 },
      { id: 'steam', name: 'Steam Wallet', emoji: '🎯', cat: 'tech', min: 2000, max: 30000 },
      { id: 'apple', name: 'Apple Gift Card', emoji: '🍎', cat: 'tech', min: 5000, max: 50000 },
      { id: 'amazon', name: 'Amazon Card', emoji: '📦', cat: 'tech', min: 5000, max: 50000 },
      { id: 'ps', name: 'PlayStation Card', emoji: '🕹️', cat: 'tech', min: 10000, max: 50000 },
      { id: 'xbox', name: 'Xbox Card', emoji: '🎮', cat: 'tech', min: 10000, max: 50000 },
      { id: 'perfume', name: 'Luxury Perfume', emoji: '🌸', cat: 'luxury', min: 2000, max: 30000 },
      { id: 'watch', name: 'Luxury Watch', emoji: '⌚', cat: 'luxury', min: 8000, max: 50000 },
      { id: 'gold', name: 'Gold Chain', emoji: '📿', cat: 'luxury', min: 10000, max: 50000 },
      { id: 'pearl', name: 'Pearl Necklace', emoji: '📿', cat: 'luxury', min: 10000, max: 50000 },
      { id: 'diamond', name: 'Diamond Ring', emoji: '💍', cat: 'luxury', min: 20000, max: 50000 },
      { id: 'cap', name: 'Snapback Cap', emoji: '🧢', cat: 'fashion', min: 200, max: 3000 },
      { id: 'scarf', name: 'Silk Scarf', emoji: '🧣', cat: 'fashion', min: 500, max: 15000 },
      { id: 'shades', name: 'Designer Shades', emoji: '🕶️', cat: 'fashion', min: 1000, max: 20000 },
      { id: 'bag', name: 'Designer Handbag', emoji: '👜', cat: 'fashion', min: 5000, max: 50000 },
      { id: 'nike', name: 'Nike Sneakers', emoji: '👟', cat: 'fashion', min: 10000, max: 50000 },
      { id: 'book', name: 'Book Gift', emoji: '📚', cat: 'lifestyle', min: 200, max: 3000 },
      { id: 'plant', name: 'Potted Plant', emoji: '🌱', cat: 'lifestyle', min: 200, max: 3000 },
      { id: 'candle', name: 'Scented Candle', emoji: '🕯️', cat: 'lifestyle', min: 200, max: 2000 },
      { id: 'frame', name: 'Photo Frame', emoji: '🖼️', cat: 'lifestyle', min: 500, max: 10000 },
      { id: 'case', name: 'Phone Case', emoji: '📱', cat: 'lifestyle', min: 500, max: 10000 },
      { id: 'powerbank', name: 'Power Bank', emoji: '🔋', cat: 'wellness', min: 2000, max: 15000 },
      { id: 'spa', name: 'Spa Voucher', emoji: '💆', cat: 'wellness', min: 5000, max: 30000 },
      { id: 'airpods', name: 'AirPods', emoji: '🎧', cat: 'wellness', min: 8000, max: 50000 },
    ];

    const genCode = () => {
      const C = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      const seg = () => Array.from({ length: 4 }, () => C[Math.floor(Math.random() * C.length)]).join('');
      return 'LGM-' + seg() + '-' + seg() + '-' + seg();
    };

    const getPresets = (min, max) => {
      const spread = max - min;
      const p2 = Math.max(min, Math.round((min + spread * 0.33) / 50) * 50);
      const p3 = Math.max(p2, Math.round((min + spread * 0.66) / 100) * 100);
      return [min, p2, p3, max];
    };

    function App() {
      const [uid, setUid] = useState(null);
      const [userEmail, setUserEmail] = useState('');
      const [userName, setUserName] = useState('Hustler');
      const [paystackKey, setPaystackKey] = useState('');
      const [tab, setTab] = useState('shop');
      const [activeCat, setActiveCat] = useState('all');
      
      // Product & Purchase State
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [giftAmount, setGiftAmount] = useState(1000);
      const [customAmount, setCustomAmount] = useState('');
      const [recipientName, setRecipientName] = useState('');
      const [message, setMessage] = useState('');
      const [isSecret, setIsSecret] = useState(false);
      const [selectedTheme, setSelectedTheme] = useState('auto');
      const [payLoading, setPayLoading] = useState(false);
      
      // Spin State
      const [spinResult, setSpinResult] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);

      // UI States
      const [myCards, setMyCards] = useState([]);
      const [loadingCards, setLoadingCards] = useState(false);
      const [viewCard, setViewCard] = useState(null);
      const [cardImageUrl, setCardImageUrl] = useState(null);
      const [toast, setToast] = useState(null);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        fetch('/api/config').then(r => r.json()).then(d => setPaystackKey(d.publicKey || '')).catch(() => {});
      }, []);

      // ✅ Auth + email sync
      useEffect(() => {
        const unsub = auth.onAuthStateChanged(user => {
          if (!user) { window.location.href = '/login.html'; return; }
          setUid(user.uid);
          setUserEmail(user.email || 'user@lagoslife.com');
          if (user.email) {
            db.collection("users").doc(user.uid).update({ email: user.email, lastSeen: Date.now() }).catch(() => {});
          }
          try {
            const cached = JSON.parse(localStorage.getItem('lagos_user_data') || '{}');
            setUserName(cached.name || 'Hustler');
          } catch (e) {}
        });
        return () => unsub();
      }, []);

      const loadMyCards = async () => {
        if (!uid) return;
        setLoadingCards(true);
        try {
          let snap;
          try {
            snap = await db.collection('gift_cards')
              .where('buyerId', '==', uid)
              .orderBy('createdAt', 'desc')
              .limit(50).get();
          } catch (idxErr) {
            snap = await db.collection('gift_cards')
              .where('buyerId', '==', uid)
              .limit(50).get();
          }
          const arr = [];
          snap.forEach(d => arr.push(Object.assign({ id: d.id }, d.data())));
          arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setMyCards(arr);
        } catch (e) {
          console.error(e);
          notify('Could not load cards', 'bad');
        } finally { setLoadingCards(false); }
      };

      useEffect(() => { if (tab === 'cards' && uid) loadMyCards(); }, [tab, uid]);

      const filteredProducts = useMemo(() => {
        if (activeCat === 'all') return PRODUCTS;
        return PRODUCTS.filter(p => p.cat === activeCat);
      }, [activeCat]);

      const openProduct = (p) => {
        setSelectedProduct(p);
        setGiftAmount(Math.round((p.min + p.max) / 2 / 100) * 100);
        setCustomAmount('');
        setRecipientName('');
        setMessage('');
        setIsSecret(false);
        setSelectedTheme('auto');
        setSpinResult(null);
      };

      // 🎰 Spin Logic
      const handleSpin = () => {
        if (isSpinning || spinResult) return;
        setIsSpinning(true);
        
        // Possible discounts
        const outcomes = [
          { label: '0% Off', mult: 1 },
          { label: '5% Off', mult: 0.95 },
          { label: '10% Off', mult: 0.90 },
          { label: '15% Off', mult: 0.85 },
          { label: '20% Off', mult: 0.80 },
          { label: 'No Luck', mult: 1 }
        ];
        
        setTimeout(() => {
          // Randomly pick an outcome (weighted so 20% is rare)
          const rand = Math.random();
          let result;
          if (rand < 0.1) result = outcomes[4]; // 20% (10% chance)
          else if (rand < 0.3) result = outcomes[3]; // 15% (20% chance)
          else if (rand < 0.5) result = outcomes[2]; // 10% (20% chance)
          else if (rand < 0.7) result = outcomes[1]; // 5% (20% chance)
          else result = outcomes[5]; // No luck (30% chance)
          
          setSpinResult(result);
          setIsSpinning(false);
          
          if (result.mult < 1) {
            notify('🎉 You won ' + result.label + '!', 'good');
          } else {
            notify('😢 No luck this time.', 'bad');
          }
        }, 1500);
      };

      // Calculations
      const baseTotal = giftAmount;
      const discountMult = spinResult ? spinResult.mult : 1;
      const totalPay = Math.floor(baseTotal * discountMult);
      
      const feeAmount = Math.round(totalPay * FEE_RATE);
      const redeemValue = totalPay - feeAmount;

      const handlePaystack = () => {
        if (!paystackKey) return notify('Payment loading... try again', 'bad');
        if (!selectedProduct) return;
        if (giftAmount < MIN_AMOUNT) return notify('Minimum gift is ₦200', 'bad');
        if (giftAmount > MAX_AMOUNT) return notify('Maximum gift is ₦50,000', 'bad');

        setPayLoading(true);
        setPayLoading(true);
        const ref = 'LGS_GIFT_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
        const code = genCode();
        const card = {
          code,
          productId: selectedProduct.id,
          productName: selectedProduct.name,
          emoji: selectedProduct.emoji,
          cat: selectedProduct.cat,
          amountPaid: totalPay,
          feeAmount,
          redeemValue,
          buyerId: uid,
          buyerName: isSecret ? 'Secret Admirer 👻' : userName, // Secret Mode
          recipientName: recipientName.trim() || '',
          message: message.trim() || '',
          theme: selectedTheme, // Custom Theme
          status: 'active',
          createdAt: Date.now(),
          expiresAt: Date.now() + EXPIRY_DAYS * 86400000,
          paystackRef: ref
        };

        // Pre-cache card so any redirects can retrieve details
        try {
          sessionStorage.setItem('pending_gift_card', JSON.stringify(card));
          localStorage.setItem('pending_gift_card_' + ref, JSON.stringify(card));
        } catch (e) {}

        const handler = PaystackPop.setup({
          key: paystackKey,
          email: userEmail || `user_${uid}@lagoslife.com`,
          amount: totalPay * 100,
          currency: 'NGN',
          ref: ref,
          metadata: {
            type: 'gift_card',
            productId: selectedProduct.id,
            productName: selectedProduct.name,
            emoji: selectedProduct.emoji,
            cat: selectedProduct.cat,
            amountPaid: totalPay,
            feeAmount: feeAmount,
            redeemValue: redeemValue,
            buyerId: uid,
            buyerName: isSecret ? 'Secret Admirer 👻' : userName,
            recipientName: recipientName.trim() || '',
            message: message.trim() || '',
            theme: selectedTheme,
            giftCode: code,
            custom_fields: [
              { display_name: 'Product', variable_name: 'product', value: selectedProduct.name },
              { display_name: 'Recipient', variable_name: 'recipient', value: recipientName || 'N/A' },
              { display_name: 'Type', variable_name: 'type', value: 'gift_card' }
            ]
          },
          callback: (response) => {
            const finalRef = (response && (response.reference || response.trxref)) || ref;
            onPaymentSuccess(finalRef, card);
          },
          onClose: () => {
            setPayLoading(false);
            notify('Payment cancelled', 'bad');
          }
        });
        handler.openIframe();
      };

      // Guaranteed redirect to callback URL with storage cache and async background save
      const onPaymentSuccess = (finalRef, cardData) => {
        const updatedCard = Object.assign({}, cardData, { paystackRef: finalRef });

        // Save card to storage synchronously
        try {
          sessionStorage.setItem('pending_gift_card', JSON.stringify(updatedCard));
          localStorage.setItem('pending_gift_card_' + finalRef, JSON.stringify(updatedCard));
        } catch (e) {}

        // Non-blocking background save to Firestore
        try {
          db.collection('gift_cards').add(updatedCard).catch(err => {
            console.warn('Background card save warning:', err);
          });
        } catch (e) {}

        // Immediate redirect to callback URL
        setPayLoading(false);
        const callbackUrl = '/payment-success.html?reference=' + encodeURIComponent(finalRef) + '&type=gift';
        window.location.href = callbackUrl;
      };

      const downloadCard = () => {
        if (!cardImageUrl) return;
        const a = document.createElement('a');
        a.href = cardImageUrl;
        a.download = 'lagos-gift-' + (viewCard ? viewCard.code : Date.now()) + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        notify('Downloaded! 📥');
      };

      const shareCard = async () => {
        if (!viewCard) return;
        const text = '🎁 I got you a gift! ' + viewCard.emoji + ' ' + viewCard.productName + ' worth ' + fmtFull(viewCard.redeemValue) + '\n\n' +
          'Redeem code: ' + viewCard.code + '\n' +
          'Go to: https://lagoslifemini.online/redeem.html\n\n' +
          'From: ' + viewCard.buyerName;
        try {
          if (navigator.share) await navigator.share({ title: 'You have a gift! 🎁', text });
          else if (navigator.clipboard) { await navigator.clipboard.writeText(text); notify('Copied! 📋'); }
        } catch (e) {}
      };

      if (!uid) return h('div', { className: 'min-h-screen grid place-items-center text-white/50 font-sans' }, '⏳ Loading shop...');

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white font-sans selection:bg-pink-500 selection:text-white' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },

          // Header
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/95 backdrop-blur border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center gap-3' },
              h('button', {
                onClick: () => window.location.href = 'more.html',
                className: 'w-9 h-9 rounded-lg bg-white/[0.06] border border-white/10 grid place-items-center active:scale-90 transition'
              }, '←'),
              h('div', { className: 'flex-1 min-w-0' },
                h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-pink-400/80 leading-none font-display' }, 'Gift Shop'),
                h('div', { className: 'text-[13px] font-black truncate font-display mt-0.5' }, '🎁 Send love, earn smiles')
              ),
              h('div', { className: 'px-2 py-1 rounded-lg bg-pink-500/15 border border-pink-400/30 text-pink-300 text-[10px] font-extrabold' }, '20% fee')
            )
          ),

          // Tabs
          h('div', { className: 'px-4 py-3' },
            h('div', { className: 'flex gap-1 p-1 rounded-xl bg-white/[0.05] border border-white/10' },
              h('button', {
                onClick: () => setTab('shop'),
                className: 'flex-1 py-2 rounded-lg text-[11px] font-black transition ' + (tab === 'shop' ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg' : 'text-white/50')
              }, '🛍️ Shop'),
              h('button', {
                onClick: () => setTab('cards'),
                className: 'flex-1 py-2 rounded-lg text-[11px] font-black transition ' + (tab === 'cards' ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg' : 'text-white/50')
              }, '🎟️ My Cards')
            )
          ),

          // SHOP TAB
          tab === 'shop' && h('main', { className: 'flex-1 px-4 pb-4' },
            h('div', { className: 'rounded-2xl shop-hero border border-pink-400/30 p-4 relative overflow-hidden' },
              h('div', { className: 'absolute inset-0 shimmer-line pointer-events-none' }),
              h('div', { className: 'relative' },
                h('div', { className: 'text-2xl mb-1' }, '🎁'),
                h('div', { className: 'text-[15px] font-black font-display text-white' }, 'Buy a gift for someone special'),
                h('div', { className: 'text-[10.5px] text-white/60 mt-1 leading-relaxed' },
                  'Send shawarma, Apple cards, diamond rings & more. ',
                  h('span', { className: 'text-pink-300 font-bold' }, 'They redeem it for real cash.'),
                  ' We keep a 20% fee.'
                )
              )
            ),

            // Categories
            h('div', { className: 'mt-4 flex gap-1.5 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4' },
              CATS.map(c =>
                h('button', {
                  key: c.id,
                  onClick: () => setActiveCat(c.id),
                  className: 'cat-pill shrink-0 px-3 py-1.5 rounded-full text-[10px] font-black border whitespace-nowrap ' +
                    (activeCat === c.id ? 'active' : 'bg-white/[0.04] border-white/10 text-white/60')
                }, c.emoji + ' ' + c.name)
              )
            ),

            // Products
            h('div', { className: 'mt-3 grid grid-cols-2 gap-2.5' },
              filteredProducts.map(p => {
                const t = THEMES[p.cat];
                const isTrending = TRENDING_IDS.includes(p.id);
                return h('button', {
                  key: p.id,
                  onClick: () => openProduct(p),
                  className: 'prod-card rounded-2xl p-3 text-left border transition-all relative overflow-hidden card-gradient'
                },
                  isTrending && h('div', { className: 'trending-badge' }, '🔥 TRENDING'),
                  h('div', {
                    className: 'absolute -top-8 -right-8 w-20 h-20 rounded-full opacity-30 blur-2xl pointer-events-none',
                    style: { background: t.bg[0] }
                  }),
                  h('div', { className: 'relative mt-1' },
                    h('div', { className: 'text-3xl mb-1.5' }, p.emoji),
                    h('div', { className: 'text-[11.5px] font-black font-display leading-tight' }, p.name),
                    h('div', { className: 'text-[9px] text-white/45 mt-1 tabular-nums' }, fmtFull(p.min) + ' – ' + fmtFull(p.max))
                  )
                );
              })
            )
          ),

          // CARDS TAB
          tab === 'cards' && h('main', { className: 'flex-1 px-4 pb-4' },
            loadingCards ? h('div', { className: 'text-center py-20 text-white/40 text-[12px] animate-pulse' }, 'Loading your cards...') :
            myCards.length === 0 ? h('div', { className: 'text-center py-20' },
              h('div', { className: 'text-6xl mb-3 animate-giftFloat' }, '🎁'),
              h('div', { className: 'text-[13px] font-black font-display text-white/70' }, 'No gift cards yet'),
              h('div', { className: 'text-[11px] text-white/40 mt-1' }, 'Buy your first gift to see it here'),
              h('button', {
                onClick: () => setTab('shop'),
                className: 'mt-4 px-5 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black text-[11px] active:scale-95 shadow-lg'
              }, '🛍️ Go to Shop')
            ) : h('div', { className: 'space-y-2.5' },
              myCards.map(card => {
                const statusColor = card.status === 'active' ? '#22C55E' : card.status === 'redeemed' ? '#FFD60A' : '#EF4444';
                const statusLabel = card.status === 'active' ? 'ACTIVE' : card.status === 'redeemed' ? 'REDEEMED' : 'EXPIRED';
                return h('div', { key: card.id, className: 'card-gradient rounded-2xl p-3' },
                  h('div', { className: 'flex items-center gap-2.5' },
                    h('div', { className: 'text-3xl' }, card.emoji),
                    h('div', { className: 'flex-1 min-w-0' },
                      h('div', { className: 'flex items-center gap-1.5 flex-wrap' },
                        h('div', { className: 'text-[12px] font-black font-display truncate' }, card.productName),
                        h('span', { className: 'text-[8px] font-black px-1.5 py-0.5 rounded', style: { background: statusColor + '25', color: statusColor } }, statusLabel)
                      ),
                      h('div', { className: 'text-[10px] text-white/50 mt-0.5' }, fmtFull(card.redeemValue), card.recipientName && (' · For ' + card.recipientName)),
                      h('div', { className: 'text-[9px] font-mono text-pink-300 mt-1' }, card.code)
                    )
                  ),
                  h('div', { className: 'mt-2 flex gap-1.5' },
                    h('button', {
                      onClick: () => { setViewCard(card); setCardImageUrl(null); },
                      className: 'flex-1 py-1.5 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-black text-white/80 active:scale-95'
                    }, '📋 Copy Code')
                  )
                );
              })
            )
          ),

          // PURCHASE MODAL
          selectedProduct && h('div', { className: 'fixed inset-0 z-[100] grid place-items-end sm:place-items-center p-0 sm:p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => !payLoading && setSelectedProduct(null) }),
            h('div', { className: 'relative w-full max-w-md bg-[#121218] border-t sm:border border-pink-400/30 rounded-t-3xl sm:rounded-3xl p-5 animate-slideUp max-h-[90vh] overflow-y-auto no-scrollbar' },
              h('div', { className: 'w-12 h-1 bg-white/20 rounded-full mx-auto mb-4 sm:hidden' }),
              
              h('div', { className: 'text-center mb-4' },
                h('div', { className: 'text-6xl mb-2 animate-giftFloat' }, selectedProduct.emoji),
                h('div', { className: 'text-[16px] font-black font-display' }, selectedProduct.name),
                h('div', { className: 'text-[10px] text-white/50 mt-0.5' }, 'Range: ' + fmtFull(selectedProduct.min) + ' – ' + fmtFull(selectedProduct.max))
              ),

              // 🎰 SPIN FOR DISCOUNT
              !spinResult && h('div', { className: 'mb-4 p-3 rounded-xl bg-gradient-to-r from-purple-500/20 to-pink-500/20 border border-pink-500/30 text-center relative overflow-hidden' },
                h('div', { className: 'text-[11px] font-black text-white mb-2' }, '🎰 Spin to win a discount!'),
                h('button', {
                  onClick: handleSpin,
                  disabled: isSpinning,
                  className: 'w-full py-2.5 rounded-lg bg-white/10 border border-white/20 text-[12px] font-black active:scale-95 disabled:opacity-50 transition flex justify-center items-center gap-2'
                },
                  h('span', { className: isSpinning ? 'animate-spin inline-block' : '' }, '🎡'),
                  isSpinning ? 'Spinning...' : 'SPIN NOW'
                )
              ),
              spinResult && h('div', { className: 'mb-4 p-3 rounded-xl bg-green-500/15 border border-green-500/30 text-center' },
                h('div', { className: 'text-[12px] font-black text-green-400' }, '🎉 Discount Applied: ' + spinResult.label)
              ),

              // Amount Selection
              h('div', { className: 'mb-3' },
                h('div', { className: 'flex justify-between items-end mb-1.5' },
                  h('div', { className: 'text-[10px] uppercase tracking-widest font-extrabold text-white/40' }, 'Gift Value'),
                  spinResult && spinResult.mult < 1 && h('div', { className: 'text-[10px] line-through text-white/40' }, fmtFull(giftAmount))
                ),
                h('div', { className: 'grid grid-cols-4 gap-1.5' },
                  getPresets(selectedProduct.min, selectedProduct.max).map(p =>
                    h('button', {
                      key: p,
                      onClick: () => { setGiftAmount(p); setCustomAmount(''); },
                      className: 'py-2 rounded-lg text-[10.5px] font-black tabular-nums transition ' +
                        (giftAmount === p && !customAmount
                          ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg'
                          : 'bg-white/[0.05] border border-white/10 text-white/70')
                    }, fmt(p))
                  )
                ),
                h('div', { className: 'mt-1.5 flex items-center bg-white/[0.05] border border-white/10 rounded-lg px-2' },
                  h('span', { className: 'text-[12px] font-black text-white/50' }, '₦'),
                  h('input', {
                    type: 'number',
                    placeholder: 'Custom amount (₦200 – ₦50,000)',
                    value: customAmount,
                    onChange: (e) => {
                      const raw = e.target.value;
                      const v = Math.floor(Number(raw));
                      setCustomAmount(raw);
                      if (v >= MIN_AMOUNT && v <= MAX_AMOUNT) setGiftAmount(v);
                    },
                    className: 'w-full bg-transparent py-2 text-[12px] font-black text-white placeholder-white/30 ml-1 tabular-nums'
                  })
                )
              ),

              // 🎨 THEME PICKER
              h('div', { className: 'mb-3' },
                h('div', { className: 'text-[10px] uppercase tracking-widest font-extrabold text-white/40 mb-1.5' }, 'Card Design'),
                h('div', { className: 'flex gap-2 overflow-x-auto no-scrollbar pb-1' },
                  ['auto', 'luxury', 'tech', 'food', 'fashion'].map(t => {
                    const isSelected = selectedTheme === t;
                    const bg = t === 'auto' ? 'bg-gradient-to-r from-gray-600 to-gray-800' : 
                               t === 'luxury' ? 'bg-gradient-to-r from-yellow-600 to-yellow-900' :
                               t === 'tech' ? 'bg-gradient-to-r from-blue-600 to-purple-900' :
                               t === 'food' ? 'bg-gradient-to-r from-orange-500 to-red-700' :
                               'bg-gradient-to-r from-pink-500 to-purple-800';
                    return h('button', {
                      key: t,
                      onClick: () => setSelectedTheme(t),
                      className: 'shrink-0 w-12 h-12 rounded-lg border-2 transition ' + bg + ' ' + (isSelected ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-60')
                    }, h('div', { className: 'text-[8px] font-black uppercase text-white shadow-sm' }, t));
                  })
                )
              ),

              // 👻 SECRET SANTA TOGGLE
              h('div', { className: 'mb-3 flex items-center justify-between px-3 py-2.5 bg-white/[0.03] border border-white/[0.06] rounded-xl' },
                h('div', { className: 'flex items-center gap-2' },
                  h('span', { className: 'text-lg' }, '👻'),
                  h('div', null,
                    h('div', { className: 'text-[11px] font-black' }, 'Secret Santa Mode'),
                    h('div', { className: 'text-[9px] text-white/40' }, 'Hide your name on the card')
                  )
                ),
                h('button', {
                  onClick: () => setIsSecret(!isSecret),
                  className: 'w-11 h-6 rounded-full transition relative ' + (isSecret ? 'bg-[#22C55E]' : 'bg-white/15')
                }, h('div', { className: 'absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all', style: { left: isSecret ? '22px' : '2px' } }))
              ),

              // Recipient Details
              h('div', { className: 'mb-3' },
                h('div', { className: 'text-[10px] uppercase tracking-widest font-extrabold text-white/40 mb-1.5' }, 'Recipient name (optional)'),
                h('input', {
                  value: recipientName, onChange: (e) => setRecipientName(e.target.value.slice(0, 24)),
                  placeholder: 'e.g. Tunde, My Love, Mom',
                  className: 'w-full bg-white/[0.05] border border-white/10 rounded-lg px-3 py-2 text-[12px] font-bold text-white placeholder-white/30'
                })
              ),
              h('div', { className: 'mb-3' },
                h('div', { className: 'text-[10px] uppercase tracking-widest font-extrabold text-white/40 mb-1.5' }, 'Message (optional)'),
                h('input', {
                  value: message, onChange: (e) => setMessage(e.target.value.slice(0, 60)),
                  placeholder: 'e.g. Enjoy your shawarma! 😋',
                  className: 'w-full bg-white/[0.05] border border-white/10 rounded-lg px-3 py-2 text-[12px] font-bold text-white placeholder-white/30'
                })
              ),

              // Breakdown
              h('div', { className: 'rounded-xl bg-white/[0.03] border border-white/[0.08] p-3 mb-3' },
                h('div', { className: 'flex justify-between items-center py-1' },
                  h('span', { className: 'text-[11px] text-white/60' }, 'You pay'),
                  h('span', { className: 'text-[13px] font-black tabular-nums' }, fmtFull(totalPay))
                ),
                h('div', { className: 'flex justify-between items-center py-1' },
                  h('span', { className: 'text-[11px] text-white/60' }, 'Our fee (20%)'),
                  h('span', { className: 'text-[11px] font-black tabular-nums text-red-400' }, '−' + fmtFull(feeAmount))
                ),
                h('div', { className: 'flex justify-between items-center py-1 border-t border-white/[0.08] mt-1 pt-2' },
                  h('span', { className: 'text-[11px] font-black text-pink-300' }, 'They receive'),
                  h('span', { className: 'text-[14px] font-black tabular-nums text-pink-300' }, fmtFull(redeemValue))
                )
              ),

              h('button', {
                onClick: handlePaystack,
                disabled: payLoading || !paystackKey || giftAmount < MIN_AMOUNT || giftAmount > MAX_AMOUNT,
                className: 'w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black text-[13px] font-display shadow-[0_8px_24px_-8px_rgba(236,72,153,0.7)] active:scale-[0.97] disabled:opacity-50 disabled:shadow-none transition'
              }, payLoading ? '⏳ Processing...' : '💳 Pay ' + fmtFull(totalPay)),

              h('button', {
                onClick: () => setSelectedProduct(null), disabled: payLoading,
                className: 'mt-2 w-full py-2 text-[11px] font-bold text-white/40'
              }, 'Cancel')
            )
          ),

          // Toast
          toast && h('div', {
            className: 'fixed top-20 left-1/2 -translate-x-1/2 z-[150] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl animate-slideDown font-display whitespace-nowrap max-w-[90vw] truncate ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-red-500 to-red-600 text-white' : 'bg-gradient-to-b from-pink-400 to-purple-500 text-white')
          }, toast.msg)
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
