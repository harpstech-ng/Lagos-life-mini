    tailwind.config = {

  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; overscroll-behavior-y: none; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,214,10,0.08), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,184,0,0.05), transparent); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .text-gradient-gold { background: linear-gradient(135deg, #FFE566 0%, #FFD60A 40%, #FFB800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    .card-gold { background: linear-gradient(135deg, rgba(255,214,10,0.12) 0%, rgba(255,184,0,0.04) 100%); border: 1px solid rgba(255,214,10,0.25); box-shadow: 0 8px 30px -10px rgba(255,214,10,0.3); }
    .glow-dot { box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
    .animate-slideUp { animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1); }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .nav-active-pill { background: linear-gradient(180deg, rgba(255,214,10,0.2) 0%, rgba(255,214,10,0.05) 100%); border: 1px solid rgba(255,214,10,0.35); box-shadow: 0 0 25px rgba(255,214,10,0.25); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-backdrop { background: linear-gradient(to top, #08080B 70%, rgba(8,8,11,0.85) 90%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .action-pulse { animation: pulse 1.2s ease-in-out infinite; }

    .music-toggle { position: fixed; top: 70px; right: 12px; z-index: 40; }

<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const ENERGY_MS = 5 * 60 * 1000;

    const BIZ_PRICES = { water: 10_000, suya: 250_000, keke: 500_000, phone: 2_000_000, danfo: 5_000_000, wash: 25_000_000, bet9ja: 50_000_000, lounge: 500_000_000, oil: 5_000_000_000 };
    const ASSET_PRICES = { chain: 5_000_000, rolex: 50_000_000, tesla: 500_000_000, gwag: 5_000_000_000, yacht: 20_000_000_000, jet: 100_000_000_000, mansion: 1_000_000_000_000 };

    const STREET_ACTIONS = [
      { id: 'rob', label: 'Rob a Stranger', emoji: '🥷', cd: 45, desc: 'High risk, high reward. Might get caught.', color: 'from-red-500/25 to-red-700/10', heat: 25 },
      { id: 'snatch', label: 'Snatch Phone', emoji: '📱', cd: 60, desc: 'Ole! Run sharp sharp.', color: 'from-red-600/25 to-red-800/10', heat: 30 },
      { id: 'agbero', label: 'Agbero Tax', emoji: '💵', cd: 30, desc: 'Collect money at the bus stop.', color: 'from-emerald-500/25 to-emerald-700/10', heat: 10 },
      { id: 'beg', label: 'Beg for Money', emoji: '🙏', cd: 20, desc: 'Low risk, small change.', color: 'from-amber-400/25 to-amber-700/10', heat: 0 },
      { id: 'spray', label: 'Spray at Owambe', emoji: '💸', cd: 90, desc: 'Show off your money. Gain massive clout.', color: 'from-fuchsia-500/25 to-fuchsia-700/10', heat: -10 },
      { id: 'chop', label: 'Chop Life', emoji: '🍲', cd: 120, desc: 'Buy food and recharge energy.', color: 'from-blue-500/25 to-blue-700/10', heat: -5 },
    ];

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) {
          const parsed = JSON.parse(cached);
          return Object.assign({}, parsed, { heat: parsed.heat || 0 });
        }
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: [], heat: 0
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const mmss = (ms) => {
      const t = Math.max(0, Math.ceil(ms / 1000));
      return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    };

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        siren: () => { init(); tone(800, 0.4, "sawtooth", 0, 0.4); tone(600, 0.4, "sawtooth", 0.4, 0.4); }
      };
    })();

    const Card = ({ children, className = '', gold = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [log, setLog] = useState([]);
      const [now, setNow] = useState(Date.now());
      const [outcome, setOutcome] = useState(null);
      const [raidModal, setRaidModal] = useState(false);

      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  street: dbData.street || prev.street || {},
                  heat: dbData.heat || prev.heat || 0,
                  transactions: dbData.transactions || [],
                  history: dbData.history || []
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: [], history: [], heat: 0
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => { authUnsub(); if (userUnsub) userUnsub(); };
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      // ✅ LOG HISTORY HELPER
      const logHistory = async (title, desc, amount) => {
        if (!uid) return;
        await db.collection("users").doc(uid).update({
          history: firebase.firestore.FieldValue.arrayUnion({
            title: title,
            desc: desc,
            amount: amount,
            date: Date.now(),
            category: 'activity'
          })
        }).catch(() => {});
      };

      // Energy regen only (cash handled by business.html vault)
      useEffect(() => {
        if (!uid) return;
        const iv = setInterval(() => {
          setNow(Date.now());
          setS(prev => {
            if (!prev || prev.energy >= MAX_E) return prev;
            const nowT = Date.now();
            const gained = Math.floor((nowT - prev.lastEnergy) / ENERGY_MS);
            if (gained <= 0) return prev;
            
            const energy = Math.min(MAX_E, prev.energy + gained);
            const lastEnergy = energy >= MAX_E ? nowT : prev.lastEnergy + gained * ENERGY_MS;
            
            db.collection("users").doc(uid).update({ energy, lastEnergy }).catch(() => {});
            return Object.assign({}, prev, { energy, lastEnergy });
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [uid]);

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' }, h('div', { className: 'text-4xl' }, '⚠️'), h('div', { className: 'font-bold' }, 'Auth Error'), h('div', { className: 'text-sm' }, authError));

      const safeBiz = s.businesses || {};
      const safeAssets = s.assets || {};
      const safeStreet = s.street || {};

      const bizValue = Object.entries(safeBiz).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);
      const assetValue = Object.entries(safeAssets).reduce((a, kv) => a + kv[1] * (ASSET_PRICES[kv[0]] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);

      const doAction = async (action) => {
        const last = safeStreet[action.id] || 0;
        if (Date.now() - last < action.cd * 1000) return;

        let msg = '';
        let delta = {};
        let logKind = 'good';
        let title = '';

        if (action.id === 'rob') {
          const roll = Math.random();
          if (roll < 0.3) {
            const g = 50_000 + Math.floor(Math.random() * 450_000);
            delta = { cash: g };
            msg = 'You robbed a guy, but he was broke. You got ' + fmt(g) + ' and a pack of Indomie. 🍜';
            title = "E CHOKE!";
          } else if (roll < 0.45) {
            const g = 250_000 + Math.floor(Math.random() * 1_000_000);
            delta = { cash: g };
            msg = 'You robbed a politician\'s PA. You found ' + fmt(g) + ' in his briefcase! 🤑';
            title = "BIG BOY!";
          } else if (roll < 0.8) {
            delta = { energy: -25 };
            msg = "You tried to rob a bouncer. He slapped you into next week. -25 Energy 😵‍💫";
            logKind = 'bad';
            title = "WAHALA!";
          } else {
            delta = { energy: -50 };
            msg = "You got caught. The mob beat you and collected your phone. -50 Energy 📱";
            logKind = 'bad';
            title = "E DON CAST!";
          }
        } else if (action.id === 'snatch') {
          const roll = Math.random();
          if (roll < 0.5) {
            const g = 200_000 + Math.floor(Math.random() * 300_000);
            delta = { cash: g };
            msg = 'You snatched an iPhone 15. Sold it at Computer Village for ' + fmt(g) + '. 🏃🏾‍♂️';
            title = "OLE!";
          } else {
            delta = { energy: -30 };
            msg = "The owner was a soldier. He caught you and beat you blue and black. -30 Energy 🥊";
            logKind = 'bad';
            title = "SOLDIER WAHALA";
          }
        } else if (action.id === 'agbero') {
          const roll = Math.random();
          if (roll < 0.4) {
            const g = 150_000 + Math.floor(Math.random() * 350_000);
            delta = { cash: g };
            msg = 'You collected tax from a Bet9ja shop. The owner paid you ' + fmt(g) + ' to leave. 🎰';
            title = "TAX COLLECTOR";
          } else if (roll < 0.6) {
            const g = 500_000 + Math.floor(Math.random() * 1_500_000);
            delta = { cash: g };
            msg = 'You taxed a Danfo driver. He gave you ' + fmt(g) + '. You are now a kingpin. 👑';
            title = "KINGPIN!";
          } else if (roll < 0.85) {
            delta = { energy: -20 };
            msg = "You tried to tax a shop. The owner released a dog on you. -20 Energy 🐕";
            logKind = 'bad';
            title = "RUN!";
          } else {
            delta = { energy: -40 };
            msg = "You taxed the wrong guy. He was a cultist. You ran for your life. -40 Energy 🏃🏾‍♂️";
            logKind = 'bad';
            title = "CULTIST!";
          }
        } else if (action.id === 'beg') {
          const roll = Math.random();
          if (roll < 0.4) {
            const g = 2_000 + Math.floor(Math.random() * 5_000);
            delta = { cash: g };
            msg = 'An old woman gave you ' + fmt(g) + ' and told you to go and learn a skill. 🧓🏾';
            title = "SMALL WIN";
          } else if (roll < 0.6) {
            const g = 50_000 + Math.floor(Math.random() * 100_000);
            delta = { cash: g };
            msg = 'A rich man in a G-Wagon threw ' + fmt(g) + ' at you. "Go and make something of yourself!" 💰';
            title = "GRACE FOUND YOU!";
          } else if (roll < 0.9) {
            msg = "You begged a guy, and he told you to 'use your hands'. -0 Cash. 😑";
            title = "EMPTY HANDED";
          } else {
            delta = { energy: -15 };
            msg = "You begged a dog. The dog chased you. -15 Energy 🐕";
            logKind = 'bad';
            title = "DOG WAHALA";
          }
        } else if (action.id === 'spray') {
          if (s.cash < 100_000) { AudioEngine.error(); return notify('Need ₦100,000 to spray', 'bad'); }
          
          const roll = Math.random();
          if (roll < 0.7) {
            delta = { cash: -100_000, clout: 40 };
            msg = "You sprayed ₦100,000. The MC announced your name. Everyone screamed 'God when!' +40 Clout. 🎉";
            title = "OWAMBE LEGEND";
          } else if (roll < 0.9) {
            delta = { cash: -100_000, clout: 10, energy: -20 };
            msg = "You sprayed money, but the agbada you wore was fake. People laughed at you. +10 Clout, -20 Energy 😅";
            logKind = 'bad';
            title = "FAKE LIFE";
          } else {
            delta = { cash: -100_000, clout: 100 };
            msg = "You sprayed the bride's mother. She started crying and blessed you. +100 Clout. 👑";
            title = "BLESSINGS";
          }
        } else if (action.id === 'chop') {
          if (s.cash < 50000) { AudioEngine.error(); return notify('Need ₦50,000 to chop life', 'bad'); }
          delta = { cash: -50000, energy: 50 };
          msg = "You entered Amala joint and ate like a king. +50 Energy 🍲";
          title = "CHOP LIFE";
        }

        if (logKind === 'bad') AudioEngine.error(); else AudioEngine.coin();

        const newHeat = Math.max(0, Math.min(100, (s.heat || 0) + (action.heat || 0)));

        setOutcome({ title, msg, delta, isBad: logKind === 'bad' });
        setS((p) => (Object.assign({}, p, {
          cash: Math.max(0, (p.cash || 0) + (delta.cash || 0)),
          energy: Math.max(0, Math.min(MAX_E, (p.energy || 0) + (delta.energy || 0))),
          clout: (p.clout || 0) + (delta.clout || 0),
          heat: newHeat,
          street: Object.assign({}, p.street, { [action.id]: Date.now() })
        })));
        
        setLog((l) => [{ id: Date.now(), msg, kind: logKind }, ...l].slice(0, 10));
        
        try { if (navigator.vibrate) navigator.vibrate(logKind === 'bad' ? [40, 40, 40] : 20); } catch(e) {}

        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(delta.cash || 0),
            energy: firebase.firestore.FieldValue.increment(delta.energy || 0),
            clout: firebase.firestore.FieldValue.increment(delta.clout || 0),
            heat: newHeat,
            ['street.' + action.id]: Date.now(),
            lastSeen: Date.now()
          }).catch(() => {});
          
          // ✅ Log the action to History
          logHistory(action.label, title + ': ' + msg, delta.cash || 0);
        }

        if (newHeat >= 100) {
          setTimeout(() => { setRaidModal(true); AudioEngine.siren(); }, 1000);
        }
      };

      const resolveRaid = async () => {
        const bailAmount = Math.floor((s.cash || 0) * 0.5);
        setS(p => (Object.assign({}, p, { cash: p.cash - bailAmount, heat: 0 })));
        setRaidModal(false);
        notify('Police took ' + fmt(bailAmount) + ' as bail! 😭', 'bad');
        
        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(-bailAmount),
            heat: 0
          }).catch(() => {});
          
          logHistory('Police Raid', 'Paid bail money to Police', -bailAmount);
        }
      };

      let streetTitle = "Omo Street";
      if ((s.clout || 0) > 1000) streetTitle = "Area Boy";
      if ((s.clout || 0) > 5000) streetTitle = "Odogwu";
      if ((s.clout || 0) > 10000) streetTitle = "King of Boys 👑";

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Street · ' + streetTitle),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex flex-col items-end shrink-0' },
                h('div', { className: 'text-[8px] text-white/40 font-bold uppercase' }, 'Police Radar'),
                h('div', { className: 'w-16 h-2 rounded-full bg-white/10 overflow-hidden mt-1' },
                  h('div', { className: 'h-full bg-gradient-to-r from-yellow-400 to-red-600 rounded-full transition-all', style: { width: String(Math.min(100, (s.heat || 0))) + '%' } })
                ),
                h('div', { className: 'text-[9px] text-red-400 font-black mt-0.5' }, String(s.heat || 0) + '%')
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            h(Card, { className: 'p-4 mt-3', gold: true },
              h('div', { className: 'flex items-center justify-between' },
                h('div', null,
                  h('div', { className: 'text-[9px] uppercase tracking-widest text-white/40 font-bold' }, 'Street Clout'),
                  h('div', { className: 'text-3xl font-black text-gradient-gold tabular-nums font-display mt-1' }, (s.clout || 0).toLocaleString())
                ),
                h('div', { className: 'text-3xl' }, '🔥')
              ),
              h('div', { className: 'mt-2 text-[10px] text-white/45' }, 'The more clout, the more respect for street. Spray at owambe to build clout.')
            ),

            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, '6 moves') }, 'Street Moves'),

            h('div', { className: 'grid grid-cols-2 gap-2.5' },
              STREET_ACTIONS.map((a) => {
                const last = safeStreet[a.id] || 0;
                const left = a.cd * 1000 - (now - last);
                const onCd = left > 0;
                const canAfford = (a.id !== 'spray' && a.id !== 'chop') || s.cash >= (a.id === 'spray' ? 100000 : 50000);
                const disabled = onCd || !canAfford;
                return h(Card, { key: a.id, className: 'relative overflow-hidden p-3 flex flex-col' },
                  h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + a.color + ' pointer-events-none opacity-70' }),
                  h('div', { className: 'relative' },
                    h('div', { className: 'text-4xl text-center' }, a.emoji),
                    h('div', { className: 'text-[12px] font-extrabold mt-2 text-center leading-tight font-display' }, a.label),
                    h('div', { className: 'text-[9px] text-white/45 text-center leading-tight mt-1 mb-2' }, a.desc),
                    h('button', {
                      onClick: () => doAction(a),
                      disabled: disabled,
                      className: 'relative w-full rounded-lg text-[11px] font-black py-2 active:scale-95 transition-all tabular-nums ' +
                        (!disabled
                          ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.6)] ' + (onCd ? '' : 'action-pulse')
                          : onCd
                            ? 'bg-white/[0.06] text-white/40 border border-white/[0.06]'
                            : 'bg-white/[0.04] text-white/25 border border-white/[0.06]')
                    }, onCd ? '⏳ ' + mmss(left) : canAfford ? 'GO' : 'NO CASH')
                  )
                );
              })
            ),

            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, 'Last 10') }, 'Street Log'),
            h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
              log.length === 0 ? h('div', { className: 'px-3 py-8 text-center text-[11px] text-white/30' }, 'No moves yet. Hit a button and make your story.') :
              log.map((l) => h('div', { key: l.id, className: 'px-3.5 py-2.5 flex items-start gap-2 text-[11px] animate-slideDown' },
                h('span', { className: 'mt-1 w-1.5 h-1.5 rounded-full shrink-0 ' + (l.kind === 'bad' ? 'bg-[#EF4444]' : 'bg-[#22C55E]') }),
                h('span', { className: l.kind === 'bad' ? 'text-[#EF4444]/90' : 'text-white/65' }, l.msg)
              ))
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '🥷'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' }, 'Street na dog eat dog. Rob and Snatch na high reward high risk. Beg na guaranteed small change. Every move get cooldown — plan am well. Watch your Police Radar! 💪')
              )
            )
          ),

          outcome && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/85 backdrop-blur-sm', onClick: () => setOutcome(null) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-[0_0_60px_-10px_rgba(255,214,10,0.4)] animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-2 ' + (outcome.isBad ? 'animate-bounce' : 'animate-pulse') }, outcome.isBad ? '😭' : '🤑'),
              h('div', { className: 'text-[14px] font-black tracking-widest font-display mb-2 ' + (outcome.isBad ? 'text-[#EF4444]' : 'text-[#22C55E]') }, outcome.title),
              h('p', { className: 'text-[13px] text-white/80 leading-relaxed mb-4' }, outcome.msg),
              h('div', { className: 'flex justify-center gap-3 mb-5' },
                outcome.delta.cash !== undefined && h('div', { className: 'px-3 py-1.5 rounded-lg text-[12px] font-black tabular-nums border ' + (outcome.delta.cash > 0 ? 'bg-[#22C55E]/10 text-[#22C55E] border-[#22C55E]/30' : 'bg-[#EF4444]/10 text-[#EF4444] border-[#EF4444]/30') }, (outcome.delta.cash > 0 ? '+' : '') + fmt(outcome.delta.cash)),
                outcome.delta.energy !== undefined && h('div', { className: 'px-3 py-1.5 rounded-lg text-[12px] font-black tabular-nums border ' + (outcome.delta.energy > 0 ? 'bg-[#FFD60A]/10 text-[#FFD60A] border-[#FFD60A]/30' : 'bg-[#EF4444]/10 text-[#EF4444] border-[#EF4444]/30') }, (outcome.delta.energy > 0 ? '+' : '') + outcome.delta.energy + ' ⚡'),
                outcome.delta.clout !== undefined && h('div', { className: 'px-3 py-1.5 rounded-lg text-[12px] font-black tabular-nums border ' + (outcome.delta.clout > 0 ? 'bg-[#FFD60A]/10 text-[#FFD60A] border-[#FFD60A]/30' : 'bg-[#EF4444]/10 text-[#EF4444] border-[#EF4444]/30') }, (outcome.delta.clout > 0 ? '+' : '') + outcome.delta.clout + ' 🔥')
              ),
              h('button', { onClick: () => setOutcome(null), className: 'w-full rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/80 active:scale-95 transition' }, 'Collect / Dismiss')
            )
          ),

          raidModal && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-red-900/90 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/50 rounded-3xl p-5 shadow-2xl animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2 animate-bounce' }, '🚔'),
              h('div', { className: 'text-[15px] font-black text-red-500 font-display' }, 'POLICE RAID!'),
              h('p', { className: 'text-[12px] text-white/80 mt-2 mb-4' }, 'Your heat was too high! The Police traced you and arrested you. You have to pay 50% of your cash as bail.'),
              h('button', { onClick: resolveRaid, className: 'w-full py-3 rounded-xl bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-[13px] active:scale-95 transition' }, 'Pay Bail & Leave')
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
