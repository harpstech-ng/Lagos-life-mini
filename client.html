        if (!ctx) return; const start = ctx.currentTime + w;

              inbox.length === 0 
                ? h(Card, { className: 'p-8 text-center' },
                    h('div', { className: 'text-3xl mb-2 animate-pulse' }, '📱'),
                    h('div', { className: 'text-[11px] font-bold text-white/40' }, 'No new messages...'),
                    h('div', { className: 'text-[9px] text-white/30 mt-1' }, 'Clients will ping you shortly.'),
                    h('button', { onClick: spawnClient, className: 'mt-4 px-4 py-2 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-bold text-white/70 active:scale-95 transition' }, 'Force a Ping')
                  )
                : h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
                    inbox.map((c) => 
                      h('div', { key: c.id, onClick: () => openChat(c), className: 'p-3 flex items-center gap-3 cursor-pointer hover:bg-white/[0.02] transition' },
                        h('div', { className: 'w-10 h-10 rounded-full bg-white/[0.1] grid place-items-center text-lg shrink-0' }, c.avatar),
                        h('div', { className: 'flex-1 min-w-0' },
                          h('div', { className: 'flex justify-between items-baseline' },
                            h('div', { className: 'text-[13px] font-extrabold truncate font-display text-white' }, c.name),
                            h('div', { className: 'text-[9px] text-green-400' }, 'NEW')
                          ),
                          h('div', { className: 'text-[10px] text-white/40 truncate' }, c.initialMsg)
                        )
                      )
                    )
                  )
            ),

            // --- CHAT UI ---
            gameState !== 'idle' && activeChat && h('div', { className: 'mt-3 flex flex-col h-[calc(100vh-180px)]' },
              // Chat Header
              h('div', { className: 'flex items-center gap-2 mb-2 p-2 bg-white/[0.04] rounded-xl border border-white/[0.08]' },
                h('button', { onClick: closeChat, className: 'text-white/50 text-lg px-2' }, '←'),
                h('div', { className: 'w-8 h-8 rounded-full bg-white/[0.1] grid place-items-center text-sm' }, activeChat.avatar),
                h('div', null,
                  h('div', { className: 'text-[12px] font-extrabold font-display' }, activeChat.name),
                  h('div', { className: 'text-[9px] text-green-400' }, activeChat.country)
                )
              ),

              // Chat Messages
              h('div', { className: 'flex-1 overflow-y-auto space-y-3 p-2 bg-[#0A0A0F] rounded-xl border border-white/[0.05]' },
                chatHistory.map((msg, i) => 
                  h('div', { key: i, className: 'flex ' + (msg.sender === 'me' ? 'justify-end' : 'justify-start') },
                    h('div', { className: 'max-w-[80%] px-3 py-2 text-[12px] leading-relaxed ' +
                      (msg.sender === 'me' 
                        ? 'bg-green-600 text-white chat-bubble-right' 
                        : msg.isResult 
                          ? (msg.resultType === 'win' ? 'bg-green-500/20 text-green-300 border border-green-500/30 chat-bubble-left' : msg.resultType === 'scam' ? 'bg-red-500/20 text-red-300 border border-red-500/30 chat-bubble-left' : 'bg-white/[0.1] text-white/70 chat-bubble-left')
                          : 'bg-white/[0.1] text-white chat-bubble-left')
                    },
                      msg.isResult && h('div', { className: 'text-[14px] mb-1' }, msg.resultType === 'win' ? '🤑' : msg.resultType === 'scam' ? '😭' : '😐'),
                      msg.text,
                      msg.isResult && msg.amount !== 0 && h('div', { className: 'text-[13px] font-black tabular-nums mt-1 ' + (msg.amount > 0 ? 'text-green-400' : 'text-red-400') }, (msg.amount > 0 ? '+' : '') + fmt(msg.amount))
                    )
                  )
                ),
                isTyping && h('div', { className: 'flex justify-start' },
                  h('div', { className: 'bg-white/[0.1] px-4 py-3 rounded-2xl rounded-tl-sm flex gap-1' },
                    h('span', { className: 'typing-dot w-1.5 h-1.5 bg-white/50 rounded-full' }),
                    h('span', { className: 'typing-dot w-1.5 h-1.5 bg-white/50 rounded-full' }),
                    h('span', { className: 'typing-dot w-1.5 h-1.5 bg-white/50 rounded-full' })
                  )
                ),
                h('div', { ref: chatEndRef })
              ),

              // Options
              h('div', { className: 'mt-2 space-y-2' },
                gameState === 'chatting' && activeChat.options.map((opt, i) => 
                  h('button', { 
                    key: i, 
                    onClick: () => handleOption(opt),
                    disabled: isTyping,
                    className: 'w-full py-3 px-4 rounded-xl bg-white/[0.06] border border-white/10 text-[12px] font-bold text-left active:scale-[0.98] transition disabled:opacity-50 hover:bg-white/[0.1]' 
                  }, opt.label)
                ),
                gameState === 'result' && h('button', { onClick: closeChat, className: 'w-full py-3 rounded-xl bg-gradient-to-b from-green-400 to-green-600 text-black font-black text-[13px] shadow-[0_8px_24px_-8px_rgba(34,197,94,0.7)] active:scale-95 transition' }, 'Close Chat')
              )
            ),

            // LIVE FEED
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-green-400 flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse glow-dot' }), 'LIVE') }, 'Scam Feed'),
            h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden min-h-[100px]' },
              feed.length === 0 ? h('div', { className: 'px-4 py-6 text-center text-[11px] text-white/30' }, 'No scam activity yet.') :
              feed.map(f => h('div', { key: f.id, className: 'px-4 py-3 text-[11px] text-white/70 animate-slideDown' }, f.msg))
            )
          ),

          // Navigation
          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  onClick: (e) => { if (n.id === 'more') { e.preventDefault(); const el = document.getElementById('more-sheet'); if (el) el.classList.remove('hidden'); } },
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-green-400 nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),
          h('div', { id: 'more-sheet', className: 'hidden fixed inset-0 z-50 flex items-end justify-center' },
            h('div', { className: 'absolute inset-0 bg-black/70 backdrop-blur-sm', onClick: () => { const el = document.getElementById('more-sheet'); if (el) el.classList.add('hidden'); } }),
            h('div', { className: 'relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp', onClick: (e) => e.stopPropagation() },
              h('div', { className: 'w-10 h-1 rounded-full bg-white/15 mx-auto mb-4' }),
              h('div', { className: 'space-y-2 max-h-[70vh] overflow-y-auto' },
                MORE_PAGES.map((m) =>
                  h('a', { key: m.id, href: m.href, className: 'w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left' },
                    h('div', { className: 'w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0' }, m.icon),
                    h('div', { className: 'min-w-0' },
                      h('div', { className: 'text-[13px] font-extrabold font-display' }, m.label),
                      h('div', { className: 'text-[10px] text-white/40 font-bold mt-0.5' }, m.desc)
                    )
                  )
                )
              )
            )
          ),
          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-green-400 to-green-600 text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
