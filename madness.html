  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { gold: '#FFD60A', gold2: '#FFB800', ink: '#08080B', red: '#EF4444', green: '#22C55E' },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Sora', 'Inter', 'sans-serif'] },

  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; overscroll-behavior-y: contain; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; }
    body { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(239,68,68,0.08), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,214,10,0.05), transparent); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    .card-red { background: linear-gradient(135deg, rgba(239,68,68,0.12) 0%, rgba(185,28,28,0.04) 100%); border: 1px solid rgba(239,68,68,0.25); box-shadow: 0 8px 30px -10px rgba(239,68,68,0.3); }
    .glow-dot { box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .nav-active-pill { background: linear-gradient(180deg, rgba(239,68,68,0.2) 0%, rgba(239,68,68,0.05) 100%); border: 1px solid rgba(239,68,68,0.35); box-shadow: 0 0 25px rgba(239,68,68,0.25); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-backdrop { background: #08080B; }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    input { -webkit-user-select: text; user-select: text; }
    input:focus { outline: none; }

    .smoke-blur { filter: blur(6px); transition: filter 1s ease; pointer-events: none; }
    .smoke-bg { background: radial-gradient(circle, rgba(34,197,94,0.2) 0%, transparent 70%); }

    @keyframes floatEmoji {
      0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-200px) scale(2) rotate(45deg); opacity: 0; }
    }
    .hallucination { position: absolute; animation: floatEmoji 3s ease-out forwards; pointer-events: none; z-index: 9999; }

    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
      20%, 40%, 60%, 80% { transform: translateX(2px); }
    }
    .shake { animation: screenShake 0.5s; }

    @keyframes rouletteSpin {
      0% { transform: rotate(0); }
      100% { transform: rotate(1080deg); }
    }
    .roulette-spin { animation: rouletteSpin 1.5s cubic-bezier(0.2,0.8,0.3,1); }

    @keyframes coinFlip {
      0%, 100% { transform: rotateY(0); }
      50% { transform: rotateY(720deg); }
    }
    .coin-flip { animation: coinFlip 1.5s ease-in-out; }

    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect, useRef } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const LEADERBOARD_CACHE_MS = 5 * 60 * 1000;
    const VICTIMS_LIMIT = 100;

    const MADNESS_RANKS = [
      { min: 0,   name: 'Normal Human',       color: '#22C55E', emoji: '😊' },
      { min: 5,   name: 'Slightly Crazy',     color: '#FFD60A', emoji: '😅' },
      { min: 15,  name: 'Certified Madman',   color: '#FF6B00', emoji: '🤪' },
      { min: 30,  name: 'Area Boy King',      color: '#EF4444', emoji: '👹' },
      { min: 60,  name: 'Madman of Lagos',    color: '#A855F7', emoji: '💀' },
      { min: 100, name: 'Legend of Madness',  color: '#FFD60A', emoji: '🌟' },
    ];

    const getRank = (score) => {
      let r = MADNESS_RANKS[0];
      for (const rank of MADNESS_RANKS) {
        if ((score || 0) >= rank.min) r = rank;
      }
      return r;
    };
    const getNextRank = (score) => {
      for (const rank of MADNESS_RANKS) {
        if ((score || 0) < rank.min) return rank;
      }
      return null;
    };

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) {
          const parsed = JSON.parse(cached);
          return Object.assign({}, parsed, { madnessScore: parsed.madnessScore || 0, history: parsed.history || [] });
        }
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
        transactions: [], history: [], madnessScore: 0
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };

    const timeAgo = (t) => {
      const s = Math.floor((Date.now() - t) / 1000);
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const hrs = Math.floor(m / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    };

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        ritual: () => { init(); tone(150, 0.5, "sawtooth", 0, 0.3); tone(120, 0.6, "sawtooth", 0.2, 0.3); tone(80, 1.0, "square", 0.4, 0.3); },
        jackpot: () => { init(); [523, 659, 783, 1046, 1318].forEach((f,i) => tone(f, 0.2, "triangle", i*0.08, 0.25)); },
        spin: () => { init(); for(let i=0;i<10;i++) tone(600+i*80, 0.05, "triangle", i*0.12, 0.15); }
      };
    })();

    const Card = ({ children, className = '', red = false }) =>
      h('div', { className: 'rounded-2xl ' + (red ? 'card-red' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [feed, setFeed] = useState([]);
      
      const [kidnapModal, setKidnapModal] = useState(false);
      const [ritualModal, setRitualModal] = useState(false);
      const [smokeModal, setSmokeModal] = useState(false);
      const [fightModal, setFightModal] = useState(false);

      const [rouletteModal, setRouletteModal] = useState(false);
      const [rouletteState, setRouletteState] = useState('idle');
      const [rouletteResult, setRouletteResult] = useState(null);
      const [deathWishModal, setDeathWishModal] = useState(false);
      const [deathWishState, setDeathWishState] = useState('idle');
      const [deathWishResult, setDeathWishResult] = useState(null);
      const [leaderboardOpen, setLeaderboardOpen] = useState(false);
      const [leaderboard, setLeaderboard] = useState([]);
      const [leaderboardLastFetch, setLeaderboardLastFetch] = useState(0);
      const [historyOpen, setHistoryOpen] = useState(false);
      const [showPasswordReminder, setShowPasswordReminder] = useState(false);

      const [victims, setVictims] = useState([]);
      const [selectedVictim, setSelectedVictim] = useState(null);
      const [loadingVictims, setLoadingVictims] = useState(false);
      const [victimSearch, setVictimSearch] = useState('');

      const [kidnapTimer, setKidnapTimer] = useState(15);
      const [smokeTimer, setSmokeTimer] = useState(30);
      const [hallucinations, setHallucinations] = useState([]);
      const [isShaking, setIsShaking] = useState(false);
      
      const timerRef = useRef(null);
      const smokeInterval = useRef(null);
      const stateRef = useRef(s);
      const leaderboardFetchRef = useRef(false);

      useEffect(() => { stateRef.current = s; }, [s]);

      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);

          const hasPassword = (user.providerData || []).some(p => p.providerId === 'password');
          if (!hasPassword) {
            const lastShown = parseInt(localStorage.getItem('pw_reminder_madness') || '0', 10);
            const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
            if (lastShown < dayAgo) {
              setTimeout(() => {
                setShowPasswordReminder(true);
                localStorage.setItem('pw_reminder_madness', String(Date.now()));
              }, 12000);
            }
          }
          
          const userRef = db.collection("users").doc(userId);
          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  transactions: dbData.transactions || [],
                  history: dbData.history || [],
                  madnessScore: dbData.madnessScore || 0
                });
                stateRef.current = newData;
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
                transactions: [], history: [], madnessScore: 0
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              stateRef.current = defaultData;
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => {
          authUnsub();
          if (userUnsub) userUnsub();
          if (timerRef.current) clearInterval(timerRef.current);
          if (smokeInterval.current) clearInterval(smokeInterval.current);
        };
      }, []);

      // ✅ FIXED: Load 100 victims (not 15) + sorted by cash descending
      useEffect(() => {
        if (!uid || !ritualModal) return;
        let cancelled = false;
        setLoadingVictims(true);
        setVictimSearch('');
        (async () => {
          try {
            const snap = await db.collection("users")
              .orderBy("cash", "desc")
              .limit(VICTIMS_LIMIT)
              .get();
            if (cancelled) return;
            const v = [];
            snap.forEach(doc => {
              if (doc.id !== uid) {
                const d = doc.data();
                v.push({
                  id: doc.id,
                  name: d.name || 'Hustler',
                  cash: d.cash || 0
                });
              }
            });
            setVictims(v);
          } catch (e) {
            console.error("Victims fetch error:", e);
          } finally {
            if (!cancelled) setLoadingVictims(false);
          }
        })();
        return () => { cancelled = true; };
      }, [uid, ritualModal]);

      useEffect(() => {
        if (!leaderboardOpen) return;
        if (leaderboardFetchRef.current) return;
        if (Date.now() - leaderboardLastFetch < LEADERBOARD_CACHE_MS && leaderboard.length > 0) return;
        leaderboardFetchRef.current = true;
        (async () => {
          try {
            const snap = await db.collection("users")
              .orderBy("madnessScore", "desc")
              .limit(10)
              .get();
            const arr = [];
            snap.forEach(doc => {
              const d = doc.data();
              arr.push({ id: doc.id, name: d.name || 'Hustler', score: d.madnessScore || 0 });
            });
            setLeaderboard(arr);
            setLeaderboardLastFetch(Date.now());
          } catch (e) {
            console.warn('Leaderboard error:', e.message);
          } finally {
            leaderboardFetchRef.current = false;
          }
        })();
      }, [leaderboardOpen]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });
      const addFeed = (msg) => setFeed(prev => [{ id: Date.now(), msg }, ...prev].slice(0, 10));

      const addCash = async (delta, extra = {}) => {
        const cur = stateRef.current;
        const next = Object.assign({}, cur, {
          cash: Math.max(0, (cur.cash || 0) + delta),
          ...extra
        });
        stateRef.current = next;
        setS(next);

        if (!uid) return;

        const updates = {
          cash: firebase.firestore.FieldValue.increment(delta),
          lastSeen: Date.now()
        };

        Object.keys(extra).forEach(k => {
          if (k === 'madnessScore' || k === 'clout') {
            if (extra[k] !== 0) updates[k] = firebase.firestore.FieldValue.increment(extra[k]);
          } else {
            updates[k] = extra[k];
          }
        });

        await db.collection("users").doc(uid).update(updates).catch(() => {});
      };

      const updateUser = async (data) => {
        const cur = stateRef.current;
        const next = Object.assign({}, cur, data);
        stateRef.current = next;
        setS(next);

        if (!uid) return;

        const updates = { lastSeen: Date.now() };
        Object.keys(data).forEach(k => {
          updates[k] = data[k];
        });

        await db.collection("users").doc(uid).update(updates).catch(() => {});
      };

      const logHistory = async (title, desc, amount) => {
        if (!uid) return;
        await db.collection("users").doc(uid).update({
          history: firebase.firestore.FieldValue.arrayUnion({
            title, desc, amount, date: Date.now(), category: 'madness'
          })
        }).catch(() => {});
      };

      const triggerShake = () => {
        setIsShaking(true);
        setTimeout(() => setIsShaking(false), 500);
      };

      const enterDanfo = () => {
        if ((s.cash || 0) < 1000) { AudioEngine.error(); return notify('You need ₦1k for Danfo 🚐', 'bad'); }
        
        addCash(-1000);
        AudioEngine.tap();

        const isKidnap = Math.random() < 0.10;
        if (isKidnap) {
          triggerShake();
          setKidnapModal(true);
          setKidnapTimer(15);
          timerRef.current = setInterval(() => {
            setKidnapTimer(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                setKidnapModal(false);
                addCash(-500000, { madnessScore: 1 });
                AudioEngine.error();
                notify('You were not bailed. Lost ₦500k! 😭', 'bad');
                addFeed('🚐 ' + (s.name || 'You') + ' was kidnapped and no one paid the ransom. Lost ₦500k!');
                logHistory('Kidnapped', 'Kidnapped in One Chance.', -500000);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          notify('Safe journey! You reached your destination 🚐');
          addFeed('🚐 ' + (s.name || 'You') + ' took Danfo and reached safely.');
        }
      };

      const payRansom = () => {
        if ((s.cash || 0) < 2000000) { AudioEngine.error(); return notify('You no get ₦2M ransom 💸', 'bad'); }
        clearInterval(timerRef.current);
        setKidnapModal(false);
        addCash(-2000000, { madnessScore: 1 });
        AudioEngine.coin();
        notify('Ransom paid. They released you 🚐');
        addFeed('🚐 ' + (s.name || 'You') + ' paid ₦2M ransom and escaped!');
        logHistory('Ransom Paid', 'Paid ₦2M ransom', -2000000);
      };

      const fightKidnappers = () => {
        clearInterval(timerRef.current);
        setKidnapModal(false);
        const win = Math.random() < 0.3;
        
        if (win) {
          AudioEngine.coin();
          addCash(1000000, { clout: 200, madnessScore: 2 });
          notify('You fought them and won! +₦1M 🥊');
          addFeed('🚐 ' + (s.name || 'You') + ' fought kidnappers and escaped with ₦1M!');
          logHistory('Fought Kidnappers', 'Won against kidnappers', 1000000);
        } else {
          AudioEngine.error();
          addCash(-1000000, { energy: 0, madnessScore: 1 });
          notify('They beat you. -₦1M, -100 energy 😭', 'bad');
          addFeed('🚐 ' + (s.name || 'You') + ' tried to fight kidnappers and got beaten.');
          logHistory('Fought Kidnappers', 'Lost against kidnappers', -1000000);
        }
      };

      const doRitual = async () => {
        if (!selectedVictim || !uid) return notify('Pick a victim first', 'bad');
        if ((s.cash || 0) < 50000) { AudioEngine.error(); return notify('Need ₦50k for ritual materials 🩸', 'bad'); }
        
        triggerShake();
        AudioEngine.ritual();
        
        try {
          const result = await db.runTransaction(async (t) => {
            const myRef = db.collection("users").doc(uid);
            const victimRef = db.collection("users").doc(selectedVictim.id);

            const [myDoc, victimDoc] = await Promise.all([t.get(myRef), t.get(victimRef)]);

            if (!myDoc.exists) throw new Error("Your account not found");
            if (!victimDoc.exists) throw new Error("Victim not found");
            if ((myDoc.data().cash || 0) < 50000) throw new Error("Not enough cash");

            const victimCash = victimDoc.data().cash || 0;
            const steal = Math.min(1000000, victimCash);

            t.update(myRef, {
              cash: firebase.firestore.FieldValue.increment(10000000 - 50000),
              madnessScore: firebase.firestore.FieldValue.increment(5),
              lastSeen: Date.now()
            });
            t.update(victimRef, {
              cash: firebase.firestore.FieldValue.increment(-steal)
            });

            return { steal };
          });

          setRitualModal(false);
          setS(prev => {
            const next = Object.assign({}, prev, {
              cash: (prev.cash || 0) + 10000000 - 50000,
              madnessScore: (prev.madnessScore || 0) + 5
            });
            stateRef.current = next;
            return next;
          });

          notify('RITUAL SUCCESSFUL! +₦10M 🩸');

                        h('div', { className: 'flex items-center gap-2 min-w-0 flex-1' },
                          h('div', { className: 'w-8 h-8 rounded-lg bg-gradient-to-br from-red-400/30 to-red-600/20 border border-red-500/30 grid place-items-center text-[11px] font-black text-white shrink-0' },
                            (v.name || 'H').charAt(0).toUpperCase()
                          ),
                          h('div', { className: 'min-w-0 flex-1' },
                            h('div', { className: 'text-[12px] font-extrabold text-white truncate font-display' }, v.name),
                            h('div', { className: 'text-[9px] text-[#22C55E] font-bold tabular-nums' }, 'Cash: ' + fmt(v.cash))
                          )
                        ),
                        h('div', { className: 'text-right shrink-0' },
                          h('div', { className: 'text-[9px] text-white/40 font-bold' }, 'Steal'),
                          h('div', { className: 'text-[11px] font-black text-red-400 tabular-nums' }, fmt(stealAmount))
                        )
                      )
                    );
                  })
              ),
              
              // Actions
              h('div', { className: 'space-y-2 flex-shrink-0' },
                selectedVictim && h('div', { className: 'px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/30 text-center' },
                  h('div', { className: 'text-[10px] text-white/60 font-bold' }, 'Selected victim'),
                  h('div', { className: 'text-[12px] font-black text-red-400 font-display' }, selectedVictim.name)
                ),
                h('button', { 
                  onClick: doRitual, 
                  disabled: !selectedVictim, 
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-[13px] active:scale-95 transition disabled:opacity-50 disabled:from-white/[0.06] disabled:to-white/[0.06] disabled:text-white/30' 
                }, selectedVictim ? '🩸 CONFIRM RITUAL (₦50K)' : '🩸 PICK A VICTIM FIRST'),
                h('button', { 
                  onClick: () => { setRitualModal(false); setSelectedVictim(null); }, 
                  className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/50 font-bold text-[11px]' 
                }, 'Cancel')
              )
            )
          ),

          fightModal && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-orange-500/30 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2 animate-pulse' }, '🥊'),
              h('div', { className: 'text-[15px] font-black text-orange-400 font-display' }, 'FIGHT IN PROGRESS'),
              h('p', { className: 'text-[12px] text-white/70 mt-2' }, 'You are throwing punches with an Area Boy...'),
              h('div', { className: 'mt-4 h-2 w-full bg-white/10 rounded-full overflow-hidden' },
                h('div', { className: 'h-full w-full bg-orange-500 rounded-full animate-pulse' })
              )
            )
          ),

          rouletteModal && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => rouletteState !== 'spinning' && closeRoulette() }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2 ' + (rouletteState === 'spinning' ? 'roulette-spin' : '') }, rouletteState === 'won' && rouletteResult?.won ? '😅' : rouletteState === 'won' ? '💀' : '🎲'),
              h('div', { className: 'text-[15px] font-black text-red-400 font-display' }, 'RUSSIAN ROULETTE'),
              h('p', { className: 'text-[11px] text-white/60 mt-2' }, '₦100k to play. 1/6 die (lose). 5/6 win ₦300k.'),
              rouletteResult && h('div', { className: 'mt-3 px-3 py-2 rounded-xl ' + (rouletteResult.won ? 'bg-[#22C55E]/15 border border-[#22C55E]/30' : 'bg-red-500/15 border border-red-500/30') },
                h('div', { className: 'text-[13px] font-black ' + (rouletteResult.won ? 'text-[#22C55E]' : 'text-red-400') },
                  rouletteResult.won ? '🎉 SURVIVED! +₦300K' : '💀 BANG! -₦100K')
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: playRoulette,
                  disabled: rouletteState === 'spinning',
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-[13px] active:scale-95 disabled:opacity-50'
                }, rouletteState === 'spinning' ? 'Firing...' : rouletteState === 'won' ? '🔫 PLAY AGAIN (₦100K)' : '🔫 PULL TRIGGER (₦100K)'),
                h('button', { onClick: closeRoulette, disabled: rouletteState === 'spinning', className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Close')
              )
            )
          ),

          deathWishModal && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => deathWishState !== 'flipping' && closeDeathWish() }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2 ' + (deathWishState === 'flipping' ? 'coin-flip' : '') }, deathWishResult ? (deathWishResult.won ? '💰' : '💀') : '💀'),
              h('div', { className: 'text-[15px] font-black text-red-400 font-display' }, 'DEATH WISH'),
              h('p', { className: 'text-[11px] text-white/60 mt-2' }, '₦100k to flip. 50/50 chance. Win ₦500k or lose all.'),
              deathWishResult && h('div', { className: 'mt-3 px-3 py-2 rounded-xl ' + (deathWishResult.won ? 'bg-[#22C55E]/15 border border-[#22C55E]/30' : 'bg-red-500/15 border border-red-500/30') },
                h('div', { className: 'text-[13px] font-black ' + (deathWishResult.won ? 'text-[#22C55E]' : 'text-red-400') },
                  deathWishResult.won ? '💰 PAID! +₦500K NET' : '💀 LOST ₦100K')
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: playDeathWish,
                  disabled: deathWishState === 'flipping',
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-[13px] active:scale-95 disabled:opacity-50'
                }, deathWishState === 'flipping' ? 'Flipping...' : deathWishState === 'result' ? '🔮 FLIP AGAIN (₦100K)' : '🔮 ACCEPT DEATH WISH (₦100K)'),
                h('button', { onClick: closeDeathWish, disabled: deathWishState === 'flipping', className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Close')
              )
            )
          ),

          leaderboardOpen && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-4' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setLeaderboardOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/40 rounded-3xl p-5 animate-popIn max-h-[85vh] overflow-y-auto' },
              h('div', { className: 'text-center mb-3' },
                h('div', { className: 'text-4xl mb-1' }, '🏆'),
                h('div', { className: 'text-[15px] font-black tracking-widest text-red-400 font-display' }, 'MADNESS LEADERBOARD'),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Top 10 maddest hustlers in Lagos')
              ),
              leaderboard.length === 0
                ? h('div', { className: 'text-center text-white/40 text-[11px] py-6 animate-pulse' }, 'Loading...')
                : h('div', { className: 'space-y-1.5' },
                    leaderboard.map((u, i) => {
                      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1);
                      const isMe = u.id === uid;
                      const uRank = getRank(u.score);
                      return h('div', {
                        key: u.id,
                        className: 'flex items-center gap-2.5 px-2.5 py-2 rounded-xl ' + (isMe ? 'bg-red-500/15 border border-red-500/30' : 'bg-white/[0.03] border border-white/[0.06]')
                      },
                        h('div', { className: 'text-base shrink-0 w-6 text-center' }, medal),
                        h('div', { className: 'flex-1 min-w-0' },
                          h('div', { className: 'text-[12px] font-extrabold font-display truncate' }, u.name + (isMe ? ' (You)' : '')),
                          h('div', { className: 'text-[9px] font-black', style: { color: uRank.color } }, uRank.emoji + ' ' + uRank.name + ' · ' + u.score + ' pts')
                        )
                      );
                    })
                  ),
              h('button', { onClick: () => setLeaderboardOpen(false), className: 'mt-3 w-full py-2 rounded-xl bg-white/[0.04] border border-white/10 text-[10px] font-bold text-white/60 active:scale-95' }, 'Close')
            )
          ),

          historyOpen && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-4' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setHistoryOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-red-500/40 rounded-3xl p-5 animate-popIn max-h-[85vh] overflow-y-auto' },
              h('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3 mb-3' },
                h('div', { className: 'text-[13px] font-black tracking-widest text-red-400 font-display' }, '📜 MADNESS HISTORY'),
                h('button', { onClick: () => setHistoryOpen(false), className: 'text-white/50 text-xl leading-none' }, '×')
              ),
              (!s.history || s.history.filter(hh => hh.category === 'madness').length === 0) ?
                h('div', { className: 'text-center text-white/40 text-[11px] py-6' }, 'No madness history yet.') :
                h('div', { className: 'space-y-1.5' },
                  [...s.history].filter(hh => hh.category === 'madness').slice(-20).reverse().map((hh, i) =>
                    h('div', { key: i, className: 'px-2.5 py-2 rounded-xl bg-white/[0.03] border border-white/[0.06]' },
                      h('div', { className: 'flex items-center justify-between' },
                        h('div', { className: 'text-[11px] font-extrabold text-white/80' }, hh.title),
                        h('div', { className: 'text-[10px] font-black tabular-nums ' + ((hh.amount || 0) >= 0 ? 'text-[#22C55E]' : 'text-red-400') },
                          ((hh.amount || 0) >= 0 ? '+' : '') + fmt(hh.amount))
                      ),
                      h('div', { className: 'text-[9px] text-white/40 truncate' }, hh.desc),
                      h('div', { className: 'text-[8px] text-white/25 mt-0.5' }, timeAgo(hh.date))
                    )
                  )
                )
            )
          ),

          showPasswordReminder && h('div', { className: 'fixed inset-0 z-[95] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setShowPasswordReminder(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-2' }, '🔐'),
              h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'ADD A PASSWORD'),
              h('p', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed' },
                'You signed in with Google. Add a password so you fit still login with email if Google ever fails.'
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: () => { window.location.href = '/index.html'; },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95'
                }, '🔒 Set Password Now'),
                h('button', { onClick: () => setShowPasswordReminder(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Later')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-green-400 to-green-600 text-white')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
