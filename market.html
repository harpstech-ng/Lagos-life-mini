        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }
      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        toggle: () => { if (musicPlaying) { AudioEngine.stopMusic(); } else { AudioEngine.startMusic(); } return musicPlaying; },

      };

          if (u.pathname.includes('@')) handle = u.pathname.split('@')[1].split('/')[0];
          return { handle: '@' + handle.replace('@',''), fullUrl: 'https://www.tiktok.com/@' + handle.replace('@','') };
        } catch(e) {
          const clean = url.replace('@','').trim();

      const claimCampaign = async (campaign) => {

        if (campaign.claimedSlots >= campaign.totalSlots) return notify('All slots filled!', 'bad');
        if (inFlightClaims.current.has(campaign.id)) return;
        inFlightClaims.current.add(campaign.id);

        try {
          await db.runTransaction(async (t) => {
            const campRef = db.collection("tiktok_campaigns").doc(campaign.id);
            const doc = await t.get(campRef);
            if (!doc.exists) throw new Error("Campaign not found");
            const data = doc.data();
            if (data.claimedBy?.includes(uid)) throw new Error("You already claimed this");
            if (data.claimedSlots >= data.totalSlots) throw new Error("Slots full");

            const userRef = db.collection("users").doc(uid);
            t.update(userRef, { cash: firebase.firestore.FieldValue.increment(data.rewardPerFollow) });
            t.update(campRef, {
              claimedSlots: firebase.firestore.FieldValue.increment(1),
              claimedBy: firebase.firestore.FieldValue.arrayUnion(uid)
            });
          });
          AudioEngine.jackpot();
          notify('🎉 You earned ' + fmt(campaign.rewardPerFollow) + '!');
          logHistory('TikTok Campaign', 'Followed ' + campaign.tiktokHandle, campaign.rewardPerFollow);
        } catch(e) {
          console.error(e);
          notify(e.message || 'Claim failed', 'bad');
        } finally {
          inFlightClaims.current.delete(campaign.id);
        }
      };

      const cancelCampaign = async (campaign) => {
        if (campaign.creatorId !== uid) return;
        const remaining = campaign.totalSlots - campaign.claimedSlots;
        const refund = remaining * campaign.rewardPerFollow;
        try {
          await db.runTransaction(async (t) => {
            const campRef = db.collection("tiktok_campaigns").doc(campaign.id);
            const doc = await t.get(campRef);
            if (!doc.exists) return;
            const data = doc.data();
            if (data.creatorId !== uid) throw new Error("Not your campaign");
            const userRef = db.collection("users").doc(uid);
            if (refund > 0) t.update(userRef, { cash: firebase.firestore.FieldValue.increment(refund) });
            t.delete(campRef);
          });
          AudioEngine.coin();
          notify('Campaign cancelled. Refunded ' + fmt(refund));
        } catch(e) {
          console.error(e);
          notify(e.message || 'Failed', 'bad');

      const createAuction = async (asset, startingBid, duration) => {
        if ((safeAssets[asset.id] || 0) < 1) return notify('You do not own this', 'bad');
        if (startingBid < 1000) return notify('Min bid ₦1,000', 'bad');
        try {
          await db.runTransaction(async (t) => {
            const userRef = db.collection("users").doc(uid);
            t.update(userRef, { [`assets.${asset.id}`]: firebase.firestore.FieldValue.increment(-1) });
            const aRef = db.collection("auctions").doc();
            t.set(aRef, {
              sellerId: uid,
              sellerName: s.name || 'Hustler',
              assetId: asset.id,
              assetName: asset.name,
              emoji: asset.emoji,
              startingBid: startingBid,
              currentBid: 0,
              currentBidderId: null,
              currentBidderName: null,
              createdAt: Date.now(),
              endsAt: Date.now() + duration,
              status: 'active'
            });
          });
          setS(prev => {
            const newAssets = Object.assign({}, prev.assets);
            newAssets[asset.id] -= 1;
            if (newAssets[asset.id] <= 0) delete newAssets[asset.id];
            return Object.assign({}, prev, { assets: newAssets });
          });
          AudioEngine.purchase();
          notify('🔨 Auction live!');
          setAuctionModal(false);
          setViewMode('auction');

          notify('Failed to create auction', 'bad');

      const placeBid = async (auction, amount) => {
        if (auction.status !== 'active') return notify('Auction ended', 'bad');
        if (amount <= auction.currentBid && auction.currentBid > 0) return notify('Bid must be higher than ' + fmt(auction.currentBid), 'bad');
        if (amount < auction.startingBid) return notify('Bid must be at least ' + fmt(auction.startingBid), 'bad');
        if (s.cash < amount) return notify('Not enough cash', 'bad');

        try {
          await db.runTransaction(async (t) => {
            const aRef = db.collection("auctions").doc(auction.id);
            const doc = await t.get(aRef);
            if (!doc.exists) throw new Error("Auction gone");
            const data = doc.data();
            if (data.status !== 'active') throw new Error("Ended");
            if (data.endsAt < Date.now()) throw new Error("Expired");
            if (amount <= data.currentBid && data.currentBid > 0) throw new Error("Bid too low");

            const buyerRef = db.collection("users").doc(uid);
            const buyerDoc = await t.get(buyerRef);
            if (buyerDoc.data().cash < amount) throw new Error("Not enough cash");

            if (data.currentBidderId) {
              const prevRef = db.collection("users").doc(data.currentBidderId);
              t.update(prevRef, { cash: firebase.firestore.FieldValue.increment(data.currentBid) });
            }
            t.update(buyerRef, { cash: firebase.firestore.FieldValue.increment(-amount) });
            t.update(aRef, {
              currentBid: amount,
              currentBidderId: uid,
              currentBidderName: s.name || 'Hustler'
            });
          });
          AudioEngine.bid();
          notify('🎯 Bid placed!');
          setBidModal(null);
          setBidAmount('');

          console.error(e);
          notify(e.message || 'Bid failed', 'bad');

        if ((s.cash || 0) < MYSTERY_BOX_COST) { AudioEngine.error(); return notify('Need ' + fmt(MYSTERY_BOX_COST), 'bad'); }
        setIsOpeningBox(true);
        setMysteryResult(null);
        AudioEngine.tap();

        setTimeout(async () => {
          const roll = Math.random();
          let pool;
          if (roll < 0.50) pool = ASSETS.filter(a => a.price < 50_000_000);
          else if (roll < 0.80) pool = ASSETS.filter(a => a.price >= 50_000_000 && a.price < 500_000_000);
          else if (roll < 0.95) pool = ASSETS.filter(a => a.price >= 500_000_000 && a.price < 10_000_000_000);
          else if (roll < 0.99) pool = ASSETS.filter(a => a.price >= 10_000_000_000 && a.price < 500_000_000_000);
          else pool = ASSETS.filter(a => a.price >= 500_000_000_000);
          if (pool.length === 0) pool = ASSETS;
          const won = pool[Math.floor(Math.random() * pool.length)];

            await db.runTransaction(async (t) => {
              const userRef = db.collection("users").doc(uid);

              t.update(userRef, {
                cash: firebase.firestore.FieldValue.increment(-MYSTERY_BOX_COST),
                [`assets.${won.id}`]: firebase.firestore.FieldValue.increment(1)
              });
            });
            setS(prev => {
              const newAssets = Object.assign({}, prev.assets);

                h('button', {
                  onClick: () => { setMysteryResult(null); },
                  className: 'mt-4 w-full py-3 rounded-xl mystery-gradient text-white text-[12px] font-black active:scale-95'
                }, '🎁 Open Another'),
                h('button', { onClick: () => { setMysteryModal(false); setMysteryResult(null); }, className: 'mt-2 w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Close')
              ) :
              h(React.Fragment, null,
                h('div', { className: 'text-6xl mb-2 ' + (isOpeningBox ? 'animate-shake' : '') }, '🎁'),
                h('div', { className: 'text-[15px] font-black tracking-widest mystery-gradient text-white rounded-lg py-1.5 font-display' }, 'MYSTERY BOX'),
                h('p', { className: 'text-[11px] text-white/60 mt-3 mb-3 leading-relaxed' }, 'Roll the dice. Win ANY asset — from a ₦500K Air Force to a ₦50 Quadrillion Crypto Exchange.'),
                h('div', { className: 'rounded-xl bg-white/[0.03] border border-white/[0.06] p-2.5 text-[10px] text-left space-y-1' },
                  h('div', { className: 'flex justify-between' }, h('span', { className: 'text-white/50' }, '🏆 Legendary'), h('span', { className: 'text-[#FF6B00] font-bold' }, '1%')),
                  h('div', { className: 'flex justify-between' }, h('span', { className: 'text-white/50' }, '💎 Epic'), h('span', { className: 'text-[#A855F7] font-bold' }, '4%')),
                  h('div', { className: 'flex justify-between' }, h('span', { className: 'text-white/50' }, '⭐ Rare'), h('span', { className: 'text-[#3B82F6] font-bold' }, '15%')),
                  h('div', { className: 'flex justify-between' }, h('span', { className: 'text-white/50' }, '✨ Uncommon'), h('span', { className: 'text-[#22C55E] font-bold' }, '30%')),
                  h('div', { className: 'flex justify-between' }, h('span', { className: 'text-white/50' }, '📦 Common'), h('span', { className: 'text-white/70 font-bold' }, '50%'))
                ),
                h('div', { className: 'mt-3 px-3 py-2 rounded-xl bg-[#FFD60A]/10 border border-[#FFD60A]/30 flex items-center justify-between' },
                  h('span', { className: 'text-[10px] uppercase tracking-widest font-bold text-white/50' }, 'Cost'),
                  h('span', { className: 'font-black tabular-nums font-display text-[14px] text-[#FFD60A]' }, fmt(MYSTERY_BOX_COST))
                ),
                h('button', {
                  onClick: openMysteryBox,
                  disabled: isOpeningBox || s.cash < MYSTERY_BOX_COST,
                  className: 'mt-4 w-full py-3 rounded-xl mystery-gradient text-white text-[13px] font-black active:scale-95 disabled:opacity-40'
                }, isOpeningBox ? 'Opening...' : '🎁 OPEN BOX'),
                h('button', { onClick: () => setMysteryModal(false), disabled: isOpeningBox, className: 'mt-2 w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Cancel')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', {
              style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' },
              onClick: () => window.location.reload()
            }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
