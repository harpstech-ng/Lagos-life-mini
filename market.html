    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }
      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        toggle: () => { if (musicPlaying) { stopMusic(); } else { startMusic(); } return musicPlaying; },
        coin: () => { init(); tone(1046, 0.08, "square", sfxGain, 0, 0.15); tone(1318, 0.15, "square", sfxGain, 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", sfxGain, 0, 0.25); tone(165, 0.25, "sawtooth", sfxGain, 0.1, 0.25); },
        purchase: () => { init(); tone(523, 0.1, "triangle", sfxGain, 0, 0.2); tone(659, 0.1, "triangle", sfxGain, 0.07, 0.2); tone(783, 0.2, "triangle", sfxGain, 0.14, 0.2); }
      };
    })();

          const userId = user.uid;
          setUid(userId);
          const userRef = db.collection("users").doc(userId);

          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              const dbData = doc.data();
              setS(prev => {
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  travels: dbData.travels || prev.travels || [],
                  transactions: dbData.transactions || [],
                  cash: dbData.cash !== undefined ? dbData.cash : prev.cash
                });

                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),

              userRef.set(defaultData).catch(() => {});
              setS(defaultData);

      const safeBusinesses = s.businesses || {};
      const safeAssets = s.assets || {};

      const bizValue = Object.entries(safeBusinesses).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);
      const assetValue = Object.entries(safeAssets).reduce((a, kv) => {
        const ast = ASSETS.find((x) => x.id === kv[0]);

      }, 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);
      const ownedCount = Object.values(safeAssets).reduce((a, c) => a + c, 0);

      let flexTitle = "Broke Guy";
      if (netWorth > 1_000_000) flexTitle = "Starter Flexer";
      if (netWorth > 100_000_000) flexTitle = "Sharp Guy";
      if (netWorth > 1_000_000_000) flexTitle = "Odogwu Flexer";
      if (netWorth > 100_000_000_000) flexTitle = "Aje Butler";

      const buyAsset = async (a) => {
        if (s.cash < a.price) {
          AudioEngine.error();
          return notify('Not enough Lagos Cash 💸. Go and hustle!', 'bad');
        }

        setS((p) => {
          const currentAssets = p.assets || {};
          const newAssets = Object.assign({}, currentAssets);
          newAssets[a.id] = (newAssets[a.id] || 0) + 1;
          const next = Object.assign({}, p, { cash: p.cash - a.price, assets: newAssets });
          try { localStorage.setItem("lagos_user_data", JSON.stringify(next)); } catch(e) {}
          return next;
        });

        setFlexAnim(a.id);
        setTimeout(() => setFlexAnim(null), 1500);

        AudioEngine.purchase();
        try { if (navigator.vibrate) navigator.vibrate(30); } catch(e) {}

        let toastMsg = a.emoji + ' ' + a.name + ' acquired!';
        if (a.id === 'gwag') toastMsg = 'G-Wagon acquired! Now you need ₦50k for fuel 😂';
        else if (a.id === 'mansion') toastMsg = 'Banana Island Mansion! Your village people are already on the way 🧙🏾‍♂️';
        else if (a.id === 'af1') toastMsg = 'Air Force 1. Clean! Don\'t enter mud.';
        else if (a.id === 'rolex') toastMsg = 'Rolex! Hope e no be fake from Computer Village? 👀';
        notify(toastMsg);

        if (uid) {
          const updates = {
            cash: firebase.firestore.FieldValue.increment(-a.price),
            lastSeen: Date.now()
          };
          updates['assets.' + a.id] = firebase.firestore.FieldValue.increment(1);
          await db.collection("users").doc(uid).update(updates).catch(() => {});
        }
      };

      const filteredAssets = activeTab === "All"
        ? ASSETS
        : ASSETS.filter(a => a.cat === activeTab);

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },

          h('button', {
            onClick: () => { const on = AudioEngine.toggle(); setMusicOn(on); },
            className: 'music-toggle w-10 h-10 rounded-full bg-white/[0.08] border border-white/15 grid place-items-center active:scale-95 transition backdrop-blur'
          }, h('span', { className: 'text-base' }, musicOn ? '🔊' : '🔇')),

          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Market'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0)),
                h('div', { className: 'px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums' }, fmtReal(s.real || 0))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            s.cash < 10000 && h('div', { className: 'mt-3 px-3 py-2 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center gap-2' },
              h('span', { className: 'text-lg animate-bounce' }, '😭'),
              h('div', { className: 'text-[10px] font-bold text-red-400' }, 'Sapa dey worry you! Go to Hustle page make money before you buy flex.')
            ),

            h(Card, { className: 'relative overflow-hidden p-4 mt-3 hero-grid', gold: true },
              h('div', { className: 'absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#FFD60A]/25 blur-3xl pointer-events-none' }),
              h('div', { className: 'relative' },
                h('div', { className: 'flex items-center justify-between' },
                  h('div', { className: 'text-[9px] uppercase tracking-widest text-white/45 font-bold' }, 'Asset Value'),
                  h('div', { className: 'text-2xl' }, '🛒')
                ),
                h('div', { className: 'text-3xl font-black tabular-nums font-display mt-1 text-gradient-gold' }, fmt(assetValue)),
                h('div', { className: 'mt-2 flex items-center gap-3 text-[10px] font-bold text-white/45' },
                  h('span', null,
                    h('span', { className: 'text-[#FFD60A] font-black' }, String(ownedCount)),
                    ' asset' + (ownedCount !== 1 ? 's' : '') + ' owned'
                  ),
                  h('span', { className: 'w-1 h-1 rounded-full bg-white/20' }),
                  h('span', null,
                    'Net Worth: ',
                    h('span', { className: 'text-[#FFD60A] font-black tabular-nums' }, fmt(netWorth))
                  )
                ),
                h('div', { className: 'mt-2 text-[10px] font-bold text-white/50' }, 'Status: ' + flexTitle)
              )
            ),

            h('div', { className: 'mt-4 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/[0.05] flex items-center gap-2 overflow-hidden' },
              h('span', { className: 'text-sm shrink-0 animate-pulse' }, '📡'),
              h('div', { className: 'flex-1 overflow-hidden relative h-5' },
                h('div', { className: 'absolute text-[10.5px] font-bold text-white/60 whitespace-nowrap marquee', key: feedMsg }, feedMsg)
              )
            ),

            h('div', { className: 'mt-4 flex gap-1.5 overflow-x-auto pb-1 no-scrollbar' },
              CATEGORIES.map(cat =>
                h('button', {
                  key: cat,
                  onClick: () => setActiveTab(cat),
                  className: 'whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all ' +
                    (activeTab === cat
                      ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_12px_-4px_rgba(255,214,10,0.5)]'
                      : 'bg-white/[0.06] text-white/50 border border-white/10')
                }, cat)
              )
            ),

            ownedCount > 0 && activeTab === 'All' && h(React.Fragment, null,
              h(SectionTitle, {
                right: h('span', { className: 'text-[10px] font-bold text-[#FFD60A] flex items-center gap-1.5' },
                  h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#FFD60A] animate-pulse glow-dot' }),
                  'FLEX'
                )
              }, 'Your Garage'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
                ASSETS.filter((a) => (safeAssets[a.id] || 0) > 0).map((a) => {
                  const owned = safeAssets[a.id];
                  return h('div', { key: a.id, className: 'px-3.5 py-2.5 flex items-center gap-3' },
                    h('div', { className: 'w-9 h-9 rounded-lg bg-white/[0.06] grid place-items-center text-lg shrink-0' }, a.emoji),
                    h('div', { className: 'flex-1 min-w-0' },
                      h('div', { className: 'text-[12px] font-extrabold truncate font-display' }, a.name),
                      h('div', { className: 'text-[10px] text-white/40 font-bold tabular-nums' }, '×' + owned + ' · ' + a.tier)
                    ),
                    h('div', { className: 'text-[11px] font-black text-[#FFD60A] tabular-nums shrink-0' }, fmt(a.price * owned))
                  );
                })
              )
            ),

            h(SectionTitle, {
              right: h('span', { className: 'text-[10px] font-bold text-white/30' }, filteredAssets.length + ' items')
            }, activeTab === "All" ? "Flex Market" : activeTab),

            h('div', { className: 'space-y-2.5' },
              filteredAssets.map((a) => {
                const owned = safeAssets[a.id] || 0;
                const canAfford = (s.cash || 0) >= a.price;
                const justBought = flexAnim === a.id;
                const isHighTier = a.price >= 100_000_000_000;
                return h(Card, {
                  key: a.id,
                  className: 'relative overflow-hidden p-3 flex items-center gap-3 transition-all duration-300 ' +
                    (owned > 0 ? 'border-[#FFD60A]/30 ' : '') +
                    (justBought ? 'ring-2 ring-[#FFD60A] shadow-[0_0_30px_rgba(255,214,10,0.4)] scale-[1.01] ' : '') +
                    (isHighTier && owned > 0 ? 'shine ' : '')
                },
                  h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + a.color + ' pointer-events-none opacity-60' }),
                  h('div', { className: 'relative w-14 h-14 rounded-xl bg-gradient-to-br from-white/[0.1] to-white/[0.02] border border-white/[0.08] grid place-items-center text-3xl shrink-0' },
                    a.emoji,
                    owned > 0 && h('span', { className: 'badge-owned absolute -top-1.5 -right-1.5 bg-gradient-to-br from-[#FFE566] to-[#FFB800] text-black text-[9px] font-black rounded-full min-w-[20px] h-5 px-1 grid place-items-center shadow-lg' }, '×' + owned)
                  ),
                  h('div', { className: 'relative flex-1 min-w-0' },
                    h('div', { className: 'text-[13px] font-extrabold truncate font-display' }, a.name),
                    h('div', { className: 'text-[9px] text-white/40 truncate mb-1' }, a.desc),
                    h('div', { className: 'flex items-center gap-2' },
                      h('span', {
                        className: 'text-[8.5px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded ' +
                          (a.tier === 'Legend' ? 'bg-pink-500/20 text-pink-300' :
                           a.tier === 'Aje' ? 'bg-purple-500/20 text-purple-300' :
                           a.tier === 'Odogwu' ? 'bg-cyan-500/20 text-cyan-300' :
                           a.tier === 'Big Boy' ? 'bg-slate-400/20 text-slate-200' :
                           a.tier === 'Sharp' ? 'bg-red-500/20 text-red-300' :
                           a.tier === 'Baller' ? 'bg-amber-400/20 text-amber-300' :
                           'bg-yellow-500/20 text-yellow-300')
                      }, a.tier)
                    ),
                    h('div', { className: 'text-[10px] font-black text-white/70 tabular-nums mt-1' }, fmt(a.price))
                  ),
                  h('button', {
                    onClick: () => buyAsset(a),
                    disabled: !canAfford,
                    className: 'relative shrink-0 rounded-lg text-[10.5px] font-black px-3 py-2.5 active:scale-95 transition-all ' +
                      (canAfford
                        ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_14px_-4px_rgba(255,214,10,0.7)]'
                        : 'bg-white/[0.06] text-white/25 border border-white/[0.06]')
                  }, canAfford ? 'FLEX' : 'LOCKED')
                );
              })
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '💎'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' },
                  'Assets no dey produce money — na ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, 'pure status'),
                  '. Every one you buy go add straight to your ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, 'Net Worth'),
                  ' and push you up the leaderboard. Banana Island Mansion na ₦1 Trillion — only true Aje fit afford am. 🏆'
                )
              )
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'market';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad'
                ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white'
                : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', {
              style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' },
              onClick: () => window.location.reload()
            }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
