    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e21) return s + '₦' + (n / 1e21).toFixed(2) + 'Sx';
      if (n >= 1e18) return s + '₦' + (n / 1e18).toFixed(2) + 'Qi';

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        achievement: () => { init(); [523, 659, 783, 1046].forEach((f,i) => tone(f, 0.15, "triangle", i*0.08, 0.25)); },

      };

    function generateDynamicLeaderboard() {
      let seed = Math.floor(Date.now() / (1000 * 60 * 5));
      const rnd = () => {
        seed = (seed * 1103515245 + 12345) % 2147483648;
        return seed / 2147483648;
      };
      
      const first = ['Tunde', 'Chidi', 'Bisi', 'Emeka', 'Ngozi', 'Femi', 'Yemi', 'Ada', 'Kelechi', 'Seyi', 'Ifeanyi', 'Amaka', 'Bola', 'Dapo', 'Funke', 'Uche', 'Tope', 'Zainab', 'Musa', 'Chioma', 'Segun', 'Kemi'];
      const last = ['Ade', 'Okoye', 'Balogun', 'Eze', 'Ogun', 'Nwosu', 'Bello', 'Achebe', 'Ibrahim', 'Ojo', 'Chukwu', 'Lawal', 'Adebayo', 'Nnamdi', 'Salami'];
      const faces = ['🦍', '🐐', '🦅', '🐆', '🦁', '🐊', '🦈', '🐘', '🦂', '🐍', '🦍', '🐐'];
      
      const out = [];
      for (let i = 0; i < 100; i++) {
        const baseNw = Math.pow(10, 16.2 - i * 0.065);
        const drift = baseNw * (rnd() * 0.05); 
        
        out.push({
          name: first[Math.floor(rnd() * first.length)] + ' ' + last[Math.floor(rnd() * last.length)],
          nw: Math.floor(baseNw + drift),
          emoji: faces[Math.floor(rnd() * faces.length)],
          isReal: false
        });
      }
      return out;
    }

      const fetchRealUsers = async (force = false) => {

        if (realUsersFetchRef.current) return;

        setRefreshingUsers(true);
        try {
          const snap = await db.collection("users").orderBy("cash", "desc").limit(100).get();

          snap.forEach(doc => {
            const data = doc.data();
            const bizValue = Object.entries(data.businesses || {}).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);

            let netWorth = (data.cash || 0) + bizValue + assetValue;
            
            const now = Date.now();
            if (data.boostExpiresAt && data.boostExpiresAt > now) {
              netWorth *= 2;
            }

            const isRaided = data.raidExpiresAt && data.raidExpiresAt > now;

            users.push({
              id: doc.id,
              name: data.name || 'Hustler',
              nw: Math.floor(netWorth),

              isReal: true,
              gold: data.goldName,
              isRaided: isRaided,
              flexExpiresAt: data.flexExpiresAt || 0,
              flexMessage: data.flexMessage || '',

                      const statusColor = w.status === 'paid' ? '#22C55E' : w.status === 'pending' ? '#FFD60A' : '#EF4444';
                      return h('div', { key: w.id, className: 'px-3 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06]' },
                        h('div', { className: 'flex items-center justify-between mb-1' },
                          h('div', { className: 'text-[12px] font-black text-white tabular-nums' }, fmtReal(w.amountReal || 0)),
                          h('div', { className: 'text-[9px] font-black uppercase px-1.5 py-0.5 rounded', style: { background: statusColor + '25', color: statusColor } }, w.status || 'pending')
                        ),
                        h('div', { className: 'text-[9.5px] text-white/40' }, (w.bankName || '—') + ' · ' + (w.accountNumber || '—')),
                        h('div', { className: 'text-[9px] text-white/30 mt-0.5' }, new Date(w.createdAt || Date.now()).toLocaleString('en-NG'))
                      );
                    })
                  )
            )
          ),

          shareOpen && shareUrl && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-4' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setShareOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm animate-popIn' },
              h('div', { className: 'rounded-2xl overflow-hidden border border-[#FFD60A]/40' },
                h('img', { src: shareUrl, alt: 'Rank card', className: 'w-full block' })
              ),
              h('div', { className: 'mt-3 grid grid-cols-2 gap-2' },
                h('button', { onClick: downloadShare, className: 'rounded-xl bg-white/[0.06] border border-white/10 py-3 text-[12px] font-extrabold text-white/85 active:scale-95' }, '⬇️ Download'),
                h('button', { onClick: shareToSocial, className: 'rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] py-3 text-[12px] font-black text-black active:scale-95' }, '📤 Share')
              ),
              h('button', { onClick: () => setShareOpen(false), className: 'mt-2 w-full rounded-xl bg-white/[0.04] border border-white/10 py-2.5 text-[11px] font-extrabold text-white/60 active:scale-95' }, 'Close')
            )
          ),

          achievementToast && h('div', { className: 'fixed top-20 left-1/2 -translate-x-1/2 z-[95] px-4 animate-slideDown pointer-events-none' },
            h('div', { className: 'bg-gradient-to-r from-[#FFD60A] to-[#FFB800] text-black px-5 py-3 rounded-2xl shadow-[0_8px_30px_-6px_rgba(255,214,10,0.8)] flex items-center gap-3 min-w-[220px]' },
              h('div', { className: 'text-2xl' }, achievementToast.icon),
              h('div', null,
                h('div', { className: 'text-[9px] font-black uppercase tracking-widest opacity-60' }, 'Achievement Unlocked!'),
                h('div', { className: 'text-[13px] font-black font-display' }, achievementToast.name)
              )
            )
          ),

          showPasswordReminder && h('div', { className: 'fixed inset-0 z-[95] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setShowPasswordReminder(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-2' }, '🔐'),
              h('div', { className: 'text-[15px] font-black tracking-widest text-[#FFD60A] font-display' }, 'ADD A PASSWORD'),
              h('p', { className: 'text-[11px] text-white/60 mt-2 leading-relaxed' },
                'You signed in with Google. Add a password so you fit still login with email if Google login ever fails.'
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: () => { window.location.href = '/index.html'; },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[12px] font-black active:scale-95'
                }, '🔒 Set Password Now'),
                h('button', { onClick: () => setShowPasswordReminder(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Later')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
