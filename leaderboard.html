  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ═══ FIREBASE INITIALIZATION ═══ */
    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    /* ═══ CONSTANTS ═══ */
    const MAX_E = 100;
    const ENERGY_MS = 5 * 60 * 1000;
    const TOTAL_USERS = 256890;
    
    // New Withdrawal Math: 1 Trillion Fake = 150 Naira Real
    // To get 1,000 Naira real, they need (1000 / 150) * 1 Trillion = 6,666,666,666,667 fake
    const MIN_WITHDRAW = 6_666_666_666_667; 
    const REAL_PER_WITHDRAW = 1000;

    const BIZ_PRICES = { water: 10_000, suya: 250_000, keke: 500_000, phone: 2_000_000, danfo: 5_000_000, wash: 25_000_000, bet9ja: 50_000_000, lounge: 500_000_000, oil: 5_000_000_000 };
    const BIZ_PER_HR = { water: 2000, suya: 40000, keke: 75000, phone: 350000, danfo: 800000, wash: 4000000, bet9ja: 9000000, lounge: 90000000, oil: 1000000000 };
    const ASSET_PRICES = { chain: 5_000_000, rolex: 50_000_000, tesla: 500_000_000, gwag: 5_000_000_000, yacht: 20_000_000_000, jet: 100_000_000_000, mansion: 1_000_000_000_000 };

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      const tg = window?.Telegram?.WebApp;
      return {
        name: tg?.initDataUnsafe?.user?.first_name || 'Hustler', 
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: []
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /* ═══ DYNAMIC LEADERBOARD ═══ */
    function generateDynamicLeaderboard() {
      let seed = Math.floor(Date.now() / (1000 * 60 * 5)); // Changes every 5 mins
      const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
      
      const first = ['Tunde', 'Chidi', 'Bisi', 'Emeka', 'Ngozi', 'Femi', 'Yemi', 'Ada', 'Kelechi', 'Seyi', 'Ifeanyi', 'Amaka', 'Bola', 'Dapo', 'Funke', 'Uche', 'Tope', 'Zainab', 'Musa', 'Chioma', 'Segun', 'Kemi'];
      const last = ['Ade', 'Okoye', 'Balogun', 'Eze', 'Ogun', 'Nwosu', 'Bello', 'Achebe', 'Ibrahim', 'Ojo', 'Chukwu', 'Lawal', 'Adebayo', 'Nnamdi', 'Salami'];
      const faces = ['🦍', '🐐', '🦅', '🐆', '🦁', '🐊', '🦈', '🐘', '🦂', '🐍', '🦍', '🐐'];
      
      const out = [];
      for (let i = 0; i < 100; i++) {
        // Base score drops exponentially
        const baseNw = Math.pow(10, 13.7 - i * 0.055);
        // Add random drift so they feel alive (up to 5% fluctuation)
        const drift = baseNw * (rnd() * 0.05); 
        
        out.push({
          name: first[Math.floor(rnd() * first.length)] + ' ' + last[Math.floor(rnd() * last.length)],
          nw: Math.floor(baseNw + drift),
          emoji: faces[Math.floor(rnd() * faces.length)],
          isReal: false
        });
      }
      return out;
    }

    /* ═══ AUDIO ENGINE ═══ */
    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.15; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }

      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        coin: () => { init(); tone(1046, 0.08, "square", sfxGain, 0, 0.15); tone(1318, 0.15, "square", sfxGain, 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", sfxGain, 0, 0.25); tone(165, 0.25, "sawtooth", sfxGain, 0.1, 0.25); }
      };
    })();

    const Card = ({ children, className = '', gold = false }) => (
      <div className={'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className}>{children}</div>
    );
    const SectionTitle = ({ children, right }) => (
      <div className="flex items-end justify-between mb-2.5 mt-6">
        <h2 className="text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display">{children}</h2>
        {right}
      </div>
    );

    function App() {
      const [s, setS] = useState(getCachedData); 
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [musicOn, setMusicOn] = useState(false);
      
      // Dynamic Leaderboard State
      const [realUsers, setRealUsers] = useState([]);
      const [fakeUsers, setFakeUsers] = useState(() => generateDynamicLeaderboard());

      /* Initialize Firebase Auth & Sync */
      useEffect(() => {
        const tg = window?.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        auth.signInAnonymously().then((cred) => {
          const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : cred.user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          const unsubscribe = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = {
                  ...dbData,
                  transactions: dbData.transactions || [],
                };
                localStorage.setItem("lagos_user_data", JSON.stringify(newData));
                return newData;
              });
            } else {
              const defaultData = {
                name: tg?.initDataUnsafe?.user?.first_name || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: []
              };
              userRef.set(defaultData);
              setS(defaultData);
              localStorage.setItem("lagos_user_data", JSON.stringify(defaultData));
            }
          });
          return unsubscribe;
        }).catch(e => setAuthError(e.message));
      }, []);

      /* Fetch Real Users for Leaderboard */
      useEffect(() => {
        const fetchRealUsers = async () => {
          try {
            const snap = await db.collection("users").orderBy("cash", "desc").limit(20).get();
            const users = [];
            snap.forEach(doc => {
              const data = doc.data();
              const bizValue = Object.entries(data.businesses || {}).reduce((a, [id, c]) => a + c * (BIZ_PRICES[id] || 0), 0);
              const assetValue = Object.entries(data.assets || {}).reduce((a, [id, c]) => a + c * (ASSET_PRICES[id] || 0), 0);
              const netWorth = (data.cash || 0) + bizValue + assetValue;
              users.push({
                id: doc.id,
                name: data.name || 'Hustler',
                nw: Math.floor(netWorth),
                emoji: '👤',
                isReal: true,
                gold: data.goldName
              });
            });
            setRealUsers(users);
          } catch (e) {
            console.error("Error fetching real users:", e);
          }
        };
        if (uid) fetchRealUsers();
      }, [uid]);

      /* Drift Fake Users every 30 seconds */
      useEffect(() => {
        const iv = setInterval(() => {
          setFakeUsers(prev => prev.map(u => ({
            ...u,
            nw: Math.floor(u.nw * (1 + (Math.random() * 0.002))) // grow slowly
          })));
        }, 30000);
        return () => clearInterval(iv);
      }, []);

      /* Start music */
      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      /* Tick: energy + income */
      useEffect(() => {
        if (!s) return;
        const iv = setInterval(() => {
          const now = Date.now();
          let energy = s.energy;
          let lastEnergy = s.lastEnergy;
          if (energy < MAX_E) {
            const gained = Math.floor((now - lastEnergy) / ENERGY_MS);
            if (gained > 0) {
              energy = Math.min(MAX_E, energy + gained);
              lastEnergy = energy >= MAX_E ? now : lastEnergy + gained * ENERGY_MS;
            }
          }
          const perHr = Object.entries(s.businesses || {}).reduce((a, [id, cnt]) => a + cnt * (BIZ_PER_HR[id] || 0), 0);
          const newCash = s.cash + perHr / 3600;
          
          if (energy !== s.energy || perHr > 0) {
            setS(prev => ({ ...prev, energy, lastEnergy, cash: newCash }));
            if (uid && perHr > 0) {
              db.collection("users").doc(uid).update({ cash: firebase.firestore.FieldValue.increment(perHr / 3600), energy, lastEnergy });
            }
          }
        }, 1000);
        return () => clearInterval(iv);
      }, [s, uid]);

      if (authError) return <div className="min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500"><div className="text-4xl">⚠️</div><div className="font-bold">Auth Error</div><div className="text-sm">{authError}</div></div>;

      /* Derived & Leaderboard Merge */
      const bizValue = Object.entries(s.businesses || {}).reduce((a, [id, c]) => a + c * (BIZ_PRICES[id] || 0), 0);
      const assetValue = Object.entries(s.assets || {}).reduce((a, [id, c]) => a + c * (ASSET_PRICES[id] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);

      // Merge real users + me + fake users
      const allUsers = [
        ...realUsers.filter(u => u.id !== uid), // Exclude me from real list so I can insert myself
        { id: uid, name: s.name, nw: netWorth, emoji: '👤', isReal: true, isMe: true, gold: s.goldName },
        ...fakeUsers
      ];

      // Sort by Net Worth descending
      allUsers.sort((a, b) => b.nw - a.nw);

      // Find my rank
      const myIndex = allUsers.findIndex(u => u.isMe);
      const rank = myIndex >= 0 ? myIndex + 1 : TOTAL_USERS;

      // Take top 100
      const board = allUsers.slice(0, 100);

      const withdraw = async () => {
        if (s.cash < MIN_WITHDRAW) { AudioEngine.error(); return notify('You need ₦6.66T fake to withdraw', 'bad'); }
        if (s.real < 0) return; 

        // Process withdrawal
        setS((p) => ({ ...p, cash: p.cash - MIN_WITHDRAW, real: p.real + REAL_PER_WITHDRAW }));
        AudioEngine.coin();
        notify('Withdrawn! +₦1,000.00 real 💰');
        try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy'); } catch {}

        if (uid) {
          await db.collection("users").doc(uid).update({
            cash: firebase.firestore.FieldValue.increment(-MIN_WITHDRAW),
            real: firebase.firestore.FieldValue.increment(REAL_PER_WITHDRAW),
            lastSeen: Date.now()
          });
        }
      };

      const topUpDemo = async () => {
        setS((p) => ({ ...p, real: p.real + 1000 }));
        notify('Demo top-up: +₦1,000.00 real');
        AudioEngine.coin();
        if (uid) {
          await db.collection("users").doc(uid).update({
            real: firebase.firestore.FieldValue.increment(1000),
            lastSeen: Date.now()
          });
        }
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: '#' },
      ];
      const MORE_PAGES = [
        { id: 'travel', label: 'Travel', icon: '✈️', desc: 'Japa from Mushin', href: 'travel.html' },
        { id: 'street', label: 'Street', icon: '🥷', desc: 'Rob, beg, tax, spray', href: 'street.html' },
        { id: 'leaderboard', label: 'Ranks & Wallet', icon: '🏆', desc: 'Top 100 + withdraw', href: 'leaderboard.html' },
      ];

      return (
        <div className="min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black">
          <div className="mx-auto max-w-md min-h-screen flex flex-col pb-24 relative">
            
            <button onClick={() => { const on = AudioEngine.toggle(); setMusicOn(on); }} className="music-toggle w-10 h-10 rounded-full bg-white/[0.08] border border-white/15 grid place-items-center active:scale-95 transition backdrop-blur">
              <span className="text-base">{musicOn ? "🔊" : "🔇"}</span>
            </button>

            <header className="sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]">
              <div className="px-4 py-2.5 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display">L</div>
                  <div className="min-w-0">
                    <div className="text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display">Leaderboard</div>
                    <div className="text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5">#{rank.toLocaleString()}</div>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <div className="px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums">⚡ {s.energy}</div>
                  <div className="px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums">{fmtReal(s.real)}</div>
                </div>
              </div>
            </header>

            <main className="flex-1 px-4 pb-4 animate-slideDown">
              {/* PROFILE */}
              <Card className="relative overflow-hidden p-4 mt-3 hero-grid" gold>
                <div className="absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#FFD60A]/25 blur-3xl pointer-events-none" />
                <div className="relative flex items-center gap-3">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-3xl shrink-0 shadow-[0_8px_24px_-8px_rgba(255,214,10,0.6)]">
                    👤
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5">
                      <input value={s.name}
                             onChange={(e) => setS((p) => ({ ...p, name: e.target.value.slice(0, 18) }))}
                             onBlur={() => { if (uid) db.collection("users").doc(uid).update({ name: s.name }); }}
                             className="bg-transparent text-[15px] font-black outline-none border-b border-transparent focus:border-[#FFD60A]/50 w-full min-w-0 font-display" />
                      {s.goldName && <span className="text-[#FFD60A] text-base shrink-0">⭐</span>}
                    </div>
                    <div className="text-[10px] font-bold text-white/45 mt-1">
                      Rank #{rank.toLocaleString()} · {s.taps.toLocaleString()} taps · {s.clout.toLocaleString()} clout
                    </div>
                  </div>
                </div>
                <div className="mt-3 pt-3 border-t border-white/[0.08] grid grid-cols-3 gap-2 text-center">
                  {[['Net Worth', fmt(netWorth)], ['Cash', fmt(s.cash)], ['Real', fmtReal(s.real)]].map(([k, v]) => (
                    <div key={k}>
                      <div className="text-[9px] uppercase tracking-widest text-white/35 font-bold">{k}</div>
                      <div className="text-[12px] font-black tabular-nums mt-0.5">{v}</div>
                    </div>
                  ))}
                </div>
              </Card>

              {/* WITHDRAW */}
              <SectionTitle>Withdraw to Real</SectionTitle>
              <Card className="p-4">
                <div className="text-[11px] text-white/55 leading-relaxed">
                  Rate: <span className="text-[#FFD60A] font-bold">₦1T fake = ₦150 real</span><br />
                  Minimum: <span className="text-[#FFD60A] font-bold">₦6.66T fake = ₦1,000 real</span>
                </div>
                <div className="mt-3 h-2.5 rounded-full bg-white/10 overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-[#22C55E] via-[#FFD60A] to-[#FFB800] rounded-full transition-all" style={{ width: Math.min(100, (s.cash / MIN_WITHDRAW) * 100) + '%' }} />
                </div>
                <div className="mt-2 flex justify-between text-[10px] font-bold text-white/40 tabular-nums">
                  <span>{fmt(s.cash)}</span>
                  <span>{fmt(MIN_WITHDRAW)}</span>
                </div>
                <button onClick={withdraw} disabled={s.cash < MIN_WITHDRAW}
                        className="w-full mt-3 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] py-3.5 text-[13px] font-black text-black active:scale-[0.97] transition disabled:from-white/[0.06] disabled:to-white/[0.06] disabled:text-white/30 font-display shadow-[0_8px_24px_-8px_rgba(34,197,94,0.6)] disabled:shadow-none">
                  Withdraw ₦1,000.00 Real
                </button>
                <button onClick={topUpDemo} className="w-full mt-2 rounded-xl bg-white/[0.06] border border-white/10 py-2.5 text-[11px] font-extrabold text-white/65 active:scale-[0.97] transition">
                  💳 Top Up ₦1,000 Real (Demo)
                </button>
              </Card>

              {/* LEADERBOARD */}
              <SectionTitle right={<span className="text-[10px] font-bold text-white/30">TOP 100</span>}>
                Ranking
              </SectionTitle>
              <Card className="divide-y divide-white/[0.05] overflow-hidden">
                {board.map((u, i) => (
                  <div key={i} className={'px-3 py-2.5 flex items-center gap-2.5 ' + (u.isMe ? 'bg-[#FFD60A]/10' : '')}>
                    <div className={'w-7 text-center text-[11px] font-black tabular-nums shrink-0 font-display ' +
                      (i === 0 ? 'text-[#FFD60A] text-[13px]' : i === 1 ? 'text-white/80' : i === 2 ? 'text-[#CD7F32]' : 'text-white/30')}>
                      {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}
                    </div>
                    <div className={'w-9 h-9 rounded-lg grid place-items-center text-base shrink-0 ' + (u.isMe ? 'bg-[#FFD60A]/20' : 'bg-white/[0.06]')}>
                      {u.emoji}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className={'text-[12px] font-extrabold truncate font-display ' + (u.isMe ? 'text-[#FFD60A]' : '')}>
                        {u.name} {u.isMe && <span className="text-[9px] opacity-70">(you)</span>}
                        {u.gold && <span className="ml-1">⭐</span>}
                      </div>
                    </div>
                    <div className="text-[11px] font-black tabular-nums text-white/65 shrink-0">{fmt(u.nw)}</div>
                  </div>
                ))}
              </Card>

              <Card className="p-3.5 mt-4">
                <div className="flex items-start gap-2">
                  <span className="text-base">🏆</span>
                  <p className="text-[10.5px] text-white/50 leading-relaxed">
                    Every asset, business, and cash dey count toward your Net Worth. Push higher to climb the leaderboard. Withdraw ₦6.66T fake for ₦1,000 real. 💰
                  </p>
                </div>
              </Card>
            </main>

            <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]">
              <div className="grid grid-cols-6 px-1 pt-1.5 safe-bottom">
                {NAV.map((n) => {
                  const active = n.id === 'more';
                  return (
                    <a key={n.id} href={n.href}
                       onClick={(e) => { if (n.id === 'more') { e.preventDefault(); document.getElementById('more-sheet')?.classList.remove('hidden'); } }}
                       className={'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')}>
                      <span className={'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '')}>{n.icon}</span>
                      <span className="text-[8.5px] font-extrabold tracking-wide font-display">{n.label}</span>
                    </a>
                  );
                })}
              </div>
            </nav>

            <div id="more-sheet" className="hidden fixed inset-0 z-50 flex items-end justify-center">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => document.getElementById('more-sheet')?.classList.add('hidden')} />
              <div className="relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp" onClick={(e) => e.stopPropagation()}>
                <div className="w-10 h-1 rounded-full bg-white/15 mx-auto mb-4" />
                <div className="space-y-2">
                  {MORE_PAGES.map((m) => (
                    <a key={m.id} href={m.href} className="w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left">
                      <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0">{m.icon}</div>
                      <div className="min-w-0">
                        <div className="text-[13px] font-extrabold font-display">{m.label}</div>
                        <div className="text-[10px] text-white/40 font-bold mt-0.5">{m.desc}</div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>
            </div>

            {toast && (
              <div className={'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' + (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')}>
                {toast.msg}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
