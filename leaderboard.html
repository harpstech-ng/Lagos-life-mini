    const getCachedData = () => {
      try {

        if (cached) {
          const parsed = JSON.parse(cached);
          return Object.assign({}, parsed, { transactions: parsed.transactions || [], taps: parsed.taps || 0, clout: parsed.clout || 0, withdrawals: parsed.withdrawals || 0 });

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e15) return s + '₦' + (n / 1e15).toFixed(2) + 'Q'; 
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); }
      };
    })();

    function generateDynamicLeaderboard() {
      let seed = Math.floor(Date.now() / (1000 * 60 * 5));
      const rnd = () => {
        seed = (seed * 1103515245 + 12345) % 2147483648;
        return seed / 2147483648;
      };
      
      const first = ['Tunde', 'Chidi', 'Bisi', 'Emeka', 'Ngozi', 'Femi', 'Yemi', 'Ada', 'Kelechi', 'Seyi', 'Ifeanyi', 'Amaka', 'Bola', 'Dapo', 'Funke', 'Uche', 'Tope', 'Zainab', 'Musa', 'Chioma', 'Segun', 'Kemi'];
      const last = ['Ade', 'Okoye', 'Balogun', 'Eze', 'Ogun', 'Nwosu', 'Bello', 'Achebe', 'Ibrahim', 'Ojo', 'Chukwu', 'Lawal', 'Adebayo', 'Nnamdi', 'Salami'];
      const faces = ['🦍', '🐐', '🦅', '🐆', '🦁', '🐊', '🦈', '🐘', '🦂', '🐍', '🦍', '🐐'];
      
      const out = [];
      for (let i = 0; i < 100; i++) {
        // Top 1 is ~15 Quadrillion, Drops down to Billions at rank 100
        const baseNw = Math.pow(10, 16.2 - i * 0.065);
        const drift = baseNw * (rnd() * 0.05); 
        
        out.push({
          name: first[Math.floor(rnd() * first.length)] + ' ' + last[Math.floor(rnd() * last.length)],
          nw: Math.floor(baseNw + drift),
          emoji: faces[Math.floor(rnd() * faces.length)],
          isReal: false
        });
      }
      return out;
    }

    const Card = ({ children, className = '', gold = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      
      const [realUsers, setRealUsers] = useState([]);
      const [fakeUsers, setFakeUsers] = useState(() => generateDynamicLeaderboard());
      const [feedMsg, setFeedMsg] = useState(FEED_MESSAGES[0]);

      const [paystackKey, setPaystackKey] = useState("");
      const [topUpAmount, setTopUpAmount] = useState(1000);

      const [withdrawModal, setWithdrawModal] = useState(false);
      const [bankName, setBankName] = useState("");
      const [accountNumber, setAccountNumber] = useState("");
      const [accountName, setAccountName] = useState("");

      useEffect(() => {
        fetch('/api/config')
          .then(res => res.json())
          .then(data => setPaystackKey(data.publicKey))
          .catch(err => console.error("Could not load Paystack config", err));

        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  travels: dbData.travels || prev.travels || [],

                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: [], withdrawals: 0
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}

        const fetchRealUsers = async () => {
          try {
            const snap = await db.collection("users").orderBy("cash", "desc").limit(100).get();

            snap.forEach(doc => {
              const data = doc.data();
              const bizValue = Object.entries(data.businesses || {}).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);

            const gained = Math.floor((now - prev.lastEnergy) / ENERGY_MS);

      const nextTarget = BASE_MIN_WITHDRAW * (1 + withdrawalCount * 0.5 + (withdrawalCount * withdrawalCount) * 0.1);

        })));
        
        if (uid) {

        const handler = PaystackPop.setup({

      const NAV = [

        { label: 'Real', value: fmtReal(s.real || 0) }
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Leaderboard'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, '#' + rank.toLocaleString())
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0)),
                h('div', { className: 'px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums' }, fmtReal(s.real || 0))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            h('div', { className: 'mt-3 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/[0.05] flex items-center gap-2 overflow-hidden' },
              h('span', { className: 'text-sm shrink-0 animate-pulse' }, '📡'),
              h('div', { className: 'flex-1 overflow-hidden relative h-5' },
                h('div', { className: 'absolute text-[10.5px] font-bold text-white/60 whitespace-nowrap marquee', key: feedMsg }, feedMsg)
              )
            ),

            h(Card, { className: 'relative overflow-hidden p-4 mt-3 hero-grid', gold: true },
              h('div', { className: 'absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#FFD60A]/25 blur-3xl pointer-events-none' }),
              h('div', { className: 'relative flex items-center gap-3' },
                h('div', { className: 'w-16 h-16 rounded-2xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-3xl shrink-0 shadow-[0_8px_24px_-8px_rgba(255,214,10,0.6)]' }, '👤'),
                h('div', { className: 'flex-1 min-w-0' },
                  h('div', { className: 'flex items-center gap-1.5' },
                    h('input', {
                      value: s.name || '',
                      onChange: (e) => {
                        const val = e.target.value.slice(0, 18);
                        setS((p) => Object.assign({}, p, { name: val }));
                      },
                      onBlur: () => { if (uid) db.collection("users").doc(uid).update({ name: s.name }).catch(() => {}); },
                      className: 'bg-transparent text-[15px] font-black outline-none border-b border-transparent focus:border-[#FFD60A]/50 w-full min-w-0 font-display'
                    }),
                    s.goldName && h('span', { className: 'text-[#FFD60A] text-base shrink-0' }, '⭐')
                  ),
                  h('div', { className: 'text-[10px] font-bold text-white/45 mt-1' },
                    'Rank #' + rank.toLocaleString() + ' · ' + (s.taps || 0).toLocaleString() + ' taps · ' + (s.clout || 0).toLocaleString() + ' clout'
                  )
                )
              ),
              h('div', { className: 'mt-3 pt-3 border-t border-white/[0.08] grid grid-cols-3 gap-2 text-center' },
                statsData.map((item) =>
                  h('div', { key: item.label },
                    h('div', { className: 'text-[9px] uppercase tracking-widest text-white/35 font-bold' }, item.label),
                    h('div', { className: 'text-[12px] font-black tabular-nums mt-0.5' }, item.value)
                  )
                )
              )
            ),

            h(SectionTitle, null, 'Wallet & Payouts'),
            h(Card, { className: 'p-4' },
              h('div', { className: 'text-[11px] text-white/55 leading-relaxed' },
                'Rate: ', h('span', { className: 'text-[#FFD60A] font-bold' }, fmt(nextTarget) + ' fake = ₦10,000 real'), h('br'),
                'Payout Processing: ', h('span', { className: 'text-[#FFD60A] font-bold' }, '24-48 Hours (Manual Review)')
              ),
              h('div', { className: 'mt-3 h-2.5 rounded-full bg-white/10 overflow-hidden' },
                h('div', { className: 'h-full bg-gradient-to-r from-[#22C55E] via-[#FFD60A] to-[#FFB800] rounded-full transition-all', style: { width: Math.min(100, ((s.cash || 0) / nextTarget) * 100) + '%' } })
              ),
              h('div', { className: 'mt-2 flex justify-between text-[10px] font-bold text-white/40 tabular-nums' },
                h('span', null, fmt(s.cash || 0)),
                h('span', null, fmt(nextTarget))
              ),
              h('div', { className: 'text-[9px] text-[#FFD60A] mt-1 font-bold italic' },
                (s.cash || 0) < nextTarget ? '"Sapa dey hold you, keep hustling!"' : '"Almost don blow! Request payout now!"'
              ),
              h('button', { onClick: () => { if ((s.cash || 0) >= nextTarget) setWithdrawModal(true); else notify('You need ' + fmt(nextTarget) + ' to request a payout', 'bad'); }, disabled: (s.cash || 0) < nextTarget,
                className: 'w-full mt-3 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] py-3.5 text-[13px] font-black text-black active:scale-[0.97] transition disabled:from-white/[0.06] disabled:to-white/[0.06] disabled:text-white/30 font-display shadow-[0_8px_24px_-8px_rgba(34,197,94,0.6)] disabled:shadow-none' },
                '📥 Request ₦10,000 Payout'
              ),

              h('div', { className: 'mt-5 pt-4 border-t border-white/[0.08]' },
                h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold mb-2' }, 'Top Up Real Cash'),
                h('div', { className: 'flex gap-2' },
                  h('div', { className: 'flex-1 flex items-center bg-white/[0.05] border border-white/10 rounded-xl px-3' },
                    h('span', { className: 'text-[14px] text-white/50 font-bold' }, '₦'),
                    h('input', {
                      type: 'number',
                      value: topUpAmount || '',
                      onChange: (e) => setTopUpAmount(Math.floor(Number(e.target.value))),
                      placeholder: 'Enter amount',
                      className: 'w-full bg-transparent py-3 text-[14px] font-black text-white focus:outline-none ml-1'
                    })
                  ),
                  h('button', { onClick: topUpReal, className: 'px-4 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[12px] active:scale-95 transition' }, 'Pay Now')
                )
              )
            ),

            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, 'TOP 100') }, 'Ranking'),
            h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
              board.map((u, i) =>
                h('div', { key: i, className: 'px-3 py-2.5 flex items-center gap-2.5 ' + (u.isMe ? 'bg-[#FFD60A]/10' : '') },
                  h('div', { className: 'w-7 text-center text-[11px] font-black tabular-nums shrink-0 font-display ' +
                    (i === 0 ? 'text-[#FFD60A] text-[13px]' : i === 1 ? 'text-white/80' : i === 2 ? 'text-[#CD7F32]' : 'text-white/30') },
                    i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1
                  ),
                  h('div', { className: 'w-9 h-9 rounded-lg grid place-items-center text-base shrink-0 ' + (u.isMe ? 'bg-[#FFD60A]/20' : 'bg-white/[0.06]') }, u.emoji),
                  h('div', { className: 'flex-1 min-w-0' },
                    h('div', { className: 'text-[12px] font-extrabold truncate font-display ' + (u.isMe ? 'text-[#FFD60A]' : '') },
                      u.name + ' ', u.isMe && h('span', { className: 'text-[9px] opacity-70' }, '(you)'), u.gold && h('span', { className: 'ml-1' }, '⭐')
                    )
                  ),
                  h('div', { className: 'text-[11px] font-black tabular-nums text-white/65 shrink-0' }, fmt(u.nw))
                )
              )
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '🏆'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' },
                  'Every asset, business, and cash dey count toward your Net Worth. Push higher to climb the leaderboard. Your current status: ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, sapaTitle),
                  '.'
                )
              )
            )
          ),

          withdrawModal && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setWithdrawModal(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 shadow-2xl animate-popIn' },
              h('div', { className: 'text-3xl text-center mb-2' }, '🏦'),
              h('div', { className: 'text-center text-[14px] font-black tracking-widest text-[#FFD60A] font-display' }, 'PAYOUT REQUEST'),
              h('p', { className: 'text-center text-[10.5px] text-white/50 mt-1 mb-4' }, 'Enter your bank details. Payouts are manually verified and sent within 24-48 hours.'),
              
              h('div', { className: 'space-y-3' },
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Bank Name'),
                  h('input', { value: bankName, onChange: (e) => setBankName(e.target.value), placeholder: 'e.g. GTBank, Opay', className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/25' })
                ),
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Account Number'),
                  h('input', { type: 'number', value: accountNumber, onChange: (e) => setAccountNumber(e.target.value), placeholder: '10 digits', className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/25' })
                ),
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Account Name'),
                  h('input', { value: accountName, onChange: (e) => setAccountName(e.target.value), placeholder: 'Your real name', className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/25' })
                )
              ),
              
              h('div', { className: 'mt-5 flex gap-2' },
                h('button', { onClick: () => setWithdrawModal(false), className: 'flex-1 py-3 rounded-xl bg-white/[0.06] border border-white/10 text-white/70 text-[12px] font-bold' }, 'Cancel'),
                h('button', { onClick: submitWithdrawal, className: 'flex-1 py-3 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] text-black text-[12px] font-black' }, 'Submit Request')
              )
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
