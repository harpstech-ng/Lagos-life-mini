  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; overscroll-behavior-y: none; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .text-gradient-gold { background: linear-gradient(135deg, #FFE566 0%, #FFD60A 40%, #FFB800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    .card-gold { background: linear-gradient(135deg, rgba(255,214,10,0.12) 0%, rgba(255,184,0,0.04) 100%); border: 1px solid rgba(255,214,10,0.25); box-shadow: 0 8px 30px -10px rgba(255,214,10,0.3); }
    .card-blue { background: linear-gradient(135deg, rgba(59,130,246,0.12) 0%, rgba(29,78,216,0.04) 100%); border: 1px solid rgba(59,130,246,0.25); box-shadow: 0 8px 30px -10px rgba(59,130,246,0.3); }
    .glow-dot { box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
    .animate-slideUp { animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1); }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .nav-active-pill { background: linear-gradient(180deg, rgba(59,130,246,0.2) 0%, rgba(59,130,246,0.05) 100%); border: 1px solid rgba(59,130,246,0.35); box-shadow: 0 0 25px rgba(59,130,246,0.25); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-backdrop { background: linear-gradient(to top, #08080B 70%, rgba(8,8,11,0.85) 90%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    input { -webkit-user-select: text; user-select: text; }
    input:focus { outline: none; }
    .bbn-glow { box-shadow: 0 0 30px rgba(59,130,246,0.4); }
    .president-glow { box-shadow: 0 0 30px rgba(255,214,10,0.4); }

<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const ELECTION_COST = 500_000_000; // ₦500M
    const VOTE_COST = 10_000; // ₦10k
    const REAL_RIG_COST = 100; // ₦100 Real
    const POLL_CREATE_COST = 100; // ₦100 Real

    const FAKE_NAMES = ['Aje Butler', 'Tunde Cash', 'Bisi Gold', 'Emeka Billions', 'Ngozi Oil', 'Femi G-Wagon', 'Yemi Dubai', 'Ada Mansion'];

    const NEWS_TICKER = [
      "🚨 EFCC arrests politician for stealing yam from local market",
      "🗳️ INEC announces new rule: You must have a G-Wagon to vote",
      "🎤 President's daughter caught twerking at a rally",
      "💰 Lawmaker sprays ₦500M at his own impeachment party",
      "🚔 Police arrest ballot box snatcher, turns out to be a goat",
      "🍲 Politician promises to build a jollof rice factory if elected"
    ];

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      const tg = window && window.Telegram && window.Telegram.WebApp;
      return {
        name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
        transactions: [], isPresident: false, bbnVotes: 0
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        election: () => { init(); tone(523, 0.2, "sine", 0, 0.2); tone(659, 0.2, "sine", 0.15, 0.2); tone(783, 0.3, "sine", 0.3, 0.2); tone(1046, 0.4, "sine", 0.45, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false, blue = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : blue ? 'card-blue' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState("bbn"); // bbn, election, polls
      
      // BBN State
      const [housemates, setHousemates] = useState([
        { id: 1, name: 'Whitemoney', votes: 1200, emoji: '👨🏾‍🍳' },
        { id: 2, name: 'Liquorose', votes: 950, emoji: '💃🏾' },
        { id: 3, name: 'Pere', votes: 850, emoji: '🚶🏾‍♂️' },
        { id: 4, name: 'Angel', votes: 700, emoji: '😇' },
        { id: 5, name: 'Saga', votes: 500, emoji: '🏊🏾‍♂️' }
      ]);

      // Election State
      const [president, setPresident] = useState({ name: 'Aje Butler', isMe: false, taxRate: 500 });
      const [broadcastMsg, setBroadcastMsg] = useState('');
      
      // Polls State
      const [polls, setPolls] = useState([]);
      const [pollModalOpen, setPollModalOpen] = useState(false);
      const [pollTitle, setPollTitle] = useState('');
      const [pollOptA, setPollOptA] = useState('');
      const [pollOptB, setPollOptB] = useState('');

      // Feed
      const [feed, setFeed] = useState([
        "📢 BBNaija: Whitemoney dey lead the house with 1,200 votes!",
        "🗳️ Election season don start. Who go be the next President?"
      ]);
      const [tickerMsg, setTickerMsg] = useState(NEWS_TICKER[0]);

      // Firebase Sync
      useEffect(() => {
        const tg = window && window.Telegram && window.Telegram.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

        auth.signInAnonymously().then((cred) => {
          const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
          const userId = (tgUser && tgUser.id) ? String(tgUser.id) : cred.user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          const unsubscribe = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  transactions: dbData.transactions || [],
                  isPresident: dbData.isPresident || false,
                  bbnVotes: dbData.bbnVotes || 0
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: (tgUser && tgUser.first_name) || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
                transactions: [], isPresident: false, bbnVotes: 0
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
          return unsubscribe;
        }).catch(e => setAuthError(e.message));
      }, []);

      // Fetch Custom Polls from Firebase
      useEffect(() => {
        const unsub = db.collection("polls").orderBy("createdAt", "desc").limit(10).onSnapshot((snap) => {
          const p = [];
          snap.forEach(doc => {
            p.push(Object.assign({ id: doc.id }, doc.data()));
          });
          setPolls(p);
        }, (e) => console.error("Polls fetch error:", e));
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        const iv = setInterval(() => {
          setTickerMsg(NEWS_TICKER[Math.floor(Math.random() * NEWS_TICKER.length)]);
        }, 6000);
        return () => clearInterval(iv);
      }, []);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });
      const addFeed = (msg) => setFeed(prev => [msg, ...prev].slice(0, 20));

      const updateUser = async (data) => {
        setS(prev => Object.assign({}, prev, data));
        if (uid) {
          await db.collection("users").doc(uid).update(Object.assign({}, data, { lastSeen: Date.now() })).catch(() => {});
        }
      };

      // --- BBN ACTIONS ---
      const voteBBN = (housemate) => {
        if (s.cash < VOTE_COST) { AudioEngine.error(); return notify('You need ₦10k to vote 💸', 'bad'); }
        
        updateUser({ cash: s.cash - VOTE_COST, bbnVotes: (s.bbnVotes || 0) + 1 });
        AudioEngine.coin();
        notify('You voted for ' + housemate.name + '! 🗳️');
        
        setHousemates(prev => {
          const updated = prev.map(hm => 
            hm.id === housemate.id ? Object.assign({}, hm, { votes: hm.votes + 1 }) : hm
          );
          return updated.sort((a, b) => b.votes - a.votes);
        });

        addFeed('🗳️ ' + (s.name || 'You') + ' just voted for ' + housemate.name + ' in the BBN house!');
      };

      const rigBBN = (housemate) => {
        if ((s.real || 0) < REAL_RIG_COST) { AudioEngine.error(); return notify('Need ₦100 Real to rig 💸', 'bad'); }
        
        updateUser({ real: s.real - REAL_RIG_COST, bbnVotes: (s.bbnVotes || 0) + 10000 });
        AudioEngine.election();
        notify('RIGGED! +10,000 votes for ' + housemate.name + ' 🚨');
        
        setHousemates(prev => {
          const updated = prev.map(hm => 
            hm.id === housemate.id ? Object.assign({}, hm, { votes: hm.votes + 10000 }) : hm
          );
          return updated.sort((a, b) => b.votes - a.votes);
        });

        addFeed('🚨 ELECTION RIGGED: ' + (s.name || 'You') + ' just bought 10,000 votes for ' + housemate.name + '!');
      };

      // --- ELECTION ACTIONS ---
      const contestElection = () => {
        if (s.cash < ELECTION_COST) { AudioEngine.error(); return notify('You need ₦500M to contest 🚫', 'bad'); }
        
        updateUser({ cash: s.cash - ELECTION_COST, isPresident: true });
        setPresident({ name: s.name || 'You', isMe: true, taxRate: 500 });
        
        AudioEngine.election();
        notify('👑 YOU ARE NOW THE PRESIDENT!');
        addFeed('🚨 BREAKING: ' + (s.name || 'You') + ' just won the Presidential Election!');
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); } catch(e) {}
      };

      const rigElection = () => {
        if ((s.real || 0) < 1000) { AudioEngine.error(); return notify('Need ₦1,000 Real to rig election 🚫', 'bad'); }
        
        updateUser({ real: s.real - 1000, isPresident: true });
        setPresident({ name: s.name || 'You', isMe: true, taxRate: 500 });
        
        AudioEngine.election();
        notify('👑 YOU RIGGED THE ELECTION AND WON!');
        addFeed('🚨 BREAKING: ' + (s.name || 'You') + ' just rigged the election with real money and is now President!');
      };

      const sendBroadcast = () => {
        if (!s.isPresident) return;
        if (!broadcastMsg.trim()) return notify('Type a message first', 'bad');
        
        addFeed('📢 PRESIDENTIAL BROADCAST: "' + broadcastMsg + '" — ' + (s.name || 'President'));
        notify('Broadcast sent to all hustlers! 📢');
        setBroadcastMsg('');
        AudioEngine.coin();
      };

      const increaseTax = () => {
        if (!s.isPresident) return;
        const newRate = president.taxRate + 100;
        setPresident(Object.assign({}, president, { taxRate: newRate }));
        addFeed('🚨 PRESIDENTIAL DECREE: Agbero Tax don increase to ₦' + newRate + '! Everyone must pay!');
        notify('Agbero Tax increased to ₦' + newRate + ' 📈');
        AudioEngine.tap();
      };

      // --- CUSTOM POLLS ACTIONS ---
      const createPoll = async () => {
        if (!pollTitle.trim() || !pollOptA.trim() || !pollOptB.trim()) return notify('Fill all fields', 'bad');
        if ((s.real || 0) < POLL_CREATE_COST) { AudioEngine.error(); return notify('Need ₦100 Real to create poll', 'bad'); }
        
        updateUser({ real: s.real - POLL_CREATE_COST });
        
        await db.collection("polls").add({
          title: pollTitle,
          optA: pollOptA,
          votesA: 0,
          optB: pollOptB,
          votesB: 0,
          creator: s.name || 'Hustler',
          createdAt: Date.now()
        });

        setPollModalOpen(false);
        setPollTitle(''); setPollOptA(''); setPollOptB('');
        AudioEngine.election();
        notify('Poll created successfully! 🗳️');
      };

      const votePoll = async (pollId, option) => {
        if (s.cash < VOTE_COST) { AudioEngine.error(); return notify('Need ₦10K fake', 'bad'); }
        updateUser({ cash: s.cash - VOTE_COST });
        
        const updateObj = {};
        if (option === 'A') updateObj.votesA = firebase.firestore.FieldValue.increment(1);
        else updateObj.votesB = firebase.firestore.FieldValue.increment(1);
        
        await db.collection("polls").doc(pollId).update(updateObj).catch(() => {});
        AudioEngine.coin();
        notify('Vote cast! 🗳️');
      };

      const rigPoll = async (pollId, option) => {
        if ((s.real || 0) < REAL_RIG_COST) { AudioEngine.error(); return notify('Need ₦100 Real to rig', 'bad'); }
        updateUser({ real: s.real - REAL_RIG_COST });
        
        const updateObj = {};
        if (option === 'A') updateObj.votesA = firebase.firestore.FieldValue.increment(1000);
        else updateObj.votesB = firebase.firestore.FieldValue.increment(1000);
        
        await db.collection("polls").doc(pollId).update(updateObj).catch(() => {});
        AudioEngine.election();
        notify('Rigged! +1,000 votes 🚨');
      };

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' }, h('div', { className: 'text-4xl' }, '⚠️'), h('div', { className: 'font-bold' }, 'Auth Error'), h('div', { className: 'text-sm' }, authError));

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-blue-500 selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-blue-400 to-blue-600 grid place-items-center text-white font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(59,130,246,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-blue-400/80 leading-none font-display' }, 'Politics & BBN'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-blue-500/15 border border-blue-500/30 text-blue-400 text-[10px] font-extrabold tabular-nums' }, '🗳️ ' + (s.bbnVotes || 0))
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            // FAKE NEWS TICKER
            h('div', { className: 'mt-3 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/[0.05] flex items-center gap-2 overflow-hidden' },
              h('span', { className: 'text-sm shrink-0 animate-pulse' }, '📡'),
              h('div', { className: 'flex-1 overflow-hidden relative h-5' },
                h('div', { className: 'absolute text-[10.5px] font-bold text-blue-400 whitespace-nowrap marquee', key: tickerMsg }, tickerMsg)
              )
            ),

            // TABS
            h('div', { className: 'mt-3 flex gap-1 bg-white/[0.04] p-1 rounded-xl border border-white/[0.06]' },
              ['bbn', 'election', 'polls'].map(tab => 
                h('button', {
                  key: tab,
                  onClick: () => { setActiveTab(tab); AudioEngine.tap(); },
                  className: 'flex-1 py-2 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all ' + 
                    (activeTab === tab ? 'bg-gradient-to-b from-blue-400 to-blue-600 text-white shadow-md' : 'text-white/50')
                }, tab === 'bbn' ? '📺 BBN' : tab === 'election' ? '🎩 Election' : '🗳️ Polls')
              )
            ),

            // --- BBN TAB ---
            activeTab === 'bbn' && h('div', { className: 'mt-4' },
              h(Card, { className: 'p-4 text-center', blue: true },
                h('div', { className: 'text-4xl mb-1' }, '📺'),
                h('div', { className: 'text-[15px] font-black text-white font-display' }, 'BIG BROTHER LAGOS HOUSE'),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Top 5 Housemates. Vote or Rig the election!')
              ),

              h(SectionTitle, null, 'Housemates'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
                housemates.map((hm, i) => 
                  h('div', { key: hm.id, className: 'px-3 py-2 flex flex-col gap-1.5' },
                    h('div', { className: 'flex items-center gap-2' },
                      h('div', { className: 'w-6 text-center text-[11px] font-black tabular-nums shrink-0 font-display ' +
                        (i === 0 ? 'text-[#FFD60A]' : 'text-white/30') }, i + 1),
                      h('div', { className: 'w-8 h-8 rounded-full bg-white/[0.06] grid place-items-center text-sm shrink-0' }, hm.emoji),
                      h('div', { className: 'flex-1 min-w-0' },
                        h('div', { className: 'text-[12px] font-extrabold truncate font-display' }, hm.name),
                        h('div', { className: 'text-[9px] text-white/40 tabular-nums' }, hm.votes.toLocaleString() + ' votes')
                      )
                    ),
                    h('div', { className: 'grid grid-cols-2 gap-1.5 ml-8' },
                      h('button', { onClick: () => voteBBN(hm), className: 'py-1 rounded-lg bg-blue-500/20 text-blue-400 text-[9px] font-black active:scale-95 transition' }, 'Vote (₦10K)'),
                      h('button', { onClick: () => rigBBN(hm), className: 'py-1 rounded-lg bg-red-500/20 text-red-400 text-[9px] font-black active:scale-95 transition' }, 'Rig (₦100)')
                    )
                  )
                )
              )
            ),

            // --- ELECTION TAB ---
            activeTab === 'election' && h('div', { className: 'mt-4' },
              h(Card, { className: 'p-5 text-center', gold: true },
                h('div', { className: 'text-5xl mb-2' }, '🎩'),
                h('div', { className: 'text-[10px] uppercase tracking-widest text-[#FFD60A]/70 font-bold' }, 'Current President'),
                h('div', { className: 'text-2xl font-black text-gradient-gold font-display mt-1' }, president.name),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Agbero Tax Rate: ₦' + president.taxRate)
              ),

              !s.isPresident && h('div', { className: 'mt-4 space-y-2' },
                h(Card, { className: 'p-4' },
                  h('button', { onClick: contestElection, className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[13px] active:scale-95 transition' }, 'Contest Election (₦500M Fake)'),
                  h('button', { onClick: rigElection, className: 'w-full mt-2 py-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 font-black text-[13px] active:scale-95 transition' }, 'Rig Election (₦1,000 Real)')
                )
              ),

              s.isPresident && h('div', { className: 'mt-4' },
                h(Card, { className: 'p-4 border border-[#FFD60A]/40' },
                  h('div', { className: 'text-[12px] font-black text-[#FFD60A] mb-2' }, '👑 Presidential Powers'),
                  h('div', { className: 'flex gap-2 mb-2' },
                    h('input', { value: broadcastMsg, onChange: (e) => setBroadcastMsg(e.target.value), placeholder: 'Broadcast...', className: 'flex-1 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2 text-[11px]' }),
                    h('button', { onClick: sendBroadcast, className: 'px-3 rounded-xl bg-[#FFD60A] text-black font-black text-[10px]' }, 'Send')
                  ),
                  h('button', { onClick: increaseTax, className: 'w-full py-2 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 text-[10px] font-bold' }, 'Increase Tax')
                )
              )
            ),

            // --- POLLS TAB ---
            activeTab === 'polls' && h('div', { className: 'mt-4' },
              h('button', { onClick: () => setPollModalOpen(true), className: 'w-full py-3 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white font-black text-[13px] shadow-[0_8px_24px_-8px_rgba(59,130,246,0.7)] active:scale-95 transition mb-4' }, '➕ Create Custom Poll (₦100 Real)'),
              
              polls.length === 0 ? h('div', { className: 'text-center text-white/40 text-[11px] py-6' }, 'No polls yet. Be the first to create one!') :
              h('div', { className: 'space-y-3' },
                polls.map(p => 
                  h(Card, { key: p.id, className: 'p-4' },
                    h('div', { className: 'text-[12px] font-black text-white mb-1' }, p.title),
                    h('div', { className: 'text-[9px] text-white/40 mb-3' }, 'By ' + p.creator),
                    h('div', { className: 'space-y-2' },
                      h('div', { className: 'flex items-center justify-between bg-white/[0.03] p-2 rounded-lg' },
                        h('div', { className: 'text-[11px] font-bold' }, p.optA + ' (' + p.votesA + ')'),
                        h('div', { className: 'flex gap-1' },
                          h('button', { onClick: () => votePoll(p.id, 'A'), className: 'px-2 py-1 rounded bg-blue-500/20 text-blue-400 text-[9px] font-bold' }, 'Vote'),
                          h('button', { onClick: () => rigPoll(p.id, 'A'), className: 'px-2 py-1 rounded bg-red-500/20 text-red-400 text-[9px] font-bold' }, 'Rig')
                        )
                      ),
                      h('div', { className: 'flex items-center justify-between bg-white/[0.03] p-2 rounded-lg' },
                        h('div', { className: 'text-[11px] font-bold' }, p.optB + ' (' + p.votesB + ')'),
                        h('div', { className: 'flex gap-1' },
                          h('button', { onClick: () => votePoll(p.id, 'B'), className: 'px-2 py-1 rounded bg-blue-500/20 text-blue-400 text-[9px] font-bold' }, 'Vote'),
                          h('button', { onClick: () => rigPoll(p.id, 'B'), className: 'px-2 py-1 rounded bg-red-500/20 text-red-400 text-[9px] font-bold' }, 'Rig')
                        )
                      )
                    )
                  )
                )
              )
            ),

            // LIVE FEED
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-blue-400 flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse glow-dot' }), 'LIVE') }, 'Political Feed'),
            h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden min-h-[150px]' },
              feed.map((f, i) => h('div', { key: i, className: 'px-4 py-3 text-[11px] text-white/70 animate-slideDown' }, f))
            )
          ),

          // Navigation
          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-blue-400 nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          // CREATE POLL MODAL
          pollModalOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => setPollModalOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-blue-500/30 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'text-[14px] font-black text-blue-400 mb-4 text-center' }, 'CREATE POLL'),
              h('input', { value: pollTitle, onChange: (e) => setPollTitle(e.target.value), placeholder: 'Question (e.g. Who is the richest?)', className: 'w-full mb-2 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('input', { value: pollOptA, onChange: (e) => setPollOptA(e.target.value), placeholder: 'Option A', className: 'w-full mb-2 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('input', { value: pollOptB, onChange: (e) => setPollOptB(e.target.value), placeholder: 'Option B', className: 'w-full mb-4 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('div', { className: 'flex gap-2' },
                h('button', { onClick: () => setPollModalOpen(false), className: 'flex-1 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/70 text-[11px] font-bold' }, 'Cancel'),
                h('button', { onClick: createPoll, className: 'flex-1 py-2.5 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white text-[11px] font-black' }, 'Create (₦100)')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-blue-400 to-blue-600 text-white')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
