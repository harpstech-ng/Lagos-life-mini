<body>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect, useRef } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const ELECTION_COST = 500_000_000; // ₦500M
    const VOTE_COST = 10_000; // ₦10k

    const FAKE_NAMES = ['Aje Butler', 'Tunde Cash', 'Bisi Gold', 'Emeka Billions', 'Ngozi Oil', 'Femi G-Wagon', 'Yemi Dubai', 'Ada Mansion'];

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      const tg = window && window.Telegram && window.Telegram.WebApp;
      return {
        name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
        transactions: [], isPresident: false, bbnVotes: 0
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };

    /* ═══ AUDIO ENGINE ═══ */
    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        election: () => { init(); tone(523, 0.2, "sine", 0, 0.2); tone(659, 0.2, "sine", 0.15, 0.2); tone(783, 0.3, "sine", 0.3, 0.2); tone(1046, 0.4, "sine", 0.45, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false, blue = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : blue ? 'card-blue' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState("bbn"); // bbn, election
      
      // BBN State
      const [housemates, setHousemates] = useState([
        { id: 1, name: 'Whitemoney', votes: 1200, emoji: '👨🏾‍🍳' },
        { id: 2, name: 'Liquorose', votes: 950, emoji: '💃🏾' },
        { id: 3, name: 'Pere', votes: 850, emoji: '🚶🏾‍♂️' },
        { id: 4, name: 'Angel', votes: 700, emoji: '😇' },
        { id: 5, name: 'Saga', votes: 500, emoji: '🏊🏾‍♂️' }
      ]);

      // Election State
      const [president, setPresident] = useState({ name: 'Aje Butler', isMe: false, taxRate: 500 });
      const [broadcastMsg, setBroadcastMsg] = useState('');
      const [feed, setFeed] = useState([
        "📢 BBNaija: Whitemoney dey lead the house with 1,200 votes!",
        "🗳️ Election season don start. Who go be the next President?"
      ]);

      // Firebase Sync
      useEffect(() => {
        const tg = window && window.Telegram && window.Telegram.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

        auth.signInAnonymously().then((cred) => {
          const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
          const userId = (tgUser && tgUser.id) ? String(tgUser.id) : cred.user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          const unsubscribe = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  transactions: dbData.transactions || [],
                  isPresident: dbData.isPresident || false,
                  bbnVotes: dbData.bbnVotes || 0
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: (tgUser && tgUser.first_name) || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
                transactions: [], isPresident: false, bbnVotes: 0
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
          return unsubscribe;
        }).catch(e => setAuthError(e.message));
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });
      const addFeed = (msg) => setFeed(prev => [msg, ...prev].slice(0, 20));

      const updateUser = async (data) => {
        setS(prev => Object.assign({}, prev, data));
        if (uid) {
          await db.collection("users").doc(uid).update(Object.assign({}, data, { lastSeen: Date.now() })).catch(() => {});
        }
      };

      const voteBBN = (housemate) => {
        if (s.cash < VOTE_COST) { AudioEngine.error(); return notify('You need ₦10k to vote 💸', 'bad'); }
        
        updateUser({ cash: s.cash - VOTE_COST, bbnVotes: (s.bbnVotes || 0) + 1 });
        AudioEngine.coin();
        notify('You voted for ' + housemate.name + '! 🗳️');
        
        // Update local housemate votes
        setHousemates(prev => prev.map(hm => 
          hm.id === housemate.id ? Object.assign({}, hm, { votes: hm.votes + 1 }) : hm
        ).sort((a, b) => b.votes - a.votes));

        addFeed('🗳️ ' + (s.name || 'You') + ' just voted for ' + housemate.name + ' in the BBN house!');
      };

      const contestElection = () => {
        if (s.cash < ELECTION_COST) { AudioEngine.error(); return notify('You need ₦500M to contest 🚫', 'bad'); }
        
        updateUser({ 
          cash: s.cash - ELECTION_COST, 
          isPresident: true 
        });
        
        setPresident({ name: s.name || 'You', isMe: true, taxRate: 500 });
        
        AudioEngine.election();
        notify('👑 YOU ARE NOW THE PRESIDENT OF LAGOS LIFE MINI!');
        addFeed('🚨 BREAKING: ' + (s.name || 'You') + ' just won the Presidential Election and is now the President!');
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); } catch(e) {}
      };

      const sendBroadcast = () => {
        if (!s.isPresident) return;
        if (!broadcastMsg.trim()) return notify('Type a message first', 'bad');
        
        addFeed('📢 PRESIDENTIAL BROADCAST: "' + broadcastMsg + '" — ' + (s.name || 'President'));
        notify('Broadcast sent to all hustlers! 📢');
        setBroadcastMsg('');
        AudioEngine.coin();
        try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); } catch(e) {}
      };

      const increaseTax = () => {
        if (!s.isPresident) return;
        const newRate = president.taxRate + 100;
        setPresident(Object.assign({}, president, { taxRate: newRate }));
        addFeed('🚨 PRESIDENTIAL DECREE: Agbero Tax don increase to ₦' + newRate + '! Everyone must pay!');
        notify('Agbero Tax increased to ₦' + newRate + ' 📈');
        AudioEngine.tap();
      };

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' }, h('div', { className: 'text-4xl' }, '⚠️'), h('div', { className: 'font-bold' }, 'Auth Error'), h('div', { className: 'text-sm' }, authError));

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: '#' },
      ];
      const MORE_PAGES = [
        { id: 'bet', label: 'Bet Center', icon: '🎰', desc: 'Aviator, Bet9ja, Whot', href: 'bet.html' },
        { id: 'babe', label: 'Babe Wahala', icon: '👩🏾‍❤️‍👨🏾', desc: 'Billing, DNA Test, Breakup', href: 'babe.html' },
        { id: 'vip', label: 'Big Boys Lounge', icon: '👑', desc: 'VIP, Geh Geh, Gold Name', href: 'vip.html' },
        { id: 'politics', label: 'Politics & BBN', icon: '🎩', desc: 'Elections, Big Brother', href: 'politics.html' },
        { id: 'madness', label: 'Madness & Ritual', icon: '🍃', desc: 'Smoke Loud, Ritual, Kidnap', href: 'madness.html' },
        { id: 'travel', label: 'Travel', icon: '✈️', desc: 'Japa from Mushin', href: 'travel.html' },
        { id: 'street', label: 'Street', icon: '🥷', desc: 'Rob, beg, tax, spray', href: 'street.html' },
        { id: 'leaderboard', label: 'Ranks & Wallet', icon: '🏆', desc: 'Top 100 + withdraw', href: 'leaderboard.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-blue-500 selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-blue-400 to-blue-600 grid place-items-center text-white font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(59,130,246,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-blue-400/80 leading-none font-display' }, 'Politics & BBN'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )

              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-blue-500/15 border border-blue-500/30 text-blue-400 text-[10px] font-extrabold tabular-nums' }, '🗳️ ' + (s.bbnVotes || 0) + ' Votes')
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            // TABS
            h('div', { className: 'mt-3 flex gap-2 bg-white/[0.04] p-1 rounded-xl border border-white/[0.06]' },
              ['bbn', 'election'].map(tab => 
                h('button', {
                  key: tab,
                  onClick: () => { setActiveTab(tab); AudioEngine.tap(); },
                  className: 'flex-1 py-2 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all ' + 
                    (activeTab === tab ? 'bg-gradient-to-b from-blue-400 to-blue-600 text-white shadow-md' : 'text-white/50')
                }, tab === 'bbn' ? '📺 Big Brother' : '🎩 Election')
              )
            ),

            // --- BBN TAB ---
            activeTab === 'bbn' && h('div', { className: 'mt-4' },
              h(Card, { className: 'p-4 text-center', blue: true },
                h('div', { className: 'text-4xl mb-1' }, '📺'),
                h('div', { className: 'text-[15px] font-black text-white font-display' }, 'BIG BROTHER LAGOS HOUSE'),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Top 5 Housemates. Vote for your favorite to win ₦100M!')
              ),

              h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, 'Vote ₦10K') }, 'Housemates'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden' },
                housemates.map((hm, i) => 
                  h('div', { key: hm.id, className: 'px-3.5 py-3 flex items-center gap-3' },
                    h('div', { className: 'w-7 text-center text-[11px] font-black tabular-nums shrink-0 font-display ' +
                      (i === 0 ? 'text-[#FFD60A] text-[13px]' : i === 1 ? 'text-white/80' : i === 2 ? 'text-[#CD7F32]' : 'text-white/30') },
                      i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1
                    ),
                    h('div', { className: 'w-10 h-10 rounded-full bg-white/[0.06] grid place-items-center text-lg shrink-0' }, hm.emoji),
                    h('div', { className: 'flex-1 min-w-0' },
                      h('div', { className: 'text-[13px] font-extrabold truncate font-display' }, hm.name),
                      h('div', { className: 'text-[10px] text-white/40 tabular-nums' }, hm.votes.toLocaleString() + ' votes')
                    ),
                    h('button', { onClick: () => voteBBN(hm), className: 'shrink-0 px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-400 text-[10px] font-black border border-blue-500/30 active:scale-95 transition' }, 'VOTE')
                  )
                )
              ),

              h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-blue-400 flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse glow-dot' }), 'LIVE') }, 'BBN Feed'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden min-h-[150px]' },
                feed.length === 0 ? h('div', { className: 'px-4 py-6 text-center text-[11px] text-white/30' }, 'No drama yet.') :
                feed.map((f, i) => h('div', { key: i, className: 'px-4 py-3 text-[11px] text-white/70 animate-slideDown' }, f))
              )
            ),

            // --- ELECTION TAB ---
            activeTab === 'election' && h('div', { className: 'mt-4' },
              h(Card, { className: 'p-5 text-center', gold: true },
                h('div', { className: 'text-5xl mb-2' }, '🎩'),
                h('div', { className: 'text-[10px] uppercase tracking-widest text-[#FFD60A]/70 font-bold' }, 'Current President'),
                h('div', { className: 'text-2xl font-black text-gradient-gold font-display mt-1' }, president.name),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Agbero Tax Rate: ₦' + president.taxRate)
              ),

              !s.isPresident && h('div', { className: 'mt-4' },
                h(Card, { className: 'p-4' },
                  h('p', { className: 'text-[11px] text-white/50 leading-relaxed mb-3' },
                    'Pay ₦500M to contest the election. If you win, you become the President for 30 days and gain exclusive powers.'
                  ),
                  h('button', { onClick: contestElection, className: 'w-full py-3.5 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black font-black text-[13px] shadow-[0_8px_24px_-8px_rgba(255,214,10,0.7)] active:scale-95 transition' }, 'Contest for President (₦500M)')
                )
              ),

              s.isPresident && h('div', { className: 'mt-4 space-y-3' },
                h(Card, { className: 'p-4 border border-[#FFD60A]/40' },
                  h('div', { className: 'text-[12px] font-black text-[#FFD60A] mb-2' }, '👑 Presidential Powers'),
                  h('p', { className: 'text-[10px] text-white/50 mb-3' }, 'You are the President. Use your powers wisely (or wickedly).'),
                  
                  h('div', { className: 'space-y-2' },
                    h('div', null,
                      h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Presidential Broadcast'),
                      h('div', { className: 'flex gap-2 mt-1' },
                        h('input', { 
                          value: broadcastMsg, onChange: (e) => setBroadcastMsg(e.target.value), placeholder: 'My people of Lagos Life...',
                          className: 'flex-1 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] text-white focus:border-[#FFD60A]/50 transition'
                        }),
                        h('button', { onClick: sendBroadcast, className: 'px-4 rounded-xl bg-[#FFD60A] text-black font-black text-[11px] active:scale-95 transition' }, 'Send')
                      )
                    ),
                    h('button', { onClick: increaseTax, className: 'w-full py-2.5 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 text-[11px] font-bold active:scale-95 transition' }, 'Increase Agbero Tax (+₦100)')
                  )
                )
              ),

              h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-[#FFD60A] flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#FFD60A] animate-pulse glow-dot' }), 'LIVE') }, 'Political Feed'),
              h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden min-h-[150px]' },
                feed.length === 0 ? h('div', { className: 'px-4 py-6 text-center text-[11px] text-white/30' }, 'No political drama yet.') :
                feed.map((f, i) => h('div', { key: i, className: 'px-4 py-3 text-[11px] text-white/70 animate-slideDown' }, f))
              )
            )
          ),

          // Navigation
          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  onClick: (e) => { if (n.id === 'more') { e.preventDefault(); const el = document.getElementById('more-sheet'); if (el) el.classList.remove('hidden'); } },
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-blue-400 nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),
          h('div', { id: 'more-sheet', className: 'hidden fixed inset-0 z-50 flex items-end justify-center' },
            h('div', { className: 'absolute inset-0 bg-black/70 backdrop-blur-sm', onClick: () => { const el = document.getElementById('more-sheet'); if (el) el.classList.add('hidden'); } }),
            h('div', { className: 'relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp', onClick: (e) => e.stopPropagation() },
              h('div', { className: 'w-10 h-1 rounded-full bg-white/15 mx-auto mb-4' }),
              h('div', { className: 'space-y-2 max-h-[70vh] overflow-y-auto' },
                MORE_PAGES.map((m) =>
                  h('a', { key: m.id, href: m.href, className: 'w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left' },
                    h('div', { className: 'w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0' }, m.icon),
                    h('div', { className: 'min-w-0' },
                      h('div', { className: 'text-[13px] font-extrabold font-display' }, m.label),
                      h('div', { className: 'text-[10px] text-white/40 font-bold mt-0.5' }, m.desc)
                    )
                  )
                )
              )
            )
          ),
          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-blue-400 to-blue-600 text-white')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
