<!DOCTYPE html>
<html lang="en">

    tailwind.config = {
      theme: { extend: {
        colors: { gold: '#FFD60A', gold2: '#FFB800', ink: '#08080B', red: '#EF4444', blue: '#3B82F6' },

  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; overscroll-behavior-y: contain; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { margin: 0; padding: 0; background: #08080B; color: #fff; overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; }
    body { background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.1), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,214,10,0.06), transparent); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .font-display { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .text-gradient-gold { background: linear-gradient(135deg, #FFE566 0%, #FFD60A 40%, #FFB800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card-gradient { background: linear-gradient(135deg, #15151D 0%, #0F0F15 100%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5); }
    .card-gold { background: linear-gradient(135deg, rgba(255,214,10,0.12) 0%, rgba(255,184,0,0.04) 100%); border: 1px solid rgba(255,214,10,0.25); box-shadow: 0 8px 30px -10px rgba(255,214,10,0.3); }
    .card-blue { background: linear-gradient(135deg, rgba(59,130,246,0.12) 0%, rgba(29,78,216,0.04) 100%); border: 1px solid rgba(59,130,246,0.25); box-shadow: 0 8px 30px -10px rgba(59,130,246,0.3); }
    .glow-dot { box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes presidentGlow { 0%,100% { box-shadow: 0 0 20px rgba(255,214,10,0.4); } 50% { box-shadow: 0 0 40px rgba(255,214,10,0.8); } }
    @keyframes livePulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1); }
    .animate-popIn { animation: popIn 0.32s cubic-bezier(0.22,1,0.36,1); }
    .animate-president { animation: presidentGlow 2s ease-in-out infinite; }
    .animate-live { animation: livePulse 1.5s ease-in-out infinite; }
    .nav-active-pill { background: linear-gradient(180deg, rgba(59,130,246,0.2) 0%, rgba(59,130,246,0.05) 100%); border: 1px solid rgba(59,130,246,0.35); box-shadow: 0 0 25px rgba(59,130,246,0.25); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-backdrop { background: #08080B; }
    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    input { -webkit-user-select: text; user-select: text; }
    input:focus { outline: none; }
    .marquee { animation: marquee 20s linear infinite; white-space: nowrap; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .presidential-crown { filter: drop-shadow(0 0 10px rgba(255,214,10,0.8)); }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .position-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 5px; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) { console.error('Global error:', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { console.error('Unhandled rejection:', e.reason); });
  </script>

  <script>
    const { useState, useEffect, useRef, useMemo } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const CYCLE_MS = 24 * 60 * 60 * 1000;

    // Election costs
    const CANDIDACY_COST_FAKE = 1_000_000_000;
    const CANDIDACY_COST_REAL = 500;
    const VOTE_COST_FAKE = 10_000;
    const RIG_COST_REAL = 100;
    const POLL_CREATE_COST = 100;

    const BBN_VOTE_COST = 10_000;
    const BBN_RIG_COST = 100;

    // ✅ Quota-safe config
    const POLLS_REFRESH_MS = 60000;       // polls auto-refresh every 60s
    const BROADCASTS_REFRESH_MS = 60000;  // broadcasts auto-refresh every 60s

    const NEWS_TICKER = [
      "🚨 EFCC arrests politician for stealing yam from local market",
      "🗳️ INEC announces new rule: You must have a G-Wagon to vote",
      "🎤 President's daughter caught twerking at a rally",
      "💰 Lawmaker sprays ₦500M at his own impeachment party",
      "🚔 Police arrest ballot box snatcher, turns out to be a goat",
      "🍲 Politician promises to build a jollof rice factory if elected",
      "🏛️ Lagos State Assembly passes bill to make Agbero a certified profession",
      "📺 BBN: Housemates fight over last piece of chicken"
    ];

    const BBN_HOUSEMATES_BASE = [
      { id: 'white', name: 'Whitemoney', emoji: '👨🏾‍🍳' },
      { id: 'liquor', name: 'Liquorose', emoji: '💃🏾' },
      { id: 'pere', name: 'Pere', emoji: '🚶🏾‍♂️' },
      { id: 'angel', name: 'Angel', emoji: '😇' },
      { id: 'saga', name: 'Saga', emoji: '🏊🏾‍♂️' },
    ];

    const POSITIONS = [
      { rank: 1, title: 'President', emoji: '👑', color: '#FFD60A', passive: '₦10M/hr' },
      { rank: 2, title: 'Vice President', emoji: '🎖️', color: '#C0C0C0', passive: '₦5M/hr' },
      { rank: 3, title: 'Governor', emoji: '🏛️', color: '#CD7F32', passive: '₦3M/hr' },
      { rank: 4, title: 'Senator', emoji: '⚖️', color: '#A855F7', passive: '₦1M/hr' },
    ];

    const getPosition = (rank) => {
      if (rank === 1) return POSITIONS[0];
      if (rank === 2) return POSITIONS[1];
      if (rank === 3) return POSITIONS[2];
      if (rank <= 10) return POSITIONS[3];
      return null;
    };

    const getCycleId = () => Math.floor(Date.now() / CYCLE_MS);
    const getCycleEnd = () => (getCycleId() + 1) * CYCLE_MS;
    const formatTimeLeft = (ms) => {
      if (ms <= 0) return 'ENDED';
      const hrs = Math.floor(ms / 3600000);
      const mins = Math.floor((ms % 3600000) / 60000);
      const secs = Math.floor((ms % 60000) / 1000);
      return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    };

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) {
          const parsed = JSON.parse(cached);
          return Object.assign({}, parsed, { bbnVotes: parsed.bbnVotes || 0, electionCycle: parsed.electionCycle || 0, politicalRank: parsed.politicalRank || '' });
        }
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
        taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
        transactions: [], bbnVotes: 0, electionCycle: 0, politicalRank: ''
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        election: () => { init(); tone(523, 0.2, "sine", 0, 0.2); tone(659, 0.2, "sine", 0.15, 0.2); tone(783, 0.3, "sine", 0.3, 0.2); tone(1046, 0.4, "sine", 0.45, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false, blue = false }) =>
      h('div', { className: 'rounded-2xl ' + (gold ? 'card-gold' : blue ? 'card-blue' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState("election");
      const [nowTick, setNowTick] = useState(Date.now());

      // ✅ NEW: Page visibility — pauses snapshots when hidden
      const [isPageVisible, setIsPageVisible] = useState(!document.hidden);
      useEffect(() => {
        const handler = () => setIsPageVisible(!document.hidden);
        document.addEventListener('visibilitychange', handler);
        return () => document.removeEventListener('visibilitychange', handler);
      }, []);

      // Election state
      const [candidates, setCandidates] = useState([]);
      const [candidacyOpen, setCandidacyOpen] = useState(false);
      const [partyName, setPartyName] = useState('');
      const [motto, setMotto] = useState('');
      const [voteModalCand, setVoteModalCand] = useState(null);

      // Broadcasts — get() based, not onSnapshot
      const [broadcasts, setBroadcasts] = useState([]);
      const [broadcastText, setBroadcastText] = useState('');
      const [broadcastsLoading, setBroadcastsLoading] = useState(false);

      // BBN
      const [bbnHousemates, setBbnHousemates] = useState(BBN_HOUSEMATES_BASE.map(h => ({ ...h, votes: 0 })));

      // Polls — get() based, not onSnapshot
      const [polls, setPolls] = useState([]);
      const [pollsLoading, setPollsLoading] = useState(false);
      const [pollModalOpen, setPollModalOpen] = useState(false);
      const [pollTitle, setPollTitle] = useState('');
      const [pollOptA, setPollOptA] = useState('');
      const [pollOptB, setPollOptB] = useState('');

      const [feed, setFeed] = useState([]);
      const [tickerMsg, setTickerMsg] = useState(NEWS_TICKER[0]);

      const stateRef = useRef(s);
      useEffect(() => { stateRef.current = s; }, [s]);

      const cycleId = getCycleId();
      const cycleEnd = getCycleEnd();

      // Tick
      useEffect(() => {
        const iv = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(iv);
      }, []);

      // Auth
      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  transactions: dbData.transactions || [],
                  bbnVotes: dbData.bbnVotes || 0,
                  electionCycle: dbData.electionCycle || 0,
                  politicalRank: dbData.politicalRank || ''
                });
                stateRef.current = newData;
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], street: {},
                taps: 0, clout: 0, goldName: false, isVip: false, lastSeen: Date.now(),
                transactions: [], bbnVotes: 0, electionCycle: 0, politicalRank: ''
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              stateRef.current = defaultData;
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => { authUnsub(); if (userUnsub) userUnsub(); };
      }, []);

      // ✅ ELECTION onSnapshot — only when: page visible + election tab active
      useEffect(() => {
        if (!uid) return;
        if (!isPageVisible) return;
        if (activeTab !== 'election') return;

        const unsub = db.collection("election_candidates")
          .where("cycleId", "==", cycleId)
          .orderBy("votes", "desc")
          .limit(20)
          .onSnapshot((snap) => {
            const cands = [];
            snap.forEach(doc => cands.push({ id: doc.id, ...doc.data() }));
            setCandidates(cands);
          }, (err) => {
            console.error("Election error:", err);
            // Fallback: query without orderBy
            db.collection("election_candidates").where("cycleId", "==", cycleId).limit(20).get().then((fallbackSnap) => {
              const cands = [];
              fallbackSnap.forEach(doc => cands.push({ id: doc.id, ...doc.data() }));
              cands.sort((a, b) => (b.votes || 0) - (a.votes || 0));
              setCandidates(cands);
            }).catch(() => {});
          });
        return () => unsub();
      }, [uid, cycleId, isPageVisible, activeTab]);

      // ✅ BBN onSnapshot — only when: page visible + bbn tab active
      useEffect(() => {
        if (!uid) return;
        if (!isPageVisible) return;
        if (activeTab !== 'bbn') return;

        const unsub = db.collection("bbn_housemates")
          .onSnapshot((snap) => {
            const arr = BBN_HOUSEMATES_BASE.map(h => ({ ...h, votes: 0 }));
            snap.forEach(doc => {
              const d = doc.data();
              if (d.cycleId === cycleId) {
                const match = arr.find(a => a.id === doc.id);
                if (match) match.votes = d.votes || 0;
              }
            });
            setBbnHousemates(arr);
          }, () => {});
        return () => unsub();
      }, [uid, cycleId, isPageVisible, activeTab]);

      // ✅ BROADCASTS — get() based with 60s auto-poll
      const fetchBroadcasts = async () => {
        if (!uid) return;
        setBroadcastsLoading(true);
        try {
          const snap = await db.collection("presidential_broadcasts")
            .orderBy("createdAt", "desc")
            .limit(10)
            .get();
          const arr = [];
          snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
          setBroadcasts(arr);
        } catch (e) {
          console.error("Broadcasts fetch:", e);
        } finally {
          setBroadcastsLoading(false);
        }
      };

      useEffect(() => {
        if (!uid) return;
        if (!isPageVisible) return;
        if (activeTab !== 'election') return;

        fetchBroadcasts();
        const iv = setInterval(fetchBroadcasts, BROADCASTS_REFRESH_MS);
        return () => clearInterval(iv);
      }, [uid, isPageVisible, activeTab]);

      // ✅ POLLS — get() based with 60s auto-poll
      const fetchPolls = async () => {
        if (!uid) return;
        setPollsLoading(true);
        try {
          const snap = await db.collection("polls")
            .orderBy("createdAt", "desc")
            .limit(10)
            .get();
          const p = [];
          snap.forEach(doc => p.push({ id: doc.id, ...doc.data() }));
          setPolls(p);
        } catch (e) {
          console.error("Polls fetch:", e);
        } finally {
          setPollsLoading(false);
        }
      };

      useEffect(() => {
        if (!uid) return;
        if (!isPageVisible) return;
        if (activeTab !== 'polls') return;

        fetchPolls();
        const iv = setInterval(fetchPolls, POLLS_REFRESH_MS);
        return () => clearInterval(iv);
      }, [uid, isPageVisible, activeTab]);

      // Feed ticker
      useEffect(() => {
        const iv = setInterval(() => {
          setTickerMsg(NEWS_TICKER[Math.floor(Math.random() * NEWS_TICKER.length)]);
        }, 6000);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });
      const addFeed = (msg) => setFeed(prev => [{ id: Date.now(), msg }, ...prev].slice(0, 15));

      // Safe cash helpers
      const addCash = async (delta, extra = {}) => {
        const cur = stateRef.current;
        const next = Object.assign({}, cur, { cash: Math.max(0, (cur.cash || 0) + delta), ...extra });
        stateRef.current = next;
        setS(next);

        if (!uid) return;

        const updates = { cash: firebase.firestore.FieldValue.increment(delta), lastSeen: Date.now() };
        Object.keys(extra).forEach(k => {
          if (k === 'bbnVotes' && extra[k] > 0) {
            updates[k] = firebase.firestore.FieldValue.increment(extra[k]);
          } else {
            updates[k] = extra[k];
          }
        });
        await db.collection("users").doc(uid).update(updates).catch(() => {});
      };

      const addReal = async (delta, extra = {}) => {
        const cur = stateRef.current;
        const next = Object.assign({}, cur, { real: Math.max(0, (cur.real || 0) + delta), ...extra });
        stateRef.current = next;
        setS(next);

        if (!uid) return;

        const updates = { real: firebase.firestore.FieldValue.increment(delta), lastSeen: Date.now() };
        Object.keys(extra).forEach(k => {
          if (k === 'bbnVotes') updates[k] = firebase.firestore.FieldValue.increment(extra[k]);
          else updates[k] = extra[k];
        });
        await db.collection("users").doc(uid).update(updates).catch(() => {});
      };

      // ══════════ ELECTION ACTIONS ══════════

      const declareCandidacy = async () => {
        if (!partyName.trim() || !motto.trim()) return notify('Enter party name and motto', 'bad');
        
        const cur = stateRef.current;
        const isCandidate = candidates.some(c => c.userId === uid);
        if (isCandidate) return notify('You already declared candidacy this cycle!', 'bad');

        const useReal = (cur.real || 0) >= CANDIDACY_COST_REAL;
        const useFake = (cur.cash || 0) >= CANDIDACY_COST_FAKE;

        if (!useReal && !useFake) {
          AudioEngine.error();
          return notify('Need ₦1B fake OR ₦500 real to run', 'bad');
        }

        try {
          if (useReal) {
            await addReal(-CANDIDACY_COST_REAL);
          } else {
            await addCash(-CANDIDACY_COST_FAKE);
          }

          await db.collection("election_candidates").doc(uid + "_" + cycleId).set({
            cycleId,
            userId: uid,
            name: cur.name || 'Hustler',
            party: partyName.trim(),
            motto: motto.trim(),
            votes: 0,
            createdAt: Date.now()
          });

          AudioEngine.election();
          notify('🗳️ Candidacy declared! Start campaigning!');
          addFeed('🗳️ ' + (cur.name || 'A hustler') + ' just declared candidacy for ' + partyName + '!');
          setCandidacyOpen(false);
          setPartyName('');
          setMotto('');
        } catch (e) {
          console.error(e);

                      h('button', { onClick: () => voteBBN(hm), className: 'py-1.5 rounded-lg bg-blue-500/20 text-blue-400 text-[9px] font-black active:scale-95 border border-blue-500/30' }, 'VOTE ₦10K'),
                      h('button', { onClick: () => rigBBN(hm), className: 'py-1.5 rounded-lg bg-red-500/20 text-red-400 text-[9px] font-black active:scale-95 border border-red-500/30' }, 'RIG ₦100')
                    )
                  )
                )
              )
            ),

            // ══════════ POLLS TAB ══════════
            activeTab === 'polls' && h('div', { className: 'mt-4' },
              h('button', { onClick: () => setPollModalOpen(true), className: 'w-full py-3 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white font-black text-[13px] shadow-[0_8px_24px_-8px_rgba(59,130,246,0.7)] active:scale-95 mb-4' }, '➕ CREATE POLL (₦100 Real)'),
              h('div', { className: 'flex items-center justify-between mb-2' },
                h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Live Polls'),
                h('button', {
                  onClick: fetchPolls,
                  disabled: pollsLoading,
                  className: 'text-[10px] font-black text-[#FFD60A] bg-white/[0.05] border border-white/10 px-2 py-1 rounded-md active:scale-95 disabled:opacity-40'
                }, pollsLoading ? '⏳' : '🔄 Refresh')
              ),
              polls.length === 0 ?
                h('div', { className: 'text-center py-10' },
                  h('div', { className: 'text-4xl mb-2' }, '🗳️'),
                  h('div', { className: 'text-[11px] text-white/50 font-bold' }, 'No polls yet'),
                  h('div', { className: 'text-[9px] text-white/30 mt-1' }, 'Be the first to create one!')
                ) :
                h('div', { className: 'space-y-3' },
                  polls.map(p => {
                    const total = (p.votesA || 0) + (p.votesB || 0);
                    const pctA = total > 0 ? Math.round(((p.votesA || 0) / total) * 100) : 50;
                    const pctB = 100 - pctA;
                    return h(Card, { key: p.id, className: 'p-3' },
                      h('div', { className: 'text-[12px] font-black text-white mb-0.5' }, p.title),
                      h('div', { className: 'text-[9px] text-white/40 mb-2' }, 'By ' + p.creator),
                      h('div', { className: 'space-y-2' },
                        h('div', null,
                          h('div', { className: 'flex items-center justify-between mb-1' },
                            h('div', { className: 'text-[11px] font-bold' }, p.optA + ' (' + pctA + '%)'),
                            h('div', { className: 'text-[9px] text-white/40 tabular-nums' }, (p.votesA || 0).toLocaleString())
                          ),
                          h('div', { className: 'h-1.5 rounded-full bg-white/10 overflow-hidden mb-1' },
                            h('div', { className: 'h-full bg-blue-500 rounded-full', style: { width: pctA + '%' } })
                          ),
                          h('div', { className: 'flex gap-1' },
                            h('button', { onClick: () => votePoll(p, 'A'), className: 'flex-1 py-1 rounded bg-blue-500/20 text-blue-400 text-[9px] font-black' }, 'VOTE ₦10K'),
                            h('button', { onClick: () => rigPoll(p, 'A'), className: 'flex-1 py-1 rounded bg-red-500/20 text-red-400 text-[9px] font-black' }, 'RIG ₦100')
                          )
                        ),
                        h('div', null,
                          h('div', { className: 'flex items-center justify-between mb-1' },
                            h('div', { className: 'text-[11px] font-bold' }, p.optB + ' (' + pctB + '%)'),
                            h('div', { className: 'text-[9px] text-white/40 tabular-nums' }, (p.votesB || 0).toLocaleString())
                          ),
                          h('div', { className: 'h-1.5 rounded-full bg-white/10 overflow-hidden mb-1' },
                            h('div', { className: 'h-full bg-red-500 rounded-full', style: { width: pctB + '%' } })
                          ),
                          h('div', { className: 'flex gap-1' },
                            h('button', { onClick: () => votePoll(p, 'B'), className: 'flex-1 py-1 rounded bg-blue-500/20 text-blue-400 text-[9px] font-black' }, 'VOTE ₦10K'),
                            h('button', { onClick: () => rigPoll(p, 'B'), className: 'flex-1 py-1 rounded bg-red-500/20 text-red-400 text-[9px] font-black' }, 'RIG ₦100')
                          )
                        )
                      )
                    );
                  })
                )
            ),

            feed.length > 0 && h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-blue-400' }, 'LIVE') }, 'Political Feed'),
            feed.length > 0 && h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden max-h-72 overflow-y-auto' },
              feed.map(f => h('div', { key: f.id, className: 'px-3 py-2.5 text-[11px] text-white/70 animate-slideDown' }, f.msg))
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-blue-400 nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          candidacyOpen && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setCandidacyOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-blue-500/40 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'text-center mb-3' },
                h('div', { className: 'text-5xl mb-1' }, '🎩'),
                h('div', { className: 'text-[15px] font-black text-blue-400 font-display' }, 'DECLARE CANDIDACY'),
                h('div', { className: 'text-[10px] text-white/50 mt-1' }, 'Run for President of Lagos Life')
              ),
              h('div', { className: 'space-y-2.5' },
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Party Name'),
                  h('input', {
                    value: partyName,
                    onChange: (e) => setPartyName(e.target.value),
                    placeholder: 'e.g. Aje Party of Nigeria',
                    maxLength: 30,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/30'
                  })
                ),
                h('div', null,
                  h('label', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold' }, 'Campaign Motto'),
                  h('input', {
                    value: motto,
                    onChange: (e) => setMotto(e.target.value),
                    placeholder: 'e.g. Money for everybody!',
                    maxLength: 80,
                    className: 'mt-1 w-full rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px] font-bold text-white placeholder-white/30'
                  })
                ),
                h('div', { className: 'px-3 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30' },
                  h('div', { className: 'text-[10px] text-white/60' }, 'Cost'),
                  h('div', { className: 'flex gap-2 mt-1' },
                    h('div', { className: 'text-[11px] font-black text-[#FFD60A]' }, fmt(CANDIDACY_COST_FAKE) + ' fake'),
                    h('span', { className: 'text-white/30' }, 'or'),
                    h('div', { className: 'text-[11px] font-black text-[#22C55E]' }, '₦' + CANDIDACY_COST_REAL + ' real')
                  )
                )
              ),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: declareCandidacy,
                  disabled: !partyName.trim() || !motto.trim(),
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white font-black text-[12px] active:scale-95 disabled:opacity-40'
                }, '🚀 DECLARE & RUN'),
                h('button', { onClick: () => setCandidacyOpen(false), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Cancel')
              )
            )
          ),

          voteModalCand && h('div', { className: 'fixed inset-0 z-[110] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/95 backdrop-blur-md', onClick: () => setVoteModalCand(null) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-blue-500/40 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-5xl mb-1' }, '🗳️'),
              h('div', { className: 'text-[15px] font-black text-white font-display' }, voteModalCand.name),
              h('div', { className: 'text-[10px] text-white/50 mt-0.5' }, voteModalCand.party || 'Independent'),
              h('div', { className: 'text-[11px] text-[#FFD60A] font-black mt-1' }, (voteModalCand.votes || 0).toLocaleString() + ' votes'),
              h('div', { className: 'mt-4 space-y-2' },
                h('button', {
                  onClick: async () => { await voteCandidate(voteModalCand, 1); setVoteModalCand(null); },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white font-black text-[12px] active:scale-95'
                }, '🗳️ VOTE (₦10K)'),
                h('button', {
                  onClick: async () => { await voteCandidate(voteModalCand, 10); setVoteModalCand(null); },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-[#A855F7] to-[#7C3AED] text-white font-black text-[12px] active:scale-95'
                }, '🔥 SUPER VOTE ×10 (₦100K)'),
                h('button', {
                  onClick: async () => { await rigCandidate(voteModalCand); setVoteModalCand(null); },
                  className: 'w-full py-3 rounded-xl bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-[12px] active:scale-95'
                }, '🚨 RIG +1,000 (₦100 Real)'),
                h('button', { onClick: () => setVoteModalCand(null), className: 'w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white/60 text-[11px] font-bold' }, 'Cancel')
              )
            )
          ),

          pollModalOpen && h('div', { className: 'fixed inset-0 z-50 grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: () => setPollModalOpen(false) }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-blue-500/30 rounded-3xl p-5 animate-popIn' },
              h('div', { className: 'text-[14px] font-black text-blue-400 mb-3 text-center' }, 'CREATE POLL'),
              h('input', { value: pollTitle, onChange: (e) => setPollTitle(e.target.value), placeholder: 'Question', maxLength: 100, className: 'w-full mb-2 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('input', { value: pollOptA, onChange: (e) => setPollOptA(e.target.value), placeholder: 'Option A', maxLength: 50, className: 'w-full mb-2 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('input', { value: pollOptB, onChange: (e) => setPollOptB(e.target.value), placeholder: 'Option B', maxLength: 50, className: 'w-full mb-4 rounded-xl bg-white/[0.05] border border-white/10 px-3 py-2.5 text-[12px]' }),
              h('div', { className: 'flex gap-2' },
                h('button', { onClick: () => setPollModalOpen(false), className: 'flex-1 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white/70 text-[11px] font-bold' }, 'Cancel'),
                h('button', { onClick: createPoll, className: 'flex-1 py-2.5 rounded-xl bg-gradient-to-b from-blue-400 to-blue-600 text-white text-[11px] font-black' }, 'Create (₦100)')
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-blue-400 to-blue-600 text-white')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
