    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }

        if (!ctx) return; const start = ctx.currentTime + w;

                h('div', { className: 'text-2xl font-black text-white font-display' }, babeStatus === 'dating' ? babeName : 'Single & Searching'),
                babeStatus === 'dating' && h('div', { className: 'mt-2 px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-[10px] font-bold' }, '❤️ Loving the vibe'),
                babeStatus === 'single' && h('button', { onClick: findBabe, className: 'mt-4 px-6 py-2.5 rounded-xl bg-gradient-to-b from-pink-400 to-pink-600 text-white font-black text-[12px] shadow-[0_8px_24px_-8px_rgba(236,72,153,0.7)] active:scale-95 transition' }, 'Take a Babe Out (₦50K)')
              )
            ),

            // BILLING REQUEST
            babeStatus === 'dating' && h('div', { className: 'mt-4' },
              currentRequest 
                ? h(Card, { className: 'p-4 border border-pink-500/30 relative overflow-hidden' },
                    h('div', { className: 'absolute top-0 left-0 w-1 h-full bg-pink-500' }),
                    h('div', { className: 'flex items-start gap-3' },
                      h('div', { className: 'text-3xl' }, '💬'),
                      h('div', { className: 'flex-1' },
                        h('div', { className: 'text-[12px] font-black text-pink-400 mb-1' }, babeName + ' needs you!'),
                        h('p', { className: 'text-[12px] text-white/80 leading-relaxed mb-3' }, currentRequest.msg),
                        h('div', { className: 'text-[18px] font-black text-white tabular-nums mb-3' }, fmt(currentRequest.amount)),
                        h('div', { className: 'flex gap-2' },
                          h('button', { onClick: payBill, className: 'flex-1 rounded-xl bg-gradient-to-b from-[#34D976] to-[#22C55E] py-2.5 text-[11px] font-black text-black active:scale-95 transition' }, 'Pay ' + fmt(currentRequest.amount)),
                          h('button', { onClick: ignoreBill, className: 'flex-1 rounded-xl bg-white/[0.06] border border-white/10 py-2.5 text-[11px] font-black text-red-400 active:scale-95 transition' }, 'Ignore (Breakup)')
                        )
                      )
                    )
                  )
                : h(Card, { className: 'p-5 text-center' },
                    h('div', { className: 'text-4xl mb-2' }, '💅🏾'),
                    h('div', { className: 'text-[11px] font-bold text-white/50' }, 'Babe is chilling...'),
                    h('div', { className: 'text-[14px] font-black text-pink-400 mt-1' }, 'Next bill in ' + timeLeft + 's')
                  )
            ),

            // PREGNANCY & DNA
            babeStatus === 'dating' && h('div', { className: 'mt-4' },
              isPregnant 
                ? h(Card, { className: 'p-4 border border-red-500/30' },
                    h('div', { className: 'text-center' },
                      h('div', { className: 'text-4xl mb-2 animate-pulse' }, '🤰🏾'),
                      h('div', { className: 'text-[13px] font-black text-red-400 mb-2' }, 'PREGNANCY SCARE!'),
                      h('p', { className: 'text-[12px] text-white/80 mb-4' }, pregnancyMsg),
                      h('div', { className: 'space-y-2' },
                        h('button', { onClick: () => resolvePregnancy('abortion'), className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-[11px] font-bold text-white/70 active:scale-95 transition' }, 'Pay ₦500K for Abortion'),
                        h('button', { onClick: () => resolvePregnancy('naming'), className: 'w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-[11px] font-bold text-white/70 active:scale-95 transition' }, 'Pay ₦2M for Naming'),
                        h('button', { onClick: () => resolvePregnancy('dna'), className: 'w-full py-2.5 rounded-xl bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black text-[11px] font-black active:scale-95 transition' }, 'Force DNA Test (₦1M)')
                      )
                    )
                  )
                : h(Card, { className: 'p-4 text-center' },
                    h('div', { className: 'text-[10px] uppercase tracking-widest text-white/40 font-bold mb-2' }, 'Suspicious Activity'),
                    h('button', { onClick: triggerPregnancy, className: 'px-4 py-2 rounded-xl bg-white/[0.06] border border-white/10 text-[11px] font-bold text-white/70 active:scale-95 transition' }, 'Ask if she is pregnant 🤔')
                  )
            ),

            // LIVE FEED
            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-pink-400 flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-pink-400 animate-pulse glow-dot' }), 'LIVE') }, 'Relationship Feed'),
            h(Card, { className: 'divide-y divide-white/[0.05] overflow-hidden min-h-[100px]' },
              feed.length === 0 
                ? h('div', { className: 'px-4 py-6 text-center text-[11px] text-white/30' }, 'No relationship drama yet. Go find a babe!')
                : feed.map(f => h('div', { key: f.id, className: 'px-4 py-3 text-[11px] text-white/70 animate-slideDown' }, f.msg))
            )

          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  onClick: (e) => { if (n.id === 'more') { e.preventDefault(); const el = document.getElementById('more-sheet'); if (el) el.classList.remove('hidden'); } },
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-pink-400 nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          h('div', { id: 'more-sheet', className: 'hidden fixed inset-0 z-50 flex items-end justify-center' },
            h('div', { className: 'absolute inset-0 bg-black/70 backdrop-blur-sm', onClick: () => { const el = document.getElementById('more-sheet'); if (el) el.classList.add('hidden'); } }),
            h('div', { className: 'relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp', onClick: (e) => e.stopPropagation() },
              h('div', { className: 'w-10 h-1 rounded-full bg-white/15 mx-auto mb-4' }),
              h('div', { className: 'space-y-2 max-h-[70vh] overflow-y-auto' },
                MORE_PAGES.map((m) =>
                  h('a', { key: m.id, href: m.href, className: 'w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left' },
                    h('div', { className: 'w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0' }, m.icon),
                    h('div', { className: 'min-w-0' },
                      h('div', { className: 'text-[13px] font-extrabold font-display' }, m.label),
                      h('div', { className: 'text-[10px] text-white/40 font-bold mt-0.5' }, m.desc)
                    )
                  )
                )
              )
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-pink-400 to-pink-600 text-white')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
