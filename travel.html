    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slideUp { animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1); }

    .fly-in { animation: flyIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }

    .stamp-visit { animation: stamp 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .hero-grid { background-image: linear-gradient(rgba(255,214,10,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,214,10,0.04) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 100%); }

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    /* ═══ FIREBASE INITIALIZATION ═══ */
    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",

    const MAX_E = 100;
    const ENERGY_MS = 5 * 60 * 1000;
    const BASE_TAP = 500;

    const DESTINATIONS = [
      { id: 'ikeja',   name: 'Mushin → Ikeja',  short: 'Ikeja',  emoji: '🛣️', cost: 50_000,            bonus: 0,      tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Just to see the airport.' },
      { id: 'ajah',    name: 'Mushin → Ajah',   short: 'Ajah',   emoji: '🛺', cost: 100_000,           bonus: 50,     tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Traffic go hold you.' },
      { id: 'lekki',   name: 'Mushin → Lekki',  short: 'Lekki',  emoji: '🚤', cost: 500_000,           bonus: 150,    tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Boat ride from the mainland.' },
      { id: 'accra',   name: 'Mushin → Accra',  short: 'Accra',  emoji: '🇬🇭', cost: 20_000_000,        bonus: 100,    tier: 'West Africa',   color: 'from-orange-400/20 to-red-700/10', desc: 'Go and eat Waakye.' },
      { id: 'nairobi', name: 'Mushin → Nairobi',short: 'Nairobi',emoji: '🇰🇪', cost: 50_000_000,        bonus: 250,    tier: 'East Africa',   color: 'from-emerald-400/20 to-emerald-700/10', desc: 'See the wildlife.' },
      { id: 'dubai',   name: 'Mushin → Dubai',  short: 'Dubai',  emoji: '🇦🇪', cost: 2_000_000_000,     bonus: 500,    tier: 'Middle East',   color: 'from-amber-400/20 to-amber-700/10', desc: 'Buy gold in the market.' },
      { id: 'uk',      name: 'Mushin → UK',     short: 'UK',     emoji: '🇬🇧', cost: 5_000_000_000,     bonus: 1_000,  tier: 'Europe',        color: 'from-blue-400/20 to-blue-700/10', desc: 'Go and carry work.' },
      { id: 'paris',   name: 'Mushin → Paris',  short: 'Paris',  emoji: '🇫🇷', cost: 8_000_000_000,     bonus: 1_500,  tier: 'Europe',        color: 'from-pink-400/20 to-pink-700/10', desc: 'See the Eiffel Tower.' },
      { id: 'canada',  name: 'Mushin → Canada', short: 'Canada', emoji: '🇨🇦', cost: 12_000_000_000,    bonus: 2_000,  tier: 'North America', color: 'from-red-400/20 to-red-700/10', desc: 'Cold weather, sweet maple syrup.' },
      { id: 'usa',     name: 'Mushin → USA',    short: 'USA',    emoji: '🇺🇸', cost: 25_000_000_000,    bonus: 5_000,  tier: 'Superpower',    color: 'from-indigo-400/20 to-purple-700/10', desc: 'The American Dream.' },
      { id: 'japan',   name: 'Mushin → Japan',  short: 'Japan',  emoji: '🇯🇵', cost: 40_000_000_000,    bonus: 7_500,  tier: 'Asia',          color: 'from-red-400/20 to-white/20', desc: 'Eat sushi and watch anime.' },
      { id: 'space',   name: 'Mushin → Space',  short: 'Space',  emoji: '🚀', cost: 1_000_000_000_000, bonus: 25_000, tier: 'Legendary',     color: 'from-fuchsia-400/20 to-purple-700/10', desc: 'Leave the planet entirely.' },
    ];

    const BIZ_PRICES = { water: 10_000, suya: 250_000, keke: 500_000, phone: 2_000_000, danfo: 5_000_000, wash: 25_000_000, bet9ja: 50_000_000, lounge: 500_000_000, oil: 5_000_000_000 };
    const BIZ_PER_HR = { water: 2000, suya: 40000, keke: 75000, phone: 350000, danfo: 800000, wash: 4000000, bet9ja: 9000000, lounge: 90000000, oil: 1000000000 };
    const ASSET_PRICES = { chain: 5_000_000, rolex: 50_000_000, tesla: 500_000_000, gwag: 5_000_000_000, yacht: 20_000_000_000, jet: 100_000_000_000, mansion: 1_000_000_000_000 };

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      const tg = window?.Telegram?.WebApp;
      return {
        name: tg?.initDataUnsafe?.user?.first_name || 'Hustler', 
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: []
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /* ═══ AUDIO ENGINE ═══ */
    const AudioEngine = (() => {
      let ctx = null; let musicGain, sfxGain, musicPlaying = false, musicTimer, step = 0;
      const STEP_MS = 300;
      const bassPattern = [65.41, null, 65.41, null, 73.42, null, 87.31, null];
      function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        let master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.15; musicGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      }
      function tone(f, d, t, dest, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(dest); o.start(start); o.stop(start+d+0.05);
      }
      function kick() { if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); }
      function hat() { if(!ctx) return; const t=ctx.currentTime; const b=ctx.createBuffer(1, ctx.sampleRate*0.04, ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000; const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); s.connect(hp); hp.connect(g); g.connect(musicGain); s.start(t); }
      
      function tick() {
        if (!musicPlaying) return;
        const s = step % 8;
        if (s===0||s===3||s===4) kick();
        hat();
        if (bassPattern[s]) tone(bassPattern[s], 0.3, "sine", musicGain, 0, 0.4);
        if (s===2||s===6) [329.63,415.3,493.88].forEach(f => tone(f, 0.3, "triangle", musicGain, 0, 0.06));
        step++;
      }

      return {
        startMusic: () => { init(); if(ctx.state==="suspended") ctx.resume(); if(musicPlaying) return; musicPlaying=true; tick(); musicTimer=setInterval(tick, STEP_MS); },
        stopMusic: () => { musicPlaying=false; clearInterval(musicTimer); },
        toggle: () => { musicPlaying ? AudioEngine.stopMusic() : AudioEngine.startMusic(); return musicPlaying; },
        coin: () => { init(); tone(1046, 0.08, "square", sfxGain, 0, 0.15); tone(1318, 0.15, "square", sfxGain, 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", sfxGain, 0, 0.25); tone(165, 0.25, "sawtooth", sfxGain, 0.1, 0.25); },
        purchase: () => { init(); tone(523, 0.1, "triangle", sfxGain, 0, 0.2); tone(659, 0.1, "triangle", sfxGain, 0.07, 0.2); tone(783, 0.2, "triangle", sfxGain, 0.14, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false }) => (
      <div className={'rounded-2xl ' + (gold ? 'card-gold' : 'card-gradient') + ' ' + className}>{children}</div>
    );
    const SectionTitle = ({ children, right }) => (
      <div className="flex items-end justify-between mb-2.5 mt-6">
        <h2 className="text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display">{children}</h2>
        {right}
      </div>
    );

    function App() {
      const [s, setS] = useState(getCachedData); 
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [justBooked, setJustBooked] = useState(null);
      const [musicOn, setMusicOn] = useState(false);
      
      // Animation State
      const [travelingTo, setTravelingTo] = useState(null);

      /* Initialize Firebase Auth & Sync */
      useEffect(() => {
        const tg = window?.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        auth.signInAnonymously().then((cred) => {
          const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : cred.user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          const unsubscribe = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = {
                  ...dbData,
                  transactions: dbData.transactions || [],
                };
                localStorage.setItem("lagos_user_data", JSON.stringify(newData));
                return newData;
              });
            } else {
              const defaultData = {
                name: tg?.initDataUnsafe?.user?.first_name || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [],
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: []
              };
              userRef.set(defaultData);
              setS(defaultData);
              localStorage.setItem("lagos_user_data", JSON.stringify(defaultData));
            }
          });
          return unsubscribe;
        }).catch(e => setAuthError(e.message));
      }, []);

      /* Start music */
      useEffect(() => {
        const unlock = () => { if (!musicOn) { AudioEngine.startMusic(); setMusicOn(true); } };
        window.addEventListener("pointerdown", unlock, { once: true });
        return () => window.removeEventListener("pointerdown", unlock);
      }, [musicOn]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      /* Tick: energy + income */
      useEffect(() => {
        if (!s) return;
        const iv = setInterval(() => {
          const now = Date.now();
          let energy = s.energy;
          let lastEnergy = s.lastEnergy;
          if (energy < MAX_E) {
            const gained = Math.floor((now - lastEnergy) / ENERGY_MS);
            if (gained > 0) {
              energy = Math.min(MAX_E, energy + gained);
              lastEnergy = energy >= MAX_E ? now : lastEnergy + gained * ENERGY_MS;
            }
          }
          const perHr = Object.entries(s.businesses || {}).reduce((a, [id, cnt]) => a + cnt * (BIZ_PER_HR[id] || 0), 0);
          const newCash = s.cash + perHr / 3600;
          
          if (energy !== s.energy || perHr > 0) {
            setS(prev => ({ ...prev, energy, lastEnergy, cash: newCash }));
            if (uid && perHr > 0) {
              db.collection("users").doc(uid).update({ cash: firebase.firestore.FieldValue.increment(perHr / 3600), energy, lastEnergy });
            }
          }
        }, 1000);
        return () => clearInterval(iv);
      }, [s, uid]);

      if (authError) return <div className="min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500"><div className="text-4xl">⚠️</div><div className="font-bold">Auth Error</div><div className="text-sm">{authError}</div></div>;

      const bizValue = Object.entries(s.businesses || {}).reduce((a, [id, c]) => a + c * (BIZ_PRICES[id] || 0), 0);
      const assetValue = Object.entries(s.assets || {}).reduce((a, [id, c]) => a + c * (ASSET_PRICES[id] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);

      const totalBonus = (s.travels || []).reduce((a, id) => a + (DESTINATIONS.find((d) => d.id === id)?.bonus || 0), 0);
      const tapValue = BASE_TAP + totalBonus;
      const visitedCount = (s.travels || []).length;
      const totalPossibleBonus = DESTINATIONS.reduce((a, d) => a + d.bonus, 0);
      const progressPct = Math.round((visitedCount / DESTINATIONS.length) * 100);

      const book = async (d) => {
        if ((s.travels || []).includes(d.id)) { AudioEngine.error(); return notify('You already japa\'d there ✅', 'bad'); }
        if (s.cash < d.cost) { AudioEngine.error(); return notify('Not enough Lagos Cash 💸', 'bad'); }

        // Start Animation
        setTravelingTo(d);
        AudioEngine.purchase();

        // Wait for animation to finish (2.5 seconds)
        setTimeout(async () => {
          // Optimistic Update
          setS((p) => ({ ...p, cash: p.cash - d.cost, travels: [...(p.travels || []), d.id] }));
          setTravelingTo(null);
          setJustBooked(d.id);
          setTimeout(() => setJustBooked(null), 2000);
          
          notify(d.emoji + ' Japa to ' + d.short + ' successful! +' + fmt(d.bonus) + '/tap');
          try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy'); } catch {}

          // Firestore update
          if (uid) {
            await db.collection("users").doc(uid).update({
              cash: firebase.firestore.FieldValue.increment(-d.cost),
              travels: firebase.firestore.FieldValue.arrayUnion(d.id),
              lastSeen: Date.now()
            });
          }
        }, 2500);
      };

      const getVehicle = (id) => {
        if (['ikeja', 'ajah'].includes(id)) return { icon: '🚌', anim: 'animate-drive' };
        if (id === 'lekki') return { icon: '🚤', anim: 'animate-drive' };
        if (id === 'space') return { icon: '🚀', anim: 'animate-fly' };
        return { icon: '✈️', anim: 'animate-fly' };
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: '#' },
      ];
      const MORE_PAGES = [
        { id: 'travel', label: 'Travel', icon: '✈️', desc: 'Japa from Mushin', href: 'travel.html' },
        { id: 'street', label: 'Street', icon: '🥷', desc: 'Rob, beg, tax, spray', href: 'street.html' },
        { id: 'leaderboard', label: 'Ranks & Wallet', icon: '🏆', desc: 'Top 100 + withdraw', href: 'leaderboard.html' },
      ];

      return (
        <div className="min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black">
          <div className="mx-auto max-w-md min-h-screen flex flex-col pb-24 relative">
            
            <button onClick={() => { const on = AudioEngine.toggle(); setMusicOn(on); }} className="music-toggle w-10 h-10 rounded-full bg-white/[0.08] border border-white/15 grid place-items-center active:scale-95 transition backdrop-blur">
              <span className="text-base">{musicOn ? "🔊" : "🔇"}</span>
            </button>

            <header className="sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]">
              <div className="px-4 py-2.5 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display">L</div>
                  <div className="min-w-0">
                    <div className="text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display">Travel</div>
                    <div className="text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5">{s.name || 'Hustler'} · {fmt(s.cash)}</div>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <div className="px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums">⚡ {s.energy}</div>
                  <div className="px-2 py-1 rounded-lg bg-[#22C55E]/15 border border-[#22C55E]/30 text-[#22C55E] text-[10px] font-extrabold tabular-nums">{fmtReal(s.real)}</div>
                </div>
              </div>
            </header>

            <main className="flex-1 px-4 pb-4 animate-slideDown">
              <Card className="relative overflow-hidden p-4 mt-3 hero-grid" gold>
                <div className="absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#FFD60A]/25 blur-3xl pointer-events-none" />
                <div className="relative">
                  <div className="flex items-center justify-between">
                    <div className="text-[9px] uppercase tracking-widest text-white/45 font-bold">Tap Bonus Collected</div>
                    <div className="text-2xl">✈️</div>
                  </div>
                  <div className="mt-1 flex items-baseline gap-1">
                    <span className="text-3xl font-black tabular-nums font-display text-gradient-gold">+{fmt(totalBonus)}</span>
                    <span className="text-[11px] font-bold text-white/40">/ tap</span>
                  </div>
                  <div className="mt-1.5 text-[10.5px] font-bold text-white/55">
                    Current tap value: <span className="text-[#FFD60A] font-black tabular-nums">{fmt(tapValue)}</span>
                    <span className="text-white/30 ml-1">(base {fmt(BASE_TAP)})</span>
                  </div>
                  <div className="mt-3 pt-3 border-t border-white/[0.08]">
                    <div className="flex items-center justify-between text-[9px] font-bold uppercase tracking-widest text-white/40 mb-1.5">
                      <span>{visitedCount} / {DESTINATIONS.length} destinations</span>
                      <span className="tabular-nums text-[#FFD60A]">{progressPct}%</span>
                    </div>
                    <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-[#FFD60A] to-[#FFB800] rounded-full transition-all duration-500" style={{ width: progressPct + '%' }} />
                    </div>
                    <div className="mt-2 text-[9.5px] text-white/35 font-bold">
                      Max possible: <span className="text-[#FFD60A] font-black">+{fmt(totalPossibleBonus)}</span> per tap
                    </div>
                  </div>
                </div>
              </Card>

              {visitedCount > 0 && (
                <>
                  <SectionTitle right={<span className="text-[10px] font-bold text-[#22C55E] flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-[#22C55E] animate-pulse glow-dot" />STAMPED</span>}>
                    Your Passport
                  </SectionTitle>
                  <Card className="p-3.5">
                    <div className="flex flex-wrap gap-2">
                      {DESTINATIONS.filter((d) => (s.travels || []).includes(d.id)).map((d) => (
                        <div key={d.id} className="fly-in relative flex items-center gap-1.5 bg-white/[0.06] border border-[#FFD60A]/30 rounded-lg px-2.5 py-1.5">
                          <span className="text-base">{d.emoji}</span>
                          <span className="text-[10.5px] font-extrabold font-display">{d.short}</span>
                          <span className="text-[9px] font-black text-[#22C55E] tabular-nums">+{fmt(d.bonus)}</span>
                        </div>
                      ))}
                    </div>
                  </Card>
                </>
              )}

              <SectionTitle right={<span className="text-[10px] font-bold text-white/30">{DESTINATIONS.length} routes</span>}>
                Japa Routes
              </SectionTitle>

              <div className="space-y-2.5">
                {DESTINATIONS.map((d) => {
                  const done = (s.travels || []).includes(d.id);
                  const canAfford = s.cash >= d.cost;
                  const justBookedThis = justBooked === d.id;
                  const isLegendary = d.id === 'space';
                  return (
                    <Card key={d.id}
                          className={'relative overflow-hidden p-3 flex items-center gap-3 transition-all duration-300 ' +
                            (done ? 'border-[#22C55E]/40 ' : '') +
                            (justBookedThis ? 'ring-2 ring-[#FFD60A] shadow-[0_0_30px_rgba(255,214,10,0.5)] scale-[1.01] ' : '')}>
                      <div className={'absolute inset-0 bg-gradient-to-br ' + d.color + ' pointer-events-none opacity-60'} />
                      <div className="relative w-14 h-14 rounded-xl bg-gradient-to-br from-white/[0.1] to-white/[0.02] border border-white/[0.08] grid place-items-center text-3xl shrink-0">
                        {d.emoji}
                        {done && (
                          <div className="absolute -top-1.5 -right-1.5 bg-[#22C55E] rounded-full w-5 h-5 grid place-items-center shadow-lg stamp-visit">
                            <span className="text-black text-[10px] font-black">✓</span>
                          </div>
                        )}
                      </div>
                      <div className="relative flex-1 min-w-0">
                        <div className="flex items-center gap-1.5">
                          <div className="text-[13px] font-extrabold truncate font-display">{d.name}</div>
                          {isLegendary && <span className="text-[10px]">🚀</span>}
                        </div>
                        <div className="text-[9px] text-white/40 truncate mb-1">{d.desc}</div>
                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                          <span className={'text-[8.5px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded ' +
                            (d.tier === 'Legendary' ? 'bg-fuchsia-500/20 text-fuchsia-300' :
                             d.tier === 'Superpower' ? 'bg-indigo-500/20 text-indigo-300' :
                             d.tier === 'North America' ? 'bg-red-500/20 text-red-300' :
                             d.tier === 'Europe' ? 'bg-blue-500/20 text-blue-300' :
                             d.tier === 'Middle East' ? 'bg-amber-400/20 text-amber-300' :
                             d.tier === 'West Africa' ? 'bg-orange-500/20 text-orange-300' :
                             'bg-slate-400/20 text-slate-300')}>
                            {d.tier}
                          </span>
                        </div>
                        <div className="flex items-center gap-2 mt-1.5 text-[10px] font-black tabular-nums">
                          <span className="text-white/55">{fmt(d.cost)}</span>
                          <span className="text-white/20">·</span>
                          <span className="text-[#22C55E]">+{fmt(d.bonus)}/tap</span>
                        </div>
                      </div>
                      <button onClick={() => book(d)} disabled={done || !canAfford}
                              className={'relative shrink-0 rounded-lg text-[10.5px] font-black px-3 py-2.5 active:scale-95 transition-all ' +
                                (done
                                  ? 'bg-[#22C55E]/20 text-[#22C55E] border border-[#22C55E]/30'
                                  : canAfford
                                    ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_14px_-4px_rgba(255,214,10,0.7)]'
                                    : 'bg-white/[0.06] text-white/25 border border-white/[0.06]')}>
                        {done ? '✅ JAPA\'D' : canAfford ? 'BOOK' : 'LOCKED'}
                      </button>
                    </Card>
                  );
                })}
              </div>

              <Card className="p-3.5 mt-4">
                <div className="flex items-start gap-2">
                  <span className="text-base">🌍</span>
                  <p className="text-[10.5px] text-white/50 leading-relaxed">
                    Every destination you visit <span className="text-[#FFD60A] font-bold">permanently boosts your tap earnings</span>. Ikeja na free upgrade (no bonus but story). Space na the ultimate flex — ₦1 Trillion and you go +₦25,000 every tap. Japa tire! ✈️
                  </p>
                </div>
              </Card>
            </main>

            {/* ANIMATION MODAL */}
            {travelingTo && (() => {
              const vehicle = getVehicle(travelingTo.id);
              return (
                <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 backdrop-blur-md">
                  <div className="text-6xl mb-4 animate-bounce">{travelingTo.emoji}</div>
                  <h2 className="text-2xl font-black text-[#FFD60A] mb-1 font-display text-center px-4">
                    JAPA TO {travelingTo.short.toUpperCase()}...
                  </h2>
                  <p className="text-white/60 text-xs mb-8">{travelingTo.desc}</p>
                  
                  {/* Animation Area */}
                  <div className="relative w-full h-32 flex items-center overflow-hidden">
                    <div className={`absolute text-6xl ${vehicle.anim}`}>{vehicle.icon}</div>
                  </div>
                  
                  <div className="text-white/40 text-[10px] font-bold mt-4 uppercase tracking-widest animate-pulse">
                    Booking your ticket...
                  </div>
                </div>
              );
            })()}

            <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]">
              <div className="grid grid-cols-6 px-1 pt-1.5 safe-bottom">
                {NAV.map((n) => {
                  const active = n.id === 'more';
                  return (
                    <a key={n.id} href={n.href}
                       onClick={(e) => { if (n.id === 'more') { e.preventDefault(); document.getElementById('more-sheet')?.classList.remove('hidden'); } }}
                       className={'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')}>
                      <span className={'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '')}>{n.icon}</span>
                      <span className="text-[8.5px] font-extrabold tracking-wide font-display">{n.label}</span>
                    </a>
                  );
                })}
              </div>
            </nav>

            <div id="more-sheet" className="hidden fixed inset-0 z-50 flex items-end justify-center">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => document.getElementById('more-sheet')?.classList.add('hidden')} />
              <div className="relative w-full max-w-md bg-[#101016] border-t border-white/10 rounded-t-3xl p-4 pb-8 animate-slideUp" onClick={(e) => e.stopPropagation()}>
                <div className="w-10 h-1 rounded-full bg-white/15 mx-auto mb-4" />
                <div className="space-y-2">
                  {MORE_PAGES.map((m) => (
                    <a key={m.id} href={m.href} className="w-full flex items-center gap-3 rounded-2xl bg-white/[0.04] border border-white/[0.07] p-3 active:scale-[0.98] transition text-left">
                      <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-white/[0.08] to-white/[0.02] border border-white/[0.06] grid place-items-center text-lg shrink-0">{m.icon}</div>
                      <div className="min-w-0">
                        <div className="text-[13px] font-extrabold font-display">{m.label}</div>
                        <div className="text-[10px] text-white/40 font-bold mt-0.5">{m.desc}</div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>
            </div>

            {toast && (
              <div className={'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' + (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')}>
                {toast.msg}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
