    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slideUp { animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1); }

    button { -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
    
    @keyframes flyIn { 0% { opacity: 0; transform: translateX(-40px) rotate(-15deg) scale(0.7); } 60% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1.15); } 100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); } }
    .fly-in { animation: flyIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes stamp { 0% { opacity: 0; transform: scale(2) rotate(-30deg); } 100% { opacity: 1; transform: scale(1) rotate(-12deg); } }
    .stamp-visit { animation: stamp 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .hero-grid { background-image: linear-gradient(rgba(255,214,10,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,214,10,0.04) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 100%); }
    
    @keyframes flyAcross {
      0% { transform: translateX(-20vw) translateY(20px) rotate(-10deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(120vw) translateY(-20px) rotate(-10deg); opacity: 0; }

    }
    .animate-fly { animation: flyAcross 2.5s cubic-bezier(0.4,0,0.2,1) forwards; }

<body>

  <script>

  <script>
    const { useState, useEffect } = React;
    const h = React.createElement;

    const firebaseConfig = {
      apiKey: "AIzaSyBf2lWdtfpQe-h3bMpdHqsHR4SuQHICOZs",
      authDomain: "lagos-life-a8706.firebaseapp.com",
      projectId: "lagos-life-a8706",
      storageBucket: "lagos-life-a8706.firebasestorage.app",
      messagingSenderId: "187884589425",
      appId: "1:187884589425:web:07383ff1a19edbb751a6d0",
      measurementId: "G-DDMJTH2WY7"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const MAX_E = 100;
    const ENERGY_MS = 5 * 60 * 1000;
    const BASE_TAP = 500;

    const DESTINATIONS = [
      { id: 'ikeja',   name: 'Mushin → Ikeja',  short: 'Ikeja',  emoji: '🛣️', cost: 50_000,            bonus: 0,      tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Just to see the airport.' },
      { id: 'ajah',    name: 'Mushin → Ajah',   short: 'Ajah',   emoji: '🛺', cost: 100_000,           bonus: 50,     tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Traffic go hold you.' },
      { id: 'lekki',   name: 'Mushin → Lekki',  short: 'Lekki',  emoji: '🚤', cost: 500_000,           bonus: 150,    tier: 'Local',         color: 'from-slate-400/20 to-slate-700/10', desc: 'Boat ride from the mainland.' },
      { id: 'accra',   name: 'Mushin → Accra',  short: 'Accra',  emoji: '🇬🇭', cost: 20_000_000,        bonus: 100,    tier: 'West Africa',   color: 'from-orange-400/20 to-red-700/10', desc: 'Go and eat Waakye.' },
      { id: 'nairobi', name: 'Mushin → Nairobi',short: 'Nairobi',emoji: '🇰🇪', cost: 50_000_000,        bonus: 250,    tier: 'East Africa',   color: 'from-emerald-400/20 to-emerald-700/10', desc: 'See the wildlife.' },
      { id: 'dubai',   name: 'Mushin → Dubai',  short: 'Dubai',  emoji: '🇦🇪', cost: 2_000_000_000,     bonus: 500,    tier: 'Middle East',   color: 'from-amber-400/20 to-amber-700/10', desc: 'Buy gold in the market.' },
      { id: 'uk',      name: 'Mushin → UK',     short: 'UK',     emoji: '🇬🇧', cost: 5_000_000_000,     bonus: 1_000,  tier: 'Europe',        color: 'from-blue-400/20 to-blue-700/10', desc: 'Go and carry work.' },
      { id: 'paris',   name: 'Mushin → Paris',  short: 'Paris',  emoji: '🇫🇷', cost: 8_000_000_000,     bonus: 1_500,  tier: 'Europe',        color: 'from-pink-400/20 to-pink-700/10', desc: 'See the Eiffel Tower.' },
      { id: 'canada',  name: 'Mushin → Canada', short: 'Canada', emoji: '🇨🇦', cost: 12_000_000_000,    bonus: 2_000,  tier: 'North America', color: 'from-red-400/20 to-red-700/10', desc: 'Cold weather, sweet maple syrup.' },
      { id: 'usa',     name: 'Mushin → USA',    short: 'USA',    emoji: '🇺🇸', cost: 25_000_000_000,    bonus: 5_000,  tier: 'Superpower',    color: 'from-indigo-400/20 to-purple-700/10', desc: 'The American Dream.' },
      { id: 'japan',   name: 'Mushin → Japan',  short: 'Japan',  emoji: '🇯🇵', cost: 40_000_000_000,    bonus: 7_500,  tier: 'Asia',          color: 'from-red-400/20 to-white/20', desc: 'Eat sushi and watch anime.' },
      { id: 'space',   name: 'Mushin → Space',  short: 'Space',  emoji: '🚀', cost: 1_000_000_000_000, bonus: 25_000, tier: 'Legendary',     color: 'from-fuchsia-400/20 to-purple-700/10', desc: 'Leave the planet entirely.' },
    ];

    const TRAVEL_EVENTS = [
      { type: 'good', msg: 'You met a billionaire on the plane. He tipped you ₦10M!', cash: 10_000_000, energy: 0 },
      { type: 'bad', msg: 'Customs seized your bag. You paid ₦5M bribe.', cash: -5_000_000, energy: 0 },
      { type: 'funny', msg: 'The pilot was drunk. You arrived safely but lost 20 energy.', cash: 0, energy: -20 },
      { type: 'good', msg: 'You won the in-flight lottery! +₦2M', cash: 2_000_000, energy: 0 },
      { type: 'bad', msg: 'Your luggage went to Ghana instead of your destination. -₦1M to retrieve it.', cash: -1_000_000, energy: 0 },
    ];

    const BIZ_PRICES = { water: 10_000, suya: 250_000, keke: 500_000, phone: 2_000_000, danfo: 5_000_000, wash: 25_000_000, bet9ja: 50_000_000, lounge: 500_000_000, oil: 5_000_000_000 };
    const ASSET_PRICES = { chain: 5_000_000, rolex: 50_000_000, tesla: 500_000_000, gwag: 5_000_000_000, yacht: 20_000_000_000, jet: 100_000_000_000, mansion: 1_000_000_000_000 };

    const getCachedData = () => {
      try {
        const cached = localStorage.getItem("lagos_user_data");
        if (cached) return JSON.parse(cached);
      } catch (e) {}
      return {
        name: localStorage.getItem("lagos_user_name") || 'Hustler',
        cash: 25000, real: 0, energy: MAX_E,
        lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], isVip: false,
        taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
        transactions: []
      };
    };

    const fmt = (n) => {
      n = Math.floor(n || 0);
      const s = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e12) return s + '₦' + (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return s + '₦' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return s + '₦' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return s + '₦' + (n / 1e3).toFixed(1) + 'K';
      return s + '₦' + n.toLocaleString();
    };
    const fmtReal = (n) => '₦' + (n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const AudioEngine = (() => {
      let ctx = null;
      function init() { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(f, d, t, w=0, g=0.3) {
        if (!ctx) return; const start = ctx.currentTime + w;
        const o = ctx.createOscillator(), gain = ctx.createGain();
        o.type = t; o.frequency.value = f;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(g, start+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+d);
        o.connect(gain); gain.connect(ctx.destination); o.start(start); o.stop(start+d+0.05);
      }
      return {
        tap: () => { init(); tone(880, 0.09, "triangle", 0, 0.28); },
        coin: () => { init(); tone(1046, 0.08, "square", 0, 0.15); tone(1318, 0.15, "square", 0.07, 0.15); },
        error: () => { init(); tone(220, 0.15, "sawtooth", 0, 0.25); tone(165, 0.25, "sawtooth", 0.1, 0.25); },
        purchase: () => { init(); tone(523, 0.1, "triangle", 0, 0.2); tone(659, 0.1, "triangle", 0.07, 0.2); tone(783, 0.2, "triangle", 0.14, 0.2); }
      };
    })();

    const Card = ({ children, className = '', gold = false, passport = false }) =>
      h('div', { className: 'rounded-2xl ' + (passport ? 'card-passport' : gold ? 'card-gold' : 'card-gradient') + ' ' + className }, children);

    const SectionTitle = ({ children, right }) =>
      h('div', { className: 'flex items-end justify-between mb-2.5 mt-6' },
        h('h2', { className: 'text-[10px] uppercase tracking-[0.2em] font-extrabold text-white/40 font-display' }, children),
        right
      );

    function App() {
      const [s, setS] = useState(getCachedData);
      const [uid, setUid] = useState(null);
      const [authError, setAuthError] = useState(null);
      const [toast, setToast] = useState(null);
      const [justBooked, setJustBooked] = useState(null);
      const [travelingTo, setTravelingTo] = useState(null);
      const [travelEvent, setTravelEvent] = useState(null);

      useEffect(() => {
        let userUnsub = null;
        const authUnsub = auth.onAuthStateChanged((user) => {
          if (!user) { window.location.href = '/login.html'; return; }
          if (userUnsub) userUnsub();

          const userId = user.uid;
          setUid(userId);
          
          const userRef = db.collection("users").doc(userId);
          userUnsub = userRef.onSnapshot((doc) => {
            if (doc.exists) {
              setS(prev => {
                const dbData = doc.data();
                const newData = Object.assign({}, prev, dbData, {
                  businesses: dbData.businesses || prev.businesses || {},
                  assets: dbData.assets || prev.assets || {},
                  travels: dbData.travels || prev.travels || [],
                  transactions: dbData.transactions || [],
                  isVip: dbData.isVip || false
                });
                try { localStorage.setItem("lagos_user_data", JSON.stringify(newData)); } catch(e) {}
                return newData;
              });
            } else {
              const defaultData = {
                name: user.displayName || localStorage.getItem("lagos_user_name") || 'Hustler',
                cash: 25000, real: 0, energy: MAX_E,
                lastEnergy: Date.now(), businesses: {}, assets: {}, travels: [], isVip: false,
                taps: 0, clout: 0, goldName: false, lastSeen: Date.now(),
                transactions: []
              };
              userRef.set(defaultData).catch(() => {});
              setS(defaultData);
              try { localStorage.setItem("lagos_user_data", JSON.stringify(defaultData)); } catch(e) {}
            }
          }, (error) => console.error("Snapshot error:", error));
        });

        return () => { authUnsub(); if (userUnsub) userUnsub(); };
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const notify = (msg, kind = 'good') => setToast({ msg, kind, id: Date.now() });

      // Energy regen ONLY (cash handled by business.html vault)
      useEffect(() => {
        if (!uid) return;
        const iv = setInterval(() => {
          setS(prev => {
            if (!prev || prev.energy >= MAX_E) return prev;
            const now = Date.now();
            const gained = Math.floor((now - prev.lastEnergy) / ENERGY_MS);
            if (gained <= 0) return prev;
            
            const energy = Math.min(MAX_E, prev.energy + gained);
            const lastEnergy = energy >= MAX_E ? now : prev.lastEnergy + gained * ENERGY_MS;
            
            db.collection("users").doc(uid).update({ energy, lastEnergy }).catch(() => {});
            return Object.assign({}, prev, { energy, lastEnergy });
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [uid]);

      if (authError) return h('div', { className: 'min-h-screen flex items-center justify-center flex-col gap-3 p-6 text-center text-red-500' }, h('div', { className: 'text-4xl' }, '⚠️'), h('div', { className: 'font-bold' }, 'Auth Error'), h('div', { className: 'text-sm' }, authError));

      const safeTravels = s.travels || [];
      const bizValue = Object.entries(s.businesses || {}).reduce((a, kv) => a + kv[1] * (BIZ_PRICES[kv[0]] || 0), 0);
      const assetValue = Object.entries(s.assets || {}).reduce((a, kv) => a + kv[1] * (ASSET_PRICES[kv[0]] || 0), 0);
      const netWorth = Math.floor((s.cash || 0) + bizValue + assetValue);

      const totalBonus = safeTravels.reduce((a, id) => a + (DESTINATIONS.find((d) => d.id === id)?.bonus || 0), 0);
      const vipMultiplier = s.isVip ? 1.5 : 1;
      const tapValue = Math.floor((BASE_TAP + totalBonus) * vipMultiplier);
      const visitedCount = safeTravels.length;
      const totalPossibleBonus = DESTINATIONS.reduce((a, d) => a + d.bonus, 0);
      const progressPct = Math.round((visitedCount / DESTINATIONS.length) * 100);

      const book = async (d) => {
        if (safeTravels.includes(d.id)) { AudioEngine.error(); return notify('You already japa\'d there ✅', 'bad'); }
        if (s.cash < d.cost) { AudioEngine.error(); return notify('Not enough Lagos Cash 💸', 'bad'); }

        if (s.isVip) {
          const event = TRAVEL_EVENTS[Math.floor(Math.random() * TRAVEL_EVENTS.length)];
          
          setS(p => (Object.assign({}, p, {
            cash: (p.cash || 0) - d.cost + (event.cash || 0),
            energy: Math.max(0, Math.min(MAX_E, (p.energy || 0) + (event.energy || 0))),
            travels: [...(p.travels || []), d.id]
          })));
          
          setTravelEvent(event);
          AudioEngine.purchase();
          setJustBooked(d.id);
          setTimeout(() => setJustBooked(null), 2000);

          if (uid) {
            await db.collection("users").doc(uid).update({
              cash: firebase.firestore.FieldValue.increment(-d.cost + (event.cash || 0)),
              energy: firebase.firestore.FieldValue.increment(event.energy || 0),
              travels: firebase.firestore.FieldValue.arrayUnion(d.id),
              lastSeen: Date.now()
            }).catch(() => {});
          }
          return;
        }

        setTravelingTo(d);
        AudioEngine.purchase();

        setTimeout(async () => {
          const event = TRAVEL_EVENTS[Math.floor(Math.random() * TRAVEL_EVENTS.length)];
          
          setS(p => (Object.assign({}, p, {
            cash: (p.cash || 0) - d.cost + (event.cash || 0),
            energy: Math.max(0, Math.min(MAX_E, (p.energy || 0) + (event.energy || 0))),
            travels: [...(p.travels || []), d.id]
          })));
          
          setTravelingTo(null);
          setTravelEvent(event);
          setJustBooked(d.id);
          setTimeout(() => setJustBooked(null), 2000);
          
          notify(d.emoji + ' Japa to ' + d.short + ' successful!');
          try { if (navigator.vibrate) navigator.vibrate(30); } catch(e) {}

          if (uid) {
            await db.collection("users").doc(uid).update({
              cash: firebase.firestore.FieldValue.increment(-d.cost + (event.cash || 0)),
              energy: firebase.firestore.FieldValue.increment(event.energy || 0),
              travels: firebase.firestore.FieldValue.arrayUnion(d.id),
              lastSeen: Date.now()
            }).catch(() => {});
          }
        }, 2500);
      };

      const getVehicle = (id) => {
        if (['ikeja', 'ajah'].includes(id)) return { icon: '🚌', anim: 'animate-drive' };
        if (id === 'lekki') return { icon: '🚤', anim: 'animate-drive' };
        if (id === 'space') return { icon: '🚀', anim: 'animate-fly' };
        return { icon: '✈️', anim: 'animate-fly' };
      };

      const NAV = [
        { id: 'home', label: 'Home', icon: '🏠', href: 'index.html' },
        { id: 'hustle', label: 'Hustle', icon: '👊', href: 'hustle.html' },
        { id: 'biz', label: 'Biz', icon: '🏪', href: 'business.html' },
        { id: 'market', label: 'Market', icon: '🛒', href: 'market.html' },
        { id: 'club', label: 'Club', icon: '🎉', href: 'club.html' },
        { id: 'more', label: 'More', icon: '⋯', href: 'more.html' },
      ];

      return h('div', { className: 'min-h-screen bg-[#08080B] text-white antialiased font-sans selection:bg-[#FFD60A] selection:text-black' },
        h('div', { className: 'mx-auto max-w-md min-h-screen flex flex-col pb-24 relative' },
          
          h('header', { className: 'sticky top-0 z-30 bg-[#08080B]/85 backdrop-blur-xl border-b border-white/[0.06]' },
            h('div', { className: 'px-4 py-2.5 flex items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-2 min-w-0' },
                h('div', { className: 'w-9 h-9 rounded-xl bg-gradient-to-br from-[#FFE566] to-[#FFB800] grid place-items-center text-black font-black text-sm shrink-0 shadow-[0_4px_16px_-4px_rgba(255,214,10,0.7)] font-display' }, 'L'),
                h('div', { className: 'min-w-0' },
                  h('div', { className: 'text-[9px] uppercase tracking-[0.22em] font-extrabold text-[#FFD60A]/80 leading-none font-display' }, 'Travel'),
                  h('div', { className: 'text-[13px] font-black tabular-nums leading-tight truncate font-display mt-0.5' }, (s.name || 'Hustler') + ' · ' + fmt(s.cash))
                )
              ),
              h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                h('div', { className: 'px-2 py-1 rounded-lg bg-white/[0.06] border border-white/10 text-[10px] font-extrabold tabular-nums' }, '⚡ ' + (s.energy || 0)),
                s.isVip && h('div', { className: 'px-2 py-1 rounded-lg bg-[#FFD60A]/15 border border-[#FFD60A]/30 text-[#FFD60A] text-[10px] font-extrabold tabular-nums' }, '👑 VIP')
              )
            )
          ),

          h('main', { className: 'flex-1 px-4 pb-4 animate-slideDown' },
            
            h(Card, { className: 'relative overflow-hidden p-4 mt-3 hero-grid', gold: true },
              h('div', { className: 'absolute -top-16 -right-12 w-48 h-48 rounded-full bg-[#FFD60A]/25 blur-3xl pointer-events-none' }),
              h('div', { className: 'relative' },
                h('div', { className: 'flex items-center justify-between' },
                  h('div', { className: 'text-[9px] uppercase tracking-widest text-white/45 font-bold' }, 'Tap Bonus Collected'),
                  h('div', { className: 'text-2xl' }, '✈️')
                ),
                h('div', { className: 'mt-1 flex items-baseline gap-1' },
                  h('span', { className: 'text-3xl font-black tabular-nums font-display text-gradient-gold' }, '+' + fmt(totalBonus)),
                  h('span', { className: 'text-[11px] font-bold text-white/40' }, '/ tap')
                ),
                h('div', { className: 'mt-1.5 text-[10.5px] font-bold text-white/55' },
                  'Current tap value: ',
                  h('span', { className: 'text-[#FFD60A] font-black tabular-nums' }, fmt(tapValue)),
                  s.isVip && h('span', { className: 'text-[#FFD60A] ml-1' }, '(VIP 1.5x)'),
                  h('span', { className: 'text-white/30 ml-1' }, '(base ' + fmt(BASE_TAP) + ')')
                ),
                h('div', { className: 'mt-3 pt-3 border-t border-white/[0.08]' },
                  h('div', { className: 'flex items-center justify-between text-[9px] font-bold uppercase tracking-widest text-white/40 mb-1.5' },
                    h('span', null, visitedCount + ' / ' + DESTINATIONS.length + ' destinations'),
                    h('span', { className: 'tabular-nums text-[#FFD60A]' }, progressPct + '%')
                  ),
                  h('div', { className: 'h-1.5 rounded-full bg-white/10 overflow-hidden' },
                    h('div', { className: 'h-full bg-gradient-to-r from-[#FFD60A] to-[#FFB800] rounded-full transition-all duration-500', style: { width: progressPct + '%' } })
                  )
                )
              )
            ),

            visitedCount > 0 && h('div', null,
              h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-[#22C55E] flex items-center gap-1.5' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#22C55E] animate-pulse glow-dot' }), 'STAMPED') }, 'Your Passport'),
              h(Card, { className: 'p-4', passport: true },
                h('div', { className: 'flex items-center justify-between mb-3 border-b border-white/10 pb-2' },
                  h('div', { className: 'text-[10px] font-black text-white/40 uppercase tracking-widest' }, 'Federal Republic of Lagos Life'),
                  h('div', { className: 'text-lg' }, '🌍')
                ),
                h('div', { className: 'flex flex-wrap gap-2' },
                  DESTINATIONS.filter((d) => safeTravels.includes(d.id)).map((d) => 
                    h('div', { key: d.id, className: 'fly-in relative flex items-center gap-1.5 bg-white/[0.06] border border-[#FFD60A]/30 rounded-lg px-2.5 py-1.5' },
                      h('span', { className: 'text-base' }, d.emoji),
                      h('span', { className: 'text-[10.5px] font-extrabold font-display' }, d.short),
                      h('span', { className: 'text-[9px] font-black text-[#22C55E] tabular-nums' }, '+' + fmt(d.bonus))
                    )
                  )
                )
              )
            ),

            h(SectionTitle, { right: h('span', { className: 'text-[10px] font-bold text-white/30' }, DESTINATIONS.length + ' routes') }, 'Japa Routes'),

            h('div', { className: 'space-y-2.5' },
              DESTINATIONS.map((d) => {
                const done = safeTravels.includes(d.id);
                const canAfford = s.cash >= d.cost;
                const justBookedThis = justBooked === d.id;
                const isLegendary = d.id === 'space';
                
                return h(Card, {
                  key: d.id,
                  className: 'relative overflow-hidden p-3 flex items-center gap-3 transition-all duration-300 ' +
                    (done ? 'border-[#22C55E]/40 ' : '') +
                    (justBookedThis ? 'ring-2 ring-[#FFD60A] shadow-[0_0_30px_rgba(255,214,10,0.5)] scale-[1.01] ' : '')
                },
                  h('div', { className: 'absolute inset-0 bg-gradient-to-br ' + d.color + ' pointer-events-none opacity-60' }),
                  h('div', { className: 'relative w-14 h-14 rounded-xl bg-gradient-to-br from-white/[0.1] to-white/[0.02] border border-white/[0.08] grid place-items-center text-3xl shrink-0' },
                    d.emoji,
                    done && h('div', { className: 'absolute -top-1.5 -right-1.5 bg-[#22C55E] rounded-full w-5 h-5 grid place-items-center shadow-lg stamp-visit' },
                      h('span', { className: 'text-black text-[10px] font-black' }, '✓')
                    )
                  ),
                  h('div', { className: 'relative flex-1 min-w-0' },
                    h('div', { className: 'flex items-center gap-1.5' },
                      h('div', { className: 'text-[13px] font-extrabold truncate font-display' }, d.name),
                      isLegendary && h('span', { className: 'text-[10px]' }, '🚀')
                    ),
                    h('div', { className: 'text-[9px] text-white/40 truncate mb-1' }, d.desc),
                    h('div', { className: 'flex items-center gap-2 mt-1 flex-wrap' },
                      h('span', {
                        className: 'text-[8.5px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded ' +
                          (d.tier === 'Legendary' ? 'bg-fuchsia-500/20 text-fuchsia-300' :
                           d.tier === 'Superpower' ? 'bg-indigo-500/20 text-indigo-300' :
                           d.tier === 'North America' ? 'bg-red-500/20 text-red-300' :
                           d.tier === 'Europe' ? 'bg-blue-500/20 text-blue-300' :
                           d.tier === 'Middle East' ? 'bg-amber-400/20 text-amber-300' :
                           d.tier === 'West Africa' ? 'bg-orange-500/20 text-orange-300' :
                           'bg-slate-400/20 text-slate-300')
                      }, d.tier)
                    ),
                    h('div', { className: 'flex items-center gap-2 mt-1.5 text-[10px] font-black tabular-nums' },
                      h('span', { className: 'text-white/55' }, fmt(d.cost)),
                      h('span', { className: 'text-white/20' }, '·'),
                      h('span', { className: 'text-[#22C55E]' }, '+' + fmt(d.bonus) + '/tap')
                    )
                  ),
                  h('button', {
                    onClick: () => book(d),
                    disabled: done || !canAfford,
                    className: 'relative shrink-0 rounded-lg text-[10.5px] font-black px-3 py-2.5 active:scale-95 transition-all ' +
                      (done
                        ? 'bg-[#22C55E]/20 text-[#22C55E] border border-[#22C55E]/30'
                        : canAfford
                          ? 'bg-gradient-to-b from-[#FFE566] to-[#FFB800] text-black shadow-[0_4px_14px_-4px_rgba(255,214,10,0.7)]'
                          : 'bg-white/[0.06] text-white/25 border border-white/[0.06]')
                  }, done ? '✅ JAPA\'D' : canAfford ? 'BOOK' : 'LOCKED')
                );
              })
            ),

            h(Card, { className: 'p-3.5 mt-4' },
              h('div', { className: 'flex items-start gap-2' },
                h('span', { className: 'text-base' }, '🌍'),
                h('p', { className: 'text-[10.5px] text-white/50 leading-relaxed' },
                  'Every destination you visit ',
                  h('span', { className: 'text-[#FFD60A] font-bold' }, 'permanently boosts your tap earnings'),
                  '. Space na the ultimate flex — ₦1 Trillion and you go +₦25,000 every tap. Japa tire! ✈️'
                )
              )
            )
          ),

          travelingTo && h('div', { className: 'fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 backdrop-blur-md' },
            h('div', { className: 'text-6xl mb-4 animate-bounce' }, travelingTo.emoji),
            h('h2', { className: 'text-2xl font-black text-[#FFD60A] mb-1 font-display text-center px-4' }, 'JAPA TO ' + travelingTo.short.toUpperCase() + '...'),
            h('p', { className: 'text-white/60 text-xs mb-8' }, travelingTo.desc),
            h('div', { className: 'relative w-full h-32 flex items-center overflow-hidden' },
              h('div', { className: 'absolute text-6xl ' + getVehicle(travelingTo.id).anim }, getVehicle(travelingTo.id).icon)
            ),
            h('div', { className: 'text-white/40 text-[10px] font-bold mt-4 uppercase tracking-widest animate-pulse' }, 'Booking your ticket...')
          ),

          travelEvent && h('div', { className: 'fixed inset-0 z-[100] grid place-items-center p-6' },
            h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md' }),
            h('div', { className: 'relative w-full max-w-sm bg-[#121218] border border-[#FFD60A]/30 rounded-3xl p-5 animate-popIn text-center' },
              h('div', { className: 'text-6xl mb-2' }, travelEvent.type === 'good' ? '🤑' : travelEvent.type === 'bad' ? '😭' : '😂'),
              h('div', { className: 'text-[15px] font-black text-[#FFD60A] font-display mb-2' }, 'TRAVEL EVENT!'),
              h('p', { className: 'text-[12px] text-white/80 leading-relaxed mb-4' }, travelEvent.msg),
              travelEvent.cash !== 0 && h('div', { className: 'text-[18px] font-black ' + (travelEvent.cash > 0 ? 'text-green-400' : 'text-red-400') + ' mb-4' }, (travelEvent.cash > 0 ? '+' : '') + fmt(travelEvent.cash)),
              h('button', { onClick: () => setTravelEvent(null), className: 'w-full py-3 rounded-xl bg-white/[0.06] border border-white/10 text-white font-bold text-[12px] active:scale-95 transition' }, 'Continue')
            )
          ),

          h('nav', { className: 'fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 nav-backdrop border-t border-white/[0.08]' },
            h('div', { className: 'grid grid-cols-6 px-1 pt-1.5 safe-bottom' },
              NAV.map((n) => {
                const active = n.id === 'more';
                return h('a', {
                  key: n.id, href: n.href,
                  className: 'flex flex-col items-center gap-0.5 py-1.5 rounded-xl transition-all duration-150 ' + (active ? 'text-[#FFD60A] nav-active-pill' : 'text-white/35')
                },
                  h('span', { className: 'text-[17px] leading-none transition-transform ' + (active ? 'scale-110' : '') }, n.icon),
                  h('span', { className: 'text-[8.5px] font-extrabold tracking-wide font-display' }, n.label)
                );
              })
            )
          ),

          toast && h('div', {
            className: 'fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[11px] font-extrabold shadow-xl whitespace-nowrap max-w-[90vw] truncate animate-slideDown font-display ' +
              (toast.kind === 'bad' ? 'bg-gradient-to-b from-[#F87171] to-[#EF4444] text-white' : 'bg-gradient-to-b from-[#FFE566] to-[#FFD60A] text-black')
          }, toast.msg)
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
      render() {
        if (this.state.hasError) {
          return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '12px', padding: '24px', textAlign: 'center', background: '#08080B', color: '#F87171', fontFamily: 'monospace', fontSize: '12px' } },
            h('div', { style: { fontSize: '32px' } }, '⚠️'),
            h('div', { style: { fontWeight: 'bold' } }, 'Something went wrong'),
            h('div', { style: { opacity: 0.6, wordBreak: 'break-word' } }, String((this.state.error && this.state.error.message) || 'Unknown error')),
            h('button', { style: { marginTop: '12px', padding: '8px 16px', background: '#FFD60A', color: '#000', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }, onClick: () => window.location.reload() }, 'Reload')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary, null, h(App)));
  </script>
</body>
</html>
